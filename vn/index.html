<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>越南路线</title>
  <style>
    :root {
      --ink: #17302e;
      --muted: #70817b;
      --line: #d7e0da;
      --paper: #f5f5ef;
      --surface: #fffefa;
      --blue: #267c92;
      --blue-soft: #e7f1f0;
      --coral: #dc6048;
      --coral-soft: #fae9e3;
      --gold: #e4aa44;
      --shadow: 0 12px 30px rgba(35, 56, 48, .07);
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.35;
    }

    button, summary { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 16px 0 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .time-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      width: min(520px, 100%);
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #e9ede7;
    }

    .time-tab {
      min-height: 42px;
      padding: 5px 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 850;
      text-align: left;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .time-tab.active {
      background: var(--surface);
      box-shadow: 0 3px 10px rgba(39, 57, 53, .08);
    }

    .time-tab small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
    }

    .top-tools {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: auto;
      color: var(--muted);
      font-size: 11px;
    }

    .references {
      position: relative;
    }

    .references summary {
      min-height: 42px;
      padding: 11px 2px;
      color: var(--blue);
      cursor: pointer;
      font-weight: 850;
      list-style: none;
    }

    .references summary::-webkit-details-marker { display: none; }

    .reference-popover {
      position: absolute;
      z-index: 10;
      top: 48px;
      right: 0;
      width: 330px;
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .reference-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .reference-thumb {
      display: block;
      width: 100%;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--paper);
      cursor: pointer;
      overflow: hidden;
    }

    .reference-thumb img {
      display: block;
      width: 100%;
      height: 128px;
      object-fit: cover;
      object-position: top;
    }

    .reference-thumb span {
      display: block;
      padding: 6px 7px;
      color: var(--muted);
      font-size: 10px;
      text-align: left;
    }

    .route-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      padding: 25px 0 15px;
      border-bottom: 1px solid var(--line);
    }

    .route-title {
      margin: 0 0 7px;
      font-size: 32px;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .route-title .arrow { color: var(--coral); }

    .route-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .total {
      min-width: 160px;
      padding: 10px 13px;
      border-left: 3px solid var(--coral);
      background: var(--coral-soft);
    }

    .total span, .total small {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .total strong {
      display: block;
      margin: 3px 0;
      font-size: 24px;
      line-height: 1;
    }

    .route-options {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 13px;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .section-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .option-list {
      display: flex;
      gap: 7px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .option-list::-webkit-scrollbar { display: none; }

    .route-option {
      flex: 1 1 0;
      min-width: 145px;
      min-height: 52px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      text-align: left;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .route-option.active {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .route-option strong, .route-option small {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-option strong {
      font-size: 12px;
      font-weight: 850;
    }

    .route-option small {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .route-path {
      --count: 5;
      padding: 17px 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .path-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--count), minmax(0, 1fr));
      gap: 0;
    }

    .path-grid::before {
      position: absolute;
      top: 20px;
      right: 5%;
      left: 5%;
      height: 2px;
      background: var(--line);
      content: "";
    }

    .path-node {
      position: relative;
      z-index: 1;
      min-width: 0;
      text-align: center;
    }

    .path-dot {
      display: block;
      width: 14px;
      height: 14px;
      margin: 13px auto 12px;
      border: 3px solid var(--surface);
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 2px var(--blue);
    }

    .path-node.move .path-dot {
      background: var(--gold);
      box-shadow: 0 0 0 2px var(--gold);
    }

    .path-node.end .path-dot {
      background: var(--coral);
      box-shadow: 0 0 0 2px var(--coral);
    }

    .path-tag, .path-place, .path-time {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .path-tag {
      color: var(--muted);
      font-size: 10px;
    }

    .path-place {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 900;
    }

    .path-time {
      margin-top: 2px;
      color: var(--blue);
      font-size: 10px;
      font-weight: 850;
    }

    .route-note {
      margin: 14px 0 0;
      padding: 9px 12px;
      border-left: 3px solid var(--coral);
      background: #f7f4eb;
      color: var(--muted);
      font-size: 12px;
    }

    .route-note strong { color: var(--ink); }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.04fr) minmax(0, .96fr);
      gap: 18px;
      margin-top: 18px;
    }

    .content > .panel:nth-child(3) {
      grid-column: 2;
      grid-row: 1 / span 2;
    }

    .panel {
      min-width: 0;
      padding: 17px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 11px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .panel-head span {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .stay-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .city-card {
      border: 1px solid var(--line);
      background: #fbfbf7;
    }

    .city-card summary {
      min-height: 74px;
      padding: 10px;
      cursor: pointer;
      list-style: none;
    }

    .city-card summary::-webkit-details-marker { display: none; }
    .city-card summary::after {
      float: right;
      color: var(--coral);
      content: "+";
      font-size: 16px;
      line-height: 1;
    }

    .city-card[open] summary::after { content: "−"; }

    .city-region, .city-name, .city-days {
      display: block;
    }

    .city-region {
      color: var(--muted);
      font-size: 10px;
    }

    .city-name {
      margin-top: 3px;
      font-size: 16px;
      font-weight: 900;
    }

    .city-days {
      margin-top: 3px;
      color: var(--coral);
      font-size: 11px;
      font-weight: 850;
    }

    .city-details {
      margin: 0;
      padding: 0 10px 11px;
      color: var(--muted);
      font-size: 11px;
    }

    .city-details strong { color: var(--ink); }

    .transport-list {
      display: grid;
      gap: 0;
    }

    .transport-row {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }

    .transport-row:first-child { border-top: 0; padding-top: 2px; }

    .transport-route {
      font-size: 12px;
      font-weight: 850;
    }

    .transport-mode {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .transport-mode strong {
      color: var(--blue);
      font-weight: 850;
    }

    .transport-mode small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .flight-groups {
      display: grid;
      gap: 12px;
    }

    .flight-group {
      padding-top: 11px;
      border-top: 1px solid var(--line);
    }

    .flight-group:first-child {
      padding-top: 2px;
      border-top: 0;
    }

    .flight-group-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .flight-options {
      display: grid;
      gap: 6px;
    }

    .flight-option {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      width: 100%;
      min-height: 62px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      background: #fbfbf7;
      cursor: pointer;
      text-align: left;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .flight-option.selected {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .flight-name, .flight-time, .flight-detail {
      display: block;
    }

    .flight-name {
      font-size: 12px;
      font-weight: 900;
    }

    .flight-time {
      margin-top: 2px;
      font-size: 13px;
      font-weight: 800;
    }

    .flight-detail {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .flight-price {
      align-self: center;
      color: var(--coral);
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
    }

    .flight-price small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      text-align: right;
    }

    .budget {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px 12px;
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 12px;
    }

    .budget div:nth-child(odd) { color: var(--muted); }

    .budget-total {
      padding-top: 8px;
      border-top: 1px solid var(--line);
      font-size: 16px;
      font-weight: 900;
    }

    .budget-note {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 10px;
    }

    .focus-ring:focus-visible, button:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(35, 111, 143, .25);
      outline-offset: 2px;
    }

    .modal {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(13, 30, 28, .76);
    }

    .modal.open { display: flex; }

    .modal-card {
      position: relative;
      width: min(700px, 100%);
      max-height: calc(100vh - 40px);
      padding: 10px;
      background: var(--surface);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .2);
    }

    .modal-card img {
      display: block;
      width: 100%;
      max-height: calc(100vh - 88px);
      object-fit: contain;
      background: var(--paper);
    }

    .modal-close {
      position: absolute;
      top: -13px;
      right: -13px;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    @media (hover: hover) and (pointer: fine) {
      .time-tab:hover, .route-option:hover, .flight-option:hover {
        transform: translateY(-1px);
      }
      .time-tab:hover { color: var(--blue); }
      .route-option:hover, .flight-option:hover { border-color: var(--blue); }
    }

    @media (max-width: 820px) {
      .content { grid-template-columns: 1fr; }
      .content > .panel:nth-child(3) {
        grid-column: auto;
        grid-row: auto;
      }
    }

    @media (orientation: landscape) and (max-height: 560px) and (max-width: 920px) {
      .page { padding-top: 8px; }
      .route-head { padding-top: 15px; }
      .route-title { font-size: 26px; }
      .route-path { padding: 10px 0; }
      .content {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      .panel { padding: 13px; }
      .city-card summary { min-height: 62px; padding: 8px; }
      .flight-option { min-height: 52px; padding: 7px 8px; }
    }

    @media (max-width: 600px) {
      .page { width: min(100% - 20px, 540px); padding-top: 9px; }
      .topbar { gap: 7px; }
      .time-tabs { width: calc(100% - 48px); }
      .time-tab { min-height: 46px; padding: 5px 8px; font-size: 11px; }
      .time-tab small { font-size: 9px; }
      .top-tools { gap: 4px; font-size: 10px; }
      .top-tools > span { display: none; }
      .references summary { padding: 12px 2px; }
      .reference-popover {
        position: fixed;
        top: 52px;
        right: 10px;
        width: min(330px, calc(100vw - 20px));
      }
      .route-head { display: block; padding-top: 17px; }
      .route-title { font-size: 24px; line-height: 1.18; }
      .route-meta { gap: 5px 10px; font-size: 11px; }
      .total { width: fit-content; min-width: 0; margin-top: 11px; }
      .route-options {
        grid-template-columns: 1fr;
        gap: 7px;
        padding: 11px 0;
      }
      .option-list { width: 100%; }
      .route-option { min-width: 150px; }
      .path-place { font-size: 12px; }
      .path-tag, .path-time { font-size: 9px; }
      .route-note { font-size: 11px; }
      .panel { padding: 14px; }
      .stay-grid { gap: 6px; }
      .city-card summary { min-height: 70px; padding: 9px; }
      .city-name { font-size: 15px; }
      .transport-row { grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 8px; }
      .flight-option { min-height: 66px; }
      .modal { padding: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <nav class="time-tabs" aria-label="时间方案">
        <button class="time-tab active" type="button" data-plan="a" aria-selected="true">
          方案一 · 09.25 → 10.03
          <small>河内进出 · 约7天</small>
        </button>
        <button class="time-tab" type="button" data-plan="b" aria-selected="false">
          方案二 · 09.27 → 10.08
          <small>河内进 · 胡志明市出 · 约10.5天</small>
        </button>
      </nav>
      <div class="top-tools">
        <span>2026</span>
        <details class="references">
          <summary>参考图</summary>
          <div class="reference-popover">
            <div class="reference-grid">
              <button class="reference-thumb" type="button" data-image="vietnam-overview.jpg" data-caption="越南区域与城市分布">
                <img src="vietnam-overview.jpg" alt="越南区域与城市分布">
                <span>区域总览</span>
              </button>
              <button class="reference-thumb" type="button" data-image="vietnam-city-guide.jpg" data-caption="热门城市与景点">
                <img src="vietnam-city-guide.jpg" alt="热门城市与景点">
                <span>城市景点</span>
              </button>
              <button class="reference-thumb" type="button" data-image="vietnam-transport.jpg" data-caption="南下交通时间">
                <img src="vietnam-transport.jpg" alt="南下交通时间">
                <span>交通时间</span>
              </button>
              <button class="reference-thumb" type="button" data-image="vietnam-south-route.jpg" data-caption="越南一路南下路线">
                <img src="vietnam-south-route.jpg" alt="越南一路南下路线">
                <span>南下路线</span>
              </button>
            </div>
          </div>
        </details>
      </div>
    </header>

    <section class="route-head" aria-live="polite">
      <div>
        <h1 class="route-title" id="route-title">上海 <span class="arrow">→</span> 河内 <span class="arrow">→</span> 岘港 + 会安 <span class="arrow">→</span> 河内 <span class="arrow">→</span> 上海</h1>
        <div class="route-meta">
          <span id="route-window">09.25 深夜 → 10.03 凌晨</span>
          <span id="route-duration">约7天</span>
          <span id="route-stay">北越2天 · 中越4天 · 通勤1天</span>
        </div>
      </div>
      <div class="total">
        <span>机票 + 国内航班</span>
        <strong id="overview-total">¥4,067</strong>
        <small>未含燃油、基建及税费</small>
      </div>
    </section>

    <section class="route-options">
      <span class="section-label">中间路线</span>
      <div class="option-list" id="option-list"></div>
    </section>

    <section class="route-path" aria-label="完整路线">
      <div class="path-grid" id="path-grid"></div>
      <p class="route-note" id="route-note"></p>
    </section>

    <section class="content">
      <section class="panel">
        <div class="panel-head">
          <h2>停留</h2>
          <span id="stay-caption">点击查看景点</span>
        </div>
        <div class="stay-grid" id="stay-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>转场</h2>
          <span>机场 / 时间 / 方式</span>
        </div>
        <div class="transport-list" id="transport-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>机票</h2>
          <span>点击选择</span>
        </div>
        <div class="flight-groups" id="flight-groups"></div>
        <div class="budget" aria-live="polite">
          <div>国际段</div><div id="budget-international">¥3,367</div>
          <div>越南国内航班</div><div id="budget-domestic">¥700</div>
          <div class="budget-total">合计参考</div><div class="budget-total" id="budget-total">¥4,067</div>
          <div class="budget-note" id="budget-note">国内航班约1.5小时；机场往返、值机和候机按半天至一天预留。</div>
        </div>
      </section>
    </section>
  </main>

  <div class="modal" id="image-modal" role="dialog" aria-modal="true" aria-label="参考图预览">
    <div class="modal-card">
      <button class="modal-close" id="modal-close" type="button" aria-label="关闭参考图">×</button>
      <img id="modal-image" src="" alt="">
    </div>
  </div>

  <script>
    const domesticPerFlight = 350;
    const plans = {
      a: {
        window: "09.25 深夜 → 10.03 凌晨",
        duration: "约7天",
        stay: "北越2天 · 中越4天 · 通勤1天",
        budgetNote: "国内航班约1.5小时；机场往返、值机和候机按半天至一天预留。",
        options: [
          {
            id: "a1",
            name: "中越经典",
            short: "河内 → 岘港 / 会安 → 河内",
            label: "最稳 · 少转场",
            title: "上海 <span class=\"arrow\">→</span> 河内 <span class=\"arrow\">→</span> 岘港 + 会安 <span class=\"arrow\">→</span> 河内 <span class=\"arrow\">→</span> 上海",
            note: "<strong>岘港 + 会安</strong> 合并4天最顺；10月2日前回到河内，匹配10月3日凌晨回程。",
            domesticFlights: 2,

    function renderPlanTabs() {
      document.querySelectorAll(".time-tab").forEach(tab => {
        const active = tab.dataset.plan === activePlan;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
      });
    }

    function renderOptions(plan) {
      document.querySelector("#option-list").innerHTML = plan.options.map(option => `
        <button class="route-option ${option.id === activeOption ? "active" : ""}" type="button" data-option="${option.id}" aria-pressed="${option.id === activeOption}">
          <strong>${option.name}</strong>
          <small>${option.label}</small>
        </button>
      `).join("");

      document.querySelectorAll(".route-option").forEach(button => {
        button.addEventListener("click", () => {
          activeOption = button.dataset.option;
          renderRoute();
        });
      });
    }

    function renderRoute() {
      const plan = plans[activePlan];
      const route = currentRoute();
      renderPlanTabs();
      renderOptions(plan);
      document.querySelector("#route-title").innerHTML = route.title;
      document.querySelector("#route-window").textContent = plan.window;
      document.querySelector("#route-duration").textContent = plan.duration;
      document.querySelector("#route-stay").textContent = plan.stay;
      document.querySelector("#route-note").innerHTML = route.note;
      document.querySelector("#budget-note").textContent = plan.budgetNote;

      const pathGrid = document.querySelector("#path-grid");
      pathGrid.style.setProperty("--count", route.stops.length);
      pathGrid.innerHTML = route.stops.map(stop => `
        <div class="path-node ${stop.kind}">
          <span class="path-tag">${stop.tag}</span>
          <span class="path-dot"></span>
          <span class="path-place">${stop.place}</span>
          <span class="path-time">${stop.time}</span>
        </div>
      `).join("");

      document.querySelector("#stay-grid").innerHTML = route.cities.map(city => `
        <details class="city-card">
          <summary>
            <span class="city-region">${city.region}</span>
            <span class="city-name">${city.name}</span>
            <span class="city-days">${city.days}</span>
          </summary>
          <p class="city-details">${city.details}</p>
        </details>
      `).join("");

      document.querySelector("#transport-list").innerHTML = route.legs.map(leg => `
        <div class="transport-row">
          <span class="transport-route">${leg[0]}</span>
          <span class="transport-mode"><strong>${leg[1]}</strong><small>${leg[2]}</small></span>
        </div>
      `).join("");

      renderFlights(plan);
    }

    function renderFlights(plan) {
      plan.flights.forEach(group => {
        group.options.forEach(option => {
          if (!(option.id in selectedFlights)) selectedFlights[option.id] = group.selected === option.id;
        });
      });

      document.querySelector("#flight-groups").innerHTML = plan.flights.map(group => `
        <div class="flight-group">
          <div class="flight-group-title">
            <span>${group.title}</span>
            <span>选择一项</span>
          </div>
          <div class="flight-options">
            ${group.options.map(option => `
              <button class="flight-option ${selectedFlights[option.id] ? "selected" : ""}" type="button" data-flight="${option.id}" aria-pressed="${selectedFlights[option.id]}">
                <span>
                  <span class="flight-name">${option.name}</span>
                  <span class="flight-time">${option.time}</span>
                  <span class="flight-detail">${option.detail}</span>
                </span>
                <span class="flight-price">${money(option.price)}<small>参考</small></span>
              </button>
            `).join("")}
          </div>
        </div>
      `).join("");

      document.querySelectorAll(".flight-option").forEach(button => {
        button.addEventListener("click", () => {
          const id = button.dataset.flight;
          plan.flights.forEach(group => {
            if (group.options.some(option => option.id === id)) {
              group.options.forEach(option => selectedFlights[option.id] = option.id === id);
            }
          });
          renderFlights(plan);
        });
      });

      updateBudget(plan);
    }

    function updateBudget(plan) {
      const route = currentRoute();
      const international = plan.flights.reduce((sum, group) => {
        const selected = group.options.find(option => selectedFlights[option.id]);
        return sum + (selected ? selected.price : 0);
      }, 0);
      const domestic = route.domesticFlights * domesticPerFlight;
      const total = international + domestic;
      document.querySelector("#budget-international").textContent = money(international);
      document.querySelector("#budget-domestic").textContent = money(domestic);
      document.querySelector("#budget-total").textContent = money(total);
      document.querySelector("#overview-total").textContent = money(total);
    }

    });

    const modal = document.querySelector("#image-modal");
    const modalImage = document.querySelector("#modal-image");
    const closeModal = () => {
      modal.classList.remove("open");
      modalImage.src = "";
    };

    document.querySelectorAll(".reference-thumb").forEach(button => {
      button.addEventListener("click", () => {
        modalImage.src = button.dataset.image;
        modalImage.alt = button.dataset.caption;
        modal.classList.add("open");
      });
    });

    document.querySelector("#modal-close").addEventListener("click", closeModal);
    modal.addEventListener("click", event => {
      if (event.target === modal) closeModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });

    renderRoute();
  </script>
</body>
</html>
