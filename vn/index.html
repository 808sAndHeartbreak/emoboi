<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f1">
  <title>越南行程 · 2026</title>
  <style>
    :root {
      --bg: #f3f5f1;
      --surface: #fffefa;
      --surface-2: #f8faf6;
      --ink: #142b2a;
      --muted: #71807b;
      --line: #dce4de;
      --line-dark: #b9c9c2;
      --jade: #0a716e;
      --jade-soft: #e5f3ef;
      --coral: #df634f;
      --coral-soft: #fae9e2;
      --amber: #d19b35;
      --amber-soft: #fbf0d6;
      --shadow: 0 10px 30px rgba(22, 49, 44, .06);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
    }

    button, input, summary { font: inherit; }
    button { color: inherit; }

    button:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 3px solid rgba(10, 113, 110, .22);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .page {
      width: min(1320px, calc(100% - 40px));
      margin: 0 auto;
      padding: 12px 0 28px;
    }

    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 7px 0 10px;
      background: var(--bg);
    }

    .time-switch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px;
      width: min(560px, 100%);
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #e7ece7;
    }

    .time-tab {
      min-width: 0;
      min-height: 48px;
      padding: 6px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .time-tab.active {
      background: var(--surface);
      box-shadow: 0 3px 10px rgba(30, 58, 51, .08);
    }

    .tab-main,
    .tab-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-main {
      font-size: 12px;
      font-weight: 900;
    }

    .tab-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-left: auto;
    }

    .year {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .reference-trigger {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 38px;
      padding: 6px 0 6px 7px;
      border: 0;
      background: transparent;
      color: var(--jade);
      cursor: pointer;
      font-size: 11px;
      font-weight: 850;
    }

    .reference-trigger .glyph {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 5px;
      font-size: 13px;
      line-height: 1;
    }

    .route-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      padding: 24px 0 15px;
      border-bottom: 1px solid var(--line);
    }

    .route-title {
      margin: 0;
      font-size: clamp(25px, 3.2vw, 43px);
      font-weight: 920;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .route-title .arrow {
      padding: 0 4px;
      color: var(--coral);
      font-weight: 550;
    }

    .route-city {
      display: inline-block;
      white-space: nowrap;
    }

    .route-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 16px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .route-meta span + span::before {
      margin-right: 16px;
      color: var(--line-dark);
      content: "·";
    }

    .route-total {
      min-width: 184px;
      padding: 11px 14px 12px;
      border-left: 3px solid var(--coral);
      background: var(--coral-soft);
    }

    .route-total span,
    .route-total small {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .route-total strong {
      display: block;
      margin: 3px 0 2px;
      font-size: 27px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .number-flash {
      animation: numberFlash .5s ease;
    }

    @keyframes numberFlash {
      0% { color: var(--coral); }
      45% { color: var(--jade); }
      100% { color: var(--ink); }
    }

    .route-picker {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 15px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .section-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .route-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 7px;
      min-width: 0;
    }

    .route-option {
      min-width: 0;
      min-height: 53px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
      text-align: left;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .route-option.active {
      border-color: var(--jade);
      background: var(--jade-soft);
    }

    .option-main,
    .option-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .option-main {
      font-size: 12px;
      font-weight: 900;
    }

    .option-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .route-track {
      position: relative;
      margin-top: 14px;
      padding: 3px 0 13px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      scrollbar-color: var(--line-dark) transparent;
      scrollbar-width: thin;
      overscroll-behavior-inline: contain;
      -webkit-overflow-scrolling: touch;
    }

    .track-inner {
      --stop-count: 5;
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--stop-count), minmax(96px, 1fr));
      min-width: 100%;
    }

    .track-inner::before {
      position: absolute;
      top: 39px;
      right: 5%;
      left: 5%;
      height: 2px;
      background: var(--line);
      content: "";
    }

    .track-stop {
      position: relative;
      z-index: 1;
      min-width: 0;
      scroll-snap-align: center;
      text-align: center;
    }

    .track-kicker,
    .track-place,
    .track-time {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-kicker {
      height: 16px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .track-dot {
      display: block;
      width: 15px;
      height: 15px;
      margin: 16px auto 12px;
      border: 3px solid var(--surface);
      border-radius: 50%;
      background: var(--jade);
      box-shadow: 0 0 0 2px var(--jade);
    }

    .track-stop.transfer .track-dot {
      background: var(--amber);
      box-shadow: 0 0 0 2px var(--amber);
    }

    .track-stop.exit .track-dot {
      background: var(--coral);
      box-shadow: 0 0 0 2px var(--coral);
    }

    .track-place {
      padding: 0 5px;
      font-size: 13px;
      font-weight: 900;
    }

    .track-time {
      margin-top: 2px;
      padding: 0 5px;
      color: var(--jade);
      font-size: 10px;
      font-weight: 900;
    }

    .route-note {
      display: flex;
      gap: 8px;
      align-items: baseline;
      margin: 0;
      padding: 8px 11px;
      border-left: 3px solid var(--amber);
      background: var(--amber-soft);
      color: var(--muted);
      font-size: 11px;
    }

    .route-note strong { color: var(--ink); }

    .utility-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.22fr) minmax(250px, .8fr) minmax(0, 1.16fr);
      gap: 12px;
      margin-top: 13px;
      align-items: start;
    }

    .tool-panel,
    .content-panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .tool-head,
    .content-head {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }

    .tool-head h2,
    .content-head h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
    }

    .phrase-tool .tool-head {
      border-bottom: 0;
    }

    .tool-head span,
    .content-head span {
      margin-left: auto;
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button,
    .copy-button {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line-dark);
      border-radius: 50%;
      background: transparent;
      color: var(--jade);
      cursor: pointer;
      line-height: 1;
      transition: background .2s ease, transform .2s ease;
    }

    .icon-button {
      width: 25px;
      height: 25px;
      font-size: 15px;
    }

    .weather-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
      gap: 6px;
      min-height: 89px;
      padding: 9px 12px 11px;
    }

    .weather-item {
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-2);
    }

    .weather-city,
    .weather-main,
    .weather-detail {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .weather-city {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .weather-main {
      margin-top: 3px;
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .weather-icon {
      margin-right: 3px;
      font-size: 14px;
    }

    .weather-detail {
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
    }

    .weather-loading {
      align-self: center;
      color: var(--muted);
      font-size: 10px;
    }

    .exchange-body {
      padding: 9px 12px 11px;
    }

    .fx-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
    }

    .fx-input-wrap {
      display: flex;
      min-width: 0;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      background: var(--surface-2);
    }

    .fx-input {
      width: 100%;
      min-width: 0;
      padding: 8px 9px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .fx-mode {
      display: flex;
      align-items: center;
      padding-right: 4px;
    }

    .fx-mode button {
      padding: 4px 5px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 900;
    }

    .fx-mode button.active {
      background: var(--jade-soft);
      color: var(--jade);
    }

    .fx-swap {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--jade);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }

    .fx-result {
      display: block;
      min-height: 32px;
      margin-top: 7px;
      padding: 4px 8px;
      border-left: 2px solid var(--coral);
      background: var(--coral-soft);
      font-size: 14px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1.65;
      text-align: right;
    }

    .fx-presets {
      display: flex;
      gap: 5px;
      margin-top: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .fx-presets::-webkit-scrollbar { display: none; }

    .fx-preset {
      flex: 0 0 auto;
      min-width: 48px;
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 850;
    }

    .phrase-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 15px;
      padding: 2px 12px 7px;
    }

    .phrase-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
      align-items: center;
      min-width: 0;
      min-height: 42px;
      border-top: 1px solid var(--line);
    }

    .phrase-row:nth-child(-n + 2) { border-top: 0; }

    .phrase-copy-block {
      min-width: 0;
    }

    .phrase-original,
    .phrase-pronunciation,
    .phrase-meaning {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .phrase-original {
      font-size: 10px;
      font-weight: 900;
    }

    .phrase-pronunciation {
      margin-top: 1px;
      color: var(--muted);
      font-size: 9px;
    }

    .phrase-meaning {
      max-width: 76px;
      color: var(--muted);
      font-size: 9px;
    }

    .copy-button {
      width: 23px;
      height: 23px;
      border-color: transparent;
      font-size: 12px;
    }

    .copy-button.copied {
      border-color: var(--jade);
      background: var(--jade-soft);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr);
      gap: 18px;
      margin-top: 17px;
      align-items: start;
    }

    .content-head {
      min-height: 45px;
    }

    .content-head h2 {
      font-size: 16px;
    }

    .city-list {
      padding: 3px 16px 10px;
    }

    .city-stop {
      border-top: 1px solid var(--line);
    }

    .city-stop:first-child { border-top: 0; }

    .city-stop summary {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto 15px;
      gap: 10px;
      align-items: center;
      min-height: 70px;
      cursor: pointer;
      list-style: none;
    }

    .city-stop summary::-webkit-details-marker { display: none; }

    .city-index {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border: 1px solid var(--line-dark);
      border-radius: 50%;
      color: var(--jade);
      font-size: 10px;
      font-weight: 900;
    }

    .city-region,
    .city-name,
    .city-highlights,
    .city-period {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .city-region {
      color: var(--muted);
      font-size: 9px;
    }

    .city-name {
      margin-top: 2px;
      font-size: 17px;
      font-weight: 900;
    }

    .city-highlights {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .city-period {
      color: var(--jade);
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
    }

    .city-days {
      margin-top: 2px;
      color: var(--coral);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .city-chevron {
      color: var(--coral);
      font-size: 16px;
      line-height: 1;
      transition: transform .2s ease;
    }

    .city-stop[open] .city-chevron { transform: rotate(45deg); }

    .city-detail {
      margin: -1px 0 11px 38px;
      padding: 9px 11px;
      border-left: 2px solid var(--jade);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      animation: detailIn .2s ease both;
    }

    .city-detail strong { color: var(--ink); }

    @keyframes detailIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .side-column {
      display: grid;
      gap: 18px;
      position: sticky;
      top: 75px;
    }

    .flight-groups {
      padding: 3px 16px 0;
    }

    .flight-group {
      padding: 11px 0 12px;
      border-top: 1px solid var(--line);
    }

    .flight-group:first-child { border-top: 0; }

    .flight-group-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }

    .flight-options {
      display: grid;
      gap: 6px;
    }

    .flight-option {
      display: grid;
      grid-template-columns: 17px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 59px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-2);
      cursor: pointer;
      text-align: left;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .flight-option.selected {
      border-color: var(--jade);
      background: var(--jade-soft);
    }

    .flight-radio {
      display: grid;
      width: 14px;
      height: 14px;
      place-items: center;
      border: 2px solid var(--line-dark);
      border-radius: 50%;
    }

    .flight-option.selected .flight-radio {
      border-color: var(--jade);
    }

    .flight-option.selected .flight-radio::after {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--jade);
      content: "";
    }

    .flight-name,
    .flight-time,
    .flight-detail {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .flight-name {
      font-size: 11px;
      font-weight: 900;
    }

    .flight-time {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .flight-detail {
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
    }

    .flight-price {
      color: var(--coral);
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .budget {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 12px;
      margin: 0 16px;
      padding: 12px 0 14px;
      border-top: 1px solid var(--line);
      font-size: 11px;
    }

    .budget-label { color: var(--muted); }

    .budget-value {
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .budget-total {
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--ink);
      font-size: 15px;
      font-weight: 900;
    }

    .budget-note {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 9px;
    }

    .transport-list {
      padding: 3px 16px 11px;
    }

    .transport-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .transport-row:first-child { border-top: 0; }

    .transport-route {
      font-size: 11px;
      font-weight: 900;
    }

    .transport-note {
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
    }

    .transport-time {
      color: var(--jade);
      font-size: 11px;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }

    .transport-time small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
    }

    .footnote {
      margin: 13px 1px 0;
      color: var(--muted);
      font-size: 9px;
    }

    .reference-drawer {
      position: fixed;
      z-index: 30;
      top: 67px;
      right: max(20px, calc((100vw - 1320px) / 2));
      display: none;
      width: min(362px, calc(100vw - 40px));
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);

      justify-content: space-between;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;

    .reference-close,

      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }

    .reference-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .reference-thumb {
      display: block;
      min-width: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-2);
      cursor: pointer;
      overflow: hidden;
      text-align: left;
      transition: border-color .2s ease, transform .2s ease;
    }

    .reference-thumb img {
      display: block;
      width: 100%;
      height: 118px;
      object-fit: cover;
      object-position: top;
    }

    .reference-thumb span {
      display: block;
      padding: 6px 7px;
      color: var(--muted);
      font-size: 9px;
    }

    @keyframes drawerIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(13, 31, 28, .78);
    }

    .modal.open { display: flex; }

    .modal-card {
      position: relative;
      width: min(720px, 100%);
      max-height: calc(100svh - 36px);
      padding: 9px;
      border-radius: 7px;
      background: var(--surface);
      box-shadow: 0 22px 60px rgba(0, 0, 0, .25);
      animation: modalIn .2s ease both;

      display: block;
      width: 100%;
      max-height: calc(100svh - 54px);
      object-fit: contain;
      background: var(--bg);

      position: absolute;
      z-index: 1;
      top: -12px;
      right: -12px;
      width: 36px;
      height: 36px;
      font-size: 21px;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(.98) translateY(4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .is-entering {
      animation: routeIn .3s ease both;
    }

    @keyframes routeIn {
      from { opacity: .3; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }

</head>

      document.querySelectorAll(".flight-option").forEach(button => {

    function updateBudget(plan, route) {
      const international = plan.flights.reduce((sum, group) => {
        const selectedId = selectedFlights[group.id];
        const selected = group.options.find(option => option.id === selectedId);
        return sum + (selected ? selected.price : 0);
      }, 0);
      const domestic = route.domesticFlights * domesticPerFlight;
      const total = international + domestic;
      document.querySelector("#budget-international").textContent = money(international);
      document.querySelector("#budget-domestic").textContent = money(domestic);
      document.querySelector("#budget-total").textContent = money(total);
      document.querySelector("#overview-total").textContent = money(total);
      document.querySelector("#budget-note").textContent = plan.budgetNote;

      ["budget-total", "overview-total"].forEach(id => {
        const element = document.querySelector(`#${id}`);
        element.classList.remove("number-flash");
        void element.offsetWidth;
        element.classList.add("number-flash");
      });
    }

    function weatherLocationsFor(route) {
      const locations = [];
      const seen = new Set();
      route.cities.forEach(city => {
        const query = weatherQueries[city.name];
        if (query && !seen.has(query)) {
          seen.add(query);
          locations.push({ label: city.name, query });
        }
      });
      return locations;
    }

    function weatherIconFor(description) {
      if (/雷/.test(description)) return "⚡";
      if (/雪/.test(description)) return "❄";
      if (/雨/.test(description)) return "☂";
      if (/晴/.test(description)) return "☀";
      if (/云|阴|雾|霾/.test(description)) return "☁";
      return "◌";
    }

    function weatherTemperature(value) {
      const temperature = Number(value);
      if (!Number.isFinite(temperature)) return "—";
      return `${Number.isInteger(temperature) ? temperature : temperature.toFixed(1)}°`;
    }

    function renderWeatherLoading(locations) {
      document.querySelector("#weather-list").innerHTML = locations.map(location => `
        <div class="weather-item">
          <span class="weather-city">${location.label}</span>
          <span class="weather-loading">读取中…</span>
        </div>
      `).join("");
      document.querySelector("#weather-meta").textContent = "读取中";
    }

    async function loadWeather(route, force = false) {
      const requestId = ++weatherRequestId;
      const locations = weatherLocationsFor(route);
      renderWeatherLoading(locations);

      const results = await Promise.all(locations.map(async location => {
        const cached = weatherCache.get(location.query);
        if (!force && cached && Date.now() - cached.timestamp < 10 * 60 * 1000) {
          return { ...location, data: cached.data };
        }

        try {
          const response = await fetch(`${weatherApi}?city=${encodeURIComponent(location.query)}&lang=zh`);
          if (!response.ok) throw new Error(`weather-${response.status}`);
          const data = await response.json();
          weatherCache.set(location.query, { data, timestamp: Date.now() });
          return { ...location, data };
        } catch {
          return { ...location, error: true };
        }
      }));

      if (requestId !== weatherRequestId) return;

      document.querySelector("#weather-list").innerHTML = results.map(result => {
        if (result.error || !result.data) {
          return `
            <div class="weather-item">
              <span class="weather-city">${result.label}</span>
              <span class="weather-main">—</span>
              <span class="weather-detail">暂不可用</span>
            </div>
          `;
        }
        const data = result.data;
        return `
          <div class="weather-item">
            <span class="weather-city">${result.label}</span>
            <span class="weather-main"><span class="weather-icon" aria-hidden="true">${weatherIconFor(data.weather || "")}</span>${weatherTemperature(data.temperature)} ${data.weather || ""}</span>
            <span class="weather-detail">${data.humidity == null ? "" : `湿度 ${data.humidity}% · `}${data.report_time ? `更新 ${data.report_time.slice(11, 16)}` : ""}</span>
          </div>
        `;
      }).join("");
      document.querySelector("#weather-meta").textContent = "实时";
    }

    function renderPhrases() {
      document.querySelector("#phrase-list").innerHTML = phrases.map(phrase => `
        <div class="phrase-row">
          <span class="phrase-copy-block">
            <span class="phrase-original">${phrase.original}</span>
            <span class="phrase-pronunciation">${phrase.pronunciation}</span>
          </span>
          <span class="phrase-meaning">${phrase.meaning}</span>
          <button class="copy-button" type="button" data-phrase="${phrase.original}" title="复制越南语" aria-label="复制：${phrase.original}">⧉</button>
        </div>
      `).join("");

      document.querySelectorAll(".copy-button").forEach(button => {
        button.addEventListener("click", async () => {
          const text = button.dataset.phrase;
          try {
            await navigator.clipboard.writeText(text);
          } catch {
            const helper = document.createElement("textarea");
            helper.value = text;
            helper.setAttribute("readonly", "");
            helper.style.position = "fixed";
            helper.style.opacity = "0";
            document.body.appendChild(helper);
            helper.select();
            document.execCommand("copy");
            helper.remove();
          }
          button.classList.add("copied");
          button.setAttribute("aria-label", `已复制：${text}`);
          window.setTimeout(() => {
            button.classList.remove("copied");
            button.setAttribute("aria-label", `复制：${text}`);
          }, 900);
        });
      });
    }

    function updateExchange() {
      const input = document.querySelector("#fx-input");
      const rawValue = Number.parseFloat(input.value);
      const value = Number.isFinite(rawValue) && rawValue >= 0 ? rawValue : 0;
      const result = fxCurrency === "CNY"
        ? `₫ ${Math.round(value * cnyToVnd).toLocaleString("en-US")}`
        : `¥ ${(value / cnyToVnd).toFixed(2)}`;
      document.querySelector("#fx-result").textContent = result;

      document.querySelectorAll(".fx-mode button").forEach(button => {
        const active = button.dataset.currency === fxCurrency;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    }

    function switchFxCurrency(currency) {
      if (currency === fxCurrency) return;
      const input = document.querySelector("#fx-input");
      const current = Number.parseFloat(input.value);
      const value = Number.isFinite(current) && current >= 0 ? current : 0;
      const converted = fxCurrency === "CNY" ? value * cnyToVnd : value / cnyToVnd;
      fxCurrency = currency;
      input.value = currency === "CNY" ? converted.toFixed(2) : String(Math.round(converted));
      updateExchange();
    }

    function renderPage(animate = false) {
      const plan = getPlan();
      const route = getRoute();
      renderPlanTabs();
      renderRouteOptions();
      renderSummary(route, plan);
      renderTrack(route);
      renderCities(route);
      renderTransport(route);
      renderFlights(plan);
      updateBudget(plan, route);
      loadWeather(route);

      if (animate) {
        [document.querySelector(".route-head"), document.querySelector(".route-track"), document.querySelector(".workspace")].forEach(section => {
          section.classList.remove("is-entering");
          void section.offsetWidth;
          section.classList.add("is-entering");
        });
      }
    }

    document.querySelectorAll(".time-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        activePlan = tab.dataset.plan;
        activeRoute = getPlan().defaultRoute;
        renderPage(true);
        window.scrollTo(0, 0);
      });
    });

    document.querySelector("#weather-refresh").addEventListener("click", () => loadWeather(getRoute(), true));
    document.querySelector("#fx-input").addEventListener("input", updateExchange);
    document.querySelectorAll(".fx-mode button").forEach(button => {
      button.addEventListener("click", () => switchFxCurrency(button.dataset.currency));
    });
    document.querySelector("#fx-swap").addEventListener("click", () => {
      switchFxCurrency(fxCurrency === "CNY" ? "VND" : "CNY");
    });
    document.querySelectorAll(".fx-preset").forEach(button => {
      button.addEventListener("click", () => {
        fxCurrency = "CNY";
        document.querySelector("#fx-input").value = button.dataset.value;
        updateExchange();
      });
    });

    const referenceTrigger = document.querySelector("#reference-trigger");
    const referenceDrawer = document.querySelector("#reference-drawer");
    const imageModal = document.querySelector("#image-modal");
    const modalImage = document.querySelector("#modal-image");

    const closeReferences = () => {
      referenceDrawer.classList.remove("open");
      referenceDrawer.setAttribute("aria-hidden", "true");
      referenceTrigger.setAttribute("aria-expanded", "false");
    };

    const closeModal = () => {
      imageModal.classList.remove("open");
      modalImage.removeAttribute("src");
    };

    referenceTrigger.addEventListener("click", () => {
      const open = referenceDrawer.classList.toggle("open");
      referenceDrawer.setAttribute("aria-hidden", String(!open));
      referenceTrigger.setAttribute("aria-expanded", String(open));
    });
    document.querySelector("#reference-close").addEventListener("click", closeReferences);

    document.querySelectorAll(".reference-thumb").forEach(button => {
      button.addEventListener("click", () => {
        modalImage.src = button.dataset.image;
        modalImage.alt = button.dataset.caption;
        imageModal.classList.add("open");
      });
    });

    document.querySelector("#modal-close").addEventListener("click", closeModal);
    imageModal.addEventListener("click", event => {
      if (event.target === imageModal) closeModal();
    });
    document.addEventListener("click", event => {
      if (!referenceDrawer.contains(event.target) && !referenceTrigger.contains(event.target)) closeReferences();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeModal();
        closeReferences();
      }
    });

    renderPhrases();
    updateExchange();
    renderPage();
  </script>
</body>
</html>
