<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8e7df">
  <title>越南行程</title>
  <style>
    :root {
      --bg: #f3f5f1;
      --surface: #fffefa;
      --surface-2: #f8faf6;
      --ink: #142b2a;
      --muted: #71807b;
      --line: #dce4de;
      --line-dark: #b9c9c2;
      --jade: #0a716e;
      --jade-soft: #e5f3ef;
      --coral: #df634f;
      --coral-soft: #fae9e2;
      --amber: #d19b35;
      --amber-soft: #fbf0d6;
      --shadow: 0 10px 30px rgba(22, 49, 44, .06);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
    }

    button, input, summary { font: inherit; }
    button { color: inherit; }

    button:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 3px solid rgba(10, 113, 110, .22);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .page {
      width: min(1320px, calc(100% - 40px));
      margin: 0 auto;
      padding: 12px 0 28px;
    }

    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 7px 0 10px;
      background: var(--bg);
    }

    .time-switch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px;
      width: min(560px, 100%);
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #e7ece7;
    }

    .time-tab {
      min-width: 0;
      min-height: 48px;
      padding: 6px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .time-tab.active {
      background: var(--surface);
      box-shadow: 0 3px 10px rgba(30, 58, 51, .08);
    }

    .tab-main,
    .tab-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-main {
      font-size: 12px;
      font-weight: 900;
    }

    .tab-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .route-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      padding: 24px 0 15px;
      border-bottom: 1px solid var(--line);
    }

    .route-title {
      margin: 0;
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
      font-size: clamp(25px, 3.2vw, 43px);
      font-weight: 920;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .route-title .arrow {
      padding: 0 4px;
      color: var(--coral);
      font-weight: 550;
    }

    .route-city {
      display: inline-block;
      white-space: nowrap;
    }

    .route-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 16px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .route-meta span + span::before {
      margin-right: 16px;
      color: var(--line-dark);
      content: "·";
    }

    .route-total {
      min-width: 184px;
      padding: 11px 14px 12px;
      border-left: 3px solid var(--coral);
      background: var(--coral-soft);
    }

    .route-total span,
    .route-total small {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .route-total strong {
      display: block;
      margin: 3px 0 2px;
      font-size: 27px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .number-flash {
      animation: numberFlash .5s ease;
    }

    @keyframes numberFlash {
      0% { color: var(--coral); }
      45% { color: var(--jade); }
      100% { color: var(--ink); }
    }

    .route-picker {
      border-bottom: 1px solid var(--line);
    }

    .route-picker > summary {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 13px;
      align-items: center;
      min-height: 58px;
      padding: 7px 1px;
      cursor: pointer;
      list-style: none;
    }

    .route-picker > summary::-webkit-details-marker,
    .flight-group > summary::-webkit-details-marker {
      display: none;
    }

    .section-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .route-current {
      min-width: 0;
    }

    .route-current-name,
    .route-current-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .route-current-name {
      font-size: 13px;
      font-weight: 900;
    }

    .route-current-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .route-chevron,
    .flight-chevron {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border: 1px solid var(--line-dark);
      border-radius: 50%;
      color: var(--jade);
      font-size: 16px;
      line-height: 1;
      transition: transform .2s ease, background .2s ease;
    }

    .route-picker[open] .route-chevron,
    .flight-group[open] .flight-chevron {
      transform: rotate(45deg);
      background: var(--jade-soft);
    }

    .route-picker:not([open]) > .route-options,
    .flight-group:not([open]) > .flight-options,
    .utility-disclosure:not([open]) > .utility-grid,
    .reference-section:not([open]) > .reference-grid {
      display: none;
    }

    .route-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 7px;
      padding: 0 0 12px 85px;
      min-width: 0;
      animation: detailIn .18s ease both;
    }

    .route-option {
      min-width: 0;
      min-height: 53px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
      text-align: left;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .route-option.active {
      border-color: var(--jade);
      background: var(--jade-soft);
    }

    .option-main,
    .option-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .option-main {
      font-size: 12px;
      font-weight: 900;
    }

    .option-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .route-track {
      position: relative;
      margin-top: 14px;
      padding: 3px 0 13px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      scrollbar-color: var(--line-dark) transparent;
      scrollbar-width: thin;
      overscroll-behavior-inline: contain;
      -webkit-overflow-scrolling: touch;
    }

    .track-inner {
      --stop-count: 5;
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--stop-count), minmax(96px, 1fr));
      min-width: 100%;
    }

    .track-inner::before {
      position: absolute;
      top: 39px;
      right: 5%;
      left: 5%;
      height: 2px;
      background: var(--line);
      content: "";
    }

    .track-stop {
      position: relative;
      z-index: 1;
      min-width: 0;
      scroll-snap-align: center;
      text-align: center;
    }

    .track-kicker,
    .track-place,
    .track-time {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-kicker {
      height: 16px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .track-dot {
      display: block;
      width: 15px;
      height: 15px;
      margin: 16px auto 12px;
      border: 3px solid var(--surface);
      border-radius: 50%;
      background: var(--jade);
      box-shadow: 0 0 0 2px var(--jade);
    }

    .track-stop.transfer .track-dot {
      background: var(--amber);
      box-shadow: 0 0 0 2px var(--amber);
    }

    .track-stop.exit .track-dot {
      background: var(--coral);
      box-shadow: 0 0 0 2px var(--coral);
    }

    .track-place {
      padding: 0 5px;
      font-size: 13px;
      font-weight: 900;
    }

    .track-time {
      margin-top: 2px;
      padding: 0 5px;
      color: var(--jade);
      font-size: 10px;
      font-weight: 900;
    }

    .route-note {
      display: flex;
      gap: 8px;
      align-items: baseline;
      margin: 0;
      padding: 8px 11px;
      border-left: 3px solid var(--amber);
      border-radius: 0 5px 5px 0;
      background: var(--amber-soft);
      color: var(--muted);
      font-size: 11px;
    }

    .route-note strong { color: var(--ink); }

    .utility-disclosure,
    .reference-section {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .utility-disclosure {
      margin-top: 13px;
      background: rgba(255, 254, 250, .58);
    }

    .utility-summary,
    .reference-section > summary {
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr) auto 18px;
      gap: 9px;
      align-items: center;
      min-height: 48px;
      cursor: pointer;
      list-style: none;
    }

    .utility-summary::-webkit-details-marker,
    .reference-section > summary::-webkit-details-marker {
      display: none;
    }

    .disclosure-mark,
    .reference-summary-mark {
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border: 1px solid var(--line-dark);
      border-radius: 50%;
      color: var(--jade);
      font-size: 16px;
      line-height: 1;
      transition: transform .2s ease, background .2s ease;
    }

    .utility-disclosure[open] .disclosure-mark,
    .reference-section[open] .reference-summary-mark {
      transform: rotate(45deg);
      background: var(--jade-soft);
    }

    .disclosure-title,
    .disclosure-meta,
    .reference-summary-title,
    .reference-summary-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .disclosure-title,
    .reference-summary-title {
      font-size: 12px;
      font-weight: 900;
    }

    .disclosure-meta,
    .reference-summary-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .disclosure-action {
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
    }

    .disclosure-action::before { content: "展开"; }
    .utility-disclosure[open] .disclosure-action::before,
    .reference-section[open] .disclosure-action::before { content: "收起"; }

    .utility-summary,
    .reference-section > summary {
      padding: 0 1px;
    }

    .utility-disclosure > .utility-grid {
      margin-top: 0;
      padding: 0 0 13px;
      animation: detailIn .2s ease both;
    }

    .utility-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(250px, .85fr);
      gap: 12px;
      margin-top: 13px;
      align-items: start;
    }

    .tool-panel,
    .content-panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .tool-head,
    .content-head {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }

    .tool-head h2,
    .content-head h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
    }

    .tool-head span,
    .content-head span {
      margin-left: auto;
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line-dark);
      border-radius: 50%;
      background: transparent;
      color: var(--jade);
      cursor: pointer;
      line-height: 1;
      transition: background .2s ease, transform .2s ease;
    }

    .icon-button {
      width: 25px;
      height: 25px;
      margin-left: auto;
      font-size: 15px;
    }

    .weather-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
      gap: 6px;
      min-height: 89px;
      padding: 9px 12px 11px;
    }

    .weather-item {
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-2);
    }

    .weather-city,
    .weather-main {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .weather-city {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .weather-main {
      margin-top: 3px;
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .weather-icon {
      margin-right: 3px;
      font-size: 14px;
    }

    .weather-loading {
      align-self: center;
      color: var(--muted);
      font-size: 10px;
    }

    .exchange-body {
      padding: 9px 12px 11px;
    }

    .fx-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
    }

    .fx-input-wrap {
      display: flex;
      min-width: 0;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      background: var(--surface-2);
    }

    .fx-input {
      width: 100%;
      min-width: 0;
      padding: 8px 9px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .fx-mode {
      display: flex;
      align-items: center;
      padding-right: 4px;
    }

    .fx-mode button {
      padding: 4px 5px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 900;
    }

    .fx-mode button.active {
      background: var(--jade-soft);
      color: var(--jade);
    }

    .fx-swap {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--jade);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }

    .fx-result {
      display: block;
      min-height: 32px;
      margin-top: 7px;
      padding: 4px 8px;
      border-left: 2px solid var(--coral);
      background: var(--coral-soft);
      font-size: 14px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1.65;
      text-align: right;
    }

    .fx-presets {
      display: flex;
      gap: 5px;
      margin-top: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .fx-presets::-webkit-scrollbar { display: none; }

    .fx-preset {
      flex: 0 0 auto;
      min-width: 48px;
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 850;
    }

    .phrase-tool {
      grid-column: 1 / -1;
    }

    .phrase-categories {
      display: flex;
      gap: 5px;
      padding: 9px 12px 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .phrase-categories::-webkit-scrollbar { display: none; }

    .phrase-category {
      flex: 0 0 auto;
      min-height: 29px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 850;
      transition: border-color .18s ease, background .18s ease, color .18s ease;
    }

    .phrase-category.active {
      border-color: var(--jade);
      background: var(--jade-soft);
      color: var(--jade);
    }

    .phrase-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0 15px;
      padding: 2px 12px 9px;
    }

    .phrase-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-width: 0;
      min-height: 45px;
      padding: 5px 2px;
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: color .18s ease, background .18s ease;
    }

    .phrase-row:nth-child(-n + 3) { border-top: 0; }

    .phrase-copy-block {
      min-width: 0;
    }

    .phrase-original,
    .phrase-pronunciation,
    .phrase-meaning {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .phrase-original {
      font-size: 10px;
      font-weight: 900;
    }

    .phrase-pronunciation {
      margin-top: 1px;
      color: var(--muted);
      font-size: 9px;
    }

    .phrase-meaning {
      max-width: 88px;
      color: var(--muted);
      font-size: 10px;
      text-align: right;
    }

    .phrase-row.copied {
      background: var(--jade-soft);
      color: var(--jade);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr);
      gap: 18px;
      margin-top: 17px;
      align-items: start;
    }

    .content-head {
      min-height: 45px;
    }

    .content-head h2 {
      font-size: 16px;
    }

    .city-list {
      padding: 3px 16px 10px;
    }

    .city-stop {
      border-top: 1px solid var(--line);
    }

    .city-stop:first-child { border-top: 0; }

    .city-stop summary {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto 15px;
      gap: 10px;
      align-items: center;
      min-height: 70px;
      cursor: pointer;
      list-style: none;
    }

    .city-stop summary::-webkit-details-marker { display: none; }

    .city-index {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border: 1px solid var(--line-dark);
      border-radius: 50%;
      color: var(--jade);
      font-size: 10px;
      font-weight: 900;
    }

    .city-region,
    .city-name,
    .city-highlights,
    .city-period {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .city-region {
      color: var(--muted);
      font-size: 9px;
    }

    .city-name {
      margin-top: 2px;
      font-size: 17px;
      font-weight: 900;
    }

    .city-highlights {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .city-period {
      color: var(--jade);
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
    }

    .city-days {
      margin-top: 2px;
      color: var(--coral);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .city-chevron {
      color: var(--coral);
      font-size: 16px;
      line-height: 1;
      transition: transform .2s ease;
    }

    .city-stop[open] .city-chevron { transform: rotate(45deg); }

    .city-detail {
      margin: -1px 0 11px 38px;
      padding: 9px 11px;
      border-left: 2px solid var(--jade);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      animation: detailIn .2s ease both;
    }

    .city-detail strong { color: var(--ink); }

    .city-detail-label {
      color: var(--jade);
      font-size: 9px;
      font-weight: 900;
    }

    .attraction-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 18px;
      margin: 7px 0 0;
      padding: 0;
      list-style: none;
    }

    .attraction-list li {
      position: relative;
      min-width: 0;
      padding-left: 12px;
      color: var(--ink);
      font-size: 10px;
      font-weight: 750;
    }

    .attraction-list li::before {
      position: absolute;
      top: .5em;
      left: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--coral);
      content: "";
    }

    .city-detail-note {
      margin-top: 9px;
      color: var(--muted);
      font-size: 10px;
    }

    @keyframes detailIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .side-column {
      display: grid;
      gap: 18px;
      position: sticky;
      top: 75px;
    }

    .flight-groups {
      padding: 3px 16px 0;
    }

    .flight-group {
      border-top: 1px solid var(--line);
    }

    .flight-group:first-child { border-top: 0; }

    .flight-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 25px;
      gap: 9px;
      align-items: center;
      min-height: 72px;
      padding: 10px 0;
      cursor: pointer;
      list-style: none;
    }

    .flight-summary-copy {
      min-width: 0;
    }

    .flight-route,
    .flight-summary-name,
    .flight-summary-time {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .flight-route {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .flight-summary-name {
      margin-top: 2px;
      font-size: 11px;
      font-weight: 900;
    }

    .flight-summary-time {
      margin-top: 2px;
      color: var(--jade);
      font-size: 11px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .flight-summary-price {
      color: var(--coral);
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .flight-options {
      display: grid;
      gap: 6px;
      padding: 0 0 11px;
      animation: detailIn .18s ease both;
    }

    .flight-option {
      display: grid;
      grid-template-columns: 17px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 59px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-2);
      cursor: pointer;
      text-align: left;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .flight-option.selected {
      border-color: var(--jade);
      background: var(--jade-soft);
    }

    .flight-radio {
      display: grid;
      width: 14px;
      height: 14px;
      place-items: center;
      border: 2px solid var(--line-dark);
      border-radius: 50%;
    }

    .flight-option.selected .flight-radio {
      border-color: var(--jade);
    }

    .flight-option.selected .flight-radio::after {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--jade);
      content: "";
    }

    .flight-name,
    .flight-time,
    .flight-detail {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .flight-name {
      font-size: 11px;
      font-weight: 900;
    }

    .flight-time {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .flight-detail {
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
    }

    .flight-price {
      color: var(--coral);
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .budget {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 12px;
      margin: 0 16px;
      padding: 12px 0 14px;
      border-top: 1px solid var(--line);
      font-size: 11px;
    }

    .budget-label { color: var(--muted); }

    .budget-value {
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .budget-total {
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--ink);
      font-size: 15px;
      font-weight: 900;
    }

    .budget-note {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 9px;
    }

    .transport-list {
      padding: 3px 16px 11px;
    }

    .transport-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .transport-row:first-child { border-top: 0; }

    .transport-route {
      font-size: 11px;
      font-weight: 900;
    }

    .transport-note {
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
    }

    .transport-time {
      color: var(--jade);
      font-size: 11px;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }

    .transport-time small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
    }

    .footnote {
      margin: 13px 1px 0;
      color: var(--muted);
      font-size: 9px;
    }

    .modal-close {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }

    .reference-section {
      margin-top: 18px;
    }

    .reference-section > summary {
      grid-template-columns: 25px minmax(0, 1fr) auto 18px;
    }

    .reference-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 0 0 13px;
      animation: detailIn .2s ease both;
    }

    .reference-thumb {
      display: block;
      min-width: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-2);
      cursor: pointer;
      overflow: hidden;
      text-align: left;
      transition: border-color .2s ease, transform .2s ease;
    }

    .reference-thumb img {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: contain;
      object-position: center;
      background: var(--surface-2);
    }

    .reference-thumb span {
      display: block;
      padding: 6px 7px;
      color: var(--muted);
      font-size: 9px;
    }

    .modal {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(13, 31, 28, .78);
    }

    .modal.open { display: flex; }

    .modal-card {
      position: relative;
      width: min(720px, 100%);
      max-height: calc(100svh - 36px);
      padding: 9px;
      border-radius: 7px;
      background: var(--surface);
      box-shadow: 0 22px 60px rgba(0, 0, 0, .25);
      animation: modalIn .2s ease both;
    }

    .modal-card img {
      display: block;
      width: 100%;
      max-height: calc(100svh - 54px);
      object-fit: contain;
      background: var(--bg);
    }

    .modal-close {
      position: absolute;
      z-index: 1;
      top: -12px;
      right: -12px;
      width: 36px;
      height: 36px;
      font-size: 21px;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(.98) translateY(4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .is-entering {
      animation: routeIn .3s ease both;
    }

    @keyframes routeIn {
      from { opacity: .3; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (hover: hover) and (pointer: fine) {
      .time-tab:hover,
      .route-option:hover,
      .flight-option:hover,
      .reference-thumb:hover,
      .fx-preset:hover,
      .phrase-row:hover {
        transform: translateY(-1px);
      }

      .time-tab:hover { color: var(--jade); }
      .route-option:hover,
      .flight-option:hover,
      .reference-thumb:hover,
      .fx-preset:hover,
      .phrase-category:hover { border-color: var(--jade); }

      .phrase-row:hover {
        color: var(--jade);
        background: var(--jade-soft);
      }
    }

    @media (max-width: 980px) {
      .route-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .utility-grid {
        grid-template-columns: minmax(0, 1.1fr) minmax(240px, .9fr);
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .side-column {
        position: static;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
      }

      .reference-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (orientation: landscape) and (max-height: 560px) and (max-width: 920px) {
      .page {
        width: min(100% - 24px, 900px);
        padding-top: 4px;
      }

      .topbar {
        padding-top: 4px;
        padding-bottom: 6px;
      }

      .route-head {
        padding-top: 14px;
      }

      .route-title {
        font-size: 27px;
      }

      .route-picker > summary {
        min-height: 52px;
      }

      .route-options {
        display: flex;
        padding-left: 85px;
        overflow-x: auto;
        scrollbar-color: var(--line-dark) transparent;
        scrollbar-width: thin;
        overscroll-behavior-inline: contain;
      }

      .route-option {
        flex: 0 0 180px;
      }

      .route-track {
        margin-top: 9px;
        padding-bottom: 7px;
      }

      .route-note {
        padding: 6px 9px;
      }

      .utility-grid {
        grid-template-columns: minmax(0, 1.1fr) minmax(220px, .9fr);
        gap: 8px;
      }

      .phrase-tool {
        grid-column: 1 / -1;
      }

      .tool-head,
      .content-head {
        min-height: 36px;
        padding: 6px 9px;
      }

      .weather-list,
      .exchange-body,
      .phrase-list {
        padding-top: 6px;
        padding-bottom: 7px;
      }

      .weather-list {
        min-height: 71px;
      }

      .workspace {
        margin-top: 10px;
      }

      .side-column {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .flight-groups,
      .transport-list,
      .city-list {
        padding-left: 10px;
        padding-right: 10px;
      }

      .budget {
        margin-left: 10px;
        margin-right: 10px;
      }
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 20px, 540px);
        padding-top: 3px;
      }

      .topbar {
        gap: 7px;
        padding-top: 5px;
        padding-bottom: 7px;
      }

      .time-switch {
        width: 100%;
      }

      .time-tab {
        min-height: 45px;
        padding: 5px 8px;
      }

      .tab-main { font-size: 10px; }
      .tab-meta { font-size: 9px; }

      .route-head {
        display: block;
        padding-top: 16px;
      }

      .route-title {
        font-size: 22px;
        line-height: 1.18;
      }

      .route-meta {
        gap: 4px 10px;
        margin-top: 8px;
        font-size: 10px;
      }

      .route-meta span + span::before {
        margin-right: 10px;
      }

      .route-total {
        display: inline-block;
        min-width: 0;
        margin-top: 10px;
        padding: 8px 11px 9px;
      }

      .route-total strong { font-size: 22px; }

      .route-picker > summary {
        grid-template-columns: 62px minmax(0, 1fr) auto;
        gap: 8px;
        min-height: 56px;
      }

      .route-options {
        display: flex;
        width: 100%;
        padding: 0 0 10px 0;
        overflow-x: auto;
        scrollbar-color: var(--line-dark) transparent;
        scrollbar-width: thin;
        overscroll-behavior-inline: contain;
      }

      .route-option {
        flex: 0 0 154px;
        min-height: 50px;
      }

      .route-track {
        margin-top: 10px;
      }

      .track-inner {
        grid-template-columns: repeat(var(--stop-count), minmax(70px, 1fr));
        min-width: max(100%, calc(var(--stop-count) * 70px));
      }

      .track-place { font-size: 12px; }

      .route-note {
        display: block;
        font-size: 10px;
      }

      .route-note strong {
        display: inline-block;
        margin-right: 4px;
      }

      .utility-grid {
        grid-template-columns: 1fr;
        gap: 9px;
        margin-top: 11px;
      }

      .weather-list {
        grid-template-columns: repeat(auto-fit, minmax(106px, 1fr));
        min-height: 77px;
      }

      .phrase-list {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .phrase-row:nth-child(2),
      .phrase-row:nth-child(3) { border-top: 1px solid var(--line); }
      .phrase-row:first-child { border-top: 0; }

      .workspace {
        gap: 11px;
        margin-top: 12px;
      }

      .side-column {
        grid-template-columns: 1fr;
        gap: 11px;
      }

      .content-head {
        min-height: 42px;
        padding: 11px 12px 9px;
      }

      .city-list,
      .flight-groups,
      .transport-list {
        padding-left: 12px;
        padding-right: 12px;
      }

      .city-stop summary {
        grid-template-columns: 24px minmax(0, 1fr) auto 13px;
        gap: 7px;
        min-height: 64px;
      }

      .city-index {
        width: 23px;
        height: 23px;
      }

      .city-name { font-size: 16px; }
      .city-highlights { font-size: 9px; }
      .city-period,
      .city-days { font-size: 10px; }

      .city-detail {
        margin-left: 31px;
        font-size: 10px;
      }

      .attraction-list {
        gap: 6px 12px;
      }

      .budget {
        margin-left: 12px;
        margin-right: 12px;
      }

      .flight-option {
        min-height: 61px;
        padding: 8px;
      }

      .flight-summary {
        min-height: 68px;
      }

      .flight-name { font-size: 10px; }
      .flight-time { font-size: 11px; }
      .flight-detail { font-size: 8px; }
      .flight-price { font-size: 14px; }

      .transport-row {
        gap: 8px;
      }

      .transport-route,
      .transport-time { font-size: 10px; }

      .reference-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .reference-thumb img { height: 150px; }
      .modal { padding: 12px; }
      .modal-close { top: -9px; right: -9px; }
    }

    /* Editorial travel-atlas visual system */
    :root {
      --bg: #e8e7df;
      --surface: #f8f5ec;
      --surface-2: #eeeee7;
      --ink: #17342f;
      --muted: #68756f;
      --line: #d0d5cd;
      --line-dark: #abb8ae;
      --jade: #0d6257;
      --jade-soft: #dcebe5;
      --coral: #e1644b;
      --coral-soft: #f4dfd6;
      --amber: #c99535;
      --amber-soft: #f1e6c9;
      --stage: #123d37;
      --stage-raised: #194a43;
      --stage-text: #f4f0e5;
      --stage-muted: #abc0b8;
      --stage-line: rgba(244, 240, 229, .16);
      --shadow: 0 16px 42px rgba(23, 52, 47, .09);
      --font-display: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
      --font-body: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-data: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    body {
      background: var(--bg);
      font-family: var(--font-body);
    }

    .page {
      width: min(1380px, calc(100% - 48px));
      padding: 10px 0 32px;
    }

    .topbar {
      justify-content: center;
      padding: 7px 0 13px;
      background: rgba(232, 231, 223, .93);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: topbarIn .45s ease both;
    }

    .time-switch {
      position: relative;
      width: min(680px, 100%);
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(23, 52, 47, .11);
      border-radius: 7px;
      background: rgba(23, 52, 47, .07);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45);
      isolation: isolate;
    }

    .time-indicator {
      position: absolute;
      z-index: 0;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 6px);
      border-radius: 4px;
      background: var(--stage);
      box-shadow: 0 6px 18px rgba(18, 61, 55, .22);
      transform: translateX(0);
      transition: transform .36s cubic-bezier(.22, 1, .36, 1);
    }

    .time-switch.plan-b .time-indicator {
      transform: translateX(calc(100% + 4px));
    }

    .time-tab {
      position: relative;
      z-index: 1;
      min-height: 52px;
      padding: 7px 15px;
      border-radius: 4px;
      transition: color .25s ease, transform .2s ease;
    }

    .time-tab.active {
      background: transparent;
      color: var(--stage-text);
      box-shadow: none;
    }

    .time-tab.active .tab-meta { color: rgba(244, 240, 229, .65); }

    .tab-main {
      font-size: 13px;
      font-weight: 850;
    }

    .tab-meta {
      margin-top: 3px;
      font-size: 10px;
      font-weight: 650;
    }

    .route-stage {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 0 38px 25px;
      border: 1px solid rgba(7, 35, 31, .22);
      border-radius: 6px;
      background: var(--stage);
      color: var(--stage-text);
      box-shadow: 0 24px 70px rgba(18, 61, 55, .17);
      animation: stageIn .65s cubic-bezier(.22, 1, .36, 1) .05s both;
    }

    .route-head {
      gap: 34px;
      padding: 36px 0 24px;
      border-color: var(--stage-line);
    }

    .route-title {
      color: var(--stage-text);
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 780;
      line-height: 1.14;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .route-title .arrow {
      padding: 0 6px;
      color: var(--coral);
      font-family: var(--font-body);
      font-weight: 500;
    }

    .route-leg {
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }

    .route-meta {
      gap: 6px 18px;
      margin-top: 14px;
      color: var(--stage-muted);
      font-family: var(--font-data);
      font-size: 10px;
      font-weight: 600;
    }

    .route-meta span + span::before {
      margin-right: 18px;
      color: rgba(244, 240, 229, .3);
    }

    .route-total {
      min-width: 216px;
      padding: 14px 16px 15px;
      border: 1px solid var(--stage-line);
      border-left: 3px solid var(--coral);
      border-radius: 4px;
      background: rgba(244, 240, 229, .055);
    }

    .route-total span,
    .route-total small {
      color: var(--stage-muted);
      font-size: 9px;
    }

    .route-total strong {
      margin: 6px 0 4px;
      color: var(--stage-text);
      font-family: var(--font-data);
      font-size: 31px;
      font-weight: 800;
    }

    .route-picker {
      border-color: var(--stage-line);
    }

    .route-picker > summary {
      grid-template-columns: 76px minmax(0, 1fr) auto;
      min-height: 64px;
      padding: 8px 0;
    }

    .route-stage .section-label {
      color: var(--stage-muted);
      font-family: var(--font-data);
      font-size: 9px;
    }

    .route-current-name {
      color: var(--stage-text);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 760;
    }

    .route-current-meta {
      color: var(--stage-muted);
      font-size: 10px;
    }

    .route-chevron,
    .flight-chevron {
      width: 29px;
      height: 29px;
      border-radius: 50%;
      transition: transform .28s cubic-bezier(.22, 1, .36, 1), background .2s ease, color .2s ease;
    }

    .route-chevron {
      border-color: var(--stage-line);
      color: var(--stage-text);
    }

    .route-picker[open] .route-chevron {
      background: rgba(244, 240, 229, .1);
    }

    .route-options {
      gap: 8px;
      padding: 0 0 16px 89px;
    }

    .route-option {
      min-height: 58px;
      padding: 9px 12px;
      border-color: var(--stage-line);
      border-radius: 4px;
      background: rgba(244, 240, 229, .045);
      color: var(--stage-text);
      transition: border-color .2s ease, background .2s ease, color .2s ease, transform .24s cubic-bezier(.22, 1, .36, 1);
    }

    .route-option.active {
      border-color: var(--stage-text);
      background: var(--stage-text);
      color: var(--stage);
      box-shadow: inset 3px 0 0 var(--coral);
    }

    .route-option .option-main {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 760;
    }

    .route-option .option-meta { color: var(--stage-muted); }
    .route-option.active .option-meta { color: rgba(18, 61, 55, .62); }

    .route-track {
      margin-top: 18px;
      padding: 5px 0 16px;
    }

    .track-inner::before {
      top: 41px;
      height: 1px;
      background: var(--stage-line);
      transform-origin: left center;
    }

    .track-kicker {
      color: var(--stage-muted);
      font-family: var(--font-data);
      font-size: 8px;
      font-weight: 650;
    }

    .track-dot {
      width: 13px;
      height: 13px;
      margin: 18px auto 13px;
      border: 3px solid var(--stage);
      background: #6fc5b2;
      box-shadow: 0 0 0 2px #6fc5b2;
    }

    .track-stop.transfer .track-dot {
      background: #dfb14c;
      box-shadow: 0 0 0 2px #dfb14c;
    }

    .track-stop.exit .track-dot {
      background: var(--coral);
      box-shadow: 0 0 0 2px var(--coral);
    }

    .track-place {
      color: var(--stage-text);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 760;
    }

    .track-time {
      margin-top: 4px;
      color: #83d5c2;
      font-family: var(--font-data);
      font-size: 9px;
      font-weight: 750;
    }

    .route-note {
      padding: 10px 12px;
      border-left-color: #dfb14c;
      border-radius: 0 4px 4px 0;
      background: rgba(223, 177, 76, .12);
      color: rgba(244, 240, 229, .7);
      font-size: 10px;
      line-height: 1.55;
    }

    .route-note strong {
      color: var(--stage-text);
      font-weight: 850;
    }

    .utility-disclosure {
      margin-top: 15px;
      border-color: rgba(23, 52, 47, .18);
      background: transparent;
      animation: fadeUp .5s ease .16s both;
    }

    .utility-summary,
    .reference-section > summary {
      min-height: 54px;
    }

    .disclosure-mark,
    .reference-summary-mark {
      width: 27px;
      height: 27px;
      border-color: var(--line-dark);
      background: rgba(248, 245, 236, .65);
    }

    .disclosure-title,
    .reference-summary-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 760;
    }

    .disclosure-meta,
    .reference-summary-meta,
    .disclosure-action {
      font-size: 9px;
    }

    .utility-grid {
      gap: 14px;
    }

    .tool-panel,
    .content-panel {
      border-color: rgba(23, 52, 47, .13);
      border-radius: 6px;
      background: rgba(248, 245, 236, .94);
      box-shadow: var(--shadow);
    }

    .tool-head,
    .content-head {
      min-height: 50px;
      padding: 10px 16px;
      border-color: rgba(23, 52, 47, .11);
    }

    .tool-head h2,
    .content-head h2 {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 760;
    }

    .weather-list {
      gap: 8px;
      padding: 12px 16px 15px;
    }

    .weather-item {
      padding: 10px 11px;
      border-color: rgba(23, 52, 47, .11);
      border-radius: 4px;
      background: var(--surface-2);
    }

    .weather-main,
    .fx-input,
    .fx-result {
      font-family: var(--font-data);
    }

    .exchange-body { padding: 12px 16px 15px; }

    .fx-input-wrap,
    .fx-result,
    .fx-preset,
    .phrase-category {
      border-radius: 4px;
    }

    .phrase-categories {
      gap: 6px;
      padding: 11px 16px 6px;
    }

    .phrase-category {
      min-height: 32px;
      padding: 6px 11px;
      border-color: rgba(23, 52, 47, .13);
      font-size: 10px;
    }

    .phrase-category.active {
      border-color: var(--jade);
      background: var(--jade);
      color: var(--stage-text);
    }

    .phrase-list {
      gap: 0 20px;
      padding: 3px 16px 12px;
    }

    .phrase-row {
      min-height: 49px;
      padding: 6px 3px;
      border-color: rgba(23, 52, 47, .1);
      transition: color .18s ease, background .18s ease, transform .2s ease;
    }

    .phrase-original { font-size: 11px; }
    .phrase-pronunciation { font-family: var(--font-data); }

    .workspace {
      grid-template-columns: minmax(0, 1.18fr) minmax(380px, .82fr);
      grid-template-areas:
        "stay flight"
        "transport flight";
      gap: 20px;
      margin-top: 20px;
      animation: fadeUp .58s ease .22s both;
    }

    .workspace > .content-panel { grid-area: stay; }

    .content-panel {
      overflow: hidden;
    }

    .content-head {
      min-height: 55px;
      padding: 12px 18px;
    }

    .content-head h2 {
      font-size: 20px;
    }

    .city-list {
      position: relative;
      padding: 4px 18px 12px;
    }

    .city-list::before {
      position: absolute;
      top: 37px;
      bottom: 46px;
      left: 32px;
      width: 1px;
      background: var(--line);
      content: "";
    }

    .city-stop {
      position: relative;
      border-color: rgba(23, 52, 47, .1);
    }

    .city-stop summary {
      grid-template-columns: 31px minmax(0, 1fr) auto 17px;
      gap: 12px;
      min-height: 82px;
    }

    .city-index {
      z-index: 1;
      width: 29px;
      height: 29px;
      border: 2px solid var(--surface);
      background: var(--jade);
      box-shadow: 0 0 0 1px var(--jade);
      color: var(--stage-text);
      font-family: var(--font-data);
      font-size: 9px;
    }

    .city-region {
      color: var(--muted);
      font-family: var(--font-data);
      font-size: 8px;
    }

    .city-name {
      margin-top: 3px;
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 780;
    }

    .city-highlights {
      margin-top: 3px;
      font-size: 10px;
    }

    .city-period,
    .city-days {
      font-family: var(--font-data);
    }

    .city-detail {
      margin: -2px 0 15px 44px;
      padding: 4px 2px 6px 16px;
      border-left: 2px solid var(--coral);
      background: transparent;
      line-height: 1.55;
    }

    .city-detail-label {
      color: var(--coral);
      font-family: var(--font-data);
    }

    .attraction-list {
      gap: 8px 20px;
      margin-top: 9px;
    }

    .attraction-list li {
      font-size: 11px;
      font-weight: 720;
    }

    .attraction-list li::before {
      background: var(--coral);
    }

    .side-column {
      display: contents;
    }

    .side-column > .content-panel:first-child {
      position: sticky;
      top: 83px;
      grid-area: flight;
      align-self: start;
    }

    .side-column > .content-panel:last-child {
      grid-area: transport;
    }

    .flight-groups {
      padding: 2px 18px 0;
    }

    .flight-group {
      border-color: rgba(23, 52, 47, .1);
    }

    .flight-summary {
      min-height: 78px;
      padding: 12px 0;
    }

    .flight-route {
      font-family: var(--font-data);
      font-size: 8px;
    }

    .flight-summary-name {
      margin-top: 4px;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 760;
    }

    .flight-summary-time {
      margin-top: 3px;
      font-family: var(--font-data);
      font-size: 10px;
    }

    .flight-summary-price,
    .flight-price,
    .budget-value,
    .transport-time {
      font-family: var(--font-data);
    }

    .flight-summary-price {
      font-size: 16px;
    }

    .flight-chevron {
      border-color: var(--line-dark);
    }

    .flight-options {
      gap: 7px;
      padding-bottom: 13px;
    }

    .flight-option {
      min-height: 63px;
      border-radius: 4px;
      background: var(--surface-2);
    }

    .flight-option.selected {
      border-color: var(--jade);
      background: var(--jade-soft);
      box-shadow: inset 3px 0 0 var(--jade);
    }

    .budget {
      margin: 0 18px;
      padding: 14px 0 16px;
      border-color: rgba(23, 52, 47, .12);
    }

    .budget-total {
      font-family: var(--font-display);
      font-size: 17px;
    }

    .transport-list {
      padding: 2px 18px 9px;
    }

    .transport-row {
      min-height: 64px;
      border-color: rgba(23, 52, 47, .1);
    }

    .transport-route {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 760;
    }

    .transport-note,
    .transport-time small {
      font-size: 9px;
    }

    .reference-section {
      border-color: rgba(23, 52, 47, .17);
    }

    .reference-thumb {
      border-radius: 4px;
      background: var(--surface);
    }

    .footnote {
      font-family: var(--font-data);
      font-size: 8px;
    }

    .track-stop {
      animation: stopIn .48s cubic-bezier(.22, 1, .36, 1) both;
      animation-delay: calc(.15s + var(--i, 0) * .055s);
    }

    .route-stage::before {
      position: absolute;
      z-index: 0;
      top: -26%;
      right: 5%;
      width: min(36%, 420px);
      aspect-ratio: 2 / 3;
      background: url("vietnam-topography.webp") center / contain no-repeat;
      content: "";
      filter: grayscale(1) sepia(.25) contrast(1.05);
      mix-blend-mode: screen;
      opacity: .1;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      animation: mapBreath 14s ease-in-out infinite;
    }

    .route-stage > * {
      position: relative;
      z-index: 1;
    }

    .route-title { view-transition-name: route-title; }
    .route-total { view-transition-name: route-total; }
    .route-track { view-transition-name: route-track; }
    .city-list { view-transition-name: city-list; }
    .transport-list { view-transition-name: transport-list; }

    ::view-transition-group(route-title),
    ::view-transition-group(route-total),
    ::view-transition-group(route-track),
    ::view-transition-group(city-list),
    ::view-transition-group(transport-list) {
      animation-duration: .42s;
      animation-timing-function: cubic-bezier(.22, 1, .36, 1);
    }

    ::view-transition-old(route-title),
    ::view-transition-old(route-track),
    ::view-transition-old(city-list),
    ::view-transition-old(transport-list) {
      animation: viewOut .18s ease both;
    }

    ::view-transition-new(route-title),
    ::view-transition-new(route-track),
    ::view-transition-new(city-list),
    ::view-transition-new(transport-list) {
      animation: viewIn .42s cubic-bezier(.22, 1, .36, 1) both;
    }

    .route-stage button:focus-visible,
    .route-stage summary:focus-visible {
      outline-color: rgba(244, 240, 229, .78);
    }

    .city-stop[open] .city-name {
      color: var(--coral);
    }

    .weather-loading {
      animation: loadingPulse 1.15s ease-in-out infinite;
    }

    button,
    summary {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    @keyframes mapBreath {
      0%, 100% { opacity: .085; transform: translate3d(0, 0, 0) scale(1); }
      50% { opacity: .125; transform: translate3d(0, -5px, 0) scale(1.012); }
    }

    @keyframes viewOut {
      to { opacity: 0; transform: translateY(-5px); }
    }

    @keyframes viewIn {
      from { opacity: 0; transform: translateY(8px); }
    }

    @keyframes loadingPulse {
      50% { opacity: .38; }
    }

    .route-track.is-entering .track-inner::before {
      animation: lineDraw .52s ease both;
    }

    @keyframes topbarIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes stageIn {
      from { opacity: 0; transform: translateY(12px) scale(.995); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes stopIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes lineDraw {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @media (hover: hover) and (pointer: fine) {
      .time-tab:hover { transform: translateY(-1px); }

      .route-option:hover {
        border-color: rgba(244, 240, 229, .52);
        background: rgba(244, 240, 229, .085);
      }

      .route-option.active:hover {
        background: var(--stage-text);
      }

      .content-panel:hover {
        box-shadow: 0 20px 54px rgba(23, 52, 47, .12);
      }

      .flight-summary:hover .flight-chevron,
      .route-picker > summary:hover .route-chevron {
        transform: scale(1.06);
      }

      .flight-group[open] .flight-summary:hover .flight-chevron,
      .route-picker[open] > summary:hover .route-chevron {
        transform: rotate(45deg) scale(1.06);
      }
    }

    @media (hover: none), (pointer: coarse) {
      .time-tab:active,
      .route-option:active,
      .flight-option:active,
      .phrase-row:active,
      .icon-button:active,
      .fx-preset:active {
        transform: scale(.975);
      }

      .route-picker > summary:active,
      .flight-summary:active,
      .city-stop summary:active,
      .utility-summary:active,
      .reference-section > summary:active {
        opacity: .72;
      }
    }

    @media (max-width: 980px) {
      .page { width: min(100% - 28px, 940px); }
      .route-stage { padding-inline: 26px; }
      .route-title { font-size: 39px; }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-areas:
          "stay"
          "flight"
          "transport";
      }
      .side-column > .content-panel:first-child {
        position: static;
      }
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 16px, 560px);
        padding-top: 4px;
      }

      .topbar {
        padding: 3px 0 8px;
      }

      .time-switch {
        gap: 3px;
        padding: 3px;
      }

      .time-indicator {
        top: 3px;
        bottom: 3px;
        left: 3px;
        width: calc(50% - 4.5px);
      }

      .time-switch.plan-b .time-indicator {
        transform: translateX(calc(100% + 3px));
      }

      .time-tab {
        min-height: 47px;
        padding: 6px 9px;
      }

      .tab-main { font-size: 10px; }
      .tab-meta { font-size: 8px; }

      .route-stage {
        padding: 0 13px 15px;
        border-radius: 5px;
        box-shadow: 0 18px 46px rgba(18, 61, 55, .15);
      }

      .route-stage::before {
        top: -8%;
        right: -20%;
        width: min(72%, 310px);
        opacity: .07;
        animation: none;
      }

      .route-head {
        padding: 22px 0 17px;
      }

      .route-title {
        font-size: 27px;
        line-height: 1.18;
      }

      .route-title .arrow {
        padding: 0 3px;
      }

      .route-meta {
        gap: 4px 10px;
        margin-top: 10px;
        font-size: 8px;
      }

      .route-meta span + span::before {
        margin-right: 10px;
      }

      .route-total {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        width: 100%;
        margin-top: 15px;
        padding: 10px 12px;
      }

      .route-total span { grid-column: 1; }
      .route-total strong {
        grid-column: 2;
        grid-row: 1 / span 2;
        align-self: center;
        margin: 0;
        font-size: 25px;
      }
      .route-total small { grid-column: 1; }

      .route-picker > summary {
        grid-template-columns: 60px minmax(0, 1fr) auto;
        gap: 8px;
        min-height: 58px;
      }

      .route-current-name { font-size: 14px; }
      .route-options {
        padding: 0 0 12px;
        scrollbar-width: none;
      }

      .route-options::-webkit-scrollbar { display: none; }

      .route-option {
        flex-basis: 164px;
        min-height: 57px;
      }

      .route-track {
        margin-top: 12px;
        padding-bottom: 13px;
        scrollbar-width: none;
      }

      .route-track::-webkit-scrollbar { display: none; }

      .track-inner {
        grid-template-columns: repeat(var(--stop-count), minmax(74px, 1fr));
        min-width: max(100%, calc(var(--stop-count) * 74px));
      }

      .track-place { font-size: 12px; }
      .route-note { padding: 9px 10px; }

      .utility-disclosure { margin-top: 11px; }
      .utility-summary { min-height: 51px; }

      .tool-head,
      .content-head {
        padding-inline: 13px;
      }

      .weather-list,
      .exchange-body,
      .phrase-categories,
      .phrase-list {
        padding-left: 13px;
        padding-right: 13px;
      }

      .workspace {
        gap: 12px;
        margin-top: 13px;
      }

      .content-head {
        min-height: 49px;
      }

      .content-head h2 { font-size: 18px; }

      .city-list,
      .flight-groups,
      .transport-list {
        padding-left: 13px;
        padding-right: 13px;
      }

      .city-list::before { left: 27px; }

      .city-stop summary {
        grid-template-columns: 27px minmax(0, 1fr) auto 14px;
        gap: 8px;
        min-height: 72px;
      }

      .city-index {
        width: 25px;
        height: 25px;
      }

      .city-name { font-size: 18px; }
      .city-detail { margin-left: 35px; }

      .flight-summary {
        min-height: 72px;
      }

      .budget {
        margin-left: 13px;
        margin-right: 13px;
      }
    }

    @media (orientation: landscape) and (max-height: 560px) and (max-width: 920px) {
      .page {
        width: min(100% - 20px, 900px);
        padding-top: 4px;
      }

      .topbar { padding-bottom: 7px; }

      .time-switch {
        width: min(550px, 100%);
      }

      .time-tab {
        min-height: 45px;
        padding-block: 5px;
      }

      .route-stage {
        padding: 0 20px 10px;
      }

      .route-stage::before {
        top: -65%;
        right: 2%;
        width: 230px;
        opacity: .065;
        animation: none;
      }

      .route-head {
        display: grid;
        padding: 12px 0 9px;
      }

      .route-title {
        font-size: 30px;
      }

      .route-total {
        margin-top: 0;
        padding: 10px 13px;
      }

      .route-total strong {
        font-size: 27px;
      }

      .route-picker > summary {
        min-height: 44px;
      }

      .route-options { padding-left: 89px; }

      .route-track {
        margin-top: 5px;
        padding-bottom: 5px;
        scrollbar-width: none;
      }

      .route-options { scrollbar-width: none; }
      .route-track::-webkit-scrollbar,
      .route-options::-webkit-scrollbar { display: none; }

      .track-dot {
        margin-top: 9px;
        margin-bottom: 7px;
      }

      .track-inner::before { top: 32px; }
      .track-place { font-size: 12px; }
      .track-time { margin-top: 2px; font-size: 8px; }
      .route-note { padding: 5px 8px; line-height: 1.4; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }

      ::view-transition-group(*),
      ::view-transition-old(*),
      ::view-transition-new(*) {
        animation-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <nav class="time-switch" id="time-switch" aria-label="时间方案">
        <span class="time-indicator" aria-hidden="true"></span>
        <button class="time-tab active" type="button" data-plan="a" aria-selected="true">
          <span class="tab-main">方案一 · 09.25 → 10.03</span>
          <span class="tab-meta">河内进出 · 约 7 天</span>
        </button>
        <button class="time-tab" type="button" data-plan="b" aria-selected="false">
          <span class="tab-main">方案二 · 09.27 → 10.08</span>
          <span class="tab-meta">河内进 · 胡志明市出 · 约 10.5 天</span>
        </button>
      </nav>
    </header>

    <section class="route-stage">
      <section class="route-head" aria-live="polite">
        <div>
          <h1 class="route-title" id="route-title"></h1>
          <div class="route-meta">
            <span id="route-window"></span>
            <span id="route-duration"></span>
            <span id="route-stay"></span>
          </div>
        </div>
        <div class="route-total">
          <span>已知机票参考</span>
          <strong id="overview-total">¥0</strong>
          <small>不含地面交通、燃油、基建及税费</small>
        </div>
      </section>

      <details class="route-picker" id="route-picker">
        <summary>
          <span class="section-label">中间路线</span>
          <span class="route-current">
            <span class="route-current-name" id="route-current-name"></span>
            <span class="route-current-meta" id="route-current-meta"></span>
          </span>
          <span class="route-chevron" aria-hidden="true">+</span>
        </summary>
        <div class="route-options" id="route-options" role="listbox" aria-label="具体路线"></div>
      </details>

      <section class="route-track" aria-label="完整路线">
        <div class="track-inner" id="track-inner"></div>
      </section>
      <p class="route-note" id="route-note"></p>
    </section>

    <details class="utility-disclosure">
      <summary class="utility-summary">
        <span class="disclosure-mark" aria-hidden="true">+</span>
        <span>
          <span class="disclosure-title">小工具</span>
          <span class="disclosure-meta">天气 · 汇率 · 常用语</span>
        </span>
        <span class="disclosure-action" aria-hidden="true"></span>
        <span class="sr-only">展开或收起旅行小工具</span>
      </summary>
      <section class="utility-grid" aria-label="旅行小工具">
        <section class="tool-panel weather-tool">
          <div class="tool-head">
            <h2>天气</h2>
            <button class="icon-button" id="weather-refresh" type="button" title="刷新天气" aria-label="刷新天气">↻</button>
          </div>
          <div class="weather-list" id="weather-list" aria-live="polite"></div>
        </section>

        <section class="tool-panel exchange-tool">
          <div class="tool-head">
            <h2>汇率</h2>
            <span>1 CNY = 3,880 VND</span>
          </div>
          <div class="exchange-body">
            <div class="fx-row">
              <div class="fx-input-wrap">
                <label class="sr-only" for="fx-input">换算金额</label>
                <input class="fx-input" id="fx-input" type="number" value="1" min="0" step="0.01" inputmode="decimal">
                <div class="fx-mode" role="group" aria-label="输入币种">

    function updateBudget(plan, route) {
      const international = plan.flights.reduce((sum, group) => {
        const selectedId = selectedFlights[group.id];
        const selected = group.options.find(option => option.id === selectedId);
        return sum + (selected ? selected.price : 0);
      }, 0);
      const domestic = route.domesticFlights * domesticPerFlight;
      const total = international + domestic;
      document.querySelector("#budget-international").textContent = money(international);
      document.querySelector("#budget-domestic").textContent = money(domestic);
      document.querySelector("#budget-total").textContent = money(total);
      document.querySelector("#overview-total").textContent = money(total);
      document.querySelector("#budget-note").textContent = plan.budgetNote;

      ["budget-total", "overview-total"].forEach(id => {
        const element = document.querySelector(`#${id}`);
        element.classList.remove("number-flash");
        void element.offsetWidth;
        element.classList.add("number-flash");
      });
    }

    function weatherLocationsFor(route) {
      const locations = [];
      const seen = new Set();
      route.cities.forEach(city => {
        const query = weatherQueries[city.name];
        if (query && !seen.has(query)) {
          seen.add(query);
          locations.push({ label: city.name, query });
        }
      });
      return locations;
    }

    function weatherIconFor(description) {
      if (/雷/.test(description)) return "⚡";
      if (/雪/.test(description)) return "❄";
      if (/雨/.test(description)) return "☂";
      if (/晴/.test(description)) return "☀";
      if (/云|阴|雾|霾/.test(description)) return "☁";
      return "◌";
    }

    function weatherTemperature(value) {
      const temperature = Number(value);
      if (!Number.isFinite(temperature)) return "—";
      return `${Number.isInteger(temperature) ? temperature : temperature.toFixed(1)}°`;
    }

    function renderWeatherLoading(locations) {
      document.querySelector("#weather-list").innerHTML = locations.map(location => `
        <div class="weather-item">
          <span class="weather-city">${location.label}</span>
          <span class="weather-loading">读取中…</span>
        </div>
      `).join("");
    }

    async function loadWeather(route, force = false) {
      const requestId = ++weatherRequestId;
      const locations = weatherLocationsFor(route);
      renderWeatherLoading(locations);

      const results = await Promise.all(locations.map(async location => {
        const cached = weatherCache.get(location.query);
        if (!force && cached && Date.now() - cached.timestamp < 10 * 60 * 1000) {
          return { ...location, data: cached.data };
        }

        try {
          const response = await fetch(`${weatherApi}?city=${encodeURIComponent(location.query)}&lang=zh`);
          if (!response.ok) throw new Error(`weather-${response.status}`);
          const data = await response.json();
          weatherCache.set(location.query, { data, timestamp: Date.now() });
          return { ...location, data };
        } catch {
          return { ...location, error: true };
        }
      }));

      if (requestId !== weatherRequestId) return;

      document.querySelector("#weather-list").innerHTML = results.map(result => {
        if (result.error || !result.data) {
          return `
            <div class="weather-item">
              <span class="weather-city">${result.label}</span>
              <span class="weather-main">— 暂不可用</span>
            </div>
          `;
        }
        const data = result.data;
        return `
          <div class="weather-item">
            <span class="weather-city">${result.label}</span>
            <span class="weather-main"><span class="weather-icon" aria-hidden="true">${weatherIconFor(data.weather || "")}</span>${weatherTemperature(data.temperature)} ${data.weather || ""}</span>
          </div>
        `;
      }).join("");
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
      }
    }

    function renderPhrases() {
      const categories = ["全部", ...new Set(phrases.map(phrase => phrase.category))];
      document.querySelector("#phrase-categories").innerHTML = categories.map(category => `
        <button class="phrase-category ${category === activePhraseCategory ? "active" : ""}" type="button"
          data-phrase-category="${category}" role="tab" aria-selected="${category === activePhraseCategory}">
          ${category}
        </button>
      `).join("");

      const visiblePhrases = activePhraseCategory === "全部"
        ? phrases
        : phrases.filter(phrase => phrase.category === activePhraseCategory);

      document.querySelector("#phrase-list").innerHTML = visiblePhrases.map(phrase => `
        <button class="phrase-row" type="button" data-phrase="${phrase.original}" aria-label="复制：${phrase.original}">
          <span class="phrase-copy-block">
            <span class="phrase-original">${phrase.original}</span>
            <span class="phrase-pronunciation">${phrase.pronunciation}</span>
          </span>
          <span class="phrase-meaning">${phrase.meaning}</span>
        </button>
      `).join("");

      document.querySelectorAll(".phrase-category").forEach(button => {
        button.addEventListener("click", () => {
          activePhraseCategory = button.dataset.phraseCategory;
          renderPhrases();
        });
      });

      document.querySelectorAll(".phrase-row").forEach(button => {
        button.addEventListener("click", async () => {
          const text = button.dataset.phrase;
          await copyText(text);
          const meaning = button.querySelector(".phrase-meaning");
          const originalMeaning = meaning.textContent;
          button.classList.add("copied");
          button.setAttribute("aria-label", `已复制：${text}`);
          meaning.textContent = "已复制";
          window.setTimeout(() => {
            button.classList.remove("copied");
            button.setAttribute("aria-label", `复制：${text}`);
            meaning.textContent = originalMeaning;
          }, 900);
        });
      });
    }

    function updateExchange() {
      const input = document.querySelector("#fx-input");
      const rawValue = Number.parseFloat(input.value);
      const value = Number.isFinite(rawValue) && rawValue >= 0 ? rawValue : 0;
      const result = fxCurrency === "CNY"
        ? `₫ ${Math.round(value * cnyToVnd).toLocaleString("en-US")}`
        : `¥ ${(value / cnyToVnd).toFixed(2)}`;
      document.querySelector("#fx-result").textContent = result;

      document.querySelectorAll(".fx-mode button").forEach(button => {
        const active = button.dataset.currency === fxCurrency;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    }

    function switchFxCurrency(currency) {
      if (currency === fxCurrency) return;
      const input = document.querySelector("#fx-input");
      const current = Number.parseFloat(input.value);
      const value = Number.isFinite(current) && current >= 0 ? current : 0;
      const converted = fxCurrency === "CNY" ? value * cnyToVnd : value / cnyToVnd;
      fxCurrency = currency;
      input.value = currency === "CNY" ? converted.toFixed(2) : String(Math.round(converted));
      updateExchange();
    }

    function renderPage(animate = false) {
      const plan = getPlan();
      const route = getRoute();
      renderPlanTabs();
      renderRouteOptions();
      renderSummary(route, plan);
      renderTrack(route);
      renderCities(route);
      renderTransport(route);
      renderFlights(plan);
      updateBudget(plan, route);
      loadWeather(route);

      if (animate) {
        [document.querySelector(".route-head"), document.querySelector(".route-track"), document.querySelector(".workspace")].forEach(section => {
          section.classList.remove("is-entering");
          void section.offsetWidth;
          section.classList.add("is-entering");
        });
      }
    }

    function renderViewChange(update, scrollToTop = false) {
      const render = () => {
        update();
        renderPage(false);
      };
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!document.startViewTransition || reduceMotion) {
        render();
        if (scrollToTop) window.scrollTo({ top: 0, behavior: "auto" });
        return;
      }

      const transition = document.startViewTransition(render);
      if (scrollToTop) {
        transition.finished.then(() => window.scrollTo({ top: 0, behavior: "smooth" }));
      }
    }

    document.querySelectorAll(".time-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        if (tab.dataset.plan === activePlan) return;
        document.querySelector("#route-picker").open = false;
        renderViewChange(() => {
          activePlan = tab.dataset.plan;
          activeRoute = getPlan().defaultRoute;
        }, true);
      });
    });

    document.querySelector("#route-picker").addEventListener("toggle", event => {
      if (!event.currentTarget.open) return;
      requestAnimationFrame(() => {
        const list = document.querySelector("#route-options");
        const active = list.querySelector(".route-option.active");
        if (!active || list.scrollWidth <= list.clientWidth) return;
        const left = active.offsetLeft - (list.clientWidth - active.offsetWidth) / 2;
        list.scrollTo({
          left: Math.max(0, left),
          behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"
        });
      });
    });

    document.querySelector("#weather-refresh").addEventListener("click", () => loadWeather(getRoute(), true));
    document.querySelector("#fx-input").addEventListener("input", updateExchange);
    document.querySelectorAll(".fx-mode button").forEach(button => {
      button.addEventListener("click", () => switchFxCurrency(button.dataset.currency));
    });
    document.querySelector("#fx-swap").addEventListener("click", () => {
      switchFxCurrency(fxCurrency === "CNY" ? "VND" : "CNY");
    });
    document.querySelectorAll(".fx-preset").forEach(button => {
      button.addEventListener("click", () => {
        fxCurrency = "CNY";
        document.querySelector("#fx-input").value = button.dataset.value;
        updateExchange();
      });
    });

    const imageModal = document.querySelector("#image-modal");
    const modalImage = document.querySelector("#modal-image");

    const closeModal = () => {
      imageModal.classList.remove("open");
      modalImage.removeAttribute("src");
    };

    document.querySelectorAll(".reference-thumb").forEach(button => {
      button.addEventListener("click", () => {
        modalImage.src = button.dataset.image;
        modalImage.alt = button.dataset.caption;
        imageModal.classList.add("open");
      });
    });

    document.querySelector("#modal-close").addEventListener("click", closeModal);
    imageModal.addEventListener("click", event => {
      if (event.target === imageModal) closeModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });

    renderPhrases();
    updateExchange();
    renderPage();
  </script>
</body>
</html>
