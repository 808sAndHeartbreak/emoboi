<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f0">
  <title>越南行程 · 2026</title>
  <style>
    :root {
      --bg: #f4f5f0;
      --paper: #fffdf8;
      --paper-alt: #f9faf5;
      --ink: #142d2b;
      --muted: #70807b;
      --line: #dbe2dc;
      --line-strong: #bdcdc6;
      --teal: #0a7470;
      --teal-soft: #e7f3ef;
      --coral: #e46552;
      --coral-soft: #fae8e1;
      --gold: #d39b34;
      --gold-soft: #fbf1d9;
      --shadow: 0 10px 28px rgba(23, 52, 47, .055);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, summary { font: inherit; }
    button { color: inherit; }

    button:focus-visible,
    summary:focus-visible {
      outline: 3px solid rgba(10, 116, 112, .23);
      outline-offset: 2px;
    }

    .page {
      width: min(1220px, calc(100% - 36px));
      margin: 0 auto;
      padding: 16px 0 26px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .time-switch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px;
      width: min(560px, 100%);
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #e8ede8;
    }

    .time-tab {
      min-width: 0;
      min-height: 49px;
      padding: 6px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .time-tab.active {
      background: var(--paper);
      box-shadow: 0 3px 10px rgba(30, 58, 51, .08);
    }

    .time-tab .tab-main,
    .time-tab .tab-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time-tab .tab-main {
      font-size: 12px;
      font-weight: 900;
    }

    .time-tab .tab-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-left: auto;
    }

    .year {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .reference-trigger {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 42px;
      padding: 7px 0 7px 7px;
      border: 0;
      background: transparent;
      color: var(--teal);
      cursor: pointer;
      font-size: 11px;
      font-weight: 850;
    }

    .reference-trigger .glyph {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 5px;
      font-size: 13px;
      line-height: 1;
    }

    .route-overview {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      padding: 27px 0 16px;
      border-bottom: 1px solid var(--line);
    }

    .route-string {
      margin: 0;
      font-size: clamp(22px, 3vw, 35px);
      font-weight: 920;
      line-height: 1.14;
      letter-spacing: 0;
    }

    .route-string .arrow {
      padding: 0 3px;
      color: var(--coral);
      font-weight: 600;
    }

    .route-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 15px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .route-total {
      min-width: 163px;
      padding: 10px 14px 11px;
      border-left: 3px solid var(--coral);
      background: var(--coral-soft);
    }

    .route-total span,
    .route-total small {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .route-total strong {
      display: block;
      margin: 3px 0 2px;
      font-size: 25px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .number-flash {
      animation: numberFlash .5s ease;
    }

    @keyframes numberFlash {
      0% { color: var(--coral); }
      45% { color: var(--teal); }
      100% { color: var(--ink); }
    }

    .route-picker {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 13px;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .route-options {
      display: flex;
      gap: 7px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
      overscroll-behavior-inline: contain;
    }

    .route-option {
      flex: 1 1 0;
      min-width: 165px;
      min-height: 55px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      cursor: pointer;
      text-align: left;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .route-option.active {
      border-color: var(--teal);
      background: var(--teal-soft);
    }

    .route-option .option-main,
    .route-option .option-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .route-option .option-main {
      font-size: 12px;
      font-weight: 900;
    }

    .route-option .option-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .route-rail-wrap {
      position: relative;
      margin-top: 15px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
      overscroll-behavior-inline: contain;
    }

    .route-rail {
      --stop-count: 5;
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--stop-count), minmax(92px, 1fr));
      min-width: 100%;
      padding: 3px 0 14px;
    }

    .route-rail::before {
      position: absolute;
      top: 39px;
      right: 5%;
      left: 5%;
      height: 2px;
      background: var(--line);
      content: "";
    }

    .route-stop {
      position: relative;
      z-index: 1;
      min-width: 0;
      text-align: center;
    }

    .stop-kicker,
    .stop-place,
    .stop-time {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stop-kicker {
      height: 16px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 750;
    }

    .stop-dot {
      display: block;
      width: 15px;
      height: 15px;
      margin: 16px auto 12px;
      border: 3px solid var(--paper);
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 2px var(--teal);
    }

    .route-stop.transfer .stop-dot {
      background: var(--gold);
      box-shadow: 0 0 0 2px var(--gold);
    }

    .route-stop.exit .stop-dot {
      background: var(--coral);
      box-shadow: 0 0 0 2px var(--coral);
    }

    .stop-place {
      padding: 0 5px;
      font-size: 13px;
      font-weight: 900;
    }

    .stop-time {
      margin-top: 2px;
      padding: 0 5px;
      color: var(--teal);
      font-size: 10px;
      font-weight: 850;
    }

    .route-callout {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 1px 0 0;
      padding: 8px 11px;
      border-left: 3px solid var(--gold);
      background: var(--gold-soft);
      color: var(--muted);
      font-size: 11px;
    }

    .route-callout strong { color: var(--ink); }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr);
      gap: 18px;
      margin-top: 18px;
      align-items: start;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px 11px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .panel-head span {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .city-list {
      padding: 3px 16px 9px;
    }

    .city-stop {
      border-top: 1px solid var(--line);
    }

    .city-stop:first-child { border-top: 0; }

    .city-stop summary {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto 15px;
      gap: 10px;
      align-items: center;
      min-height: 67px;
      cursor: pointer;
      list-style: none;
    }

    .city-stop summary::-webkit-details-marker { display: none; }

    .city-index {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--teal);
      font-size: 11px;
      font-weight: 900;
    }

    .city-region,
    .city-name,
    .city-highlights {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .city-region {
      color: var(--muted);
      font-size: 10px;
    }

    .city-name {
      margin-top: 2px;
      font-size: 17px;
      font-weight: 900;
    }

    .city-highlights {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .city-days {
      color: var(--coral);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .city-chevron {
      color: var(--coral);
      font-size: 16px;
      line-height: 1;
      transition: transform .2s ease;
    }

    .city-stop[open] .city-chevron { transform: rotate(45deg); }

    .city-detail {
      margin: -1px 0 11px 38px;
      padding: 9px 11px;
      border-left: 2px solid var(--teal);
      background: var(--paper-alt);
      color: var(--muted);
      font-size: 11px;
      animation: detailIn .2s ease both;
    }

    .city-detail strong { color: var(--ink); }

    @keyframes detailIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .side-stack {
      display: grid;
      gap: 18px;
      position: sticky;
      top: 12px;
    }

    .flight-groups {
      padding: 3px 16px 0;
    }

    .flight-group {
      padding: 11px 0 12px;
      border-top: 1px solid var(--line);
    }

    .flight-group:first-child { border-top: 0; }

    .flight-group-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }

    .flight-options {
      display: grid;
      gap: 6px;
    }

    .flight-option {
      display: grid;
      grid-template-columns: 17px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 58px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper-alt);
      cursor: pointer;
      text-align: left;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .flight-option.selected {
      border-color: var(--teal);
      background: var(--teal-soft);
    }

    .flight-radio {
      display: grid;
      width: 14px;
      height: 14px;
      place-items: center;
      border: 2px solid var(--line-strong);
      border-radius: 50%;
    }

    .flight-option.selected .flight-radio {
      border-color: var(--teal);
    }

    .flight-option.selected .flight-radio::after {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      content: "";
    }

    .flight-name,
    .flight-time,
    .flight-detail {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .flight-name {
      font-size: 11px;
      font-weight: 900;
    }

    .flight-time {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .flight-detail {
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
    }

    .flight-price {
      color: var(--coral);
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .budget {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 12px;
      margin: 0 16px;
      padding: 12px 0 14px;
      border-top: 1px solid var(--line);
      font-size: 11px;
    }

    .budget-label { color: var(--muted); }

    .budget-value {
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .budget-total {
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--ink);
      font-size: 15px;
      font-weight: 900;
    }

    .budget-note {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 9px;
    }

    .transport-list {
      padding: 3px 16px 11px;
    }

    .transport-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .transport-row:first-child { border-top: 0; }

    .transport-route {
      font-size: 11px;
      font-weight: 900;
    }

    .transport-note {
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
    }

    .transport-time {
      color: var(--teal);
      font-size: 11px;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }

    .transport-time small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
    }

    .footnote {
      margin: 13px 1px 0;
      color: var(--muted);
      font-size: 9px;
    }

    .reference-drawer {
      position: fixed;
      z-index: 30;
      top: 68px;
      right: max(18px, calc((100vw - 1220px) / 2));
      display: none;
      width: min(362px, calc(100vw - 36px));
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: 0 18px 45px rgba(20, 45, 43, .16);
      animation: drawerIn .18s ease both;
    }

    .reference-drawer.open { display: block; }

    .reference-drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }

    .reference-close,
    .modal-close {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--paper);
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }

    .reference-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .reference-thumb {
      display: block;
      min-width: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--paper-alt);
      cursor: pointer;
      overflow: hidden;
      text-align: left;
      transition: border-color .2s ease, transform .2s ease;
    }

    .reference-thumb img {
      display: block;
      width: 100%;
      height: 118px;
      object-fit: cover;
      object-position: top;
    }

    .reference-thumb span {
      display: block;
      padding: 6px 7px;
      color: var(--muted);
      font-size: 9px;
    }

    @keyframes drawerIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(13, 31, 28, .78);
    }

    .modal.open { display: flex; }

    .modal-card {
      position: relative;
      width: min(720px, 100%);
      max-height: calc(100svh - 36px);
      padding: 9px;
      border-radius: 7px;
      background: var(--paper);
      box-shadow: 0 22px 60px rgba(0, 0, 0, .25);
      animation: modalIn .2s ease both;
    }

    .modal-card img {
      display: block;
      width: 100%;
      max-height: calc(100svh - 54px);
      object-fit: contain;
      background: var(--bg);
    }

    .modal-close {
      position: absolute;
      z-index: 1;
      top: -12px;
      right: -12px;
      width: 36px;
      height: 36px;
      font-size: 21px;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(.98) translateY(4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .is-entering {
      animation: routeIn .32s ease both;
    }

    @keyframes routeIn {
      from { opacity: .25; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (hover: hover) and (pointer: fine) {
      .time-tab:hover,
      .route-option:hover,
      .flight-option:hover,
      .reference-thumb:hover {
        transform: translateY(-1px);
      }

      .time-tab:hover { color: var(--teal); }
      .route-option:hover,
      .flight-option:hover,
      .reference-thumb:hover { border-color: var(--teal); }
    }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .side-stack {
        position: static;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: start;
      }
    }

    @media (orientation: landscape) and (max-height: 560px) and (max-width: 920px) {
      .page {
        padding-top: 8px;
      }

      .route-overview {
        padding-top: 17px;
      }

      .route-string {
        font-size: 24px;
      }

      .route-rail {
        padding-bottom: 8px;
      }

      .workspace {
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, .9fr);
        gap: 12px;
      }

      .side-stack {
        display: grid;
        grid-template-columns: 1fr;
      }

      .panel-head { padding: 10px 13px 8px; }
      .city-stop summary { min-height: 57px; }
      .city-list, .flight-groups, .transport-list { padding-left: 13px; padding-right: 13px; }
      .budget { margin-left: 13px; margin-right: 13px; }
      .flight-option { min-height: 51px; padding: 6px 8px; }
      .reference-drawer { top: 54px; }
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 20px, 540px);
        padding-top: 9px;
      }

      .topbar { gap: 7px; }

      .time-switch {
        width: calc(100% - 42px);
      }

      .time-tab {
        min-height: 47px;
        padding: 6px 8px;
      }

      .time-tab .tab-main { font-size: 11px; }
      .time-tab .tab-meta { font-size: 9px; }
      .top-actions { gap: 2px; }
      .year { display: none; }

      .reference-trigger {
        padding-left: 4px;
      }

      .reference-trigger span:last-child { display: none; }

      .route-overview {
        display: block;
        padding-top: 18px;
      }

      .route-string {
        font-size: 23px;
        line-height: 1.18;
      }

      .route-meta {
        gap: 4px 10px;
        font-size: 10px;
      }

      .route-total {
        display: inline-block;
        min-width: 0;
        margin-top: 11px;
        padding: 8px 11px 9px;
      }

      .route-total strong { font-size: 22px; }

      .route-picker {
        grid-template-columns: 1fr;
        gap: 7px;
        padding: 11px 0;
      }

      .route-options {
        width: 100%;
      }

      .route-option {
        min-width: 153px;
        min-height: 51px;
      }

      .route-rail-wrap {
        margin-top: 12px;
      }

      .route-rail {
        grid-template-columns: repeat(var(--stop-count), minmax(86px, 1fr));
        min-width: max(100%, 610px);
      }

      .route-callout {
        display: block;
        font-size: 10px;
      }

      .route-callout strong {
        display: inline-block;
        margin-right: 5px;
      }

      .workspace {
        gap: 12px;
        margin-top: 13px;
      }

      .side-stack {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .panel-head {
        padding: 12px 12px 9px;
      }

      .panel-head h2 { font-size: 15px; }
      .city-list { padding: 2px 12px 7px; }

      .city-stop summary {

            callout: "<strong>最省转场。</strong> 不去岘港 / 大叻，把时间集中给芽庄；适合想要轻松海边节奏。",
            domesticFlights: 2,

              { region: "南中 · 芽庄附近", name: "芽庄", days: "5–6 天", highlights: "海滨 · 珍珠岛 · 出海", detail: "<strong>河内→芽庄可直飞。</strong> 芽庄可作为唯一南中停留点，减少换城。" },
              { region: "南越 · 胡志明市附近", name: "胡志明市", days: "0–1 天", highlights: "出境节点 · 可停可不留", detail: "<strong>芽庄→胡志明市优先飞。</strong> 10.08 20:00 航班前预留机场接驳。" }
            ],
            legs: [

              { route: "芽庄 CXR → 胡志明 SGN", note: "优先飞", time: "飞 · 约 1h", sub: "约 ¥350" }
            ]
          }
        ],
        flights: [
          {
            id: "b-in",
            title: "上海 → 河内",
            options: [
              { id: "b-in-ho", name: "09.27 · 吉祥 HO1329", time: "22:00 → 00:20 次日", detail: "浦东 T2 → 河内 T2 · ¥937", price: 937 },
              { id: "b-in-vj", name: "09.27 · 越捷 VJ7239", time: "02:20 → 04:50", detail: "浦东 T2 → 河内 T2 · ¥872", price: 872 }
            ],
            selected: "b-in-ho"
          },
          {
            id: "b-out",
            title: "胡志明市 → 上海",
            options: [
              { id: "b-out", name: "10.08 · 越捷 VJ3900", time: "20:00 → 01:00 次日", detail: "新山一 T2 → 浦东 T2 · ¥1,605", price: 1605 }
            ],
            selected: "b-out"
          }
        ]
      }
    };

    let activePlan = "a";
    let activeRoute = plans.a.defaultRoute;
    const selectedFlights = {};

    const money = value => `¥${value.toLocaleString("zh-CN")}`;
    const getPlan = () => plans[activePlan];
    const getRoute = () => getPlan().routes.find(route => route.id === activeRoute);

    function renderTimeTabs() {
      document.querySelectorAll(".time-tab").forEach(tab => {
        const active = tab.dataset.plan === activePlan;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
      });
    }

    function renderRouteOptions() {
      const list = document.querySelector("#route-options");
      list.innerHTML = getPlan().routes.map(route => `
        <button class="route-option ${route.id === activeRoute ? "active" : ""}" type="button"
          data-route="${route.id}" role="tab" aria-selected="${route.id === activeRoute}">
          <span class="option-main">${route.name}</span>
          <span class="option-meta">${route.meta}</span>
        </button>
      `).join("");

      list.querySelectorAll(".route-option").forEach(button => {
        button.addEventListener("click", () => {
          activeRoute = button.dataset.route;
          renderPage(true);
        });
      });
    }

    function renderSummary(route, plan) {
      document.querySelector("#route-string").innerHTML = route.title;
      document.querySelector("#route-window").textContent = plan.window;
      document.querySelector("#route-duration").textContent = plan.duration;
      document.querySelector("#route-stay").textContent = plan.stay;
      document.querySelector("#route-callout").innerHTML = route.callout;
    }

    function renderRail(route) {
      const rail = document.querySelector("#route-rail");
      rail.style.setProperty("--stop-count", route.stops.length);
      rail.innerHTML = route.stops.map(stop => `
        <div class="route-stop ${stop.kind}">
          <span class="stop-kicker">${stop.kicker}</span>
          <span class="stop-dot" aria-hidden="true"></span>
          <span class="stop-place">${stop.place}</span>
          <span class="stop-time">${stop.time}</span>
        </div>
      `).join("");
    }

    function renderCities(route) {
      document.querySelector("#city-list").innerHTML = route.cities.map((city, index) => `
        <details class="city-stop">
          <summary>
            <span class="city-index">${String(index + 1).padStart(2, "0")}</span>
            <span>
              <span class="city-region">${city.region}</span>
              <span class="city-name">${city.name}</span>
              <span class="city-highlights">${city.highlights}</span>
            </span>
            <span class="city-days">${city.days}</span>
            <span class="city-chevron" aria-hidden="true">+</span>
          </summary>
          <div class="city-detail">${city.detail}</div>
        </details>
      `).join("");
    }

    function renderTransport(route) {
      document.querySelector("#transport-list").innerHTML = route.legs.map(leg => `
        <div class="transport-row">
          <div>
            <div class="transport-route">${leg.route}</div>
            <div class="transport-note">${leg.note}</div>
          </div>
          <div class="transport-time">${leg.time}<small>${leg.sub}</small></div>
        </div>
      `).join("");
    }

    function ensureFlightSelections(plan) {
      plan.flights.forEach(group => {
        if (!selectedFlights[group.id]) selectedFlights[group.id] = group.selected;
      });
    }

    function renderFlights(plan) {
      ensureFlightSelections(plan);
      document.querySelector("#flight-groups").innerHTML = plan.flights.map(group => `
        <div class="flight-group">
          <div class="flight-group-head">
            <span>${group.title}</span>
            <span>选择一项</span>
          </div>
          <div class="flight-options">
            ${group.options.map(option => {
              const selected = selectedFlights[group.id] === option.id;
              return `
                <button class="flight-option ${selected ? "selected" : ""}" type="button"
                  data-flight-group="${group.id}" data-flight="${option.id}" aria-pressed="${selected}">
                  <span class="flight-radio" aria-hidden="true"></span>
                  <span>
                    <span class="flight-name">${option.name}</span>
                    <span class="flight-time">${option.time}</span>
                    <span class="flight-detail">${option.detail}</span>
                  </span>
                  <span class="flight-price">${money(option.price)}</span>
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `).join("");

      document.querySelectorAll(".flight-option").forEach(button => {
        button.addEventListener("click", () => {
          selectedFlights[button.dataset.flightGroup] = button.dataset.flight;
          renderFlights(plan);
          updateBudget(plan, getRoute());
        });
      });
    }

    function updateBudget(plan, route) {
      const international = plan.flights.reduce((sum, group) => {
        const selectedId = selectedFlights[group.id];
        const selected = group.options.find(option => option.id === selectedId);
        return sum + (selected ? selected.price : 0);
      }, 0);
      const domestic = route.domesticFlights * domesticPerFlight;
      const total = international + domestic;
      document.querySelector("#budget-international").textContent = money(international);
      document.querySelector("#budget-domestic").textContent = money(domestic);
      document.querySelector("#budget-total").textContent = money(total);
      document.querySelector("#overview-total").textContent = money(total);
      document.querySelector("#budget-note").textContent = plan.budgetNote;

      ["budget-total", "overview-total"].forEach(id => {
        const element = document.querySelector(`#${id}`);
        element.classList.remove("number-flash");
        void element.offsetWidth;
        element.classList.add("number-flash");
      });
    }

    function renderPage(animate = false) {
      const plan = getPlan();
      const route = getRoute();
      renderTimeTabs();
      renderRouteOptions();
      renderSummary(route, plan);
      renderRail(route);
      renderCities(route);
      renderTransport(route);
      renderFlights(plan);
      updateBudget(plan, route);

      if (animate) {
        const sections = [
          document.querySelector(".route-overview"),
          document.querySelector(".route-rail-wrap"),
          document.querySelector(".workspace")
        ];
        sections.forEach(section => {
          section.classList.remove("is-entering");
          void section.offsetWidth;
          section.classList.add("is-entering");
        });
      }
    }

    document.querySelectorAll(".time-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        activePlan = tab.dataset.plan;
        activeRoute = getPlan().defaultRoute;
        renderPage(true);
      });
    });

    const referenceTrigger = document.querySelector("#reference-trigger");
    const referenceDrawer = document.querySelector("#reference-drawer");
    const referenceClose = document.querySelector("#reference-close");
    const imageModal = document.querySelector("#image-modal");
    const modalImage = document.querySelector("#modal-image");
    const closeReferences = () => {
      referenceDrawer.classList.remove("open");
      referenceDrawer.setAttribute("aria-hidden", "true");
      referenceTrigger.setAttribute("aria-expanded", "false");
    };
    const closeModal = () => {
      imageModal.classList.remove("open");
      modalImage.removeAttribute("src");
    };

    referenceTrigger.addEventListener("click", () => {
      const open = referenceDrawer.classList.toggle("open");
      referenceDrawer.setAttribute("aria-hidden", String(!open));
      referenceTrigger.setAttribute("aria-expanded", String(open));
    });
    referenceClose.addEventListener("click", closeReferences);

    document.querySelectorAll(".reference-thumb").forEach(button => {
      button.addEventListener("click", () => {
        modalImage.src = button.dataset.image;
        modalImage.alt = button.dataset.caption;
        imageModal.classList.add("open");
      });
    });

    document.querySelector("#modal-close").addEventListener("click", closeModal);
    imageModal.addEventListener("click", event => {
      if (event.target === imageModal) closeModal();
    });
    document.addEventListener("click", event => {
      if (!referenceDrawer.contains(event.target) && !referenceTrigger.contains(event.target)) {
        closeReferences();
      }
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeModal();
        closeReferences();
      }
    });

    renderPage();
  </script>
