骨魔"],"text":"如果亡骨魔死亡，被亡骨魔杀死的主谋依然保留能力。","kind":"jinx"},{"with":["梼杌"],"text":"主谋在梼杌的能力判断中被当作“不具有能力”。","kind":"jinx"},{"with":["姑获鸟"],"text":"如果姑获鸟死亡，获得主谋能力的姑获鸟保留主谋的能力。","kind":"jinx"}],"tips":["尽量生存并协调加时日计划。","对抗时把异常平安夜、此前处决与其他不死解释一起比较。"],"counterplay":["异常继续游戏不等于一定主谋；应对时分别盘僵怖、接位、未死等实际在池的解释。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗主谋"]},"zombuul":{"id":"zombuul","name":"僵怖","sourceTitle":"僵怖","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%83%B5%E6%80%96","checkedAt":"2026-11-11","ability":"每个夜晚*，如果今天白天没有人死亡，你会被唤醒并要选择一名玩家：他死亡。 当你首次死亡后，你仍存活，但会被当作死亡。","mechanics":["当僵怖因任何原因死亡后，他会保持存活状态，但说书人会表现得如同僵怖死亡了一样。僵怖第二次死亡时，才会真正地死亡，且善良阵营获胜。","看似死亡的僵怖在绝大多数情况下都算作已死亡。该玩家在城镇广场的生命标记会翻面以标识死亡。下一次该玩家投票时，会失去投票标记。该玩家不能发起提名，该玩家可以在有巫毒师的情况下投票，该玩家不算作茶艺师的存活邻近玩家，等等。不同之处是游戏还会继续，僵怖仍然能发起攻击，且游戏会在只剩两名其他存活玩家的情况下继续进行。","如果一个醉酒或中毒的僵怖死亡，善良阵营获胜。如果一个“死亡”的僵怖醉酒或中毒，不要宣布该玩家存活。"],"qa":[],"interactions":[{"with":["召唤师"],"text":"如果召唤师将一名已死亡的玩家变成了僵怖，该玩家会变成“已经死过一次”的僵怖。","kind":"jinx"},{"with":["戏子"],"text":"在戏子存在于剧本中时，僵怖可以在游戏中任意时候向说书人示意自己“想要死亡”。无论僵怖是否触发过“假死”，当晚僵怖会变为死亡状态。","kind":"jinx"},{"with":["戏子（改）"],"text":"在戏子（改）存在于剧本中时，僵怖可以在游戏中任意时候向说书人示意自己“想要死亡”。无论僵怖是否触发过“假死”，当晚僵怖会变为死亡状态。","kind":"jinx"}],"tips":["利用公开死亡隐藏，但留意白天死亡对出刀的限制。","对抗时别把候选只限于活人。"],"counterplay":["假死者可伪装成不再值得怀疑的信息角色；应对时让已死候选仍占原本的角色名额。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗僵怖"]},"pukka":{"id":"pukka","name":"普卡","sourceTitle":"普卡","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%99%AE%E5%8D%A1","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择一名玩家：他中毒。 上个因你的能力中毒的玩家会死亡并恢复健康。","mechanics":["当普卡攻击时，他的受害者会立即中毒。在下一个夜晚，该名玩家会在普卡发起下一次攻击之后的时间点死亡。","不同于其他恶魔，普卡在首个夜晚就会行动。","旅店老板能防止普卡杀死已经中毒的玩家，随后该玩家会恢复健康。","如果醉酒状态的普卡选择了一名玩家，该玩家不会中毒，也不会在下一个夜晚死亡。","如果普卡在上一个夜晚选择玩家时是清醒的，但是当晚醉酒了，该玩家不会死亡。但是当普卡恢复清醒，中毒效果会恢复，且会在随后的夜晚杀死该玩家。"],"qa":[],"interactions":[{"with":["召唤师"],"text":"召唤师可以在第二个夜晚召唤普卡来替代第三个夜晚的召唤。","kind":"jinx"},{"with":["戏子"],"text":"在戏子存在于剧本中时，普卡可以在游戏中任意时候向说书人示意自己“想要死亡”。说书人会在当晚杀死这名玩家。","kind":"jinx"},{"with":["戏子（改）"],"text":"在戏子（改）存在于剧本中时，普卡可以在游戏中任意时候向说书人示意自己“想要死亡”。说书人会在当晚杀死这名玩家。","kind":"jinx"}],"tips":["首夜即选毒位，结合次夜延迟死亡安排节奏。","对抗时分别追踪中毒开始和死亡结算。"],"counterplay":["应对时收到错误信息的人可能是下一夜死亡者；不要把中毒与延迟死亡放在同一时点。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗普卡"]},"shabaloth":{"id":"shabaloth","name":"沙巴洛斯","sourceTitle":"沙巴洛斯","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%B2%99%E5%B7%B4%E6%B4%9B%E6%96%AF","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择两名玩家：他们死亡。 你上个夜晚选择过且当前死亡的玩家之一可能会被你反刍。","mechanics":["不同于其他恶魔，沙巴洛斯每个夜晚会攻击两次。在攻击后的下一个夜晚，说书人可以决定让沙巴洛斯攻击过的两名玩家其中之一重获新生。","被复活的玩家可以是在存活状态下被沙巴洛斯攻击的玩家，也可以是在死亡状态下被沙巴洛斯攻击的玩家。","因反刍而复活的玩家重新获得自己的能力，即使是已经使用过的“每局游戏限一次”的能力也会重新获得。如果有“在你的首个夜晚”的能力，玩家可以再次使用该能力。"],"qa":[],"interactions":[{"with":[],"text":"关于沙巴洛斯造成的反刍所带来的首夜能力使用时机的疑问：在这三个官方剧本中，角色详解通常只用于解决剧本内的一些互动方式，如果将角色互动拉到全角色和混合剧本的维度，则需要使用到统一的规则。在黯月初升中，因为只会至多有一名恶魔在场，并且爪牙发起攻击的情形不太常见，所以在大部分情况下，你可以让反刍的角色在沙巴洛斯的行动结束后立即行动。然而如果是混合剧本，则需要综合考虑，选择更准确的，不会出错的处理方式进行游戏的主持。","kind":"detail"}],"tips":["权衡双刀收益与反刍风险。","对抗时记前夜目标的可能范围，不把复活单独认证为教授。"],"counterplay":["可以攻击已死目标影响反刍；应对时不能从某人复活反推出前夜必为首次死亡。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗沙巴洛斯"]},"po":{"id":"po","name":"珀","sourceTitle":"珀","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%8F%80","checkedAt":"2026-11-11","ability":"每个夜晚*，你可以选择一名玩家：他死亡。 如果你上次选择时没有选择任何玩家，当晚你要选择三名玩家：他们死亡。","mechanics":["如同其他的恶魔，珀可以在每晚攻击一名玩家。然而，如果珀不选择任何人，那么在下个夜晚珀可以攻击三名玩家。","如果珀在上一个夜晚不选择任何人时处于醉酒或中毒，当晚珀仍然能够选择三名玩家。","当要求珀选择三名玩家时，他必须要选择。珀不能再次不选择任何人。","只有当珀不选择任何人，才能得到三次攻击的机会。如果珀在上一次进行选择时攻击了某人但该玩家没有死亡，珀也不会获得三次攻击的机会。","珀在首个夜晚不行动，但这不算作珀“没有选择”。","如果驱魔人选择了珀，珀不会行动，但是这并不算作珀“没有选择任何人”。然而，如果珀在驱魔人选择他的前一夜就没有选择任何人，那么在驱魔人选择珀的下一夜，珀能够选择三名玩家，因为珀在上一次选择时没有选择任何人。"],"qa":[],"interactions":[],"tips":["在蓄力与单刀间规划节奏。","对抗时无夜死后要预留三刀分支，保护可能遮蔽真实选择。"],"counterplay":["普通保护能遮蔽单刀或三刀；应对时根据实际选择与能力通知更新，而非只按死亡人数判断蓄力。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","对抗珀"]},"judge":{"id":"judge","name":"法官","sourceTitle":"法官","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B3%95%E5%AE%98","checkedAt":"2026-11-17","ability":"每局游戏限一次，如果其他玩家发起了提名，你可以选择让本次提名直接执行处决或让投票无效。","mechanics":["法官可以决定赦免其认为无罪之人，可以判处其认为有罪之人。","当被提名者被法官赦免时，他今天不会被处决，所有投票作废。如果被提名者被法官判处有罪，无视票数，该玩家会被立即处决，也不管是否有其他玩家即将被处决。然后白天会结束，因为正常情况下一天只会有一次处决发生。","法官可以在投票被统计之后再使用自己的角色能力。然而，此时一旦有一名新的玩家被提名，法官就只能对这名新被提名的玩家使用角色能力了。法官只能在游戏中使用一次自己的角色能力，而且仅能在其他玩家发起提名时使用。"],"qa":[],"interactions":[],"tips":["留给关键处决或关键赦免。","票型只作倾向，不能把少人投票直接当恶魔证据。"],"counterplay":["强制处决只证明公开能力运作，不认证其阵营；应对时在关键提名前沟通使用意图。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%B3%95%E5%AE%98","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B3%95%E5%AE%98"]},"matron":{"id":"matron","name":"女舍监","sourceTitle":"女舍监","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%A5%B3%E8%88%8D%E7%9B%91","checkedAt":"2026-11-11","ability":"每个白天，你可以选择至多三对玩家交换座位。 玩家不能离开座位私聊。","mechanics":["女舍监可以交换两名玩家的座位，一天最多交换三次。新的座位是永久生效的，除非被女舍监又进行了改变。","同一个玩家可以被移动数次。","一些玩家也许会因为身体缺陷或物理障碍而难以移动，这种情况下，他们可以免疫女舍监的能力然后维持原位。","当女舍监在场时，玩家们无法进行私聊，除非他们坐着和相邻的玩家耳语。玩家们不能离开座位对其他玩家耳语，也不能在有人去上厕所时谈论跟游戏有关的内容等等。玩家应该自觉遵守这个规则。","同一天里，如果女舍监一次只交换了一对或两对玩家的座位，女舍监就不能够在当天晚些时候再交换另一对玩家的座位。女舍监的三次交换必须一次性执行完毕。"],"qa":[],"interactions":[],"tips":["利用换座拆开可疑协作，事先协调依赖邻座的信息角色。","换座前后分开保存座位关系。"],"counterplay":["应对时换座后重算邻座能力；不要让旧厨师首夜信息随新座位被重新解释。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"]},"voudon":{"id":"voudon","name":"巫毒师","sourceTitle":"巫毒师","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%B7%AB%E6%AF%92%E5%B8%88","checkedAt":"2026-11-11","ability":"只有你和死亡的玩家可以投票，且投票不需要使用投票标记。忽略票数需要过半的要求。","mechanics":["已死亡的玩家和巫毒师可以在白天不限次数进行投票。他们不需要使用投票标记来投票，也不会因为投票而失去他们的投票标记。存活的玩家不能投票，这并不是说存活玩家举了手但不作数，而是投票进行时存活玩家不能举起手。","处决一名玩家的票数无需达到存活玩家数量的一半以上。每天拥有最多票数的玩家会被处决。只要没有其他玩家获得票，即使被提名的玩家只有1票也会被处决。","巫毒师不会改变提名的规则。正常情况，存活的玩家才可以发起处决提名，已死亡的玩家不能发起处决提名。因为旅行者会被流放而不是被处决，所以所有的玩家不论存活或死亡都可以支持流放巫毒师或其他旅行者。","如果一名玩家即将被处决，然后巫毒师被流放了，那名玩家依然处于即将被处决的状态，玩家继续提名，之后存活的玩家就可以正常进行投票了。如果后续被提名处决的玩家获得了更多并且大于或等于一半以上的存活玩家数量的票数，这名新的被提名玩家会取代前面那名玩家即将被处决。"],"qa":[],"interactions":[],"tips":["前期一票影响大，后期与死者沟通。","死亡票不消耗不等于死者阵营可靠。"],"counterplay":["死者可能仍有邪恶成员；应对时别把投票主导权转交给死者当作自动安全。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"]},"apprentice":{"id":"apprentice","name":"学徒","sourceTitle":"学徒","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%AD%A6%E5%BE%92","checkedAt":"2026-11-17","ability":"在你的首个夜晚，如果你是善良的，你会获得一个镇民角色的能力；如果你是邪恶的，你会获得一个爪牙角色的能力。","mechanics":["一个善良的学徒会获得一个镇民的能力。一个邪恶的学徒会获得一个爪牙的能力。学徒拥有这个能力直至死亡。","在加入游戏的首个夜晚，学徒得知其获得的能力，如果该角色能力需要学徒当晚行动，学徒就会在当天夜里选择是否行动。","只有被列在角色列表中的能力才能被学徒获得。","如果学徒获得的能力是在游戏的首个夜晚产生作用的，例如祖母的能力，该能力会在学徒加入游戏的首个夜晚产生作用。","学徒并不会因为获得了某个角色的能力而变成该角色。学徒就是学徒，是一名旅行者，所以学徒能被流放但是不能被处决，学徒也不会被计入邪恶阵营获胜条件的“存活玩家数量”中。同样，有些能够探查角色的能力会得知学徒就是学徒。"],"qa":[],"interactions":[],"tips":["按获得的能力制定计划，明确旅行者身份与实际能力不同。","确认效果持续到何时。"],"counterplay":["善良旅行者可获得强镇民能力，但不成为那个角色；应对时核对角色类型查验与所获能力的区别。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%AD%A6%E5%BE%92","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%AD%A6%E5%BE%92"]},"bishop":{"id":"bishop","name":"主教","sourceTitle":"主教","source":"https://wiki.biligame.com/bloodontheclocktower/%E4%B8%BB%E6%95%99","checkedAt":"2026-11-11","ability":"只有说书人可以发起提名。每个白天说书人至少要提名一名你对立阵营的玩家。","mechanics":["在提名过程中，将由说书人发起提名，而不是由玩家发起提名。说书人可以根据自己的意愿提名或多或少的玩家。为了更加公平，说书人每一天必须提名至少一名与主教阵营相反的玩家。","主教不会改变投票的规则，每名玩家都可以正常进行投票。","由于旅行者会被流放，而不是被处决，任何玩家都可以发起对主教或其他旅行者的流放。"],"qa":[],"interactions":[],"tips":["逐日记录说书人提名名单，按主教当前阵营比较交集。","不是每位被提名者都在对立阵营。"],"counterplay":["两天名单相交不代表交集必为对立阵营；每天可以分别包含不同的对立玩家。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"]},"brushholder":{"id":"brushholder","name":"秉笔","sourceTitle":"秉笔","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%A7%89%E7%AC%94","checkedAt":"2026-11-11","ability":"如果你在白天死亡，当晚你会得知一名善良玩家。 如果你在夜晚死亡，当晚你会得知一名邪恶玩家。","mechanics":["秉笔只会得知一名玩家，不会得知他的具体角色。","如果秉笔在白天死亡，他会在当晚得知一名善良玩家。如果秉笔在夜晚死亡，则会得知邪恶玩家。","如果秉笔在白天死亡时醉酒中毒，但在当晚清醒健康，秉笔仍然会得知正确信息。"],"qa":[],"interactions":[{"with":[],"text":"针对角色简介的第三条的详细说明：根据中毒的处理步骤（参考中毒页面），如果秉笔在白天死亡时中毒，不会影响能力的触发条件和时机，秉笔仍然会在夜晚得知信息。而在夜晚时，如果秉笔已经清醒健康，则在获得信息时，会正常获得正确信息。","kind":"detail"}],"tips":["把死亡时段与信息类型一起记。","白天死亡认善、夜晚死亡认恶，均以有效反馈为前提。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"favoretteen":{"id":"favoretteen","name":"宠妃","sourceTitle":"宠妃","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%AE%A0%E5%A6%83","checkedAt":"2026-11-11","ability":"每局游戏限一次，说书人会在关于你的事情上打破规则。随后，你会秘密得知说书人为此做了什么。","mechanics":["说书人可以为宠妃打破规则，但只有一次。","如果宠妃中毒或醉酒，说书人不能为宠妃打破规则；但说书人可以在宠妃即将中毒或醉酒时打破规则，让宠妃保持健康且清醒。","打破规则的内容可以是任何事情，例如阻止死亡、获取信息、甚至是角色和阵营的转变。","在说书人为宠妃打破规则后，宠妃会秘密得知说书人为了他做了什么。如果是在白天，宠妃可以要求与说书人进行私聊；如果是在夜晚，说书人可能需要使用手机或纸笔告诉宠妃他做了什么。"],"qa":[],"interactions":[],"tips":["完整记下获知的破例及发生时点。","只用实际告知的破例解释现象，不把一切异常归给宠妃。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"dawnseal":{"id":"dawnseal","name":"道士","sourceTitle":"道士","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%81%93%E5%A3%AB","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：如果你选中了恶魔，你死亡，然后他醉酒直到下个黎明。","mechanics":["除首个夜晚以外的每个夜晚，道士需要选择一名玩家，如果那名玩家不是恶魔，道士依然存活。当选中一名恶魔玩家时，道士死亡，然后那名恶魔玩家在当晚醉酒。","醉酒只会维持到天亮前，天亮后恶魔玩家不再醉酒。","如果道士选中了恶魔，但道士的死亡由于某些原因被阻止，恶魔玩家当晚不会醉酒。"],"qa":[],"interactions":[{"with":[],"text":"特定角色互动： 小怪宝 ：如果道士选中了照顾小怪宝的玩家，道士会死亡，该玩家醉酒。小怪宝的能力不会受到任何影响。","kind":"detail"}],"tips":["选最值得验证的恶魔候选，提前留存目标。","夜死还可能由其他来源造成，不能自行认证命中。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"arythmomancer":{"id":"arythmomancer","name":"方士","sourceTitle":"方士","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%96%B9%E5%A3%AB","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你要选择一个数字。 在该数字对应的那一个夜晚，你会得知对应数量的在场角色。","mechanics":["在首个夜晚，方士要选择一个数字，对应数字的那个夜晚，方士会得知对应数量的在场角色，不论这些角色对应的玩家是否存活。","方士选择了“1”，那么首个夜晚方士就会得知一个在场角色；方士选择了“2”，那么第二个夜晚方士会得知两个在场角色，以此类推。"],"qa":[],"interactions":[],"tips":["权衡等待更多角色信息与过早死亡的风险。","得到的是在场角色，不提供对应座位。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"dragonli":{"id":"dragonli","name":"狸猫","sourceTitle":"狸猫","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%8B%B8%E7%8C%AB","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：如果他是善良角色且当晚被邪恶角色杀死，你和他交换角色。","mechanics":["除首个夜晚以外的每个夜晚，狸猫要选择一名玩家成为自己的“太子”。","在狸猫选择的当晚如果“太子”被邪恶角色的能力杀死，狸猫与“太子”交换角色。","如果被狸猫选择的玩家不是善良角色，比如爪牙、恶魔或者旅行者，那么他们无法成为狸猫的“太子”。","如果“太子”的死亡由于某些原因被阻止，狸猫不会与“太子”交换角色。并且，如果“太子”不是被邪恶角色的能力杀死，即使他们可能是邪恶玩家，狸猫也不会与“太子”交换角色。"],"qa":[],"interactions":[{"with":[],"text":"如果狸猫选择的“太子”是死亡触发能力的角色（比如贤者 、 守鸦人等），当“太子”死亡时，先触发该玩家的死亡触发能力，再结算狸猫交换角色。","kind":"detail"},{"with":["教授"],"text":"如果狸猫与使用过能力的教授交换角色，新教授仍然失去能力。","kind":"jinx"},{"with":["报丧女妖"],"text":"如果狸猫与报丧女妖交换角色，不会触发报丧女妖的能力。","kind":"jinx"},{"with":["科学怪人"],"text":"如果因科学怪人获得狸猫能力的恶魔与“太子”交换角色，改为“太子”变成狸猫且恶魔获得“太子”原本角色的能力。","kind":"jinx"},{"with":["利维坦"],"text":"每个夜晚*，利维坦要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果“太子”被选择，他会与狸猫交换角色但不会死亡。","kind":"jinx"},{"with":["暴乱"],"text":"每个夜晚*，暴乱要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果“太子”被选择，他会与狸猫交换角色但不会死亡。","kind":"jinx"}],"tips":["优先选择有用的善良角色，记录目标与死亡来源。","角色交换后的新旧信息不要混用。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"broker":{"id":"broker","name":"掮客","sourceTitle":"掮客","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%8E%AE%E5%AE%A2","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择两名存活玩家：如果他们阵营相同，今晚任何玩家使用自身能力选择他们之一作为目标时，改为选中另一名玩家。","mechanics":["在夜晚时，掮客选择的两名存活玩家如果阵营相同，任何玩家使用自身能力选择他们之一时，在其能力生效前，选择的目标会转移到另一名玩家的身上。随后，这项能力效果会以另一名玩家作为新的目标来结算。","如果掮客选择的两名存活玩家阵营不相同，那么，任何玩家使用自身能力选择他们之一作为目标时，不会发生转移。","使用能力被掮客转移目标的玩家不会得知自己的选择目标被更换。掮客也不会得知是否有玩家因此被转移了选择的目标。","只有需要玩家做出选择的能力才能被掮客转移目标。无需进行选择的能力，无法被掮客转移目标。","掮客的能力只会在夜晚生效。在白天时，他的能力不会产生任何效果。"],"qa":[],"interactions":[{"with":[],"text":"掮客会持续检测被选择的玩家的阵营，一旦他们当中出现了阵营变化导致这两名玩家阵营不同，掮客会立即失去对这两名玩家更换选择目标的能力。","kind":"detail"},{"with":[],"text":"更多规则与细节详情请查看更换选择目标 。","kind":"detail"},{"with":[],"text":"特定角色互动： 刺客 ：如果刺客攻击了掮客选择的玩家，那名玩家会直接死亡，并不会将刺客的效果转移到另一名玩家身上。","kind":"detail"},{"with":["痢蛭"],"text":"痢蛭的宿主及其中毒效果无法被转移。","kind":"jinx"}],"tips":["先考虑两人阵营是否相同，再评估互换目标的收益。","不能仅凭一次异常认定发生了转移。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"inspector":{"id":"inspector","name":"提刑官","sourceTitle":"提刑官","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%8F%90%E5%88%91%E5%AE%98","checkedAt":"2026-11-11","ability":"在你首次提名玩家后，你会在当晚得知他的角色。恶魔会被你的能力当作善良角色。","mechanics":["一旦提刑官发起了提名，当晚他会得知那名玩家的角色，无论那名玩家是否被处决。","恶魔玩家会被提刑官当作某个镇民或者外来者，由说书人来决定恶魔被提刑官当作什么角色。","当提刑官第一次发起提名并得知信息后，提刑官会失去能力。此后即使提刑官提名其他玩家，他也不会得知任何信息。"],"qa":[],"interactions":[{"with":[],"text":"由于提刑官是回溯型能力，如果提刑官提名的玩家是恶魔，但在夜晚变成了非恶魔，提刑官会得知一个善良角色；反之，如果提刑官提名的玩家是非恶魔，但在夜晚变成了恶魔，提刑官会得知他在白天时的角色。","kind":"detail"}],"tips":["把首次提名用在信息价值高的人。","得知善良角色仍要保留恶魔被掩盖的可能。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"patrolman":{"id":"patrolman","name":"巡察","sourceTitle":"巡察","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%B7%A1%E5%AF%9F","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择两个善良角色（与上个夜晚都不同）：如果他们都存活，他们当晚不会死亡。","mechanics":["与旅店老板类似，巡察保护的玩家们不会被恶魔杀死，受保护的玩家们也不会因为外来者、爪牙、镇民和旅行者的能力而死亡。","巡察只在夜晚保护玩家，并不包括白天。","巡察每个夜晚是通过选择两个善良角色来达到保护玩家的目的，而不是直接选择玩家。","巡察每个夜晚选择的两个善良角色要与上个夜晚选择的完全不同，善良角色指的是镇民和外来者角色。","巡察选择的两个善良角色如果都存活，巡察才能保护对应的玩家当晚不会死亡，否则巡察无法保护他们。"],"qa":[],"interactions":[{"with":[],"text":"即使被巡察选择且当前存活的善良角色在当晚发生了角色变化，巡察也能保护他们当晚不会死亡。","kind":"detail"},{"with":[],"text":"特定角色互动： 莽夫 ：如果巡察是当晚首个选择莽夫的玩家，巡察会因此醉酒，莽夫转变为巡察的阵营。","kind":"detail"},{"with":["利维坦"],"text":"如果利维坦提名并处决了巡察上个夜晚保护的其中一名玩家，善良阵营获胜。","kind":"jinx"},{"with":["暴乱"],"text":"如果暴乱提名并处决了巡察上个夜晚保护的其中一名玩家，善良阵营获胜。","kind":"jinx"}],"tips":["记录连续两夜所选角色，保护有价值且可能同在场的人。","选择的是角色，不是座位。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"guide":{"id":"guide","name":"引路人","sourceTitle":"引路人","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%BC%95%E8%B7%AF%E4%BA%BA","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择除你以外的至多三名玩家：你会得知今晚是否有邪恶玩家的能力选择或影响了他们之中的玩家。","mechanics":["每个夜晚，引路人都可以选择一至三名玩家，但不能不进行选择，也不能选择自己。","如果引路人选择的玩家中没有在当晚被邪恶玩家的能力选择或影响，引路人会得知“否”。","如果引路人选择的玩家中在当晚被邪恶玩家能力选择或者影响，引路人会得知“是”。如果引路人选择了超过一名玩家，他不会得知是具体哪名玩家被邪恶玩家能力选择或者影响了。","不仅邪恶的爪牙、恶魔能力会被引路人探查，邪恶的镇民、外来者能力也会被引路人探查。"],"qa":[],"interactions":[{"with":[],"text":"“影响”的范围包括：改变该玩家的状态（角色、阵营等），对该玩家的能力造成了妨害效果（互动干扰、能力效果干扰、阻止能力生效等），等等。暴露角色、让他人获取信息等能力不在“影响”的范围内。","kind":"detail"},{"with":[],"text":"与“保护”类似，如果邪恶玩家执行了善良玩家的能力产生选择或影响，同样会被引路人探查。","kind":"detail"},{"with":[],"text":"特定角色互动： 小怪宝 ：如果一名邪恶玩家照顾了小怪宝，当晚因小怪宝能力死亡的玩家算作被邪恶玩家的能力影响了。","kind":"detail"},{"with":["侍女"],"text":"侍女会得知引路人是否醒来，即使她是在引路人之前醒来。","kind":"jinx"},{"with":["数学家"],"text":"引路人会得知数学家是否被影响，即使他是在数学家之前醒来。","kind":"jinx"}],"tips":["分组选择一至三人，比较逐夜是否受邪恶能力影响。","“是”不告诉你谁受影响或对方是什么角色。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"estafette":{"id":"estafette","name":"驿使","sourceTitle":"驿使","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%A9%BF%E4%BD%BF","checkedAt":"2026-11-11","ability":"每个白天，你可以公开声明一个角色在场。在当晚，你会得知该声明是否正确。 如果你得知过是和否，你失去此能力。","mechanics":["每个白天，驿使可以公开声明一个角色在场。当晚，他会得知该声明是否正确。","如果驿使曾在夜晚得知过是和否，那么驿使将会失去能力。","如果驿使在醉酒或中毒时发表了声明，但当晚他的能力触发时却清醒且健康，那么说书人仍然会给他真实的信息。"],"qa":[],"interactions":[{"with":[],"text":"即使驿使在得知了是和否时处于醉酒或中毒状态，驿使也会失去能力。","kind":"detail"}],"tips":["用可区分主要分支的角色声明。","记清每晚是/否，已经各得过一次后不再期待后续反馈。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"zhen":{"id":"zhen","name":"鸩","sourceTitle":"鸩","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%B8%A9","checkedAt":"2026-11-11","ability":"每局游戏限一次，在夜晚时*，你可以选择一个镇民角色：如果他在场，他中毒并死亡。","mechanics":["每局游戏限一次，除首个夜晚以外的其他夜晚，鸩可以选择一个镇民角色，如果那个角色在场，该角色对应的玩家会中毒并死亡。","如果鸩选择了一个不在场的角色，不会有任何玩家受到鸩的影响，即使之后被选择的角色在场了，他也不会受到鸩的影响。","如果某个角色有多名玩家在场，且鸩选择了这个角色，只会有一名玩家中毒并死亡。"],"qa":[],"interactions":[{"with":[],"text":"如果鸩选择了自己，他会中毒但不会死亡。因为鸩先让自己中毒失去了能力，所以通常情况下鸩不会死于自己的能力。（特殊情况下，鸩可以死于自己的能力，比如咖啡师的效果1对鸩生效。）","kind":"detail"},{"with":["罂粟种植者"],"text":"如果鸩选择了罂粟种植者，罂粟种植者不会因为鸩的能力中毒。","kind":"jinx"},{"with":["半仙"],"text":"如果鸩选择了半仙，半仙会中毒并死亡。","kind":"jinx"}],"tips":["唯一一次应选真正需要核验的镇民角色。","无死亡不直接排除在场，可能受保护或能力失效。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"prefect":{"id":"prefect","name":"知府","sourceTitle":"知府","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%9F%A5%E5%BA%9C","checkedAt":"2026-11-11","ability":"每个夜晚*，你会得知今天是否有非镇民且非旅行者的玩家死亡。","mechanics":["知府关注的是当天所有的死亡玩家，包括夜晚的死亡，且不论他们因何种方式死亡。","非镇民且非旅行者指的是外来者、爪牙、恶魔这些玩家的角色类型。"],"qa":[],"interactions":[{"with":[],"text":"知府关注的是死亡那一刻，该玩家的角色类型是否为非镇民且非旅行者，即使该死亡玩家在之后角色发生了变化。","kind":"detail"}],"tips":["把当天全部死亡和各自当时角色类型一起核算。","“是”包含外来者，不等于当日死了坏人。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"bartender":{"id":"bartender","name":"酒保","sourceTitle":"酒保","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%85%92%E4%BF%9D","checkedAt":"2026-11-11","ability":"与你邻近的善良玩家（旅行者除外）之一醉酒，即使你死于处决。","mechanics":["由说书人选择哪名善良玩家醉酒，无论这名善良玩家是存活还是死亡。","酒保的醉酒效果会跳过与他相邻的邪恶玩家。酒保的醉酒效果不会对旅行者生效。","这项能力当酒保死于处决时仍会保留。如果酒保因为非处决的原因而死亡时，醉酒将会解除。","如果有玩家成为新的酒保，或一个醉酒的善良玩家转为了邪恶，都会根据新的位置关系立刻改变醉酒的玩家。"],"qa":[{"q":"酒保死了，醉酒就解除吗？","a":"死于处决不会解除该醉酒效果；其他死亡及失效按技能与本局裁定处理，不一概永久保留。"}],"interactions":[],"tips":["及时提醒可能的醉酒区域，结合相邻善良玩家而非物理邻座盘点。","处决自己未必解除影响。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"mortician":{"id":"mortician","name":"入殓师","sourceTitle":"入殓师","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%85%A5%E6%AE%93%E5%B8%88","checkedAt":"2026-11-11","ability":"如果你提名了恶魔且他死于这次处决，你会变成那个邪恶的恶魔。当剩余存活玩家小于等于四人时（旅行者除外），你失去能力。","mechanics":["如果入殓师提名并使恶魔死于处决前有五名或者更多的玩家存活；或者说，如果恶魔被入殓师提名并死于处决后有四名或更多的玩家存活，那么入殓师会变成邪恶的恶魔，游戏会如同恶魔尚未死亡一样继续进行。","当入殓师失去能力时，旅行者的数量不会计算在内。且入殓师不会得知自己失去了能力。","如果入殓师提名并使得恶魔死于处决时少于五名玩家存活，游戏会结束，入殓师不会变化角色与阵营，善良阵营获胜。","如果恶魔不是被入殓师提名并死于处决或入殓师提名了恶魔但恶魔没有死于处决，入殓师不会变成恶魔。","如果入殓师变成了恶魔，他在各种意义上都会成为恶魔。如果他被处决，善良阵营会获胜。他会在每个夜晚攻击玩家，他被当作恶魔。"],"qa":[],"interactions":[{"with":["舞蛇人"],"text":"如果舞蛇人选择了变成恶魔的原入殓师，舞蛇人会变成邪恶的恶魔，而非变成入殓师。","kind":"interaction"},{"with":["猩红女郎"],"text":"如果即将出现两名存活的恶魔，其中之一是由猩红女郎转变的，猩红女郎不会变成恶魔。","kind":"jinx"},{"with":["哈迪寂亚"],"text":"如果出现两名存活的哈迪寂亚，则入殓师变成的哈迪寂亚会变回入殓师，但阵营保持邪恶。","kind":"jinx"},{"with":["小怪宝"],"text":"如果在五名及以上的玩家存活时，入殓师提名并处决了照看小怪宝的玩家，入殓师会变为邪恶的该角色，之后原入殓师玩家必须要一直照看小怪宝。","kind":"jinx"},{"with":["痢蛭"],"text":"如果在大于等于五名玩家存活时，入殓师提名并处决了宿主且他死于这次处决，原本的痢蛭会在当晚死亡，入殓师变为邪恶的痢蛭且当晚无法攻击。","kind":"jinx"}],"tips":["提名前评估自己接位转邪风险和存活人数。","死因必须是这次提名的处决死亡。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"veilhuska":{"id":"veilhuska","name":"画皮","sourceTitle":"画皮","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%94%BB%E7%9A%AE","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你要选择一名存活玩家：他死亡但会被当作存活。 当他下一次即将死亡时，他重生，随后你重获能力。","mechanics":["画皮在首个夜晚就会攻击一名玩家，但天亮后所有玩家都不会知道这件事，除了画皮自己。","画皮的攻击会让玩家进入“活尸”状态，该玩家在城镇广场上会表现出“存活”，然而实际上已经死亡。","因画皮能力而进入“活尸”状态下的玩家下一次即将死亡时，画皮会阻止这次死亡，并将他复活。画皮会重获能力，在当晚进行下一次秘密的攻击。","只有能够被画皮杀死的玩家才能因为画皮的攻击而进入“活尸”状态。如果玩家的死亡由于某些原因被阻止，他就不会进入“活尸”状态，而是正常存活。","如果被画皮选择的玩家因为任何原因仍然存活，当那名玩家下一次即将死亡时，画皮也能阻止这次死亡并试图复活那名玩家（尽管复活存活的玩家会导致无事发生），随后重获能力。"],"qa":[],"interactions":[{"with":[],"text":"“活尸”状态下的玩家下一次即将死亡时，如果画皮由于任何原因无法阻止这次死亡，那么画皮无法将他复活，也不会重获能力。通常情况下，这意味着画皮在接下来的游戏中将会毫无作用。","kind":"detail"},{"with":[],"text":"如果一名玩家在“活尸”状态已经使用过“每局游戏限一次”的能力，或者已经使用过“每局游戏限一次”的能力之后再进入“活尸”状态，即使画皮将他复活，该玩家也无法再次使用“每局游戏限一次”的能力。","kind":"detail"},{"with":[],"text":"特定角色互动： 猩红女郎 ：如果画皮选择了恶魔，通常情况下，游戏会因为场上没有存活恶魔而立即结束。即使场上有猩红女郎，也会把恶魔当作存活玩家从而不触发猩红女郎的能力。","kind":"detail"}],"tips":["协调活尸目标与后续再死亡时机。","对抗时保留公开存活却已无能力的可能。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"hekwing":{"id":"hekwing","name":"蛊雕","sourceTitle":"蛊雕","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%9B%8A%E9%9B%95","checkedAt":"2026-11-11","ability":"每个夜晚，你会得知顺时针方向上的下一名存活的镇民玩家的角色，他中毒且可能被当作邪恶的蛊雕，直到下个黄昏。 每局游戏限一次，在夜晚时，你可以改变方向。","mechanics":["每个夜晚，蛊雕都会得知顺时针方向上的下一名存活的镇民玩家的角色。其他角色类型的玩家，或是已经死亡的玩家，都会被蛊雕跳过。","被蛊雕得知的玩家中毒且可能被当作邪恶的蛊雕，直到下个黄昏。这代表着其他玩家可能当作他是邪恶的蛊雕，也可能会是原本的阵营和角色，这取决于说书人。","蛊雕可以改变方向一次。如果蛊雕这么做了，代表蛊雕得知的玩家不再是顺时针方向上的下一名玩家，而是逆时针方向上的。蛊雕会因此得知曾得知过的角色。"],"qa":[],"interactions":[{"with":[],"text":"被“蛊毒”的玩家在同时判定角色和阵营的时候，如果决定让蛊雕的能力产生干扰，那么这名玩家只能被当作“邪恶的蛊雕”。","kind":"detail"},{"with":[],"text":"如果被“蛊毒”的玩家不再是镇民或死亡了，这名玩家依然受到“蛊毒”的影响。","kind":"detail"},{"with":["炼金术士"],"text":"如果炼金术士本应获得蛊雕的能力，那么他不会拥有该能力并改为蛊雕一定在场。每次处决后，存活的炼金术士可以公开猜测一名存活玩家是蛊雕：如果猜对了，恶魔当晚必须选择蛊雕。","kind":"jinx"},{"with":["魔术师"],"text":"蛊雕会跳过魔术师。","kind":"jinx"},{"with":["食人魔"],"text":"如果“蛊毒”玩家被食人魔当作邪恶的蛊雕，食人魔会得知自己转变为邪恶。","kind":"jinx"},{"with":["瘟疫医生"],"text":"如果说书人本应获得蛊雕的能力，改为一名爪牙玩家获得此能力，且他会得知此事。","kind":"jinx"},{"with":["戏子","戏子（改）"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"}],"tips":["记录方向与一次改向，利用所得镇民身份协作。","对抗时逐夜重算最近存活镇民与毒位。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"mengpo":{"id":"mengpo","name":"孟婆","sourceTitle":"孟婆","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%AD%9F%E5%A9%86","checkedAt":"2026-11-11","ability":"每个夜晚*，你可以选择一名存活玩家，他要二选一：1）能力描述修改为“你没有能力。”；2）死亡并保留能力直到下个黄昏。","mechanics":["除首个夜晚以外的每个夜晚，孟婆可以选择一名存活玩家，也可以不进行选择。被孟婆选择的那名玩家要么决定将自己的能力修改为“你没有能力”，要么决定自己死亡但保留能力。","孟婆在当晚不会得知那名玩家选择了什么。","该玩家的角色仍然是原本的角色。","如果玩家决定自己死亡，那么该玩家的能力会一直保留到下个黄昏。"],"qa":[],"interactions":[{"with":[],"text":"修改能力属于改变玩家的状态，不论那名玩家的角色发生了何种变化，那名玩家所拥有的能力描述都会被修改为“你没有能力”。这并不会影响角色列表上的能力描述。","kind":"detail"},{"with":[],"text":"修改能力的结果是即时型效果，类似死亡、阵营变化或者角色变化。所以，即使孟婆因任何原因失去能力（中毒、醉酒或死亡等），因孟婆而修改能力描述的玩家依旧“没有能力”。","kind":"detail"},{"with":[],"text":"如果决定死亡的玩家无法死亡，那么该玩家不会在下个黄昏失去自己的能力。","kind":"detail"},{"with":["梼杌"],"text":"梼杌判定被孟婆的效果1作用的爪牙为“不具有能力”。","kind":"interaction"},{"with":["郎中"],"text":"如果郎中选中了被孟婆的效果1作用的玩家，那么郎中依然会得知其角色原本能力相关的词语。","kind":"interaction"},{"with":["酒鬼","疯子","提线木偶","悟道者"],"text":"因孟婆而被修改能力的这些角色仍然会以为自己是对应的角色，但无法再与说书人进行互动。（如果悟道者由于某些原因导致未能成功触发其自身能力的话。）","kind":"interaction"},{"with":["猩红女郎"],"text":"如果恶魔选择死亡且猩红女郎即将变成恶魔，改为恶魔与猩红女郎交换角色，随后原恶魔死亡。","kind":"jinx"},{"with":["罂粟种植者"],"text":"如果孟婆选中了罂粟种植者，罂粟种植者会得知自己被孟婆选中并死亡。","kind":"jinx"}],"tips":["挑关键能力迫使抉择。","被选者应比较失去能力与带能力死亡的价值，记录选项及持续期。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"brewer":{"id":"brewer","name":"酿酒师","sourceTitle":"酿酒师","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%85%BF%E9%85%92%E5%B8%88","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择一个镇民角色：当他下一次通过自身能力获取信息时，改为得知你给出的信息。","mechanics":["每个夜晚，酿酒师要选择一个镇民角色，随后他要向说书人给出一个信息，当那个镇民角色下一次通过自身能力获取信息时，他会得知酿酒师给出的信息。","说书人解释的规则等并非由角色能力本身得知的信息并不会被酿酒师影响。","受到酿酒师影响的玩家在因为自身能力获取信息时，即使他醉酒中毒，得知的信息也一定是酿酒师给出的信息。","如果酿酒师给出的信息不在那个角色所能获得信息的格式范围内，那么在下一次那个角色获得信息时，酿酒师的能力不生效。","酿酒师影响的是特定角色而非角色能力的实际拥有者。如果酿酒师选择了不在场的角色，之后该角色在场了，被选择角色的对应玩家也会受到酿酒师的能力影响。","即使酿酒师在选择一个镇民角色的时候中毒醉酒，但只要在那个镇民因自身能力获取信息时酿酒师健康清醒，那么该镇民就会受到酿酒师能力影响。"],"qa":[],"interactions":[{"with":[],"text":"如果酿酒师多次选择同一个角色，在那个角色下一次获取信息时，以酿酒师最后一次给出的合理信息为准。","kind":"detail"},{"with":["守夜人"],"text":"被守夜人选择的其他玩家不是通过他的能力获取了信息，而是通过守夜人的能力获取信息，在此前提下，酿酒师的能力不会影响守夜人产生的信息。（如果守夜人选择自己，那么会被酿酒师的能力影响）","kind":"interaction"}],"tips":["根据善良方预期编排下一次反馈，避免自相矛盾。","对抗时不能把被替换的信息简单反转。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"pokkkun":{"id":"pokkkun","name":"暴君","sourceTitle":"暴君","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%9A%B4%E5%90%9B","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：他死亡。 如果你杀死了与爪牙邻近的玩家，下个夜晚你可以选择至多两名玩家：他们死亡。","mechanics":["如果暴君上个夜晚杀死了与爪牙邻近的玩家，那么下个夜晚暴君可以选择杀害至多两名玩家。","如果与爪牙邻近的玩家因为某些原因没有被暴君杀死，那么暴君只能选择一名玩家。","如果暴君在“暴虐”杀戮时再次杀死了与爪牙邻近的玩家，下个夜晚，暴君仍可以继续“暴虐”杀戮。","暴君在“暴虐”杀戮时可以不进行选择，也可以只攻击一名玩家。"],"qa":[],"interactions":[],"tips":["协调爪牙邻近目标以争取次夜双刀。","对抗时先核对实际击杀而不是仅有选择。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"warden":{"id":"warden","name":"典狱长","sourceTitle":"典狱长","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%85%B8%E7%8B%B1%E9%95%BF","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择至多三名玩家：如果明天白天他们之一死于处决，上次被你选择的其他玩家会在当晚死亡。否则，当晚他们之中会有一名玩家死亡。","mechanics":["典狱长在首个夜晚就会行动，他可以选择一至三名玩家，但不能不进行选择。","如果下个白天，被典狱长选中的玩家之一死于处决，那么所有其他被典狱长选中的玩家都会在下个夜晚死亡；否则，被典狱长选中的玩家中会有一名玩家在下个夜晚死亡。"],"qa":[],"interactions":[{"with":[],"text":"特定角色互动： 莽夫 ：典狱长造成死亡在他选择玩家之后。例如：典狱长第二个夜晚选择了未被选择过的莽夫，第一个夜晚他选择的玩家都不会死亡。但第三个夜晚，只要典狱长健康清醒，那么典狱长在第二个夜晚选择的玩家（包括莽夫在内），都会正常结算死亡。","kind":"detail"},{"with":["召唤师"],"text":"召唤师可以在第二个夜晚召唤典狱长来替代第三个夜晚的召唤。","kind":"jinx"}],"tips":["计划次日处决与前夜人选的连动。","对抗时按前夜选择组解释死亡，不套普通当夜一刀。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"guhornia":{"id":"guhornia","name":"姑获鸟","sourceTitle":"姑获鸟","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%A7%91%E8%8E%B7%E9%B8%9F","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：他死亡。每局游戏限一次，当爪牙死于处决时，你可能会获得他的能力。","mechanics":["当有爪牙死于处决时，说书人可以决定让姑获鸟获得该爪牙的能力。即使有善良的爪牙死于处决，姑获鸟也可以获得他的能力。","如果一名爪牙被处决了，但因为一些原因没有死亡，则姑获鸟不会获得他的能力。","姑获鸟不会得知自己获得了什么爪牙的能力。","姑获鸟获得爪牙的能力只能触发一次。如果在姑获鸟获得能力之后，有新的姑获鸟出现，新的姑获鸟也可以获得能力。"],"qa":[],"interactions":[{"with":[],"text":"姑获鸟始终获得的是死于处决时该爪牙的能力，无论该爪牙后续变成了什么角色。","kind":"detail"},{"with":["主谋"],"text":"如果姑获鸟死亡，获得主谋能力的姑获鸟保留主谋的能力。","kind":"jinx"},{"with":["邪恶双子"],"text":"如果姑获鸟获得了邪恶双子的能力，新对立双子会知道“姑获鸟在场”，但不会知道姑获鸟是谁。","kind":"jinx"},{"with":["哥布林"],"text":"姑获鸟无法获得哥布林的能力。","kind":"jinx"},{"with":["精神病患者"],"text":"如果姑获鸟获得了精神病患者的能力，他会在被处决时死亡。","kind":"jinx"},{"with":["提线木偶"],"text":"姑获鸟无法获得提线木偶的能力。","kind":"jinx"},{"with":["维齐尔"],"text":"姑获鸟无法获得维齐尔的能力。","kind":"jinx"},{"with":["召唤师"],"text":"如果召唤师成功召唤了姑获鸟，召唤师会变成一个不在场的爪牙。","kind":"jinx"},{"with":["亡魂"],"text":"如果姑获鸟本应获得亡魂的能力，改为亡魂保留能力。","kind":"jinx"}],"tips":["与爪牙协调处决死亡时机。","对抗时即使爪牙死了，也保留其能力转移给恶魔的分支。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"geehnyn":{"id":"geehnyn","name":"奸佞","sourceTitle":"奸佞","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%A5%B8%E4%BD%9E","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：他死亡。爪牙在其死亡的当晚要选择一名玩家：如果他是善良的，他死亡。","mechanics":["除首个夜晚以外的每个夜晚，奸佞会选择一名玩家进行杀戮。","如果爪牙死亡，当晚那名爪牙都要选择一名玩家，如果他选中了一名善良玩家，那名玩家死亡。","如果爪牙死亡时或夜晚奸佞行动时奸佞醉酒中毒，那么当晚那名爪牙无法进行选择。"],"qa":[],"interactions":[{"with":[],"text":"僧侣 、 士兵无法免疫爪牙使用奸佞能力所造成的死亡。","kind":"detail"},{"with":[],"text":"即使爪牙在死亡后角色发生了变化，当晚该玩家依然可以使用奸佞的能力选择一名玩家。","kind":"detail"}],"tips":["让爪牙准备死亡夜的善良目标。","对抗时区分恶魔攻击和爪牙获得的额外击杀。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"actor_v2":{"id":"actor_v2","name":"戏子（改）","sourceTitle":"戏子（改）","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%88%8F%E5%AD%90%EF%BC%88%E6%94%B9%EF%BC%89","checkedAt":"2026-11-11","ability":"其他善良玩家醉酒（旅行者除外），你们互相认识且无法转变阵营，对调胜负结果，即使你失去能力。","mechanics":["所有除旅行者和戏子（改）以外的善良玩家都会在整局游戏中醉酒。","在游戏结束时，只要有戏子（改）在场，不论戏子（改）是否失去能力，都会导致游戏的胜负结果对调。如果一局游戏会使得善良阵营获胜，戏子（改）会导致所有善良玩家落败，且邪恶玩家获胜。反之亦然。","邪恶玩家和旅行者无法变成戏子（改）角色，也无法获得戏子（改）的能力。戏子（改）在场时，所有除旅行者以外的善良玩家无法转变阵营。"],"qa":[{"q":"与旧戏子有什么区别？","a":"旧版用全善良玩家成为戏子的设置；改版保留其他善良角色但使其醉酒、互认并锁定阵营。两版不可混用。"}],"interactions":[{"with":[],"text":"与阵营相关的互动干扰无法影响戏子（改）互认与醉酒效果。例如： 半兽人的“失足”是自己，戏子（改）的能力仍然会让半兽人参与互认并使其醉酒。","kind":"detail"},{"with":["间谍","邪恶双子","寡妇","亡魂","召唤师","暴乱"],"text":"戏子（改）与这些角色互为克星。互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["军团","利维坦","普卡","僵怖","牙噶巴卜"],"text":"通过常规方式难以自杀的恶魔，在戏子（改）存在于剧本中时，可以在游戏中任意时候向说书人示意自己“想要死亡”。说书人会在当晚杀死这名玩家。） 麻脸巫婆 ：麻脸巫婆无法创造戏子（改），麻脸巫婆创造的邪恶玩家无法获得戏子（改）的能力。","kind":"jinx"},{"with":["无神论者"],"text":"戏子（改）无法反转处决说书人导致的胜负结果，无神论者不会因为戏子（改）的能力醉酒。","kind":"jinx"},{"with":["哥布林","恐惧之灵"],"text":"戏子（改）无法反转由这些角色能力产生的胜负结果。","kind":"jinx"},{"with":["疯子"],"text":"疯子不会因为戏子（改）能力参与互认，也不会因为戏子（改）的能力醉酒。","kind":"jinx"},{"with":["国王","告密者","落难少女"],"text":"国王/告密者/落难少女不会因为戏子（改）的能力醉酒。","kind":"jinx"},{"with":["书生"],"text":"书生不会因为戏子（改）的能力醉酒。","kind":"jinx"},{"with":["蛊雕"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"}],"tips":["先确认互认、阵营锁定和反转规则，再制定全队行动。","别期待其他善良玩家的醉酒能力正常工作。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"imperialist":{"id":"imperialist","name":"禁卫军","sourceTitle":"禁卫军","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%A6%81%E5%8D%AB%E5%86%9B","checkedAt":"2026-11-11","ability":"“疯狂”地想要死亡的玩家可能会立即被处决。","mechanics":["如果有玩家向其他玩家表达自己想要死亡的想法，那么禁卫军的能力可能会处决该玩家以达成他的愿望。","“可能”意味着说书人可以不进行处决，具体情况根据场上局势而定。","如果有玩家在晚上表达了想要死亡，那么你也可以在当晚处决他，这不算在每个白天的一次处决限制里。宣布他被处决，并正常进行夜晚行动。","处决必须立即执行。如果一名曾经想要死亡的玩家开始表现出求生的欲望，或者他表达自己想要死亡的想法已经过去了一段较长的时间，那么你就不能够在之后将他处决。"],"qa":[],"interactions":[],"tips":["注意自己及他人公开求死的措辞。","未被处决不能排除禁卫军，疯狂触发是可能而非必定。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"royalmessenger":{"id":"royalmessenger","name":"赦令承旨","sourceTitle":"赦令承旨","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%B5%A6%E4%BB%A4%E6%89%BF%E6%97%A8","checkedAt":"2026-11-11","ability":"解除所有角色能力在进行选择时的限制条件。","mechanics":["这是传奇规则，不占玩家座位。解除的是角色能力在选择目标时的限制，例如僧侣不能选自己、驱魔人不能连续同选、侍女只能选存活者。","不把夜晚*改成首夜可用，不刷新限次技能，也不撤销触发条件或胜负条件。开局应说明具体适用的选择方式。"],"qa":[],"interactions":[],"tips":["开局确认具体解除哪些选择限制及本局裁定。","不要自动解除触发条件、次数或胜负要求。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"banxian":{"id":"banxian","name":"半仙","sourceTitle":"半仙","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%8D%8A%E4%BB%99","checkedAt":"2026-11-11","ability":"任何在夜晚使用自身能力选择你的其他玩家，会改为选中另一名邪恶玩家作为替代。","mechanics":["在夜晚时，任何使用自身能力选择半仙的玩家，在其能力生效前，选择的目标会暗中转移到一名邪恶玩家的身上。随后，这项能力效果会以那名邪恶玩家作为新的目标来进行结算。","使用能力选择半仙的玩家不会得知自己的选择目标被更改，半仙也不会得知自己的能力被触发。","只有需要做出选择的能力才能被半仙转移目标。无需进行选择的能力，无法被半仙转移目标。","在一项能力更换目标后，无需重新进行选择限制条件的判断。 舞蛇人的选择目标可能会因此改为已经死亡的邪恶玩家， 恶魔代言人的选择目标可能会改为选中自己。","在一项能力更换目标后，需要重新进行能力效果中触发条件的判断。 传教士因为半仙而改为选中恶魔时，不会让恶魔失去能力，因为恶魔与爪牙是不同的角色类型。","一项能力在更换选择目标后，能力自身与选择相关的内容不会因此发生变更，依然以玩家自身做出的选择作为判断基准。 恶魔代言人在选择半仙后导致目标转移，他在第二晚无法选择半仙，而不是无法选择转移后的目标。 管家在选择主人时目标被变更， 管家在下个白天投票时仍然需要参考他昨晚选择的那名玩家的投票意见，不会受到影响。","如果一项能力需要玩家选择多个目标，而半仙成为了目标之一，那么半仙只会将自己更改为一名邪恶玩家，不会使得玩家的其他目标发生变化。半仙也不会让一项能力的多个目标中重复选择同一名玩家。如果此时没有其他合法的目标可以转移选择，那么半仙仍然会受到原本能力效果的影响。","一项能力中的某个选择目标至多只能被转移一次。也就是说，被半仙转移后的目标，无法受到使节的影响使得目标再次转移。","半仙的能力只会在夜晚被触发。在白天时，他的能力不会产生任何效果。"],"qa":[],"interactions":[{"with":["恐惧之灵"],"text":"如果恐惧之灵选择了半仙，是否播报能力取决于半仙转移结果的玩家是否与恐惧之灵之前的选择发生了变化。被半仙转移后，恐惧之灵的能力只会对转移后的目标生效（从某种意义上来说，也算是无效了，因为恐惧之灵的能力此时只能让邪恶阵营落败）。恐惧之灵需要通过播报与否来判断自己是否选中了半仙。","kind":"interaction"},{"with":["和尚"],"text":"如果半仙与和尚为邻座，且有邪恶玩家的能力选择了半仙，在和尚的能力生效前，半仙会先将选择目标转移，从而使得邪恶玩家既不会选择半仙为目标，也不会影响半仙，因此不会触发和尚的能力。反之，如果半仙将邪恶玩家的选择转移到与和尚邻近的一名邪恶玩家，和尚的能力就会因此被触发。","kind":"interaction"},{"with":["痢蛭"],"text":"痢蛭的宿主及其中毒效果无法被转移。","kind":"jinx"},{"with":["鸩"],"text":"如果鸩选择了半仙，半仙会中毒并死亡。","kind":"jinx"}],"tips":["保留夜间目标被暗中转移的可能。","选择半仙所得信息不一定描述半仙本人。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"facechanger":{"id":"facechanger","name":"变脸师","sourceTitle":"变脸师","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%8F%98%E8%84%B8%E5%B8%88","checkedAt":"2026-11-11","ability":"每个白天，如果你“疯狂”地证明自己是一个善良角色（与之前不同），你可能会在当晚获得那个角色的能力，直到下个黄昏。","mechanics":["如果变脸师疯狂证明自己是一个善良角色，他就可能会在当晚获得那个角色的能力。","每当变脸师获得一项能力时，那项能力会持续到下个黄昏。","变脸师无法多次获得同一个角色的能力。","变脸师可以连续多天疯狂证明自己是同一个角色，随后在接下来的一天证明自己是其他角色。每次在决定变脸师是否能够获得能力时，只会参考变脸师当天白天的言论。只要他这一天疯狂证明的角色与他之前曾经证明过且获得能力的角色不同，他就可能会获得这个角色的能力。","部分角色能力跨度时间与变脸师获得能力的时间可能会不匹配。（如杂耍艺人 、 歌伶等。）这些角色的能力在变脸师疯狂证明时便可立即获得，无需等到夜晚。"],"qa":[],"interactions":[],"tips":["按局势选择新善良角色并充分疯狂。","获得能力不是必然，记下实际反馈与时间窗口。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"firewatcher":{"id":"firewatcher","name":"打更人","sourceTitle":"打更人","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%89%93%E6%9B%B4%E4%BA%BA","checkedAt":"2026-11-11","ability":"每个夜晚*，你要猜测今晚首个死亡的玩家与你的距离。如果你猜测正确，则除你以外的所有玩家今晚不会死亡，但你可能会死亡。","mechanics":["在每个夜晚，打更人都可以猜测一个数字，这个数字是打更人认为的当晚第一个即将死亡的玩家与他的距离。因此，打更人在猜测时实际上同时猜测了他左右两侧与这个距离相符的玩家。","如果当晚首次有玩家死亡，且这个玩家与打更人之间的距离正好是打更人猜测的距离，那么这名玩家当晚不会死亡。“首次死亡的玩家”是在当晚的夜晚行动顺序中，最先造成死亡的能力所选择的目标。","如果打更人猜测正确，那么在当晚，除了打更人以外的其他玩家都不会死亡。但是只要打更人的猜测正确，他就有可能在当晚死亡。这一死亡的时机发生在当晚所有会造成死亡的效果之后，因为打更人会阻止除他以外的所有其他人的死亡。","已经死亡的玩家也会参与到打更人的距离计算中。也就是说，在游戏的中后期，打更人的猜测可能只能保护一名存活玩家免于死亡。","打更人可以猜测“0”，也就是猜测自己是今晚首个死亡的玩家。如果打更人的猜测正确，仍然可以在当晚避免其他所有玩家的死亡，且他可能会在当晚所有会造成死亡的效果结算完毕之后再死亡。","如果夜晚无人死亡，或者首个死亡的玩家与打更人之间的距离不是打更人猜测的距离，那么打更人的能力在当晚不会被触发，他也不会在当晚因为自身的能力而死亡。","如果打更人无法成功保护他猜测的距离所对应的玩家，他的能力也不会被触发，其他玩家在受到攻击时会正常死亡。"],"qa":[],"interactions":[{"with":[],"text":"特定角色互动： 锦衣卫 ：锦衣卫无法保护打更人的死亡，因为打更人的免死会使得锦衣卫无法死亡。","kind":"detail"},{"with":["利维坦"],"text":"如果利维坦提名并处决了打更人上个夜晚猜测的其中一名玩家，善良阵营获胜。","kind":"jinx"},{"with":["暴乱"],"text":"如果暴乱提名并处决了打更人上个夜晚猜测的其中一名玩家，善良阵营获胜。","kind":"jinx"}],"tips":["结合夜杀倾向猜距离，首尾按座位环计算。","无人死亡仍有其他解释，不直接认证猜中。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"waiter":{"id":"waiter","name":"店小二","sourceTitle":"店小二","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%BA%97%E5%B0%8F%E4%BA%8C","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你会得知两名善良玩家。他们之中会有一人醉酒，即使你已死亡。","mechanics":["在首个夜晚，店小二会得知两名玩家，这两名玩家都属于善良阵营。","店小二所得知的两名玩家之中，会有一名玩家始终醉酒，即使店小二已经死亡。","如果店小二在游戏中途被创造，他会在当晚得知两名玩家，且他得知的这两名玩家之中会有一名玩家醉酒。","如果已经死亡的玩家变成了店小二，他不会得知任何信息，但仍然会让一名善良玩家醉酒。"],"qa":[],"interactions":[{"with":[],"text":"如果店小二因为其他角色的能力醉酒中毒，或受到涡流效果影响，使得店小二得知了错误信息，店小二仍然会让他所得知的两名玩家之中的一人醉酒（如果是店小二醉酒中毒导致的错误信息则需要店小二恢复健康清醒后）。这可能会因此导致邪恶玩家醉酒。然而，如果他得知的玩家中存在善良玩家，说书人都应该倾向于让善良玩家醉酒。","kind":"detail"},{"with":[],"text":"在店小二醉酒或中毒后，他所得知的玩家可能会发生变化。","kind":"detail"}],"tips":["与两名对象核对信息，识别谁可能长期醉酒。","正常首夜信息的善良认证不意味着两人的能力都可靠。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"diva":{"id":"diva","name":"歌伶","sourceTitle":"歌伶","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%AD%8C%E4%BC%B6","checkedAt":"2026-11-11","ability":"每局游戏限一次，在白天时，你可以提议所有玩家观看你的演出，并从同意参加的玩家中选择你的观众。如果恶魔成为了观众，你会在当晚死亡。","mechanics":["歌伶的能力在每局游戏中只能使用一次。歌伶需要在白天公开声明自己是歌伶，随后才能使用自己的能力。","与其他公开声明的角色一样，任何玩家都可以伪装自己是歌伶，并假装使用自己的能力。说书人同样也会配合你的“演出”。","在歌伶公开使用能力后，想要参加“歌伶的演出”的玩家需要举手来示意自己想要成为歌伶的观众。已经死亡的玩家也能举手。在所有玩家表明态度后，歌伶需要从举手的玩家中选择哪些玩家作为自己的观众。所有玩家都会知道谁成为了歌伶的观众。","如果恶魔被歌伶选为了自己的观众，那么歌伶就会在当晚死亡。","如果非恶魔玩家在被选中作为观众后，变成了恶魔角色，歌伶不会因此死亡。","只要歌伶在当晚清醒健康，即使她在选择观众时醉酒中毒，但观众中包含恶魔，那么歌伶就会在夜晚死亡。"],"qa":[],"interactions":[],"tips":["在演出前评估观众组合，记同意参加及最终选择。","夜死还需比较其他死亡来源。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"heshang":{"id":"heshang","name":"和尚","sourceTitle":"和尚","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%92%8C%E5%B0%9A","checkedAt":"2026-11-11","ability":"每个夜晚，当有邪恶玩家的能力首次选择或影响与你邻近的存活玩家时，改为此次能力不生效并持续至下个黎明，且你会得知你的能力被触发。","mechanics":["和尚的能力在每个夜晚都能且仅能触发一次。","当邪恶玩家的能力选择了与和尚邻近的存活玩家，或者一项无需选择的能力在满足了条件而被触发，且会对与和尚邻近的存活玩家生效时，和尚会使邪恶玩家此次的能力不生效。这一效果跟使这名玩家“中毒/醉酒”相似。然而，如果某名邪恶玩家在同一个夜晚可以多次行动，和尚只能使其中一次效果无效，而除此以外的其他效果仍然会正常生效。","如果邪恶玩家的能力是一项持续生效的能力，而非选择式或触发式的能力，和尚会使这项能力失效直至下个黎明。在下一个白天时，这项能力会再次生效。","和尚只能在一项能力开始生效前阻止这项能力。他无法阻止已经生效的能力。","和尚不会得知是哪名邪恶玩家的能力被他阻止了，也不会得知这项能力影响的是与他邻近的哪一名玩家。他只是单纯知道自己的能力被触发了。","如果一项邪恶玩家的能力无法被阻止，那么和尚的能力不会因此被触发，和尚也不会得知自己的能力触发了。"],"qa":[{"q":"和尚就是僧侣的别名吗？","a":"不是。此处是华灯角色Heshang，依靠两侧存活邻居触发；僧侣Monk是主动夜间保护角色。"},{"q":"触发通知告诉我谁是坏人吗？","a":"不告诉来源、具体能力或哪一位邻居受影响。每晚最多阻止一次，已经生效的持续能力不会被追溯取消。"}],"interactions":[{"with":[],"text":"如果和尚的能力使得一项“玩家让自身获得信息”的能力失效，其处理方式与醉酒中毒相似，该玩家仍然会获得信息，但信息可对可错。","kind":"detail"},{"with":["限"],"text":"如果限的能力让所有镇民中毒，和尚会因中毒而无法触发能力。","kind":"interaction"},{"with":["混沌"],"text":"如果混沌的能力让所有善良玩家中毒，（善良的）和尚会因中毒而无法触发能力。","kind":"interaction"},{"with":["利维坦"],"text":"如果利维坦提名并处决了与和尚邻近的其中一名存活玩家，善良阵营获胜。","kind":"jinx"},{"with":["暴乱"],"text":"如果暴乱提名并处决了与和尚邻近的其中一名存活玩家，善良阵营获胜。","kind":"jinx"}],"tips":["逐夜记是否收到触发通知及两侧存活邻居。","触发只说明阻止了一次合格能力，不揭示来源或哪位邻居。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"brocadier":{"id":"brocadier","name":"锦衣卫","sourceTitle":"锦衣卫","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%94%A6%E8%A1%A3%E5%8D%AB","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：如果他在下个黄昏前死亡，你代替他死亡。","mechanics":["每个夜晚，锦衣卫都能选择一名玩家。如果该玩家死亡，锦衣卫的能力会阻止他死亡。随后，锦衣卫会死亡。","已经死亡的锦衣卫失去能力，无法再次保护他的目标玩家。也就是说，锦衣卫只能成功保护目标玩家一次。","如果锦衣卫的目标玩家本该死亡，但却因为其他效果使得他没有死亡；又或者锦衣卫的能力无法阻止他的目标玩家死亡，那么锦衣卫的能力就不会触发，也不会导致锦衣卫自己死亡。","如果锦衣卫因为某些原因无法死亡，他的保护效果在此期间会失效。","锦衣卫的能力在白天也能触发。处决和流放导致的死亡，以及其他会在白天造成死亡的效果，都能使锦衣卫成功保护他的目标玩家，并代替那名玩家死亡。","锦衣卫的能力造成的死亡源自于锦衣卫自身。原本的死亡效果已经被锦衣卫的能力阻止，不会再继续触发因为原本的死亡而导致的一系列效果。","锦衣卫可以选择保护已经死亡的玩家。然而，已经死亡的玩家无法再次死亡，即使这些玩家受到攻击，锦衣卫的保护效果也不会因此触发。"],"qa":[],"interactions":[{"with":[],"text":"特定角色互动： 方古 ：如果锦衣卫保护了方古，且尚未转化过的方古杀死了外来者，那么外来者和锦衣卫都会死亡。方古的转化能力会被锦衣卫阻止。","kind":"detail"}],"tips":["优先保护关键能力与自己信任的目标，评估代死后局势。","你死亡不单独证明保护发动。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"herbdoctor":{"id":"herbdoctor","name":"郎中","sourceTitle":"郎中","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%83%8E%E4%B8%AD","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择除你以外的一名玩家：你会得知一个与他能力相关的词语。","mechanics":["每个夜晚，郎中都需要选择一名除自己以外的玩家。他会得知一个与该玩家能力相关的词语。说书人会将词语写在纸上，或通过能够记录词语的电子设备，向郎中提供这个词语信息。（就像灵言师得知关键词一样。）","郎中得知的词语可能来自于那个玩家角色能力描述中的某个词，如“夜晚”、“死亡”、“公开”等；也可以是说书人对该玩家能力的某种概括性描述，如“勇敢”、“牺牲”等。","郎中每次只会得知一个词语。通常来说这是一个2-4字的词语（或是一个英文单词），这个词是有明确含义的，不能是无法组成词语的字拼接在一起。","郎中可以连续多个夜晚选择同一名玩家。郎中可以选择已死亡的玩家。郎中不能选择自己。"],"qa":[],"interactions":[],"tips":["保留原始词语，不急着唯一对应角色。","与本剧本技能用词和目标独立声明交叉比较。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"stargazer":{"id":"stargazer","name":"钦天监","sourceTitle":"钦天监","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%92%A6%E5%A4%A9%E7%9B%91","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你会得知离你最近的邪恶玩家位于你的哪一侧（左/右/相同）。如果与你邻近的玩家中有邪恶阵营，你会得知错误信息作为替代。","mechanics":["在钦天监得知信息时，说书人会分别统计钦天监左右两侧离他最近的邪恶玩家与他之间的距离。即使是已死亡的玩家，也参与距离的计算。","如果钦天监与一名邪恶玩家相邻，不论该玩家存活与否，钦天监会获得错误信息。说书人会从“左/右/相同”这三个答案中，任意选择一个与正确信息不符的信息告知钦天监。","钦天监不会得知他与最近的邪恶玩家之间的具体距离。"],"qa":[],"interactions":[],"tips":["先按座位比较左右最近邪恶距离，再考虑邪恶邻座导致的错误信息。","不能简单把方向一律取反。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"enlightenedone":{"id":"enlightenedone","name":"悟道者","sourceTitle":"悟道者","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%82%9F%E9%81%93%E8%80%85","checkedAt":"2026-11-11","ability":"你以为你是一个外来者，但你实际上不是。如果有邪恶玩家的能力选择或影响了你，你会立即变成一个不在场的镇民角色。","mechanics":["悟道者不具有自己以为的那个外来者的角色能力。","当悟道者被邪恶玩家的能力选择或影响时，在相关的效果生效前，悟道者会先改变角色，变成一个不在场的镇民。","如果悟道者的角色变化发生在白天，那么说书人会在当晚所有玩家闭眼后，第一时间唤醒悟道者并告知他相关的角色变化。","在悟道者的角色变化后，如果他随即受到邪恶玩家的此次能力效果影响，使得他再次变化角色，那么说书人只会告知他最终的变化结果。"],"qa":[],"interactions":[{"with":[],"text":"）","kind":"detail"},{"with":[],"text":"特定角色互动： 诺-达鲺 ：如果在游戏开始时诺-达鲺与悟道者为邻座，悟道者会直接中毒，不会发生角色变化。如果在游戏过程中有玩家变成了邪恶的诺-达鲺且悟道者为与他邻近的镇民，悟道者会正常发生角色变化。","kind":"detail"},{"with":["数学家"],"text":"数学家会得知悟道者产生了错误信息或“能力未正常生效”。","kind":"jinx"},{"with":["村夫"],"text":"如果村夫在场数量不足3人，悟道者可以变成新的村夫。如果因此使得村夫的在场数量超过1人，会有一名村夫醉酒。","kind":"jinx"},{"with":["科学怪人"],"text":"恶魔无法拥有悟道者的能力。","kind":"jinx"}],"tips":["自己以为的外来者技能未生效不一定是撒谎。","收到新镇民通知后明确记下转换时点。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"actor":{"id":"actor","name":"戏子","sourceTitle":"戏子","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%88%8F%E5%AD%90","checkedAt":"2026-11-11","ability":"所有戏子互相认识。不论在场的戏子数量多少或存活与否，胜负结果会被对调。[所有善良玩家都是戏子]","mechanics":["戏子们知道谁是自己的盟友，也知道谁是邪恶玩家，但不知道恶魔具体是哪一名玩家。","在游戏结束时，只要有戏子在场，不论戏子在场数量多少，这些戏子是否存活，都会导致游戏的胜负结果对调。如果一局游戏会使得善良阵营获胜，戏子会导致所有善良玩家落败，且邪恶玩家获胜。反之亦然。","而反之，多名戏子同时在场时，任何一名戏子都无法单独地被改变成其他角色。","邪恶玩家和旅行者无法变成戏子角色，也无法获得戏子的能力。已经成为戏子角色的玩家无法转为邪恶阵营。"],"qa":[],"interactions":[{"with":["间谍","教父","邪恶双子","寡妇","提线木偶","亡魂","召唤师","麻脸巫婆"],"text":"戏子与这些角色互为克星。互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["军团","利维坦","普卡","暴乱","僵怖","牙噶巴卜"],"text":"通过常规方式难以自杀的恶魔，在戏子存在于剧本中时，可以在游戏中任意时候向说书人示意自己“想要死亡”。说书人会在当晚杀死这名玩家。） 无神论者 ：戏子无法反转处决说书人导致的胜负结果。","kind":"jinx"},{"with":["卡扎力"],"text":"卡扎力和戏子不能在初始时同时在场。如果有角色能力能够使得善良玩家在第一个夜晚变成戏子，卡扎力会在这一效果生效之前先进行转变爪牙的行动。","kind":"jinx"},{"with":["堤丰之首"],"text":"堤丰之首和戏子不能在初始时同时在场。如果有角色能力能够使得善良玩家在第一个夜晚变成戏子，说书人会在这一效果生效之前先告知堤丰之首两侧的玩家是邪恶的爪牙。","kind":"jinx"},{"with":["哥布林","恐惧之灵"],"text":"戏子无法反转由这些角色能力产生的胜负结果。","kind":"jinx"},{"with":["蛊雕"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"}],"tips":["以互认队友和胜负反转为前提协作。","这是旧版全善良改为戏子的设置，别套用戏子（改）的醉酒规则。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"rascal":{"id":"rascal","name":"熊孩子","sourceTitle":"熊孩子","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%86%8A%E5%AD%A9%E5%AD%90","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择一个镇民角色：他的能力会产生错误信息，直到下个黄昏。","mechanics":["每个夜晚，熊孩子需要选择一个镇民角色。如果这个角色在场，对应玩家会被熊孩子影响，在下个黄昏之前均会产生错误信息。","受到熊孩子能力影响的玩家如果醉酒中毒，仍然不会让其他玩家获得信息，因为他已经失去能力。然而他在获得因自己的能力而得知的信息时，也会受到熊孩子的能力影响而必定获得错误信息。","熊孩子不会影响这名玩家通过其他方式获得的信息，例如说书人的规则解释，他自身的角色/阵营，或是由其他玩家的能力使他得知的信息。","熊孩子影响的是具体角色所对应的玩家。仅仅是拥有这个角色能力，但实际角色并非熊孩子选择的角色的玩家，不会受到熊孩子能力的影响。","如果熊孩子选择的角色当前不在场，但随后在场了，这个角色所对应的玩家仍然要受到熊孩子的能力影响。"],"qa":[],"interactions":[],"tips":["与团队协调选谁，明确该时段信息必须为假。","不要将错误信息效果泛化成让所有能力都失效。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"yinyangdiviner":{"id":"yinyangdiviner","name":"阴阳师","sourceTitle":"阴阳师","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%98%B4%E9%98%B3%E5%B8%88","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你会得知两个善良角色和两个邪恶角色，其中有且只有两个角色在场。","mechanics":["这两名在场角色有可能是任意组合（一个善良角色一个邪恶角色，两个善良角色，或者两个邪恶角色），具体信息由说书人决定。","一些角色能够干扰阴阳师的信息，比如陌客和间谍 。","如果阴阳师在游戏中途被创造出来，那么阴阳师获得的信息应该符合当前游戏的实际情况而非游戏开始时的情况。"],"qa":[],"interactions":[{"with":[],"text":"阴阳师的错误信息格式：两名善良角色和两名邪恶角色，但这些角色的在场数量不为2。","kind":"detail"}],"tips":["把四角色作为“恰有两个在场”的整体约束。","不能拆成每个善恶对子各有一个。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"turncoat":{"id":"turncoat","name":"逆臣","sourceTitle":"逆臣","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%80%86%E8%87%A3","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你要选择除你以外的一名玩家：如果他先死于处决，你会在当晚转变为邪恶；如果你先死于处决，他会在当晚转变为邪恶。","mechanics":["在首个夜晚，逆臣需要选择一名其他玩家。逆臣和这名玩家之间，谁先死于处决，另一名玩家就会在当晚转变为邪恶阵营。","两名玩家之间任何一方以其他方式死亡，不会使得另一方转为邪恶阵营。然而，即使逆臣选择的玩家因为其他原因已经死亡，逆臣死于处决也会导致他的阵营变化。","如果逆臣因为其他原因死亡，他的能力会失效。因此如果他的能力还未导致玩家转变阵营，即使在此之后他选择的玩家死于处决，也不会使得逆臣转变阵营。","如果逆臣选择的是邪恶玩家，他不会因为逆臣死于处决而转为善良阵营。同理，邪恶的逆臣也不会因为他的目标死于处决而转为善良阵营。"],"qa":[],"interactions":[],"tips":["记首夜绑定人及双方处决死亡顺序。","非处决死亡不触发，但不因此取消之后可能的转邪。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"mrmisfortune":{"id":"mrmisfortune","name":"煞星","sourceTitle":"煞星","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%85%9E%E6%98%9F","checkedAt":"2026-11-11","ability":"如果你死亡，当晚与你邻近的存活玩家之一可能会死亡。","mechanics":["如果煞星死亡，由说书人来决定煞星的能力是否触发，并使得额外有一名玩家死亡。","如果说书人决定触发煞星的能力，因此死亡的玩家可能是善良玩家，也有可能是邪恶玩家。","煞星的能力触发时选择的是与他邻近的存活玩家，会跳过当前与他邻近但已死亡的玩家。","如果煞星在死亡时醉酒中毒，或者一名死亡的玩家角色变成了煞星，那么煞星的能力就不会被触发。"],"qa":[],"interactions":[],"tips":["死亡后将邻近存活者额外死亡列为候选来源。","没有连带死亡不能反证角色。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"ambassador":{"id":"ambassador","name":"使节","sourceTitle":"使节","source":"https://wiki.biligame.com/bloodontheclocktower/%E4%BD%BF%E8%8A%82","checkedAt":"2026-11-11","ability":"每个夜晚限一次，一名玩家在使用自身能力选择邪恶玩家时会改为选中你，即使你已死亡。","mechanics":["在每个夜晚，使节的能力能够触发最多一次。使节的能力可以连续在多个夜晚都触发，也可能会连续几个夜晚都不触发。由说书人来决定使节的能力触发与否。","只要有玩家在使用自身能力选择了邪恶玩家，且使节的能力当晚还未触发，说书人就可以决定触发使节的能力让该玩家的选择目标改为使节。","如果使节的能力在当晚已经被触发过一次了，那么之后有其他玩家使用能力进行选择时，就无法再被使节影响。"],"qa":[],"interactions":[{"with":["痢蛭"],"text":"痢蛭的宿主及其中毒效果无法被转移。","kind":"jinx"}],"tips":["夜间异常需保留被转移到使节的分支。","使节已死仍可能吸收本来选向邪恶玩家的能力。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"pedant":{"id":"pedant","name":"书生","sourceTitle":"书生","source":"https://wiki.biligame.com/bloodontheclocktower/%E4%B9%A6%E7%94%9F","checkedAt":"2026-11-11","ability":"恶魔知道书生在场。每局游戏限一次，恶魔可以拜访说书人并猜测你是书生。如果恶魔猜测正确，即使你已死亡，当晚该恶魔可以选择一名玩家：他死亡。","mechanics":["恶魔会在自己的首个夜晚得知书生在场。","如果书生在游戏中途被创造，或有任何玩家获得了书生的能力，尚未得知“书生在场”的恶魔会在当晚得知书生在场。","只要恶魔得知过书生在场，便能在白天拜访说书人并进行猜测。在这种情况即使书生已经死亡，恶魔也能进行猜测，并在猜测正确时触发书生的能力效果。","如果一名已死亡的玩家变成了书生，恶魔不会因此得知书生在场，也无法进行猜测或触发书生的能力效果。","如果恶魔猜测正确，做出正确猜测的恶魔便能在当晚自己的行动结束后，额外导致一名玩家死亡。这一选择的时机最晚不能超过夜晚的“信息类角色行动开始”时机，详情参考夜晚行动顺序一览 。","如果恶魔猜测正确，即使该恶魔随后被变成了非恶魔角色，依然能够使用书生的能力造成死亡。","书生的能力导致的死亡，不算作恶魔的攻击。那名玩家是由书生的能力导致的死亡，因此如果以这种方式杀死了一名爪牙， 亡骨魔无法使得那名爪牙保留能力。如果执行书生能力的玩家是恶魔，那么仍然算作恶魔的负面能力。","如果场上有多名恶魔玩家，这些玩家共享一次猜测机会。任何恶魔使用了这次机会后，其他恶魔玩家的猜测都不会触发任何效果。他们不会知道自己的猜测是否正确，也不会知道是否有其他恶魔玩家在他之前进行了猜测并耗用了猜测的机会。","如果场上有多名书生或具有书生能力的角色，恶魔也只会有一次猜测机会。"],"qa":[],"interactions":[{"with":["戏子（改）"],"text":"书生不会因为戏子（改）的能力醉酒。","kind":"jinx"}],"tips":["尽量隐藏，避免让恶魔找到额外击杀机会。","死亡后仍不要随意泄露身份。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"corpsewalker":{"id":"corpsewalker","name":"赶尸人","sourceTitle":"赶尸人","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%B5%B6%E5%B0%B8%E4%BA%BA","checkedAt":"2026-11-11","ability":"与你邻近的两名镇民玩家会在其首次死亡时被当作仍然存活。[-1外来者]","mechanics":["与赶尸人邻近的镇民在首次死亡时，会进入“活尸”状态。与穷奇的能力相似，该玩家在城镇广场上会表现出“存活”，然而实际上已经死亡。在这种情况下再次死亡，玩家在城镇广场上的状态也就会变成死亡状态。","只有能够死亡的玩家才能因为赶尸人的能力而进入“活尸”状态。如果玩家的死亡由于某些原因被阻止，他就不会进入“活尸”状态，而是正常存活（也不会因此算作他的“首次死亡”，赶尸人的能力能在他真正死亡的时候如常触发）。","“活尸”状态下的玩家死亡时，相关的“死亡时触发的能力”不会触发，因为玩家在此之前已经进入了死亡状态（且之前进入死亡状态时，自身被当作存活而没有触发“死亡时触发的能力”）。而“得知自己死亡”的能力会正常触发，因为这些能力会持续保留到玩家“得知自己死亡”时。","“活尸”状态与醉酒中毒相似：玩家会失去自身的能力，如果玩家的能力会让他自己获得信息，则有可能获得错误信息。","“活尸”状态是一次性变化。即使之后赶尸人中毒醉酒或是死亡，又或者是“活尸”玩家的角色发生了变化且不再是镇民，“活尸”玩家在城镇广场上的状态依旧不会发生变化。但此时“活尸”玩家在参与能力互动时，不再被当作存活状态，而是处于死亡状态。","如果已经进入“活尸”状态的玩家变成了非镇民角色，赶尸人所能影响的玩家也会发生变化。此时会计算分别与他顺时针和逆时针两个方向上最近的镇民玩家，赶尸人的能力会对这些玩家生效。"],"qa":[],"interactions":[{"with":[],"text":"如果玩家因为某些效果“不会死亡”，如旅店老板的效果，则在他将要死亡时，不会受到赶尸人的效果影响。同样的，也不会因此被算作“首次死亡”。","kind":"detail"},{"with":["弄臣"],"text":"与赶尸人相邻，且未触发能力的弄臣在首次死亡时，会触发弄臣的能力，从而使得弄臣不会死亡。在弄臣再次死亡时，会正常受到赶尸人的能力影响，进入“活尸”状态。","kind":"interaction"},{"with":["瘟疫医生"],"text":"如果说书人本应获得赶尸人的能力，改为一名爪牙玩家获得此能力，且他会得知此事。","kind":"jinx"}],"tips":["利用隐藏死亡扰乱持续信息。","对抗时区分最近镇民、公开存活与实际有无能力。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"vixen":{"id":"vixen","name":"狐媚娘","sourceTitle":"狐媚娘","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%8B%90%E5%AA%9A%E5%A8%98","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你要选择一名玩家：他会知道狐媚娘在场。如果你死于处决，当晚他转变为邪恶阵营。","mechanics":["在首个夜晚，狐媚娘需要选择一名玩家，该玩家会知道狐媚娘在场。","即使狐媚娘在选择玩家的时候醉酒中毒，一旦狐媚娘恢复清醒健康，她选择的玩家也会立即知道狐媚娘在场。（这个行为会发生在夜晚阶段，并且需要尽可能快地结算。）","如果狐媚娘死于处决（不论是因为常规的处决或是角色能力造成的处决），当晚，被狐媚娘选择的玩家会转变为邪恶阵营。","如果狐媚娘选择的玩家在狐媚娘死于处决时已经是邪恶阵营，则无事发生。"],"qa":[],"interactions":[{"with":["异端分子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["瘟疫医生"],"text":"如果说书人本应获得狐媚娘的能力，改为一名爪牙玩家获得此能力，且他会得知此事。","kind":"jinx"}],"tips":["与选中者协调转邪时机。","对抗时死亡公告不等于阵营通知，保留当晚变化。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"bugkeeper":{"id":"bugkeeper","name":"养蛊人","sourceTitle":"养蛊人","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%85%BB%E8%9B%8A%E4%BA%BA","checkedAt":"2026-11-11","ability":"在你存活时提名你的玩家会在当晚死亡，即使你已死亡。","mechanics":["如果一名玩家在白天的提名环节提名了养蛊人，且此时养蛊人存活，那么这名玩家会在当晚死亡。","即使养蛊人因为一次提名而被处决并死亡，此次提名养蛊人的玩家也会在当晚死亡。","即使提名养蛊人的玩家是邪恶玩家，该玩家也会正常受到养蛊人的能力影响并死亡。"],"qa":[],"interactions":[{"with":[],"text":"通过屠夫的能力进行的额外提名，可以使得养蛊人的能力在同一个夜晚对不同的玩家生效，并造成多名玩家死亡。","kind":"detail"},{"with":["瘟疫医生"],"text":"如果说书人本应获得养蛊人的能力，改为一名爪牙玩家获得此能力，且他会得知此事。","kind":"jinx"}],"tips":["诱使关键善良玩家提名你。","对抗时记录谁提名及当时你是否活着，夜死不必来自恶魔。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"hundun":{"id":"hundun","name":"混沌","sourceTitle":"混沌","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%B7%B7%E6%B2%8C","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：他死亡。如果你以这种方式杀死了一名与你邻近的镇民玩家，除旅行者外的所有善良玩家会中毒直到下个黄昏。","mechanics":["当混沌的攻击杀死一名玩家时，如果该玩家的角色是镇民，并且是与混沌最邻近的镇民玩家，混沌的中毒效果就会被触发，并持续到下个黄昏时。","即使杀死的是邪恶的镇民，只要该玩家是混沌最邻近的两名镇民玩家之一，混沌的中毒效果就会被触发。","如果混沌杀死的镇民会使得“死亡时触发的能力”被触发，那么混沌的中毒效果会在这些能力结算完毕后再触发。","如果混沌杀死镇民后导致游戏结束，那么混沌的中毒效果不会触发。","攻击已经死亡的镇民，或攻击但没有导致镇民的死亡，不会触发混沌的中毒效果。","在混沌的中毒效果的生效期间，只要玩家是善良阵营（旅行者除外），就会受到中毒效果的影响，包括善良的爪牙和恶魔。","在混沌的中毒效果的生效期间，如果玩家转变为了善良阵营，就会立即中毒。反之，如果玩家转变为了邪恶阵营，就会立即解除混沌的中毒效果对他的影响。"],"qa":[],"interactions":[],"tips":["权衡杀近邻镇民造成群毒与直接处理威胁。","对抗时标出疑似群毒的整个夜昼窗口。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"qiongqi":{"id":"qiongqi","name":"穷奇","sourceTitle":"穷奇","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%A9%B7%E5%A5%87","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：他死亡。如果今天白天有外来者死亡，当晚改为你要选择一名玩家：他死亡，但被当作仍然存活，随后会有一名其他玩家死亡。[+1外来者]","mechanics":["如果在白天有外来者死亡，穷奇的攻击会让玩家进入“活尸”状态。该玩家在城镇广场上会表现出“存活”，然而实际上已经死亡。在这种情况下再次死亡，玩家在城镇广场上的状态也就会变成死亡状态。","只有能够被穷奇杀死的玩家才能因为穷奇的攻击而进入“活尸”状态。如果玩家的死亡由于某些原因被阻止，他就不会进入“活尸”状态，而是正常存活。","“活尸”状态下的玩家死亡时，相关的“死亡时触发的能力”不会触发，因为玩家在此之前已经进入了死亡状态（且之前进入死亡状态时，自身被当作存活而没有触发“死亡时触发的能力”）。而“得知自己死亡”的能力会正常触发，因为这些能力会持续保留到玩家“得知自己死亡”时。","“活尸”状态与醉酒中毒相似：玩家会失去自身的能力，如果玩家的能力会让他自己获得信息，则有可能获得错误信息。","“活尸”状态是一次性变化。即使之后穷奇中毒醉酒或是死亡，“活尸”玩家在城镇广场上的状态依旧不会发生变化。但此时“活尸”玩家在参与能力互动时，不再被当作存活状态，而是处于死亡状态。"],"qa":[],"interactions":[{"with":["赶尸人"],"text":"如果穷奇的特殊行动攻击了与赶尸人邻近的镇民玩家，该玩家当前存活且能够死亡，那么该玩家会进入“死亡但被当作存活”状态（该状态由穷奇导致）。如果穷奇的特殊行动攻击了“死亡但被当作存活”的玩家，且该玩家能够死亡，该玩家会直接死亡。","kind":"interaction"},{"with":["呆瓜","月之子"],"text":"“活尸”状态的呆瓜和月之子在得知自己死亡后，能力会正常触发，因为他们的能力会在死亡后持续保留直至得知自己死讯的时候。","kind":"interaction"}],"tips":["围绕白天外来者死亡安排活尸攻击。","对抗时保留额外外来者与隐藏死亡，不能只数公开刀口。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"taotie":{"id":"taotie","name":"饕餮","sourceTitle":"饕餮","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%A5%95%E9%A4%AE","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择任意数量的非旅行者玩家或一名旅行者玩家：如果他们的角色类型均不相同，他们死亡。[+1外来者]","mechanics":["饕餮每个夜晚可以选择任意数量的非旅行者玩家。如果这些玩家之中没有任何两名玩家有相同的角色类型，那么这些玩家都会死亡。","饕餮可以不进行选择，这也视作选择了任意数量的玩家。","旅行者与其他非旅行者不属于同一角色类型。但是他们是无辜的！如果饕餮选择攻击一名旅行者，那么他当晚就不能再攻击其他玩家了。"],"qa":[],"interactions":[{"with":[],"text":"被饕餮攻击而死亡的玩家，其死亡顺序依照饕餮的选择顺序进行。如果饕餮导致了多名玩家死亡，且其中一名玩家的能力使得饕餮在死亡结算中途中毒或醉酒（比如心上人 ），那么后续的其他玩家就不会再死亡。（但这种情况极为少见，此处仅做举例说明，不意味着鼓励说书人这么做）","kind":"detail"}],"tips":["获取角色类型后再组合多杀，避免重复类型令整组失败。","对抗时比较死亡类型与其他来源。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"taowu":{"id":"taowu","name":"梼杌","sourceTitle":"梼杌","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%A2%BC%E6%9D%8C","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：他死亡。当你将要死亡时，改为一名存活且具有能力的爪牙失去能力。你不会得知恶魔信息。","mechanics":["如果梼杌即将死亡时，有任何存活的爪牙具有能力，那么梼杌就不会死亡，并且其中一名爪牙会失去能力。如果所有存活的爪牙都不具有能力，那么梼杌仍然会死亡。","“具有能力”与失去能力相反。判断一名爪牙是否“具有能力”，看的是该爪牙是否有任何失去能力的效果。如果有，那么该爪牙便“不具有能力”。如果没有，那么爪牙便“具有能力”。","处于中毒或醉酒状态的爪牙不具有能力。能力有限定次数，且已经使用完毕的爪牙不具有能力。）受到传教士的能力影响的爪牙不具有能力。受到梼杌本身的能力所影响的爪牙同样不具有能力。","只有三名存活的玩家时， 女巫仍然具有能力！（她具有的是“让自己失去能力的能力”，女巫就是这么的诡计多端！让游戏和生活变得尽量简单！","即使是善良阵营的爪牙，也能成为梼杌能力的生效对象，在失去能力的同时让梼杌免除一次死亡。","梼杌不会获得恶魔信息。也就是说，在游戏的首个夜晚，他不会得知爪牙是谁，也不会得知三个不在场的善良角色作为自己的恶魔伪装。同样的，如果一名疯子以为自己是梼杌，也不会在首个夜晚获得任何“恶魔信息”。"],"qa":[],"interactions":[{"with":[],"text":"因梼杌而失去能力的爪牙不会与说书人进行互动。","kind":"detail"},{"with":[],"text":"特定角色互动： 罂粟种植者 ：在罂粟种植者死亡后，梼杌仍然会因为自己的能力限制，而无法知道谁是爪牙。","kind":"detail"},{"with":["猩红女郎","邪恶双子","主谋"],"text":"这些角色在梼杌的能力判断中被当作“不具有能力”。","kind":"jinx"},{"with":["街头风琴手"],"text":"当梼杌被处决时，如果街头风琴手具有能力，说书人会宣布“无人被处决”。","kind":"jinx"},{"with":["提线木偶"],"text":"梼杌不会得知谁是提线木偶。在梼杌使得提线木偶失去能力后，梼杌会得知对应的那一名提线木偶是谁，但提线木偶会仍然以为自己是一个善良角色。","kind":"jinx"},{"with":["帽匠","麻脸巫婆","工程师"],"text":"如果梼杌变成了其他角色，因为梼杌而失去能力的爪牙会立即死亡。","kind":"jinx"},{"with":["舞蛇人","理发师"],"text":"如果梼杌的角色发生了交换，因为梼杌失去能力的爪牙依然失去能力。","kind":"jinx"}],"tips":["保存仍有能力的活爪牙作为保命资源。","对抗时把未死与爪牙失能迹象、特殊相克一起核对。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"pauper":{"id":"pauper","name":"叫花子","sourceTitle":"叫花子","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%8F%AB%E8%8A%B1%E5%AD%90","checkedAt":"2026-11-11","ability":"每个白天限一次，你可以公开选择一名其他玩家，让他选择一个非恶魔角色：你可能会获得这个角色的能力，直到下个黎明。","mechanics":["叫花子在使用自己的能力选择一名玩家之后，该玩家不能拒绝触发叫花子的能力效果。","只有被列在剧本的角色列表中的能力才能被叫花子获得。","叫花子并非每次都能够成功获得能力。如果说书人认为一项角色的能力不会对游戏中的某一方造成巨大的优势或者劣势，那么叫花子就能够成功获得这个角色的能力。","叫花子获得能力后，不会改变自己的角色。他还是叫花子，并且会在下一次黎明到来时失去这项能力。","如果叫花子获得的能力是在游戏的首个夜晚产生作用的，该能力会在当晚的所有会造成死亡的效果对应的角色行动完毕后产生作用。"],"qa":[],"interactions":[],"tips":["向可信玩家请求当前最需要的非恶魔能力。","记录实际是否获得和下个黎明截止时间。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"qilin":{"id":"qilin","name":"麒麟","sourceTitle":"麒麟","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%BA%92%E9%BA%9F","checkedAt":"2026-11-11","ability":"在游戏的最后一天，最幸运的玩家身上会发生一些好的事情。","mechanics":["一些玩家可能会比较胆怯，害怕与陌生人交流。在非好友的对局之中，游戏的氛围可能会有一些沉闷。麒麟可以鼓励和促进玩家之间的交流，让游戏的气氛变得活跃起来。","如何判断哪一名玩家是“最幸运的”这一判定规则需要在游戏开始前就设定好。不要让玩家觉得是说书人在操控玩家的“运气”！","不需要在每一局游戏中都加入麒麟！麒麟在对于需要破冰的场合下会显得更加有趣，但如果在每一局游戏中都加入，玩家可能会过度关注“幸运规则”，从而放弃游戏原本的乐趣。当你认为大家都开始融入到游戏中时，就不需要再在对局中加入麒麟了。"],"qa":[],"interactions":[],"tips":["开局先理解幸运判定。","把最终奖励作为额外规则，不假设会按指定方式证明某人身份。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"lycanthrope":{"id":"lycanthrope","name":"半兽人","sourceTitle":"半兽人","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%8D%8A%E5%85%BD%E4%BA%BA","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名存活玩家：如果他是善良的，他死亡，并且当晚恶魔不会造成死亡。 会有一名善良玩家始终被当作邪恶阵营。","mechanics":["半兽人必须在每个夜晚选择一名存活的玩家。如果半兽人选择了已死亡的玩家，说书人会摇头并让半兽人重新选择。","如果半兽人选择的玩家是善良玩家，那名玩家死亡，并且当晚恶魔不能造成死亡。","如果半兽人选择的玩家是邪恶玩家，那名玩家不会死亡，并且恶魔可以造成死亡。","如果半兽人攻击了善良的玩家但没有导致那名玩家死亡，恶魔可以造成死亡。","恶魔与造成死亡无关的能力仍然会正常运作，不会受到半兽人的能力影响。","一名善良玩家始终被当作邪恶阵营。他同样也被半兽人当作邪恶阵营，因此半兽人无法杀死这名玩家。"],"qa":[{"q":"杀了一个人就能认证他善良吗？","a":"需先确认这是你的有效能力造成的死亡，并考虑固定阵营干扰项、误登记和其他夜死。不能单凭公开刀口认证。"}],"interactions":[],"tips":["选即使死亡也能保留信息价值的善良候选。","保留固定阵营干扰项和其他死亡来源。"],"counterplay":["恶魔可以配合假跳者制造同目标死亡；应对时将普通夜杀与半兽人自己的命中分开。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成半兽人"]},"banshee":{"id":"banshee","name":"报丧女妖","sourceTitle":"报丧女妖","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%8A%A5%E4%B8%A7%E5%A5%B3%E5%A6%96","checkedAt":"2026-11-11","ability":"如果恶魔杀死了你，所有玩家都会得知此事。从现在开始，你每天可以发起两次提名，每次投票时可以投两票。","mechanics":["报丧女妖在存活时，如常进行提名和投票。","如果恶魔杀死了报丧女妖，她每天可以发起两次提名，即使通常情况下来说已死亡的玩家无法发起提名。","如果恶魔杀死了报丧女妖，她可以自由地在提名中投票，无需消耗投票标记。她可以在同一次提名中投两票。","报丧女妖死亡后的能力只会在被恶魔杀死之后获得。死于处决或是死于非恶魔的能力不会让她获得这些能力。","如果要在一次提名中投出两票，报丧女妖需要在计票时同时举起两只手。如果玩家因为某些生理障碍无法做到这样的行为，说书人可以默认将他的常规票数翻倍。"],"qa":[],"interactions":[{"with":[],"text":"如果报丧女妖在获得死亡能力时清醒健康，但在随后醉酒中毒，她无法发起提名，且投票需要消耗投票标记。","kind":"detail"},{"with":["窃贼"],"text":"窃贼会让报丧女妖的每一票都算作负票。与官员效果结合后，每一票都算作负三票。","kind":"interaction"},{"with":["利维坦"],"text":"每个夜晚*，利维坦要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果报丧女妖被选择，他死亡并能力生效。","kind":"jinx"},{"with":["暴乱"],"text":"每个夜晚*，暴乱要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果报丧女妖被选择，他死亡并能力生效。","kind":"jinx"},{"with":["涡流"],"text":"如果涡流杀死了报丧女妖，玩家仍然会得知正确信息。（中文百科上的‘通用简化原则’已涵盖包括多角色互动下的涡流信息的简化处理方式，此条仅作说明。）","kind":"jinx"},{"with":["狸猫"],"text":"如果狸猫与报丧女妖交换角色，不会触发报丧女妖的能力。","kind":"jinx"}],"tips":["争取被恶魔杀死，区分公开触发公告与个人自述。","触发后利用死后提名和双票协助团队。"],"counterplay":["假跳者通常无法伪造说书人公开触发；应对时以实际公告为准，别把夜死自述当公告。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成报丧女妖"]},"choirboy":{"id":"choirboy","name":"唱诗男孩","sourceTitle":"唱诗男孩","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%94%B1%E8%AF%97%E7%94%B7%E5%AD%A9","checkedAt":"2026-11-11","ability":"如果恶魔杀死了国王，你会得知哪名玩家是恶魔。[+国王]","mechanics":["国王可以在唱诗男孩不在场时出现在游戏中。在游戏设置阶段，如果唱诗男孩在场而国王不在场，那么国王就会被添加进来并替换掉一个其他镇民。而如果国王已经在场，唱诗男孩不会因此再将另外一名国王添加进场。","如果恶魔使用自己的能力杀死了国王，唱诗男孩会得知哪名玩家是恶魔。恶魔提名并处决国王时，不算做使用自己的能力杀死国王。爪牙使用能力杀死国王，例如刺客，也不会计算在内。","如果恶魔攻击了国王但未能将其杀死，唱诗男孩不会得知恶魔是谁。","唱诗男孩得知的是恶魔的具体玩家，但不得知具体角色。"],"qa":[],"interactions":[],"tips":["尽量存活并隐藏，迫使恶魔权衡是否杀国王。","普通国王死亡不等于满足恶魔击杀触发。"],"counterplay":["假跳可与假国王相互配合；应对时先核验国王来源与真正死亡方式。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成唱诗男孩"]},"preacher":{"id":"preacher","name":"传教士","sourceTitle":"传教士","source":"https://wiki.biligame.com/bloodontheclocktower/%E4%BC%A0%E6%95%99%E5%A3%AB","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择一名玩家：如果你选中了爪牙，他会得知被传教士选中。 所有被你选中的爪牙失去能力。","mechanics":["如果传教士选择了不是爪牙的玩家，无事发生。","传教士可以选择死亡玩家。","如果传教士在醉酒或中毒的时候选择了一名玩家，那名玩家不会被传教士的能力影响。","如果传教士醉酒或中毒，被布道的爪牙会重新获得能力，直到传教士恢复清醒健康。"],"qa":[],"interactions":[{"with":[],"text":"关于传教士的“失去能力”与其他角色的醉酒中毒效果会有所不同，暂且作为“特例”进行处理。如果想要了解与其他情况下失去能力的效果的详细差别，请参考这里 。","kind":"detail"},{"with":[],"text":"如果传教士死亡，这些爪牙恢复能力。已经使用了“每局游戏限一次”的能力的爪牙无法再次使用能力。","kind":"detail"},{"with":[],"text":"如果传教士醉酒或中毒，因传教士失去能力的爪牙恢复能力，但会在传教士恢复健康清醒后再次失去能力。","kind":"detail"},{"with":[],"text":"如果被传教士选中的爪牙在之后变成其他角色类型的角色(也就是不再是爪牙)，那么他不再受到传教士能力的影响。此外，邪恶玩家不会仅仅因为属于邪恶阵营就受到传教士能力的影响，他需要明确地作为爪牙角色才能受到影响。","kind":"detail"},{"with":[],"text":"同理，一名后来变成爪牙的非爪牙玩家不会因为在变成爪牙之前被传教士选择而受到其能力影响。如果他在变成爪牙后被传教士选中，传教士能力正常生效。","kind":"detail"},{"with":[],"text":"如果因传教士而失去能力的爪牙在死亡后复活，他不会恢复能力，只要传教士仍然存活，他仍然失去能力。","kind":"detail"},{"with":["工程师"],"text":"如果工程师做出行动，被布道的爪牙会被告知他的爪牙角色发生改变，但他会继续受到传教士影响，并且不会恢复能力。","kind":"interaction"},{"with":["数学家"],"text":"那些原本该醒来或使用能力的爪牙，因为被布道而无法这样做时，会被数学家当作是他的能力未正常生效。","kind":"interaction"},{"with":["灵言师"],"text":"如果灵言师在首个夜晚被布道，他不会得知关键词。然而，如果传教士死亡或醉酒中毒，灵言师会在那个时候得知他的关键词。如果灵言师在其他夜晚被布道，在这之后说出关键词的玩家不会转变为邪恶但仍然消耗灵言师的能力，同样的情况适用于如果玩家在白天说出关键词，接着灵言师在夜晚被布道。玩家不能在灵言师得知关键词之前说出关键词，在灵言师被告知关键词之前，关键词实际上并不存在，所以提前使用相关词语不算作灵言师能力的一次使用，既没有消耗能力，也没有让玩家转变为邪恶。","kind":"interaction"},{"with":["陌客"],"text":"陌客可以被传教士当作是爪牙角色，并得知被传教士选中。","kind":"interaction"},{"with":["间谍"],"text":"间谍可以在被传教士选中时被当作非爪牙角色，并且避免受到传教士能力影响。","kind":"interaction"},{"with":["亡骨魔"],"text":"传教士可以选中在亡骨魔的保留能力效果下的死亡爪牙。在这种情况下，传教士的能力会更胜一筹，意味着爪牙会像被正常选中那样失去能力。在此之后，如果传教士死亡，受到影响的爪牙将恢复能力。","kind":"interaction"},{"with":["寡妇"],"text":"如果寡妇在首个夜晚被传教士选中，那么他不能查看魔典并选择一名玩家中毒，也不会有一名善良玩家知道寡妇在场。然而，如果传教士死亡或醉酒中毒，寡妇会在那个时候查看魔典并选择一名玩家中毒，随后会有一名善良玩家知道寡妇在场。","kind":"interaction"},{"with":["维齐尔"],"text":"如果维齐尔失去能力，他会得知此事，但不会在白天死亡。","kind":"jinx"},{"with":["召唤师"],"text":"如果存活的召唤师失去能力，说书人会获得召唤师能力。","kind":"jinx"},{"with":["军团"],"text":"如果传教士选中了军团，军团仍然保留能力，但传教士可能会得知自己选中了军团。","kind":"jinx"}],"tips":["优先选择疑似强爪牙并观察后续能力迹象。","你本人通常得不到命中确认。"],"counterplay":["邪恶可假装能力被阻断来配合假跳；应对时单一停用迹象通常只是辅助。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成传教士"]},"villageidiot":{"id":"villageidiot","name":"村夫","sourceTitle":"村夫","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%9D%91%E5%A4%AB","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择一名玩家：你会得知他的阵营。[+0~2村夫，复数村夫中有一人醉酒]","mechanics":["由说书人在进行游戏设置时决定哪一名村夫醉酒。","在场村夫的数量可能是1、2或3，这与一局游戏的玩家人数无关。","如果在场村夫的数量为1，他会是清醒的。","醉酒的村夫仍然可能会得知正确信息。","如果村夫在游戏过程中被创造，只有被创造的村夫会发生角色变化。不会有其他玩家因此变成村夫。","如果所有清醒的村夫都离场，剩余的醉酒村夫仍然保持醉酒状态。","如果一名清醒的村夫因为其他效果醉酒或中毒，处于醉酒状态的村夫仍然保持醉酒状态。"],"qa":[],"interactions":[{"with":[],"text":"“复数村夫中有一人醉酒”这一项能力既是设置调整能力（需要在为首夜准备时进行调整），又是持续检测型能力。","kind":"detail"},{"with":[],"text":"只要村夫在场，即使村夫的在场数量不足3人，说书人都无法将村夫作为恶魔的伪装提供给恶魔。然而如果有酒鬼或是提线木偶以为自己是村夫，将村夫作为伪装提供给恶魔不算是“YBD”。","kind":"detail"},{"with":[],"text":"哲学家 、 食人族 、 学徒等角色的获得能力效果，不会参与到“村夫在场数量”的计算之中。也就是说，如果村夫在场数量为1人，那么即使有其他具有村夫能力的角色，这些角色包括村夫在内就都不会因为村夫的能力而醉酒。）","kind":"detail"},{"with":[],"text":"特定角色互动： 卡扎力 ：如果有复数个村夫在场，卡扎力的设置调整优先生效，其他的村夫因卡扎力的能力变成了爪牙，剩下的那名村夫一定是清醒的，因为这时村夫已经只有一个了。","kind":"detail"},{"with":["麻脸巫婆"],"text":"如果村夫在场数量不足3人，麻脸巫婆可以创造新的村夫。如果她这么做，村夫的醉酒效果可能会更换目标。","kind":"jinx"},{"with":["科学怪人"],"text":"如果村夫在场数量不足3人，科学怪人可以让恶魔拥有村夫的能力。","kind":"jinx"},{"with":["悟道者"],"text":"如果村夫在场数量不足3人，悟道者可以变成新的村夫。如果因此使得村夫的在场数量超过1人，会有一名村夫醉酒。","kind":"jinx"}],"tips":["与其他村夫对照同目标的反馈，定位醉酒可能。","信息一致仍可能巧合，不直接排除假跳。"],"counterplay":["邪恶可混成第三村夫支持醉酒者的信息；应对时把人数、醉酒名额与每晚反馈联立。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成村夫"]},"engineer":{"id":"engineer","name":"工程师","sourceTitle":"工程师","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%B7%A5%E7%A8%8B%E5%B8%88","checkedAt":"2026-11-17","ability":"每局游戏限一次，在夜晚时，你可以选择让恶魔变成你选择的恶魔角色，或让所有爪牙变成你选择的爪牙角色。","mechanics":["每局一次，可改变恶魔或全部爪牙的角色，通常不改变阵营，也不把新角色的设置调整倒施于开局。","发动后的当前角色与以前的私有身份、反馈须分时点分析；先前排除某恶魔种类不排除后来由工程师改变。"],"qa":[],"interactions":[{"with":["方古","小恶魔"],"text":"如果工程师选择的时候，场上有复数的相同角色恶魔，这些相同角色的恶魔玩家都会改变角色。","kind":"interaction"},{"with":["小怪宝"],"text":"如果小怪宝在场的时候，工程师选择其他恶魔，当前照看小怪宝的玩家会变成那个恶魔，不管他之前是什么角色。如果工程师选择让小怪宝进入游戏，之前的恶魔会变成一个不在场的爪牙角色并且正在照看小怪宝。","kind":"interaction"},{"with":["提线木偶"],"text":"如果提线木偶被工程师带入游戏，提线木偶不需要与恶魔相邻。","kind":"interaction"},{"with":["传教士"],"text":"如果爪牙已经被传教士布道，然后被工程师转变，爪牙得知他的角色改变但仍然会被传教士影响，所以他的新角色仍然失去能力。","kind":"interaction"},{"with":["陌客"],"text":"理论上可以被当作爪牙/恶魔，然后被工程师转变或者影响其他发生转变的角色……不要这样做，陌客是外来者。","kind":"interaction"},{"with":["间谍"],"text":"可以不被当作爪牙，同时无视工程师的转换，保持他的能力。","kind":"interaction"},{"with":["亡骨魔"],"text":"如果被工程师变为其他恶魔，被亡骨魔杀死的爪牙失去能力，与这些爪牙相邻的中毒玩家会立即解除中毒。","kind":"interaction"},{"with":["寡妇"],"text":"如果被工程师带入游戏，当晚一名善良玩家得知场上有寡妇。","kind":"interaction"},{"with":["僵怖"],"text":"如果把假死的僵怖变为其他恶魔，他在城镇广场上将继续表现为死亡，但在其他所有情况下都当作存活。","kind":"interaction"},{"with":["召唤师"],"text":"如果存活的召唤师从游戏中离场，说书人会获得召唤师的能力。","kind":"jinx"},{"with":["军团"],"text":"如果工程师创造了军团，所有邪恶玩家会变成军团。如果军团在场，工程师失去能力并改为得知这一信息。","kind":"jinx"},{"with":["梼杌"],"text":"如果梼杌变成了其他恶魔，因为梼杌而失去能力的爪牙会立即死亡。","kind":"jinx"}],"tips":["根据最危险机制决定改恶魔还是全部爪牙。","通知变角色与获得实际夜间行动的时点分开。","可与团队协商排除最危险的恶魔或爪牙机制；只有实际有效发动才约束之后的角色，不能凭自称已变更抹掉此前反馈。"],"counterplay":["假工程师可声称创造实际已有的恶魔或爪牙；应对时观察选择前后机制，不只听自述。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成工程师"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%B7%A5%E7%A8%8B%E5%B8%88","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%B7%A5%E7%A8%8B%E5%B8%88"]},"princess":{"id":"princess","name":"公主","sourceTitle":"公主","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%85%AC%E4%B8%BB","checkedAt":"2026-11-11","ability":"在你的首个白天，如果你提名并处决了一名玩家，当晚恶魔不会造成死亡。","mechanics":["想让公主的能力生效，公主提名的玩家必须被处决。被其他玩家提名处决的玩家不会触发公主的能力。","公主的能力不要求被处决的玩家死亡。","流放旅行者不会触发公主的能力。","如果公主在白天醉酒了，但在夜晚恢复清醒，她就能阻止恶魔造成的死亡。如果公主白天是清醒的，但夜晚醉酒了，她的能力不会生效。","在夜晚，非恶魔造成的死亡不会受到公主的影响。","在夜晚，恶魔依然会选择一名玩家，但他不会死亡。恶魔的其他能力不会受到影响，例如让其他玩家中毒和产生错误信息等等。","公主不必强制在第一天提名。","如果公主在游戏过程中被创造出来，并且在她的第一天成功提名并处决了一名玩家，当晚恶魔也不会造成死亡。"],"qa":[],"interactions":[{"with":[],"text":"公主在其首个白天提名了一名玩家后，该玩家不论由于何种原因被处决（例如洗脑师或贞洁者等），都会满足公主的“提名并处决了一名玩家”的要求，从而导致当晚恶魔无法造成死亡。","kind":"detail"},{"with":["食人族"],"text":"如果食人族提名并处决了公主且公主因此死亡，当晚恶魔不会造成死亡。","kind":"jinx"},{"with":["哈迪寂亚"],"text":"如果公主在首个白天提名并处决了一名玩家，没有人会因为哈迪寂亚而死亡。(公主与哈迪寂亚角色互动结果本应如此，此条仅做说明)","kind":"jinx"}],"tips":["首日提前协调提名和票数，避免机会被别人的提名占用。","当晚无死不是单独认证。"],"counterplay":["邪恶可攻击已死者伪造当晚无死；应对时别用一夜结果直接确认首日提名者身份。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成公主"]},"noble":{"id":"noble","name":"贵族","sourceTitle":"贵族","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E8%B4%B5%E6%97%8F","checkedAt":"2026-11-17","ability":"在你的首个夜晚，你会得知三名玩家：其中有且只有一名玩家是邪恶的。","mechanics":["贵族只会在第一个夜晚得知他的信息。","如果贵族在游戏中途被创造，他会在自己作为贵族时的第一个夜晚得知信息。","贵族得知的是两名善良玩家和一名邪恶玩家。他不会得知一名善良玩家和两名邪恶玩家，也不会得知三名邪恶玩家。"],"qa":[],"interactions":[{"with":["舞蛇人"],"text":"可能在贵族醒来之前阵营发生交换，所以在贵族信息中需要展示新的阵营状态。","kind":"interaction"},{"with":["莽夫"],"text":"在贵族醒来时，莽夫的阵营可能已经变为邪恶，所以可以将莽夫作为邪恶玩家展示。注意，贵族没有使用自身能力选择莽夫。","kind":"interaction"},{"with":["陌客","间谍"],"text":"可以被贵族当作邪恶或善良。","kind":"interaction"}],"tips":["把三人恰一邪作为整体条件，结合其他信息划分。","注意信息时点和登记干扰。","清醒健康且原始信息可信的分支，三名对象恰有一名邪恶；与其他信息共同排坑，不独立认证未被点名的人。"],"counterplay":["假贵族可以指定三名好人制造嫌疑；应对时需要独立采信条件，不自动假设三人里恰好一红。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成贵族"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E8%B4%B5%E6%97%8F","https://wiki.biligame.com/jbzlbwgwjcygf/%E8%B4%B5%E6%97%8F"]},"king":{"id":"king","name":"国王","sourceTitle":"国王","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%9B%BD%E7%8E%8B","checkedAt":"2026-11-11","ability":"每个夜晚，如果死亡的玩家数量大于或等于存活的玩家数量，你会得知一个存活的角色。 恶魔知道你是国王。","mechanics":["国王会在游戏的数个夜晚之后获得能力——只要死亡玩家的数量大于或等于存活玩家的数量。","在游戏开始时的第一个夜晚，恶魔会得知谁是国王。如果国王在游戏中途被创造，恶魔会在当晚得知谁是国王。","国王未必能幸存到能够使用自己的能力。然而一旦死亡玩家的数量大于或等于存活玩家的数量，国王就能在此后的每个夜晚得知一个存活角色。","国王既有可能得知善良角色，也有可能得知邪恶角色，甚至还有可能多次得知同一个角色。","唱诗男孩并非一定在场。但如果唱诗男孩在场，且在恶魔杀死国王时仍然存活，唱诗男孩就能够得知谁是恶魔。"],"qa":[],"interactions":[{"with":["罂粟种植者"],"text":"罂粟种植者不会干扰恶魔知道谁是国王。","kind":"interaction"},{"with":["教授","沙巴洛斯","集骨者"],"text":"复活/反刍/重获能力角色选择国王将导致恶魔再次被告知国王是谁。","kind":"interaction"},{"with":["舞蛇人","理发师","麻脸巫婆","猩红女郎","方古","小恶魔","小怪宝"],"text":"如果恶魔更换了玩家，此时国王仍存活且清醒和健康，新的恶魔玩家会知道国王是谁。","kind":"interaction"},{"with":["理发师","麻脸巫婆"],"text":"如果国王被交换到另外一名玩家，或者被重新创造，恶魔会被告知新国王玩家。","kind":"interaction"},{"with":["酒鬼","提线木偶"],"text":"如果国王被选为酒鬼/提线木偶，恶魔不会被告知哪名玩家是国王。","kind":"interaction"},{"with":["莽夫"],"text":"国王没有使用自己的能力主动选择莽夫，所以国王得知莽夫时不会因为莽夫的能力而醉酒。","kind":"interaction"},{"with":["疯子"],"text":"疯子可以被告知国王在场，无论正确与否。","kind":"interaction"},{"with":["陌客"],"text":"理论上你可以向陌客展示国王是谁，但这并不有趣。","kind":"interaction"},{"with":["涡流"],"text":"恶魔会被告知除该国王玩家以外的任意玩家是国王。国王得知错误信息：不在场或者已经死亡的角色。","kind":"interaction"},{"with":["僵怖"],"text":"假死的僵怖在国王“死亡玩家数量大于或等于存活玩家数量”的能力里，被算作死亡。","kind":"interaction"},{"with":["学徒"],"text":"如果获得国王能力，恶魔会被告知。","kind":"interaction"},{"with":["咖啡师"],"text":"只有当死亡玩家数量大于或等于存活玩家数量时，其才会在国王获得信息时产生效果。","kind":"interaction"},{"with":["利维坦"],"text":"如果利维坦在场，当至少一名玩家死亡时，国王每晚就会得知一个存活的角色。","kind":"jinx"},{"with":["暴乱"],"text":"如果暴乱在场，当至少一名玩家死亡时，国王每晚就会得知一个存活的角色。","kind":"jinx"},{"with":["戏子（改）"],"text":"国王不会因为戏子（改）的能力醉酒。","kind":"jinx"}],"tips":["结合唱诗男孩的潜在保护决定公开时机。","晚期得到的是存活角色，不直接对应座位。"],"counterplay":["假国王可利用临近终局的角色声明补编信息；应对时按反馈时点检查角色是否存活。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成国王"]},"general":{"id":"general","name":"将军","sourceTitle":"将军","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%B0%86%E5%86%9B","checkedAt":"2026-11-17","ability":"每个夜晚，你会得知说书人认为哪个阵营当前更有优势（善良/邪恶/均势）。","mechanics":["说书人需要对阵营的优势做出判断。很多因素都会作为考量，例如每个阵营有多少存活的玩家，善良阵营获取的信息程度如何，邪恶阵营的伪装的取信程度如何，玩家们即将打算处决谁，或是恶魔玩家的游戏经验是否丰富。上述所有内容以及一些其他因素都会影响说书人的判断。","当晚较早时段里发生的事情也可能会影响判断。","将军获得的是说书人对局势的主观评价，不是邪恶人数、某人身份或精确胜率的认证。评价变化只辅助排序，不能单独作硬排除。"],"qa":[],"interactions":[],"tips":["比较局势变化前后的优势反馈。","这是说书人的综合判断，不能等同于某次处决判红。"],"counterplay":["优势变化不等于上次处决的阵营反馈；应对时还要考虑信息、投票与隐藏胜负条件。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成将军"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%B0%86%E5%86%9B","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%B0%86%E5%86%9B"]},"alchemist":{"id":"alchemist","name":"炼金术士","sourceTitle":"炼金术士","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%82%BC%E9%87%91%E6%9C%AF%E5%A3%AB","checkedAt":"2026-11-11","ability":"你拥有一个爪牙角色的能力。当你使用能力时，说书人可能会要求你更换选择。","mechanics":["炼金术士通常会获得一个不在场爪牙的能力，但可以获得一个在场爪牙的能力。","炼金术士会在自己的首个夜晚得知自己获得了哪一项爪牙的能力。","炼金术士仍然是善良的镇民。他会在善良阵营获胜时一同获胜，也会在善良阵营落败时一同落败。他被当作善良阵营的炼金术士。","不同于一般的爪牙，炼金术士不会被唤醒以得知其他爪牙以及恶魔分别是哪些玩家。","如果炼金术士获得了一个可以选择的能力，比如投毒者或维齐尔，说书人可以让炼金术士换个选择，炼金术士就必须更换自己的选择。"],"qa":[],"interactions":[{"with":["赏金猎人"],"text":"赏金猎人可以让炼金术士转变为邪恶，让爪牙能力回归邪恶阵营。","kind":"interaction"},{"with":["邪恶双子"],"text":"如果炼金术士获得邪恶双子能力，则将一名邪恶玩家设置为他的“对立双子”。如果这名善良的炼金双子被处决，邪恶阵营获胜。","kind":"interaction"},{"with":["恐惧之灵"],"text":"获得恐惧之灵能力的炼金术士在夜晚触发的公开宣布与恐惧之灵相同：“恐惧之灵选择了一名玩家”。","kind":"interaction"},{"with":["哥布林"],"text":"炼金哥布林触发哥布林能力需要声明自己是哥布林，而不是炼金哥布林。实际上，如果不允许将这两种情况当作同样处理，也太过于为难玩家了。","kind":"interaction"},{"with":["军团"],"text":"炼金术士无法获得军团的能力。","kind":"interaction"},{"with":["小怪宝"],"text":"炼金术士不是爪牙，所以不会在为秘密决定由哪名玩家照看小怪宝时醒来。","kind":"interaction"},{"with":["精神病患者"],"text":"当炼金精神病患者发动能力选择一名玩家时，说书人可以公开要求他重新选择一名玩家，他必须更换选择。（说书人也可以要求精神病患者重新选择一名玩家，他可以不更换选择）","kind":"interaction"},{"with":["寡妇"],"text":"如果炼金术士本应获得寡妇的能力，那么他不会拥有该能力并改为寡妇一定在场。每次处决后，存活的炼金术士可以公开猜测一名存活玩家是寡妇：如果猜对了，恶魔当晚必须选择寡妇。","kind":"jinx"},{"with":["间谍"],"text":"如果炼金术士本应获得间谍的能力，那么他不会拥有该能力并改为间谍一定在场。每次处决后，存活的炼金术士可以公开猜测一名存活玩家是间谍：如果猜对了，恶魔当晚必须选择间谍。","kind":"jinx"},{"with":["召唤师"],"text":"获得召唤师能力的炼金术士不会获得伪装。他要选择一个恶魔角色，但不选择玩家，由说书人决定哪一名玩家变成邪恶的恶魔。如果他在选择之前死亡，邪恶阵营获胜。[无恶魔在场] 科学怪人 ：如果炼金术士拥有科学怪人的能力，炼金术士不会得知恶魔因此获得了哪个角色的能力。","kind":"jinx"},{"with":["亡魂"],"text":"如果炼金术士本应获得亡魂的能力，那么他不会拥有该能力并改为亡魂一定在场。每次处决后，存活的炼金术士可以公开猜测一名存活玩家是亡魂：如果猜对了，恶魔当晚必须选择亡魂。","kind":"jinx"},{"with":["提线木偶"],"text":"如果炼金术士本应获得提线木偶的能力，那么他不会拥有该能力并改为提线木偶一定在场。","kind":"jinx"},{"with":["主谋"],"text":"如果炼金术士本应获得主谋的能力，那么他不会拥有该能力并改为主谋一定不在场。","kind":"jinx"},{"with":["街头风琴手"],"text":"如果炼金术士获得街头风琴手的能力，街头风琴手一定在场。如果炼金术士和街头风琴手都是清醒的，改为他们都醉酒。","kind":"jinx"},{"with":["蛊雕"],"text":"如果炼金术士本应获得蛊雕的能力，那么他不会拥有该能力并改为蛊雕一定在场。每次处决后，存活的炼金术士可以公开猜测一名存活玩家是蛊雕：如果猜对了，恶魔当晚必须选择蛊雕。","kind":"jinx"}],"tips":["先理解实际获得的爪牙技能和相克。","用善良目标运用能力，并留意可能被要求改选。"],"counterplay":["真爪牙也可谎称自己是炼金术士；应对时确认能力发动与确认善良是两件事。"],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节","提示与技巧","伪装成炼金术士"]},"magician":{"id":"magician","name":"魔术师","sourceTitle":"魔术师","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%AD%94%E6%9C%AF%E5%B8%88","checkedAt":"2026-11-11","ability":"恶魔会以为你是爪牙。爪牙会以为你是恶魔。","mechanics":["在游戏的首个夜晚，不是告诉所有爪牙哪名玩家是恶魔，而是改为告诉爪牙魔术师和恶魔都是恶魔。","在游戏的首个夜晚，恶魔会得知所有爪牙和魔术师都是爪牙。","说书人在告知时可以以任意顺序指向魔术师和其他邪恶玩家，这样邪恶玩家就不会知道究竟哪一名玩家是魔术师了。","如果罂粟种植者死亡，导致恶魔和爪牙在游戏中途互认，魔术师的能力也会在那个夜晚生效，就如同常规情况下在首个夜晚时一样。"],"qa":[],"interactions":[{"with":["罂粟种植者"],"text":"如果罂粟种植者死亡时魔术师还活着，他会影响爪牙/恶魔信息环节，就像他在首夜运作的那样。","kind":"interaction"},{"with":["疯子"],"text":"如果角色列表上有魔术师，你可以假装让疯子以为场上有魔术师，并且向他展示额外一名“爪牙”，无论场上是否真的有魔术师。","kind":"interaction"},{"with":["主谋"],"text":"不与魔术师的能力发生互动。尽管主谋以为魔术师是恶魔，但主谋能力不会将魔术师当作恶魔，所以魔术师被处决时不会触发主谋能力。","kind":"interaction"},{"with":["灵言师"],"text":"可以将魔术师转变为邪恶阵营。同样，当灵言师以为魔术师是恶魔，但灵言师能力将魔术师当作善良，因此如果魔术师首个说出关键词，当晚会转变为邪恶阵营。","kind":"interaction"},{"with":["猩红女郎"],"text":"参考主谋/灵言师。","kind":"interaction"},{"with":["小恶魔"],"text":"小恶魔选择在夜里自杀，不能将魔术师的角色改变为小恶魔。","kind":"interaction"},{"with":["诺-达鲺"],"text":"如果魔术师是与诺-达鲺邻近的镇民玩家，他无法影响恶魔/爪牙信息环节。","kind":"interaction"},{"with":["涡流"],"text":"不与魔术师发生互动。 旅行者 / 传奇角色 ：既不是爪牙也不是恶魔（即使是拥有爪牙能力的学徒），所以不会被魔术师能力影响，只能得知正确的恶魔玩家。","kind":"interaction"},{"with":["咖啡师"],"text":"如果恶魔/爪牙在首夜因为咖啡师变得清醒且健康，恶魔/爪牙信息环节魔术师将不会向他展示。","kind":"interaction"},{"with":["间谍","寡妇"],"text":"） 小怪宝 ：如果魔术师存活，由说书人决定谁照看小怪宝。","kind":"jinx"},{"with":["维齐尔"],"text":"如果维齐尔在场，魔术师不会拥有能力，但他会免疫维齐尔的能力。","kind":"jinx"},{"with":["亡魂"],"text":"每次处决后，存活的魔术师可以公开猜测一名存活玩家是亡魂：如果猜对了，恶魔当晚必须选择亡魂。","kind":"jinx"},{"with":["提线木偶"],"text":"如果魔术师存活，恶魔不会得知谁是提线木偶。","kind":"jinx"},{"with":["蛊雕"],"text":"蛊雕会跳过魔术师。","kind":"jinx"}],"tips":["可通过接近邪恶阵营的行为观察谁来互认。","不要为了像坏人而无条件破坏善良阵营。"],"counterplay":["邪恶可利用“我只是装坏”退路；应对时独立核验其互认故事，别只看行为表演。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成魔术师"]},"farmer":{"id":"farmer","name":"农夫","sourceTitle":"农夫","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%86%9C%E5%A4%AB","checkedAt":"2026-11-17","ability":"当你在夜晚死亡时，一名存活的善良玩家会变成农夫。","mechanics":["如果一名农夫在夜晚死亡，会有另一名玩家变成农夫。","只有善良玩家能够通过这种方式变成农夫。","如果这名新的农夫也在夜晚死亡了，会再次有另一名农夫被创造出来。","在白天死亡的农夫，例如因处决而死亡，无法创造新的农夫。","已经转为邪恶阵营的农夫，例如受到灵言师的能力所影响，仍然可以创造新的农夫。然而已经转为邪恶阵营的镇民和外来者无法因为这种方式被变成农夫。","农夫们之间不会互相认识，但是每名变成农夫的玩家都会得知他现在是农夫了。","当一名玩家变成农夫后，他不再是原本的角色，也不再拥有那个角色的能力。所有与他原本能力相关的持续性效果都会立即终止。"],"qa":[{"q":"夜里死亡一定会产生新农夫吗？","a":"仅真农夫夜死且能力有效才触发。由说书人选择一名存活善良玩家成为农夫，记录角色变化时点；自称接棒不能单独认证。"}],"interactions":[{"with":[],"text":"存活且善良的玩家才会因农夫的能力变成农夫，所以在农夫行动顺序之前已经死亡的玩家或已经转变为邪恶阵营的玩家不会因农夫的能力变成农夫。","kind":"detail"},{"with":["侍女"],"text":"然而，如果当晚该玩家在变成农夫之前因自身能力醒来，尽管他现在拥有的是不同的能力，侍女仍会探查。","kind":"interaction"},{"with":["赌徒"],"text":"如果赌徒已经赌错并死亡，他不能在当晚的晚些时候变成农夫，因为他已经死亡。","kind":"interaction"},{"with":["造谣者"],"text":"如果当晚造谣者在行动顺序之前变成农夫，没有玩家会因造谣者而死，因为造谣者这个角色离场了。然而，农夫可以因为造谣者的能力死亡后让造谣者自己变成农夫。","kind":"interaction"},{"with":["半兽人"],"text":"如果半兽人杀死农夫，然后变成农夫，当晚恶魔能够造成死亡，因为场上不再有半兽人能力阻止恶魔的杀戮。","kind":"interaction"},{"with":["数学家"],"text":"玩家变成农夫并且不再能够使用他之前的能力，数学家不会检测。","kind":"interaction"},{"with":["镇长"],"text":"农夫可以代替镇长死亡，之后善良的镇长也可以变成农夫。","kind":"interaction"},{"with":["罂粟种植者"],"text":"如果罂粟种植者变成农夫，邪恶阵营无法互认。","kind":"interaction"},{"with":["莽夫"],"text":"可以变成农夫。先前的农夫玩家没有使用自身能力选择莽夫，是说书人选择，所以莽夫不会导致之前的农夫醉酒。","kind":"interaction"},{"with":["间谍"],"text":"可以被当作善良玩家，变成农夫。 旅行者 ：根据标准钟楼规则，旅行者不能改变角色，因此存活的善良旅行者无法变成农夫。","kind":"interaction"},{"with":["咖啡师"],"text":"如果当晚因为咖啡师导致农夫能力生效两次，农夫的死亡会导致两名存活善良玩家变成农夫。","kind":"interaction"},{"with":["利维坦"],"text":"每个夜晚*，利维坦要选择一名存活玩家（与之前的每个夜晚不同）：如果农夫被选择，他的能力生效但不会死亡。","kind":"jinx"},{"with":["暴乱"],"text":"每个夜晚*，暴乱要选择一名存活玩家（与之前的每个夜晚不同）：如果农夫被选择，他的能力生效但不会死亡。","kind":"jinx"}],"tips":["夜死后先等新农夫来联系，独立核对转换时点。","私聊互认仍须防邪恶方配合假跳。"],"counterplay":["邪恶可以共同编造农夫传递；应对时核对不同玩家独立收到的角色通知及先后。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成农夫"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%86%9C%E5%A4%AB","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%86%9C%E5%A4%AB"]},"highpriestess":{"id":"highpriestess","name":"女祭司","sourceTitle":"女祭司","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%A5%B3%E7%A5%AD%E5%8F%B8","checkedAt":"2026-11-11","ability":"每个夜晚，你会得知一名说书人认为你最应该与其交流的玩家。","mechanics":["女祭司可以连续几个夜晚得知同一名玩家，也可以在每个夜晚都得知不同的玩家。","她得知的玩家可以是存活玩家，也可以是死亡玩家。","她得知的玩家可以是善良玩家，也可以是邪恶玩家。","没有绝对的标准用于决定说书人究竟要给女祭司什么样的信息。说书人通过自己的判断来决定给出女祭司的信息内容，这取决于他认为给出什么样的信息能够对女祭司和善良阵营更加有利。这可能是因为某些玩家有重要信息但尚未公布，或是邪恶玩家的伪装一戳即破，或是有值得被信赖的玩家需要建立更强的信任，或是有善良玩家的推理出现了谬误，急需被纠正，或是其他各种各样的原因。"],"qa":[],"interactions":[],"tips":["及时与指向的人交流并问新信息。","这是交流建议，不是身份或阵营查验。"],"counterplay":["假跳可把任意聊天说成指引；应对时重点使用交流得到的实质信息，不凭被指向认好。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成女祭司"]},"balloonist":{"id":"balloonist","name":"气球驾驶员","sourceTitle":"气球驾驶员","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B0%94%E7%90%83%E9%A9%BE%E9%A9%B6%E5%91%98","checkedAt":"2026-11-17","ability":"每个夜晚，你会得知一名与上个夜晚得知的玩家角色类型不同的玩家。[+0~1外来者]","mechanics":["本版本只约束连续两次得知者的角色类型不同，不保证四晚各得一种类型，也不保证四名玩家中必有恶魔。","玩家只知道所指玩家，不知道其类型。健康恢复后的下一条反馈仍与上次实际得知者的类型比较。","初始设置可额外增加0或1名外来者；角色在池不代表实际在场，不能据此固定增加一名外来者。"],"qa":[{"q":"四晚一定正好各得知一种类型吗？","a":"不是当前版本。只要求本次与上次得知者的类型不同，可以出现镇民、外来者、镇民等序列；玩家不会得知类型本身。"},{"q":"四晚信息能无条件圈出一名恶魔吗？","a":"不能。旧攻略的四类型轮转不适用于本卡面；应只联立相邻两次类型不同的条件。"}],"interactions":[{"with":["提线木偶"],"text":"如果提线木偶抽到了气球驾驶员，在设置调整阶段可能会+1外来者。","kind":"jinx"}],"tips":["逐夜比较相邻两次信息的类型关系，结合外来者增量。","不要套旧版集齐四种类型的规则。"],"counterplay":["假跳可按公开身份编顺序；应对时保存逐夜原始目标，不把四晚循环类型当硬约束。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成气球驾驶员"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%B0%94%E7%90%83%E9%A9%BE%E9%A9%B6%E5%91%98","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B0%94%E7%90%83%E9%A9%BE%E9%A9%B6%E5%91%98"]},"knight":{"id":"knight","name":"骑士","sourceTitle":"骑士","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%AA%91%E5%A3%AB","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你会得知两名非恶魔玩家。","mechanics":["在骑士的首个夜晚，他会得知两名玩家，这两名玩家的角色都不是恶魔。","在随后的夜晚，骑士不会得知更多的信息。","骑士得知的玩家可以是镇民，外来者甚至爪牙，但骑士不会知道他所得知的玩家的具体角色类型。"],"qa":[],"interactions":[],"tips":["保护两名非恶魔信息的价值到决赛。","非恶魔仍可为爪牙，身份变化后也须重看时点。"],"counterplay":["假骑士可把恶魔列入非恶魔名单；应对时这只是采信真角色和有效首夜信息后的条件结论。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成骑士"]},"bountyhunter":{"id":"bountyhunter","name":"赏金猎人","sourceTitle":"赏金猎人","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%B5%8F%E9%87%91%E7%8C%8E%E4%BA%BA","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你会得知一名邪恶玩家。 每当你得知的玩家死亡，你会在当晚得知另一名邪恶玩家。[会有一名镇民转变为邪恶阵营]","mechanics":["在赏金猎人的首个夜晚，他会得知一名邪恶玩家。当赏金猎人得知的那名玩家死亡后，他会再得知另一名邪恶玩家。","赏金猎人只会得知一名邪恶玩家，而不会得知他的具体角色。","如果赏金猎人在应当得知新玩家的时候醉酒或中毒了，说书人可以让赏金猎人得知一名善良玩家。当这名玩家死亡后，赏金猎人会在当晚得知一名新玩家。","赏金猎人不会重复得知同一个邪恶玩家两次。","如果赏金猎人初始就加入了本局游戏，在设置调整阶段，会有一名镇民加入邪恶阵营。赏金猎人可以得知这名邪恶的镇民玩家。"],"qa":[],"interactions":[{"with":[],"text":"请注意，赏金猎人在首个夜晚的行动顺序非常靠后。","kind":"detail"},{"with":[],"text":"如果赏金猎人醉酒或中毒或处于涡流在场的游戏中，在他能够得到信息的时候，你可以（在涡流在场时必须）向他给出错误信息并展示一名善良玩家。如果赏金猎人在之后清醒，他不会因此得知新的信息，即使他仍然认为那名善良玩家是邪恶的。当赏金猎人得知的玩家死亡，他在当晚得知一名新的玩家。","kind":"detail"},{"with":[],"text":"如果“被得知”的邪恶玩家在之后转变为善良，这不会影响赏金猎人，赏金猎人为了获得进一步信息仍然需要那名玩家死亡。","kind":"detail"},{"with":[],"text":"值得注意的是，如果你觉得赏金猎人已经获得过很多信息了，可以向他指出一名死亡的邪恶玩家。死亡玩家不能再次死亡，所以赏金猎人不会获得新的信息，除非那名玩家被复活并再次被杀死。","kind":"detail"},{"with":[],"text":"对于旅行者，离开游戏和被流放都会导致他死亡——所以如果赏金猎人此前得知了一名旅行者，上述两种情况都会使得赏金猎人在当晚获得新的信息。","kind":"detail"},{"with":["哲学家"],"text":"如果哲学家获得了赏金猎人的能力，可能会有一名镇民玩家转变为邪恶。","kind":"jinx"},{"with":["卡扎力"],"text":"如果卡扎力把赏金猎人变成了爪牙，赏金猎人不会带来邪恶的镇民。","kind":"jinx"}],"tips":["结合当前指向者和死亡后的更新链找邪恶。","别忘了设置会增加一名邪恶镇民。"],"counterplay":["邪恶镇民有真能力仍可说谎；应对时别把可验证的镇民能力与善良阵营等同。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成赏金猎人"]},"amnesiac":{"id":"amnesiac","name":"失忆者","sourceTitle":"失忆者","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%A4%B1%E5%BF%86%E8%80%85","checkedAt":"2026-11-17","ability":"你不知道你的能力是什么。每个白天你可以找说书人猜测一次，你会得知你的猜测有多准确。","mechanics":["能力尚未被确认时不能发明具体技能或硬约束；原始数字、目标、说书人对猜测的反馈仍要保留。","区分玩家猜测、说书人评价和已确认能力，只有实际确认后才按对应技能剪枝。"],"qa":[],"interactions":[{"with":[],"text":"失忆者的夜晚行动顺序并非要完全依照在线魔典的原定顺序。","kind":"detail"}],"tips":["逐日从宽问题缩小技能范围，准确记下猜测和冷热反馈。","实际唤醒不等于一定是某种信息角色。"],"counterplay":["假跳可逐渐补编技能；应对时要求猜测与反馈的时间线，但不强迫真失忆者提前知道完整能力。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成失忆者"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%A4%B1%E5%BF%86%E8%80%85","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%A4%B1%E5%BF%86%E8%80%85"]},"cannibal":{"id":"cannibal","name":"食人族","sourceTitle":"食人族","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E9%A3%9F%E4%BA%BA%E6%97%8F","checkedAt":"2026-11-17","ability":"你拥有上个死于处决的玩家的能力。如果该玩家属于邪恶阵营，你中毒直到下个善良玩家死于处决。","mechanics":["真实身份仍为食人族，获得的是上个死于处决者的能力；不能把获得的角色再占一个起始角色名额。","处决未死或处决已死者不提供新的能力；不会自动得知吃到谁的能力。","本上传卡面写明：若该玩家邪恶，持续中毒直到下个善良玩家死于处决。不能按新百科个别缩写把未导致死亡的善良处决也当解除。","自己死亡后的能力按获得的具体技能及持续条件核验，不能一概继续或一概取消。"],"qa":[{"q":"我会直接得知自己吃到了什么能力吗？","a":"不会。按上个死于处决者及实际反馈判断；若其邪恶，你中毒，不能把模拟反馈当成真实获得并正常发动。"}],"interactions":[{"with":[],"text":"如果死于处决的玩家在随后改变角色或转换阵营，同样会被食人族持续检测。","kind":"detail"},{"with":["杂耍艺人"],"text":"如果杂耍艺人死于处决，食人族只能在第二天无人死于处决的情况下从杂耍艺人的能力获得信息。在杂耍艺人被处决的下一个白天是食人族杂耍艺人的“首个白天”，所以他必须在当天进行公开猜测，并且必须确保无人死于处决。以便食人族杂耍艺人保持他的能力，在当晚得到猜测的结果。","kind":"interaction"},{"with":["酒鬼"],"text":"如果食人族获得酒鬼的能力，你可以欺骗食人族是任何镇民，包括酒鬼自以为的那个角色。","kind":"interaction"},{"with":["畸形秀演员"],"text":"如果食人族拥有畸形秀演员能力，他可以声称自己是一个拥有畸形秀演员能力的食人族，并且不会被处决，因为他没有声称自己是外来者。然而，如果他声称自己是畸形秀演员，他可能会被处决。","kind":"interaction"},{"with":["政客"],"text":"如果食人族获得政客的能力，他将与已经死亡的政客发生竞争。因为只有一名玩家能够为自己阵营失败负最大责任，所以只有一名玩家可以转变阵营并获胜。","kind":"interaction"},{"with":["洗脑师"],"text":"如果一名玩家被洗脑并对特定角色疯狂，他不能声称自己是拥有该角色能力的食人族，期望以此逃避违反洗脑疯狂的处决。因为他没有声称自己就是这个角色，这不符合疯狂的要求。","kind":"interaction"},{"with":["教授","沙巴洛斯"],"text":"当食人族复活，他将获得最近死于处决的玩家能力。","kind":"interaction"},{"with":["呆瓜","月之子"],"text":"即使不进行提醒，也不应该算作是作弊。","kind":"interaction"},{"with":["杂耍艺人"],"text":"如果杂耍艺人在自己的首个白天猜测后在当天死于处决，当晚食人族会替杂耍艺人得知对应的信息。","kind":"jinx"},{"with":["管家"],"text":"如果食人族获得了管家的能力，他会得知这一信息。","kind":"jinx"},{"with":["狂热者"],"text":"如果食人族获得了狂热者的能力，他会得知这一信息。","kind":"jinx"},{"with":["公主"],"text":"如果食人族提名并处决了公主且公主因此死亡，当晚恶魔不会造成死亡。","kind":"jinx"}],"tips":["追踪上个处决死亡者及对应能力窗口。","邪恶目标造成中毒，不能把模拟反馈认证为真能力。"],"counterplay":["假食人族容易沿用死者公开信息；应对时寻找新能力实际产生的独立效果。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成食人族"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E9%A3%9F%E4%BA%BA%E6%97%8F","https://wiki.biligame.com/jbzlbwgwjcygf/%E9%A3%9F%E4%BA%BA%E6%97%8F"]},"steward":{"id":"steward","name":"事务官","sourceTitle":"事务官","source":"https://wiki.biligame.com/bloodontheclocktower/%E4%BA%8B%E5%8A%A1%E5%AE%98","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你会得知一名善良玩家。","mechanics":["事务官得知的是玩家，但不得知他的具体角色。","事务官会在首个夜晚得知他的信息。","如果事务官在游戏中途被创造，事务官会在当晚得知信息。"],"qa":[],"interactions":[],"tips":["先核对并联系得知的善良对象。","共享信息建立信任，同时保留有效能力与登记条件。"],"counterplay":["假跳可认恶魔为善良；应对时单向认人不能反向认证信息来源。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成事务官"]},"nightwatchman":{"id":"nightwatchman","name":"守夜人","sourceTitle":"守夜人","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%AE%88%E5%A4%9C%E4%BA%BA","checkedAt":"2026-11-11","ability":"每局游戏限一次，在夜晚时，你可以选择一名玩家：他会得知你是守夜人。","mechanics":["在夜晚，守夜人选择一名玩家。","守夜人选择哪个夜晚使用自己的能力。"],"qa":[],"interactions":[{"with":["咖啡师"],"text":"如果还未使用能力的守夜人受到咖啡师行动两次的影响，他可以选择两名玩家，被选择的玩家都会被告知。被选择的玩家不会被告知两次。","kind":"interaction"},{"with":["莽夫"],"text":"如果守夜人是当晚首个使用其自身能力选择了莽夫的玩家，守夜人会被莽夫醉酒，而莽夫不会得知守夜人是谁。","kind":"interaction"}],"tips":["选值得建立信任且可能活下来的对象。","通知由对方收到，提前核对一局一次的机会。"],"counterplay":["假跳通常需队友配合确认通知；应对时问对方实际收到什么，别只看两人公开互保。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成守夜人"]},"atheist":{"id":"atheist","name":"无神论者","sourceTitle":"无神论者","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%97%A0%E7%A5%9E%E8%AE%BA%E8%80%85","checkedAt":"2026-11-17","ability":"说书人可以打破游戏规则，如果说书人被处决，善良阵营获胜，即使你已死亡。[无邪恶角色在场]","mechanics":["实际在场的无神论者允许说书人破坏常规规则，并以无邪恶角色的设置分支处理；不能先固定一恶魔再排除此分支。","无神论者只在角色池或有人自称，不代表真在场：须同时考虑善良真无神论与邪恶假跳两类。","正常非无神论局处决说书人会让邪恶获胜；是否提出此行动要给出条件、证据与风险，不能只凭跳身份建议执行。","无神论分支下的规则破坏只作机制上的可能，不能捏造已发生的公告、反馈或说书人私有意图。"],"qa":[],"interactions":[{"with":["侍臣","旅店老板","吟游诗人","解谜大师","水手","心上人"],"text":"（通常来说）无神论者成功中毒或醉酒将立即结束游戏，因为没有存活恶魔，并且说书人不能再通过打破规则来阻止游戏结束。建议打破规则来阻止这种事情的发生，因为这可能会导致一个不愉快的结局。","kind":"interaction"},{"with":["疯子"],"text":"然而，他只能是疯子而不是恶魔，尽管他抽到的是红色标记。","kind":"interaction"},{"with":["提线木偶"],"text":"如果你希望无神论者是提线木偶，你将需要使用提线木偶设置规则的方法2（参考提线木偶页面），并且将恶魔设置为无神论者的邻座，以便让无神论者成为提线木偶。","kind":"interaction"},{"with":["政客"],"text":"如果政客对他的阵营在无神论者对局中落败负最大责任，他可以转变为邪恶阵营并获胜。","kind":"interaction"},{"with":["暴乱"],"text":"在暴乱的提名链中，如果说书人被提名，玩家要进行投票。如果说书人“即将被处决”，游戏结束；否则，说书人要重新发起提名。","kind":"jinx"},{"with":["戏子"],"text":"戏子无法反转处决说书人导致的胜负结果。","kind":"jinx"},{"with":["戏子（改）"],"text":"戏子（改）无法反转处决说书人导致的胜负结果，无神论者不会因为戏子（改）的能力醉酒。","kind":"jinx"}],"tips":["用具体异常帮助团队判断是否应处决说书人。","角色声明本身不足以让全队承担错误处决说书人的风险。","从本人真无神论视角可推动团队讨论处决说书人的条件；他人自称时同时保留邪恶假跳风险，不按普通角色矛盾直接排真。"],"counterplay":["邪恶可诱导处决说书人；应对时区分实际破例与可由正常在池角色解释的异常。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成无神论者"],"sources":["https://wik
