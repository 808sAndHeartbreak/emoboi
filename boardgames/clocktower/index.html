  color-scheme:dark;
  --bg:#0c0c0e; --panel:#141416; --surface:#1b1b1e; --hover:#252528;
  --ink:#eeeae4; --muted:#aba6a4; --faint:#8d8889; --line:#343034;
  --accent:#ee6875; --accent-dark:#341c23; --primary:#e7e2da; --primary-hover:#fffaf2;
  --red:#ed6977; --gold:#c8ac91; --green:#acb5a1;
  --font-body:"Notebook Sans",Inter,"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-display:"Notebook Serif","Noto Serif SC","Songti SC",serif;
  --font-mono:"SFMono-Regular",Consolas,monospace;
  font:15px/1.65 var(--font-body);font-synthesis:none;
}
*{box-sizing:border-box} [hidden]{display:none!important} html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit;border:0}button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}svg{display:inline-block;flex-shrink:0;vertical-align:middle}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input,select,textarea{min-width:0;max-width:100%;padding:11px 12px;color:var(--ink);border:1px solid #494348;border-radius:5px;background:#111113}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}input::placeholder,textarea::placeholder{color:var(--faint);opacity:1}
textarea{resize:vertical;line-height:1.8}select{padding-right:25px;text-overflow:ellipsis}input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px;flex-shrink:0}input[type=search]{appearance:none}
h1,h2,h3,p{margin:0}h1{font:600 32px/1.45 var(--font-display);letter-spacing:.03em}h2{font-size:17px;font-weight:600}h3{font-size:15px;font-weight:600}
small,.small{font-size:12px}.muted{color:var(--muted)}.faint{color:var(--faint)}.gold{color:var(--gold)}.danger{color:var(--red)}.mono{font-variant-numeric:tabular-nums}.eyebrow{font:10px/1.6 var(--font-mono);letter-spacing:.13em;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:24px}.spacer{flex:1}.gap6{gap:6px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 17px;border:1px solid #4c4449;border-radius:5px;background:var(--surface);white-space:nowrap;font-size:14px;font-weight:500;transition:background .15s,border-color .15s,color .15s}
.button:hover{background:var(--hover);border-color:#85757d}.button:active{transform:translateY(1px)}
.button.primary{color:#161315;background:var(--primary);border-color:var(--primary)}.button.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.button.quiet{background:transparent}.button.small{min-height:40px;padding:8px 12px;font-size:12px}
.button.text-only{min-height:44px;padding:8px 3px;background:none;border:0;color:var(--muted)}.button.text-only:hover{color:var(--ink)}
.icon-button{min-width:44px;min-height:44px;padding:11px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:var(--muted);background:none}.icon-button:hover{color:var(--ink);background:var(--hover)}
.icon-button[data-active=true]{color:var(--accent);background:var(--accent-dark)}.text-button{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:8px 0;color:var(--accent);background:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted);font-size:11px;white-space:nowrap}.pill.accent{color:var(--accent)}.pill.warning{color:var(--red)}
.dot{display:inline-block;width:4px;height:4px;background:var(--green);border-radius:50%}.divider{border:0;border-top:1px solid var(--line);margin:28px 0}
.skip-link{position:fixed;top:-80px;left:12px;z-index:100;padding:12px;background:var(--ink);color:var(--bg)}.skip-link:focus{top:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sidebar{display:none}#main{max-width:1540px;margin:0 auto;padding:0 clamp(24px,4vw,64px) 60px;min-height:100svh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:82px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0;background:none;text-align:left}.brand-seal{display:flex;color:var(--accent)}.brand-name{font:600 21px/1.4 var(--font-display);letter-spacing:.06em;white-space:nowrap}.brand-edition{font:10px/1 var(--font-mono);letter-spacing:.17em;color:var(--muted);margin-left:12px;padding-left:20px;border-left:1px solid var(--line)}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}.top-actions .save-state{margin:0 15px 0 0}.save-state{display:inline-flex;gap:7px;align-items:center;color:var(--faint);font-size:11px}.save-state.failed{color:var(--red)}
.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:34px 0 30px}.page-heading p{color:var(--muted);font-size:13px;margin-top:9px}.page-heading>.button{flex-shrink:0}
.session-header{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:space-between;gap:32px;min-height:190px;margin:22px 0 24px;padding:28px 32px;overflow:hidden;border:1px solid #3c3035;background:#101012}
.session-art{position:absolute;inset:0 0 0 25%;z-index:-1;background:linear-gradient(90deg,#101012,transparent 40%,#10101244),var(--town-art) center 54%/cover;opacity:.63}
.session-copy{min-width:0}.session-kicker{display:flex;align-items:center;gap:9px;color:#b8a4a8;font-size:11px;letter-spacing:.06em;overflow-wrap:anywhere}.red-rule{width:20px;height:2px;background:var(--accent);flex-shrink:0}.session-copy h1{font-size:34px;margin:9px 0 10px;text-shadow:0 2px 12px #000}
.session-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:#c5bdba}.session-meta>button:not(.button){display:inline-flex;align-items:center;gap:8px;padding:5px 0;min-height:34px;background:none;color:inherit}.session-meta>.button{min-height:34px;color:#c5bdba;font-size:12px}.session-meta>.button svg{width:14px}
.session-phase{display:flex;flex-direction:column;align-items:stretch;gap:10px;min-width:136px;padding:14px;background:#111113d9;border:1px solid #514149;backdrop-filter:blur(6px)}
.phase-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:38px;padding:0;background:none;font-size:14px;white-space:nowrap}.phase-button svg:first-child{color:var(--accent)}.phase-button svg:last-child{color:var(--muted)}.session-phase>.button{font-size:12px;min-height:36px;padding:7px 12px}

  add('townsfolk', 'empath', '共情者', '每个夜晚，你会得知与你邻近的两名存活的玩家中有几名是邪恶的。', '跳过死亡玩家寻找两侧最近的存活玩家，不固定为最初邻座。保留每晚的存活状态。');
  add('townsfolk', 'fortune_teller', '占卜师', '每个夜晚，你要选择两名玩家：你会得知他们之中是否有恶魔。有一名善良玩家始终会被你的能力当作恶魔。', '“是”不能唯一定位恶魔；考虑被当作恶魔的善良玩家（干扰项）、陌客误认及醉酒中毒。');
  add('townsfolk', 'undertaker', '送葬者', '每个夜晚*，你会得知今天白天死于处决的玩家的角色。', '处决和死亡分别记录；被处决但未死亡不产生这条信息。考虑误认与醉酒中毒。');
  add('townsfolk', 'monk', '僧侣', '每个夜晚*，你要选择除你以外的一名玩家：当晚恶魔的负面效果对他无效。', '已由用户确认：不能选择自己。保护只持续当晚，不等于免疫所有来源的死亡。');
  add('townsfolk', 'ravenkeeper', '守鸦人', '如果你在夜晚死亡，你会被唤醒，然后你要选择一名玩家：你会得知他的角色。', '触发条件是夜晚死亡，不只限于恶魔击杀；死亡当晚的触发例外需保留。');
  add('townsfolk', 'virgin', '贞洁者', '当你首次被提名时，如果提名你的玩家是镇民，他立刻被处决。', '首次提名即消耗触发机会，即使首次提名者不是镇民。处决与死亡仍须分开。');
  add('townsfolk', 'slayer', '猎手', '每局游戏限一次，在白天时，你可以公开选择一名玩家：如果他是恶魔，他死亡。', '任何人都可以声称发动猎手能力；无死亡不能单独证明目标不是恶魔。考虑醉酒中毒和陌客误认。');

  add('townsfolk', 'dreamer', '筑梦师', '每个夜晚，你要选择除你及旅行者以外的一名玩家：你会得知一个善良角色和一个邪恶角色，该玩家是其中一个角色。', '保留两个角色选项，不能把善良选项直接当作真身份。');
  add('townsfolk', 'snake_charmer', '舞蛇人', '每个夜晚，你要选择一名存活的玩家：如果你选中了恶魔，你和他交换角色和阵营，然后他中毒。', '交换后的身份、阵营与中毒分别按时间记录；旧恶魔掌握的旧信息可能仍然有用。');
  add('townsfolk', 'mathematician', '数学家', '每个夜晚，你会得知从上个黎明到现在，有多少名玩家的能力因为其他角色的能力而未正常生效。', '只计因其他角色而实际异常的能力；醉毒本身不计，醉毒却得到正常信息通常不计，自己的异常不计。同一玩家只计一次；误认也可能造成应计的异常。');

  add('townsfolk', 'savant', '博学者', '每个白天，你可以私下询问说书人以得知两条信息：一个是正确的，一个是错误的。', '成对保存原文；健康正常情况下恰好一真一假，角色机制可能改变信息。');

  add('townsfolk', 'philosopher', '哲学家', '每局游戏限一次，在夜晚时，你可以选择一个善良角色：你获得该角色的能力。如果这个角色在场，他醉酒。', '获得能力，不变成那个角色。若哲学家死亡、醉酒或中毒，由他导致的醉酒通常停止；所选角色后来入场也会受影响。首夜信息能力在获得当晚使用。');

持续一致；应对时核对指认是否与外来者声明、男爵分支相容。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成图书管理员"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%9B%BE%E4%B9%A6%E7%AE%A1%E7%90%86%E5%91%98","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%9B%BE%E4%B9%A6%E7%AE%A1%E7%90%86%E5%91%98"]},"investigator":{"id":"investigator","name":"调查员","sourceTitle":"调查员","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E8%B0%83%E6%9F%A5%E5%91%98","checkedAt":"2026-11-17","ability":"在你的首个夜晚，你会得知两名玩家和一个爪牙角色：这两名玩家之一是该角色（或者你会得知没有爪牙在场）。","mechanics":["在第一个夜晚，调查员会得知两名玩家其中一人的爪牙角色。","调查员只会得知一次信息，之后便无法获取更多信息。"],"qa":[{"q":"有爪牙名额时，为什么可能得知“没有爪牙”？","a":"能力允许此反馈；例如实际爪牙为间谍且在此查验中登记为善良角色。不能只凭开局配额排除此结果。"}],"interactions":[{"with":[],"text":"在仅有一名爪牙且为间谍的情况下， 调查员可能会将间谍当作非爪牙角色，从而得知没有爪牙在场。这种情况下，实际上也与“得知两名玩家其中之一是间谍 ”相似（因为基本上不可能存在初始没有任何爪牙在场的情况），但相对来说调查员在得知“0”的时候会对谁是间谍这一事实毫无头绪。","kind":"detail"},{"with":[],"text":"由于麻脸巫婆这样的角色存在，很有可能出现某局游戏进行到一半时没有任何爪牙角色在场，此时有新的调查员产生时，也会因此得知“0”。","kind":"detail"},{"with":[],"text":"但即使如此，说书人也应该让调查员得知爪牙角色，否则等同于在明示调查员他自己醉酒中毒，且给出的信息也不符合调查员应该获取的信息内容。","kind":"detail"},{"with":[],"text":"特定角色互动： 陌客 ： 调查员能将陌客当作爪牙，并得知陌客和任意其他玩家之中有一个任意爪牙角色。","kind":"detail"},{"with":["维齐尔"],"text":"说书人不会宣布维齐尔在场。","kind":"jinx"}],"tips":["把二选一与提名、死亡和其他查验交叉验证。","陌客可形成干扰，另一人不因此被认证。"],"counterplay":["假的二选一也能逼出大量信息；应对时不要为了验一条自述而无条件连续处决两个目标。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成调查员"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E8%B0%83%E6%9F%A5%E5%91%98","https://wiki.biligame.com/jbzlbwgwjcygf/%E8%B0%83%E6%9F%A5%E5%91%98"]},"chef":{"id":"chef","name":"厨师","sourceTitle":"厨师","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%8E%A8%E5%B8%88","checkedAt":"2026-11-17","ability":"在你的首个夜晚，你会得知场上邻座的邪恶玩家有多少对。","mechanics":["在第一个夜晚，厨师会得知有多少对邪恶玩家相邻而坐。两名相邻而坐的玩家为一对，然而每名玩家都能分别与两侧的玩家各组成一对。因此，两名相邻而坐的玩家是一对，三名相邻而坐的玩家是两对，四名相邻而坐的玩家是三对，以此类推。","厨师会像探查其他角色类型一样探查邪恶旅行者，但仅仅只会关注那些在厨师行动前加入游戏的旅行者。","厨师按其获得信息时的座次检测邻座，死亡玩家不从座次中移除；仅考虑在其行动前已加入且尚未离场的旅行者，邪恶旅行者也可形成邪恶邻座对。"],"qa":[],"interactions":[{"with":[],"text":"厨师的单次能力会为玩家进行多次检测判断。因此具有互动干扰类能力的角色可能会在与其左右相邻的玩家组合中被当作不同的阵营。但通常来说，我们建议按照在厨师的单次能力探查中始终保持同一阵营来进行判断，以提升厨师玩家的游戏体验。毕竟，不仅互动干扰能力会影响厨师的结果， 醉酒和中毒也会。","kind":"detail"},{"with":[],"text":"厨师的能力探查的是相邻玩家，且并未加“存活”这一附加条件。在游戏中途产生的厨师 ，获取到的信息仍然会考虑仍然在游戏中的所有玩家（已经提前离开游戏的旅行者则不算在内）。","kind":"detail"}],"tips":["在座位环上画邪恶邻座对，再联立共情和身份名额。","连续三红算两对，首尾也相邻。"],"counterplay":["假数字会排除整组邪恶座位；应对时要求准确原始数字，别把行为嫌疑当数字的硬依据。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成厨师"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%8E%A8%E5%B8%88","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%8E%A8%E5%B8%88"]},"empath":{"id":"empath","name":"共情者","sourceTitle":"共情者","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%85%B1%E6%83%85%E8%80%85","checkedAt":"2026-11-11","ability":"每个夜晚，你会得知与你邻近的两名存活的玩家中邪恶玩家的数量。","mechanics":["共情者只会得知与自己邻近的邪恶玩家数量，但不会得知具体哪一名玩家是邪恶的。","共情者不会探查已死亡的玩家。因此，如果共情者与一位已死亡玩家相邻，他不会获取到有关死亡玩家的任何信息。取而代之的是，他会获取与那位死亡玩家同一方向上最近的存活玩家的信息。","共情者在恶魔之后行动，因此如果恶魔杀死了共情者邻近玩家之一，共情者不会得知有关那位现在已死的玩家的信息。共情者的信息以当晚黎明时的状态为基准，而非黄昏。"],"qa":[],"interactions":[{"with":[],"text":"共情者得知的信息是当晚黎明时的状况，而非黄昏时的，因此在当晚复活的角色（通常会是在共情者行动之前复活），也可能会因为成为与共情者邻近的存活玩家，从而影响共情者获取的信息。","kind":"detail"}],"tips":["每晚同时记数字和当时两侧最近存活邻居。","邻居死亡后比较新旧数字，比单次结果更有价值。"],"counterplay":["假跳者需要解释邻居更换后的连续数字；应对时核对每一夜的邻居，别只核对最新一晚。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成共情者"]},"fortune_teller":{"id":"fortune_teller","name":"占卜师","sourceTitle":"占卜师","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%8D%A0%E5%8D%9C%E5%B8%88","checkedAt":"2026-11-17","ability":"每个夜晚，你要选择两名玩家：你会得知他们之中是否有恶魔。 会有一名善良玩家始终被你的能力当作恶魔。","mechanics":["每个夜晚，占卜师需要选择两名玩家，得知其中是否有恶魔。他不会得知具体哪一名玩家是恶魔，只知道两名玩家之中有恶魔。如果两名玩家均不是恶魔，他会得知“否”。","不幸的是，会有一名被称作“干扰项”的玩家，会被占卜师在选中时当作恶魔。“干扰项”在一整场游戏中只会是同一名玩家。这名玩家可以是任何善良玩家，甚至是占卜师自己。占卜师不会知道哪一名玩家是他的“干扰项”。","占卜师可以选择任意两名玩家——无论他们存活与否，甚至可以选择自己。如果占卜师选中了已死亡的恶魔，仍然会得知“是”。"],"qa":[{"q":"多次“是”都包含同一个人，能锁定他是恶魔吗？","a":"不能。固定善良干扰项可以独自解释多次阳性；还需考虑当次陌客登记、失效和角色变化。"},{"q":"干扰项整局一定是同一人吗？","a":"标准暗流通常保持不变。混合剧本若其变成邪恶，需重新选择一名善良干扰项；按本局技能和裁定处理。"}],"interactions":[{"with":[],"text":"虽然在占卜师的角色详解中提及了“‘干扰项’在一整场游戏中只会是同一名玩家”，但这是由于在暗流涌动中不会出现阵营转变效果而导致的。不去介绍更深层次的规则仅仅只是不希望玩家在一开始就因为接收到过于复杂的规则而变得迷惑（正常来说，玩家需要进入到梦殒春宵后才会接触到阵营转变的效果）。但只要被标记为“干扰项”的玩家阵营没有发生变化，那么他就始终都会是“干扰项”。这种情况其实与得知寡妇在场的玩家变为邪恶阵营后，会重新有一名善良玩家得知寡妇在场是类似的。","kind":"detail"},{"with":[],"text":"虽然在绝大部分情况下这并没有什么用，但是以为自己是占卜师的酒鬼因为不具有占卜师的能力，也就因此不会有“干扰项”这个标记。 提线木偶同理。","kind":"detail"},{"with":["涡流"],"text":"如果涡流在场， 占卜师仅仅选中了“干扰项”会得知“是”，这是因为占卜师的获取信息只判断“是否选中了恶魔”，而这次选择他没有选中恶魔，因此得知“是”。","kind":"interaction"},{"with":["咖啡师"],"text":"咖啡师的“获取正确信息”效果对占卜师生效的期间里，会让占卜师不再把“干扰项”错认成恶魔。","kind":"interaction"}],"tips":["保留两目标与原始是/否。","交叉复查共享目标，区分恶魔、善良干扰项和陌客。"],"counterplay":["伪装时要提前规划连续双目标；应对时保留同一个善良干扰项跨晚解释，不为每条阳性新增一个干扰项。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成占卜师"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%8D%A0%E5%8D%9C%E5%B8%88","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%8D%A0%E5%8D%9C%E5%B8%88"]},"undertaker":{"id":"undertaker","name":"送葬者","sourceTitle":"送葬者","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E9%80%81%E8%91%AC%E8%80%85","checkedAt":"2026-11-17","ability":"每个夜晚*，你会得知今天白天死于处决的玩家的角色。","mechanics":["只有死于处决的玩家才会被送葬者得知是哪一种角色。在白天因为其他原因造成的死亡，例如枪手杀死的玩家，或对旅行者的流放，不算在内。","送葬者会在除首个夜晚以外的每晚醒来，因为在首个夜晚之前不会有任何处决发生。","如果当天没有玩家死亡，送葬者不会得知任何消息。","白天发生处决但无人因此死亡，不能产生正常送葬角色结果。此时可能不被唤醒，也可能醒来但没有角色信息，侍女的数字会因此不同；不能反过来捏造送葬已取得一个角色结果。"],"qa":[],"interactions":[{"with":[],"text":"说书人可以自行决定并提前告知玩家本场游戏将以何种方式运作。）","kind":"detail"},{"with":[],"text":"如果白天无人被处决，或发生了处决但无人死亡，但涡流在场， 送葬者不会因此得知错误的信息。因为无人因处决而死，所以送葬者不会因此获得信息，也就不会受到涡流的影响。","kind":"detail"},{"with":[],"text":"在夜晚因处决而死亡的玩家其角色不会被送葬者得知。","kind":"detail"}],"tips":["提前确认哪次处决真正造成死亡。","收到角色后，与该人的完整声明和名额一起核验。"],"counterplay":["伪装者可能用公开声明补编角色；应对时核对反馈是否先于目标改口，区分独立信息与事后复述。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成送葬者"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E9%80%81%E8%91%AC%E8%80%85","https://wiki.biligame.com/jbzlbwgwjcygf/%E9%80%81%E8%91%AC%E8%80%85"]},"monk":{"id":"monk","name":"僧侣","sourceTitle":"僧侣","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%83%A7%E4%BE%A3","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择除你以外的一名玩家：当晚恶魔的负面能力对他无效。","mechanics":["除首夜外，每晚选择一名其他玩家，不能选择自己。保护仅持续当夜。","保护针对恶魔的负面能力，不防普通处决或爪牙投毒；也不保证被保护者为善良。","混合剧本中也可阻止恶魔造成的有害中毒、转邪或错误信息；不能由“无夜死”直接认证守中。"],"qa":[{"q":"保护后自己当夜死亡，守人仍可能有效吗？","a":"可以。按夜间顺序，先保护再死亡是合法的；只解释与当局线索有关的效果。"},{"q":"能保护被恶魔提名并处决的人吗？","a":"不能。普通提名、处决是游戏流程，不是该恶魔的负面能力。"}],"interactions":[{"with":[],"text":"僧侣能够保护的有害效果包括：死亡，醉酒，中毒，疯狂，阵营变化，来自与该玩家（保护目标）阵营不同的恶魔对他进行的角色变化， 涡流的错误信息，等等。","kind":"detail"},{"with":[],"text":"僧侣无法保护的效果包括：复活（ 沙巴洛斯和哈迪寂亚 ），来自与该玩家（保护目标）阵营相同的恶魔对他进行的角色变化，照看小怪宝 ，成为痢蛭的寄生对象（只会让该玩家免疫中毒，但痢蛭的免死能力还是会与该玩家绑定），等等。","kind":"detail"},{"with":["利维坦"],"text":"如果利维坦提名并处决了僧侣上个夜晚保护的那名玩家，善良阵营获胜。","kind":"jinx"},{"with":["暴乱"],"text":"如果暴乱提名并处决了僧侣上个夜晚保护的那名玩家，善良阵营获胜。","kind":"jinx"}],"tips":["优先保护仍能提供关键信息的人。","记录每晚目标，别把无人死亡直接当成守中认证。"],"counterplay":["假跳者可借空刀或攻击死者制造平安夜；应对时核对守人时间线，勿要求每晚都必须守中。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成僧侣"]},"ravenkeeper":{"id":"ravenkeeper","name":"守鸦人","sourceTitle":"守鸦人","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%AE%88%E9%B8%A6%E4%BA%BA","checkedAt":"2026-11-17","ability":"如果你在夜晚死亡，你会被唤醒，然后你要选择一名玩家：你会得知他的角色。","mechanics":["如果守鸦人愿意，他可以选择一名已死亡的玩家。","早期假跳高威胁角色吸引夜刀可以是善良策略。死亡后更正自称不因此认证善良或邪恶；仍按真实守鸦及当夜有效的条件采信其反馈。"],"qa":[],"interactions":[{"with":[],"text":"守鸦人只会得知玩家的角色，不会得知玩家的阵营。 守鸦人在得知信息时会受到互动干扰类能力的影响而可能得知错误的角色。","kind":"detail"},{"with":["利维坦"],"text":"每个夜晚*，利维坦要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果守鸦人被选择，他的能力生效但不会死亡。","kind":"jinx"},{"with":["暴乱"],"text":"每个夜晚*，暴乱要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果守鸦人被选择，他的能力生效但不会死亡。","kind":"jinx"}],"tips":["可隐藏成持续信息角色争取夜死。","提前准备最能区分分支的查验对象。"],"counterplay":["夜死后才给角色查验的假跳有较大自由度；应对时核验目标和原始角色名，结合生前声明。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成守鸦人"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%AE%88%E9%B8%A6%E4%BA%BA","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%AE%88%E9%B8%A6%E4%BA%BA"]},"virgin":{"id":"virgin","name":"贞洁者","sourceTitle":"贞洁者","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E8%B4%9E%E6%B4%81%E8%80%85","checkedAt":"2026-11-17","ability":"当你首次被提名时，如果提名你的玩家是镇民，他立刻被处决。","mechanics":["只看首次被提名；即使首次没有成功处决提名者，这次机会也已消耗。","健康有效的贞洁者被镇民提名，提名者立即被处决，随后按处决流程结束白天；处决与死亡分开。","标准暗流中，经说书人确认的此触发可认证被提名者当时为有效贞洁者；提名者是真镇民或发生了合法的间谍登记，不能是真酒鬼。"],"qa":[{"q":"已经触发，能再用醉酒、中毒解释成没有真贞洁者吗？","a":"不能。失效解释的是本应发动却未发动，不是已确认成功发动。混合剧本须另查科学怪人等实际在池的能力来源。"},{"q":"成功触发就能认下提名者所有夜间信息吗？","a":"不能。其真角色、曾否投毒、是否善良穿衣服与反馈是否正常仍要逐时点核验。"}],"interactions":[{"with":[],"text":"如果提名贞洁者的玩家其镇民角色不会因为处决而死亡（如弄臣 、 水手或被恶魔代言人保护的玩家），则说书人会宣布该玩家被处决但没有死亡（不会说明具体原因），然后因为有处决发生，所以白天阶段依然会立即结束。","kind":"detail"},{"with":[],"text":"如果提名贞洁者的镇民玩家同时被女巫诅咒，则女巫的诅咒与贞洁者的处决在同一时间被触发。在这种情况下，由说书人来对以何种顺序结算这两个效果做出决定，但应该倾向于产生更多信息的结果（参考隐性规则第1条，同时触发）。因此，在大部分情况下，即使该玩家的角色是还未触发能力的弄臣 ，也建议当晚送葬者依然能够得知该玩家的角色。","kind":"detail"}],"tips":["与愿意验证身份的镇民协商首次提名。","成功触发与未触发分开盘，别浪费首次机会。"],"counterplay":["假跳者通常怕真镇民首次提名；但未触发有多种解释，不能因此直接锁定其邪恶。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成贞洁者"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E8%B4%9E%E6%B4%81%E8%80%85","https://wiki.biligame.com/jbzlbwgwjcygf/%E8%B4%9E%E6%B4%81%E8%80%85"]},"slayer":{"id":"slayer","name":"猎手","sourceTitle":"猎手","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%8C%8E%E6%89%8B","checkedAt":"2026-11-11","ability":"每局游戏限一次，你可以在白天时公开选择一名玩家：如果他是恶魔，他死亡。","mechanics":["猎手可以在白天里的任何时间选择使用他的能力，且必须在使用能力时对所有人进行宣布。如果猎手选中了恶魔，恶魔会立刻死亡。否则，无事发生。","玩家无法得知死去玩家的真实角色。毕竟，他有可能是陌客！","处于醉酒或中毒状态下且使用了自己能力的猎手将无法再次使用他的能力。","猎手通常会选择一名存活玩家。即使猎手选中了一个已死亡的小恶魔，也会无事发生，因为已死亡的玩家无法再次死亡。","玩家可以在任何时间发表任何言论，因此假装是猎手的玩家可以假装使用了猎手的能力。"],"qa":[],"interactions":[{"with":["痢蛭"],"text":"如果猎手选择了痢蛭的宿主，则宿主会死亡。","kind":"jinx"}],"tips":["先收集信息再公开开枪。","命中有强约束，未死却可能是未命中、失效或其他有效机制。"],"counterplay":["任何人都能公开声称开枪；应对时把公开死亡和“我发动了技能”的自述分开。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成猎手"]},"soldier":{"id":"soldier","name":"士兵","sourceTitle":"士兵","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%A3%AB%E5%85%B5","checkedAt":"2026-11-11","ability":"恶魔的负面能力对你无效。","mechanics":["士兵无法因为恶魔的能力而死去。因此，如果小恶魔在夜晚攻击士兵，无事发生。没有任何人会死亡。小恶魔也不能再去选择攻击另外一名玩家。","即使发起提名的玩家是恶魔，士兵仍然会因为处决而死亡。士兵的能力会保护自己不被恶魔的能力杀死，但无法保护自己被恶魔玩家的其他行为杀死。"],"qa":[],"interactions":[{"with":[],"text":"与僧侣的能力相似， 士兵能够免疫的有害效果包括：死亡，醉酒，中毒，疯狂，阵营变化，来自与自身阵营不同的恶魔对他进行的角色变化，等等。","kind":"detail"},{"with":[],"text":"士兵无法免疫的效果包括：来自与该玩家（保护目标）阵营相同的恶魔对他进行的角色变化，照看小怪宝 ，成为痢蛭的寄生对象（只会让士兵免疫中毒，但痢蛭的免死能力还是会与士兵绑定），等等。","kind":"detail"},{"with":["利维坦"],"text":"如果利维坦提名并处决了士兵，善良阵营获胜。","kind":"jinx"},{"with":["暴乱"],"text":"如果暴乱提名并处决了士兵，善良阵营获胜。","kind":"jinx"}],"tips":["可伪装成恶魔想杀的信息角色吸收攻击。","活到决赛也不等于已证明自己。"],"counterplay":["连续幸存很容易被伪装；应对时别把恶魔没有选择某人当成已验证不死。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成士兵"]},"mayor":{"id":"mayor","name":"镇长","sourceTitle":"镇长","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%95%87%E9%95%BF","checkedAt":"2026-11-11","ability":"如果只有三名玩家存活且白天没有人被处决，你的阵营获胜。 如果你在夜晚即将死亡，可能会有一名其他玩家代替你死亡。","mechanics":["为了生存，镇长偶尔会让其他玩家“意外地”被杀死。如果镇长被攻击且即将死去时，说书人可以选择另一名玩家死亡。没有人会得知该玩家的死亡原因，仅仅只是得知该玩家死亡了。","如果在某个白天结束时只有三名玩家存活，并且那个白天没有人被处决，那么游戏结束且善良阵营获胜。","旅行者的数量也会被计入镇长的胜利条件中，因此他们必须先被流放。请记住流放并不是处决。（译注：如果场上有旅行者且包含旅行者在内的存活玩家只有三名，显然此时已经达成了邪恶阵营的胜利条件。因此如果游戏还未结束，说明场上至少还有三名非旅行者玩家，此时需要先对旅行者进行流放才能满足镇长的胜利条件。）","传奇角色的数量不会被计入镇长的胜利条件中，因为说书人不是一名玩家。","如果恶魔攻击了镇长，且说书人选择了一名已死亡玩家、士兵或被僧侣保护的玩家作为替代，则当晚不会有玩家死亡。"],"qa":[],"interactions":[{"with":[],"text":"如果镇长的替死能力被触发，代替镇长死亡的角色，其死亡原因会与镇长保持一致。也就是说，如果恶魔攻击了镇长且贤者代替了镇长死亡， 贤者能够触发他的能力。在判断那些死亡触发能力的角色的死亡原因时，这一点会显得比较重要。","kind":"detail"},{"with":[],"text":"同样地，在造成死亡的这个能力中，代替镇长死亡的角色会被当作选中为该能力的目标。原本这项能力是选择镇长并生效的，改为选择“代替镇长死亡的目标”并生效（不论这项选择是能力所属的玩家做出的还是说书人做出的）。也就是说，如果月之子选择了镇长而说书人想要通过镇长的能力改为“让一名邪恶玩家代替镇长死亡”，这会导致在能力实际生效时，被当作“ 月之子在白天选中了那名邪恶玩家”而导致不满足回溯条件，从而使得月之子无法通过能力杀死任何玩家。这虽然是可行的，但镇长能力的触发选择权在说书人，过于复杂的互动方式会让玩家难以理解，且结果并不一定会容易被所有玩家接受，不如参考镇长词条运作方式中的建议。","kind":"detail"},{"with":[],"text":"虽然镇长的特殊胜利在黄昏时宣布，但镇长的特殊胜利能力触发是在白天，因此投毒者或者其他能让镇长醉酒或中毒的角色仍然会阻止镇长因为自己的能力而以特殊方式获胜。","kind":"detail"},{"with":[],"text":"特定角色互动： 数学家 ：在镇长因为失去能力或其他效果影响下无法触发“代替死亡”能力时，对于数学家获取的信息，可以+1或不变。这是由于镇长需要触发能力才能检测到能力未生效从而被数学家得知，而镇长的能力触发取决于说书人。通常来说，为了避免造成不必要的混乱，对于这类触发与否由说书人决定的能力，应该尽量以不变来告知数学家 。但特殊情况下，如果这能避免玩家过早发现恶魔，那么可以视情况决定给出什么样的信息。","kind":"detail"},{"with":["利维坦"],"text":"如果利维坦和镇长在第五天存活且没有处决发生，善良阵营获胜。（即使镇长是邪恶阵营也是如此。） 暴乱 ：镇长可以停止暴乱的提名链。如果他这样做了，并且场上只有一名暴乱存活，善良阵营获胜；否则，邪恶阵营获胜。","kind":"jinx"}],"tips":["争取活到三人并建立信任。","提议无处决前核对人数、能力有效性和其他胜负条件。"],"counterplay":["假镇长能诱使最终日放弃处决；采纳前应综合独立身份支持和各胜负机制，不能只凭声明赌胜。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成镇长"]},"butler":{"id":"butler","name":"管家","sourceTitle":"管家","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%AE%A1%E5%AE%B6","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择除你以外的一名玩家：明天白天，只有他投票时你才能投票。","mechanics":["每个夜晚，管家需要选择一名玩家来成为自己的主人。这名玩家可以是与前一夜相同的，也可以是与前一夜不同的。","如果主人在投票时举手，或主人的投票已经被统计时，管家可以举手参与投票。","如果主人放下了他的手，表明他不参与投票，或在投票被统计前将手放下，管家也必须将自己的手放下。","说书人没有监视管家的责任。管家需要为自己的投票负责。管家在不应该投票的场合下故意投票会被视为作弊。","因为角色能力不能以任何形式影响流放流程，管家可以在流放表决中自由参与表决。","已死亡的玩家只能在拥有投票标记时才能举手投票。如果管家选择了一名已死亡玩家作为主人，这种情况仍然适用。","管家的能力从不会被强制必须投票。","管家的投票可以在他主人之前或之后被说书人计票。座次顺序并不重要。"],"qa":[],"interactions":[{"with":[],"text":"即使管家作弊投票，他的票也仍然会被统计并且有效。 管家不应该，也无法用这种方式来证明自己是管家 。","kind":"detail"},{"with":[],"text":"对于管家的作弊行为，不要以“不好的事”来进行处罚，因为这样会导致游戏产生相对于正常情况的额外信息，这不利于玩家进行推理分析。“被视为作弊”其实更多地是一种基于社交上的措辞，是对于玩家不遵守游戏规则的一种客观的表达，但并不意味着作弊的玩家需要在游戏中受到处罚。如果真的有作弊的现象发生，那么跟这位玩家在游戏结束后私下好好谈谈吧。","kind":"detail"},{"with":[],"text":"对于轮盘计票方式中，主人坐在管家下家的情况而导致管家可能无法参与投票的情况，有以下几种建议： 提倡玩家养成提前举手的习惯。因为即使提前举手，也会在说书人的手指向某个玩家时，才会计算该玩家的票，提前举手也会成为一些谈判和背叛的策略。在这种情况下，如果主人提前举手了， 管家自然就能正常举手且不算做作弊。即使管家的投票被说书人统计后主人在自己的票被统计之前又把手放下， 管家的票依然会被计算且不算作弊。 对于线上游戏，很难在短时间内观察主人的举手情况并做出反馈时，建议以以下方式进行互动： 管家玩家可以在交流阶段公开声明自己是管家 ，并询问主人自己可以参与针对哪些玩家的提名投票，向主人寻求建议。","kind":"detail"},{"with":["食人族"],"text":"如果食人族获得了管家的能力，他会得知这一信息。","kind":"jinx"},{"with":["街头风琴手"],"text":"如果街头风琴手使得玩家需要闭眼投票，管家可以自由举手投票，但只在他的主人投票时他的票才会被统计。","kind":"jinx"}],"tips":["每晚记主人，投票前确认主人是否投票。","可以参与讨论和提名，不要把投票限制当查验。"],"counterplay":["假跳者也能模仿投票限制；应对时观察只是辅助，不把遵守限制当角色证明。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成管家"]},"drunk":{"id":"drunk","name":"酒鬼","sourceTitle":"酒鬼","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E9%85%92%E9%AC%BC","checkedAt":"2026-11-17","ability":"你不知道你是酒鬼。你以为你是一个镇民角色，但其实你不是。","mechanics":["说书人知道哪位镇民实际上是酒鬼，而酒鬼玩家无从得知。","酒鬼没有任何能力。不论他获得的镇民标记是否会以某些方式影响游戏，酒鬼却无法使用这一镇民能力。然而，说书人会装作酒鬼玩家是他以为的那种镇民。如果那个镇民会在夜晚醒来，酒鬼同样会被唤醒并如同那个镇民的方式进行行动。"],"qa":[],"interactions":[{"with":[],"text":"如果酒鬼醉酒或中毒，他不会有任何变化。属于认知覆盖类的能力不会因为醉酒或中毒失效。一旦玩家成为了酒鬼这个角色，玩家会始终认为自己是镇民（除非玩家通过推理分析得出自己实际上是酒鬼 ）。","kind":"detail"},{"with":[],"text":"认知覆盖类能力的角色只要还是这个角色，说书人就能对其进行合理的欺骗，但前提条件是需要让他持续认为自己是满足自己当前角色“认知范围”内的角色，且无法对“认知范围”以外的内容进行欺骗。例如，说书人无法欺骗一个未转变阵营的酒鬼说他的阵营发生了变化。但是，如果有邪恶玩家声称自己是农夫且在夜晚死亡，说书人能够欺骗酒鬼并告诉他他变成了农夫 ，因为农夫仍然是一个镇民角色，这满足酒鬼的“认知范围”。","kind":"detail"},{"with":[],"text":"特定角色互动： 咖啡师 ：咖啡师的“清醒且健康”效果能够让能获取信息的酒鬼在生效期间内获得正确信息。","kind":"detail"},{"with":["数学家"],"text":"数学家会得知酒鬼产生了错误信息或“能力未正常生效”。","kind":"jinx"},{"with":["科学怪人"],"text":"恶魔无法拥有酒鬼的能力。","kind":"jinx"}],"tips":["比对多晚信息与已证实事件，寻找持续矛盾。","单条信息碰巧正确不能排除酒鬼。"],"counterplay":["“我可能是酒鬼”既可能是真诚修正，也可能是伪装退路；需用名额与其他失真来源分支判断。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成酒鬼"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E9%85%92%E9%AC%BC","https://wiki.biligame.com/jbzlbwgwjcygf/%E9%85%92%E9%AC%BC"]},"recluse":{"id":"recluse","name":"陌客","sourceTitle":"陌客","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E9%99%8C%E5%AE%A2","checkedAt":"2026-11-17","ability":"你可能会被当作邪恶阵营、爪牙角色或恶魔角色，即使你已死亡。","mechanics":["任何时候要探查陌客的阵营时，由说书人来决定陌客被当作善良还是邪恶。","任何时候陌客被影响特定的爪牙或恶魔角色的能力选择时，由说书人来决定陌客是否会被当作某种特定的爪牙或是恶魔角色。","陌客能在同一个夜晚的不同能力中分别被当作善良或邪恶阵营，外来者、爪牙或恶魔角色。由说书人来选择最有趣的结果。","陌客在被当作特定的爪牙或恶魔角色时，不会获得这一角色的能力。"],"qa":[],"interactions":[{"with":[],"text":"陌客的互动干扰能力中，阵营与角色是独立判断的。也就是说，如果有既能探查阵营也能探查角色的能力，那么陌客是有可能被当作“善良的恶魔”或者是“邪恶的陌客”的（如舞蛇人和食人族 ）。","kind":"detail"},{"with":["贤者"],"text":"陌客可能会被贤者当作杀死他的恶魔。","kind":"jinx"},{"with":["食人魔"],"text":"如果陌客被食人魔当作邪恶阵营，食人魔会得知自己转变为邪恶。","kind":"jinx"}],"tips":["适时说明可能误登记，帮助解释异常查验。","“可能登记邪恶”不等于每次都登记邪恶。"],"counterplay":["邪恶可用陌客解释被查红；应对时保留真陌客、假跳与当次登记的不同分支。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成陌客"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E9%99%8C%E5%AE%A2","https://wiki.biligame.com/jbzlbwgwjcygf/%E9%99%8C%E5%AE%A2"]},"saint":{"id":"saint","name":"圣徒","sourceTitle":"圣徒","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%9C%A3%E5%BE%92","checkedAt":"2026-11-17","ability":"如果你死于处决，你的阵营落败。","mechanics":["如果圣徒因处决而死亡，游戏结束。善良阵营落败，邪恶阵营获胜。","如果圣徒因处决以外的任何方式死亡——例如被恶魔杀死——游戏仍会继续。"],"qa":[],"interactions":[{"with":[],"text":"特定角色互动： 小怪宝 ：照看小怪宝的圣徒如果作为场上最后一名存活的恶魔被处决，善良阵营会获胜。","kind":"detail"}],"tips":["争取可信同伴支持并避免正常能力下的处决死亡。","夜死不触发圣徒败北。"],"counterplay":["邪恶可借处决风险自保；需要验证声明与外来者名额，不能既不查也永远不处理。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成圣徒"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%9C%A3%E5%BE%92","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%9C%A3%E5%BE%92"]},"poisoner":{"id":"poisoner","name":"投毒者","sourceTitle":"投毒者","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%8A%95%E6%AF%92%E8%80%85","checkedAt":"2026-11-17","ability":"每个夜晚，你要选择一名玩家：他在当晚和明天白天中毒。","mechanics":["每个夜晚，投毒者会选择一名玩家在当晚的剩余时间和接下来的一整个白天阶段里中毒。","中毒的玩家会失去能力，但说书人会装作他仍具有能力。他的能力不会真实地影响游戏。如果中毒玩家的角色能力能够获取信息，说书人可以给他提供错误信息。","如果一名中毒的玩家在他中毒的期间里使用了“每局游戏限一次”的能力，他无法再次使用这项能力。"],"qa":[],"interactions":[{"with":[],"text":"虽然投毒者的能力描述中，中毒的持续时间看似与水手和旅店老板等有所差别，但实际上这只是为了新手玩家便于理解，而不用特意引出“黄昏”这个概念。实际上， 投毒者的能力描述同样可以写为：“每个夜晚，你要选择一名玩家：他会中毒到下个黄昏。”","kind":"detail"}],"tips":["结合夜间顺序与信息价值选择目标，和恶魔分工。","投毒不保证一定产生假信息。"],"counterplay":["应对时给每次失真明确毒位、时点和容量；一名投毒者不能在同夜任意解释多人异常。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗投毒者"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%8A%95%E6%AF%92%E8%80%85","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%8A%95%E6%AF%92%E8%80%85"]},"spy":{"id":"spy","name":"间谍","sourceTitle":"间谍","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E9%97%B4%E8%B0%8D","checkedAt":"2026-11-17","ability":"每个夜晚，你能查看魔典。 你可能会被当作善良阵营、镇民角色或外来者角色，即使你已死亡。","mechanics":["如果任何角色的能力会探查或影响善良玩家，间谍可能会被那名角色当作善良阵营。如果任何角色的能力会探查或影响镇民角色或外来者角色，间谍可能会被那名角色当作是一个特定的镇民或外来者角色。由说书人来决定间谍被当作什么，在同一个夜晚间谍能被多次当作不同阵营或不同的角色。","间谍在被当作特定的镇民或外来者角色时，不会获得这一角色的能力。例如，被当作猎手的间谍无法猎杀恶魔。","角色与阵营可分别登记，登记不授予被登记角色的能力。保护、阵营检测或角色检测中是否允许误登记须分别核验，不把一次登记推广到整晚所有能力。"],"qa":[],"interactions":[{"with":[],"text":"邪恶玩家之间的交流需要玩家自己自发进行，而且需要让善良玩家有迹可循。","kind":"detail"},{"with":[],"text":"间谍的互动干扰能力中，阵营与角色是独立判断的。也就是说，如果有既能探查阵营也能探查角色的能力，那么间谍是有可能被当作“善良的间谍”或者是“邪恶的镇民”的（如食人族 ）。","kind":"detail"},{"with":[],"text":"养成良好的魔典使用习惯非常重要。这不仅仅是在有间谍或是寡妇的时候能确保他们获得正确的信息，也是对说书人记录繁杂的游戏信息并确保各项处理结算无误的重要支撑。在线上游戏中， 间谍不应该也无法看到说书人做的任何自定义笔记。","kind":"detail"},{"with":[],"text":"如果说书人选择在展示完后放回剧本盒，则间谍无法看到这一信息。","kind":"detail"},{"with":[],"text":"仅在暗流涌动这一剧本的实体版本中， 间谍的夜晚顺序位于投毒者 （首夜）和僧侣 （非首夜）之后（与常规顺序的区别在于，不会看到小恶魔的“死亡”标记和管家的“主人”标记，且在小恶魔自杀的那个夜晚，自己变成小恶魔之前仍能查看魔典）。这是为了避免新人玩家在一开始接触到间谍这一需要处理大量信息的角色显得棘手，而避免了冗杂信息的发生。同时也给出了足够的时间允许间谍在入睡后继续进行思考。","kind":"detail"},{"with":[],"text":"查看魔典也属于“ 获取信息 ”。如果间谍醉酒或中毒，说书人对他展示的魔典内容可能会是错误的。","kind":"detail"},{"with":["炼金术士"],"text":"如果炼金术士本应获得间谍的能力，那么他不会拥有该能力并改为间谍一定在场。每次处决后，存活的炼金术士可以公开猜测一名存活玩家是间谍：如果猜对了，恶魔当晚必须选择间谍。","kind":"jinx"},{"with":["罂粟种植者"],"text":"如果罂粟种植者拥有能力，间谍无法查看魔典。","kind":"jinx"},{"with":["落难少女"],"text":"如果间谍正在场或曾经在场，落难少女中毒。","kind":"jinx"},{"with":["异端分子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["瘟疫医生"],"text":"如果说书人本应获得间谍的能力，改为一名爪牙玩家获得此能力，且他会得知此事。","kind":"jinx"},{"with":["食人魔"],"text":"间谍必定被食人魔当作邪恶阵营。","kind":"jinx"},{"with":["戏子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["戏子（改）"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"}],"tips":["记住魔典中的真实角色和提示，帮助队友选伪装与目标。","利用登记能力时也要符合该次交互。"],"counterplay":["能复述准确秘密信息仍不自动善良；在间谍可能在场时，用相互确认建立的信任也要保留登记分支。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗间谍"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E9%97%B4%E8%B0%8D","https://wiki.biligame.com/jbzlbwgwjcygf/%E9%97%B4%E8%B0%8D"]},"scarlet_woman":{"id":"scarlet_woman","name":"猩红女郎","sourceTitle":"红唇女郎","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%BA%A2%E5%94%87%E5%A5%B3%E9%83%8E","checkedAt":"2026-11-11","ability":"如果大于等于五名玩家存活时（旅行者不计算在内）恶魔死亡，你变成那个恶魔。","mechanics":["如果在恶魔死前有五名或更多的玩家存活；或者说，如果在恶魔死后有四名或更多的玩家存活，那么猩红女郎会立刻变成恶魔，游戏会如同恶魔尚未死亡一样继续进行。","当猩红女郎的能力触发时，旅行者的数量不会计算在内。","如果在恶魔被处决时少于五名玩家存活，游戏会结束，并且善良阵营获胜。","如果在小恶魔选择自杀时，有五名或更多的玩家存活，必须是由猩红女郎来变成新的小恶魔。（前提是，猩红女郎此时能力正常生效）","如果猩红女郎变成了恶魔，她在各种意义上都会成为恶魔。如果她被处决，善良阵营会获胜。她会在每个晚上攻击玩家。她被当作恶魔。"],"qa":[],"interactions":[{"with":[],"text":"特定角色互动： 痢蛭 ：当宿主死亡时，如果在宿主死亡之前，场上除旅行者外存活玩家人数为5人， 猩红女郎不会因此变成痢蛭 。因为在痢蛭死亡时，场上的存活玩家的人数已经不足5人。（宿主与痢蛭的死亡并非同时进行的）","kind":"detail"},{"with":["瘟疫医生"],"text":"如果说书人本应获得猩红女郎的能力，改为一名爪牙玩家获得此能力，且他会得知此事。","kind":"jinx"},{"with":["哈迪寂亚"],"text":"如果即将出现两名存活的恶魔，其中之一是由猩红女郎转变的，则猩红女郎变成的恶魔会变回猩红女郎。","kind":"jinx"},{"with":["小怪宝"],"text":"如果在五名及以上的玩家存活时照看小怪宝的玩家死亡，之后猩红女郎必须要一直照看小怪宝。","kind":"jinx"},{"with":["方古"],"text":"如果即将出现两名存活的恶魔，其中之一是由猩红女郎转变的，猩红女郎不会变成恶魔。","kind":"jinx"},{"with":["梼杌"],"text":"猩红女郎在梼杌的能力判断中被当作“不具有能力”。","kind":"jinx"},{"with":["入殓师"],"text":"如果即将出现两名存活的恶魔，其中之一是由猩红女郎转变的，猩红女郎不会变成恶魔。","kind":"jinx"},{"with":["孟婆"],"text":"如果恶魔选择死亡且猩红女郎即将变成恶魔，改为恶魔与猩红女郎交换角色，随后原恶魔死亡。","kind":"jinx"}],"tips":["尽量在接位条件仍满足时存活。","与恶魔协调，记录接位前后时点，别提前暴露后备身份。"],"counterplay":["白天成功处决原恶魔后游戏未结束可能是接位；不能继续用接位前的阴性信息排除新恶魔。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗红唇女郎"]},"baron":{"id":"baron","name":"男爵","sourceTitle":"男爵","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E7%94%B7%E7%88%B5","checkedAt":"2026-11-17","ability":"会有额外的外来者在场。[+2 外来者]","mechanics":["增加的外来者角色总是会替换掉原本的镇民角色，而不是其他角色类型。"],"qa":[],"interactions":[{"with":["瘟疫医生"],"text":"如果说书人获得了男爵的能力，改为至多两名玩家会变成外来者。","kind":"jinx"},{"with":["异端分子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"}],"tips":["设置已生效后可承担较高风险，制造互不兼容的外来者声明。","自己死亡不撤回额外名额。"],"counterplay":["外来者声明超额也可能来自假跳；应对时逐分支计算真实外来者，不能直接由报身份数确认男爵。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗男爵"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E7%94%B7%E7%88%B5","https://wiki.biligame.com/jbzlbwgwjcygf/%E7%94%B7%E7%88%B5"]},"imp":{"id":"imp","name":"小恶魔","sourceTitle":"小恶魔","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%B0%8F%E6%81%B6%E9%AD%94","checkedAt":"2026-11-17","ability":"每个夜晚*，你要选择一名玩家：他死亡。如果你以这种方式自杀，一名爪牙会变成小恶魔。","mechanics":["除首个夜晚以外的每个夜晚，小恶魔会选择一名玩家进行杀戮。因为夜间大多数角色都在恶魔之后行动，被恶魔杀死的玩家可能在当晚无法使用他的能力。","小恶魔作为恶魔，能够得知哪些玩家是他的爪牙，也能得知三个不在场的善良角色，他能较为安全地伪装成这些角色。","如果小恶魔死亡，游戏结束且善良阵营获胜。然而，如果小恶魔选择在夜晚杀死自己，他会死亡并且会有一名存活的爪牙变成小恶魔。新的小恶魔在当晚无法进行行动，但现在那名爪牙现在在各种意义上都会成为恶魔——他会在此后的每个夜晚杀戮，且会在死亡时让邪恶阵营落败。"],"qa":[],"interactions":[],"tips":["自刀前确认活爪牙、女郎和接位条件。","白天处决自己通常不会像夜间自杀一样传位。"],"counterplay":["夜死者可能是自刀传位后的原恶魔；有收益的自刀线要保留，但不应无依据压过普通刀口。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","对抗小恶魔"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%B0%8F%E6%81%B6%E9%AD%94","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%B0%8F%E6%81%B6%E9%AD%94"]},"bureaucrat":{"id":"bureaucrat","name":"官员","sourceTitle":"官员","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%AE%98%E5%91%98","checkedAt":"2026-11-17","ability":"每个夜晚，你要选择除你以外的一名玩家：明天白天，他的投票算作三票。","mechanics":["当一名玩家被官员选中时，他的投票会被算作3票。该名玩家当天的所有投票都以这种方式结算。","官员死后或者被流放后，会失去他的能力，被官员选择的玩家会立刻恢复为计1票。","流放表决不会受到能力的影响，因此被官员选择的玩家在流放表决中正常计票，而不是计3票。","因为说书人会在人群中转圈计票并同时唱票，所有的玩家会立刻得知哪名玩家被官员选中了。"],"qa":[],"interactions":[],"tips":["把额外票交给阵营判断较可靠的人。","投票权重不是身份认证。"],"counterplay":["被加票者可以是任意阵营；应对时核对实际票权，不据此认证官员立场。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%AE%98%E5%91%98","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%AE%98%E5%91%98"]},"beggar":{"id":"beggar","name":"乞丐","sourceTitle":"乞丐","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E4%B9%9E%E4%B8%90","checkedAt":"2026-11-17","ability":"你只能使用投票标记才能投票。 死亡的玩家可以将他的投票标记给你，如果他这么做，你会得知他的阵营。 你不会中毒和醉酒。","mechanics":["乞丐在投票时全程不能举手，除非乞丐有投票标记。","当乞丐投票时，乞丐会失去一个投票标记。如果乞丐拥有多个投票标记，每次投票只能使用一个。","只有已死亡的玩家能够提供给乞丐投票标记，一旦这么做，已死亡的玩家就不能再进行投票。每个已死亡的玩家都由自己决定是否把投票标记提供给乞丐。包括乞丐在内的所有人都不能随意移动他人的投票标记。","当一名玩家将他的投票标记提供给乞丐时，乞丐会得知这名玩家是善良的还是邪恶的。","乞丐能够发起提名、可以进行流放表决，因为流放不受角色能力影响。","当乞丐死亡时会和其他角色一样，获得一个投票标记。然而乞丐会失去在这之前获得的所有投票标记。","将投票标记给予他人是源于乞丐角色独有的能力。无论乞丐角色是否在场，玩家都不能将自己的投票标记提供给一名不是乞丐的角色。"],"qa":[],"interactions":[],"tips":["主动与死者讨论是否交出投票标记。","记录实际获得的信息，别把拒绝交票当成邪恶证据。"],"counterplay":["交出投票标记提供的是技能规定的信息；应对时分开真实反馈与玩家公开声称自己交了票。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E4%B9%9E%E4%B8%90","https://wiki.biligame.com/jbzlbwgwjcygf/%E4%B9%9E%E4%B8%90"]},"gunslinger":{"id":"gunslinger","name":"枪手","sourceTitle":"枪手","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%9E%AA%E6%89%8B","checkedAt":"2026-11-11","ability":"每个白天，当首次投票被统计后，你可以选择一名刚投过票的玩家：他死亡。","mechanics":["每个白天，在首次投票被统计后，枪手可以公开选择一名刚投过票的玩家，这名玩家会立刻死亡。枪手不一定非得杀死一名玩家——这完全取决于枪手。不管枪手是否在每一天的首次投票过后使用能力，枪手都无法在那之后杀死其他玩家。","枪手需要主动使用能力，自行确认使用能力的时机告知说书人，并宣布自己的选择。","流放表决不会受到能力的影响，因此枪手不能将他的能力用在那些支持流放表决的人身上。"],"qa":[],"interactions":[],"tips":["先看清本次谁真正投票，再决定是否开枪。","晚些使用可获得更多判断依据。"],"counterplay":["应对时注意首轮投票的开枪风险；枪手选择杀谁本身只是阵营倾向。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"]},"thief":{"id":"thief","name":"窃贼","sourceTitle":"窃贼","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%AA%83%E8%B4%BC","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择除你以外的一名玩家：明天白天他的投票会被算作负数。","mechanics":["当一名被窃贼选中的玩家进行投票时，票数会以负数形式被统计。该名玩家当天的所有投票都以这种方式结算。","窃贼死后或者被流放后，会失去他的能力，被窃贼偷取票数的玩家会立刻恢复为正数计票。","流放表决不会受到能力的影响，被以负数计票的玩家在进行流放表决时不会受到窃贼的能力影响。","因为说书人会在人群中转圈计票并同时唱票，所有的玩家会立刻得知哪名玩家被窃贼选中了。"],"qa":[],"interactions":[],"tips":["选择可能带偏处决的投票者，记下负票影响。","不要仅因某人被你选择就判断阵营。"],"counterplay":["应对时先重算真实票数，再解读投票行为；负票不代表被选者邪恶。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"]},"scapegoat":{"id":"scapegoat","name":"替罪羊","sourceTitle":"替罪羊","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%9B%BF%E7%BD%AA%E7%BE%8A","checkedAt":"2026-11-11","ability":"如果你的阵营的一名玩家被处决，你可能会代替他被处决。","mechanics":["如果替罪羊是邪恶的，替罪羊可能会替一名邪恶玩家死亡。如果替罪羊是善良的，替罪羊可能会替一名善良玩家死亡。至于这种情况会不会发生就全靠说书人决定了。这个能力只有在玩家被处决时才可能会被触发，而不是其他的死亡方式，例如被恶魔或猎手杀死。","替罪羊因他的能力被杀死会算作是一次处决，所以当天不再会有额外的处决。","如同常规规则一样，玩家无法在替罪羊死亡后得知他的阵营。"],"qa":[],"interactions":[],"tips":["在关键处决前考虑是否值得代死。","替代对象体现说书人的判断，不直接认证双方。"],"counterplay":["替代处决死亡可能改变技能触发；应对时分别记录原被处决者、实际死亡者及先后。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"]},"clockmaker":{"id":"clockmaker","name":"钟表匠","sourceTitle":"钟表匠","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%92%9F%E8%A1%A8%E5%8C%A0","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你会得知恶魔与爪牙之间最近的距离。（邻座的玩家距离为1）","mechanics":["钟表匠只在第一个夜晚得知该信息。","距离指代恶魔与爪牙之间坐着的玩家数量，从恶魔旁边的玩家开始，到最近的爪牙结束，顺时针或逆时针均可。"],"qa":[],"interactions":[{"with":[],"text":"这意味着钟表匠得知的信息可能会与游戏初始时的情况有所不同，因为有一些角色的能力能够在游戏的过程中改变玩家的角色（如麻脸巫婆和理发师等）。","kind":"detail"},{"with":[],"text":"钟表匠在获得信息时，说书人需要每次抽取两名玩家（其中一名为恶魔，另一名为爪牙，必须是两名不同的玩家）进行距离计算，直到将场上所有的“恶魔-爪牙”组合遍历完毕。这一过程类似于厨师 ，会进行多次判断，因此某些角色可能会在不同的玩家组合中被当作为不同的结果（如间谍 、 陌客 、照看小怪宝的爪牙等）。最后，说书人会将这些距离值中的最小值作为信息提供给钟表匠 。","kind":"detail"},{"with":[],"text":"在计算距离时，距离值等同于：恶魔与爪牙这两名玩家之间的玩家数量+1。因此， 钟表匠能得知的最小数字为“1”。（然而，在极端情况下，如果场上缺乏某种类型的角色，如无恶魔或无爪牙的时候，钟表匠会得知“0”。）","kind":"detail"},{"with":[],"text":"在抽取两名玩家的组合时，即使是已死亡的玩家也依然会被钟表匠进行探查。","kind":"detail"},{"with":["召唤师"],"text":"召唤师会被钟表匠当作恶魔。","kind":"jinx"}],"tips":["先找可信的爪牙位置，再用最近距离约束恶魔。","保留首夜时点和可能误登记分支。"],"counterplay":["假距离可能刻意保护恶魔；应对时用所有候选爪牙检查最近距离，不只验证一对。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成钟表匠"]},"dreamer":{"id":"dreamer","name":"筑梦师","sourceTitle":"筑梦师","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E7%AD%91%E6%A2%A6%E5%B8%88","checkedAt":"2026-11-17","ability":"每个夜晚，你要选择除你及旅行者以外的一名玩家：你会得知一个善良角色和一个邪恶角色，该玩家是其中一个角色。","mechanics":["每个夜晚，筑梦师需要选择一名其他玩家，并得知一个善良角色与一个邪恶角色，其中一个是那名玩家的真实角色。","如果筑梦师选择的玩家是镇民或外来者，对应的错误的邪恶角色可以是爪牙或恶魔。如果筑梦师选择的玩家是爪牙或恶魔，对应的错误的善良角色可以是镇民或外来者。","筑梦师不能选择自己和旅行者作为目标。"],"qa":[],"interactions":[],"tips":["尽量在目标报角色前记下善恶两选项。","比对独立声明，别只看善良选项。","原始两角色及目标一起保留；假跳者也可报中真实角色，重复报准不自动认证善良。"],"counterplay":["假跳可先查队友互相配合；应对时重视独立、提前给出的角色选项，也保留善良穿衣服。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成筑梦师"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E7%AD%91%E6%A2%A6%E5%B8%88","https://wiki.biligame.com/jbzlbwgwjcygf/%E7%AD%91%E6%A2%A6%E5%B8%88"]},"snake_charmer":{"id":"snake_charmer","name":"舞蛇人","sourceTitle":"舞蛇人","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E8%88%9E%E8%9B%87%E4%BA%BA","checkedAt":"2026-11-17","ability":"每个夜晚，你要选择一名存活的玩家：如果你选中了恶魔，你和他交换角色和阵营，然后他中毒。","mechanics":["每晚选择一名存活玩家，可选择自己；选中恶魔时，双方交换角色和阵营，原恶魔成为中毒的舞蛇人。","未换位只对当次选择时点的恶魔身份提供条件信息；不能排除目标后来成为恶魔。","获得舞蛇人能力的哲学家若换中恶魔，原恶魔成为中毒的哲学家；获得能力不等于原本就是真舞蛇人。"],"qa":[],"interactions":[{"with":["梼杌"],"text":"如果梼杌的角色发生了交换，因为梼杌失去能力的爪牙依然失去能力。","kind":"jinx"}],"tips":["可反复选少数人降低后期转邪风险。","一旦交换，应按新阵营行动，旧恶魔信息属于旧时点。","公开或私下提供查验记录时注明夜次，区分换位前的真实经历与换位后的阵营动机。"],"counterplay":["恶魔可谎称自己被换成善良舞蛇人；应对时追问原先选择和通知时点，不能直接认下其旧队友名单。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成舞蛇人"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E8%88%9E%E8%9B%87%E4%BA%BA","https://wiki.biligame.com/jbzlbwgwjcygf/%E8%88%9E%E8%9B%87%E4%BA%BA"]},"mathematician":{"id":"mathematician","name":"数学家","sourceTitle":"数学家","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%95%B0%E5%AD%A6%E5%AE%B6","checkedAt":"2026-11-11","ability":"每个夜晚，你会得知有多少名玩家的能力因为其他角色的能力而未正常生效。（从上个黎明到你被唤醒时）","mechanics":["当一个角色的能力受到其他角色的影响而无法按预期方式发挥作用时，数学家会得知这些异常的发生。如果由于其他角色的影响使得一名玩家获得一条本应正确，实则错误的信息时，或者本应产生效果的角色能力没有生效时，数学家就会得知这些情况。","数学家不会得知异常发生在哪名玩家身上，只会得知异常在多少名玩家身上发生了。","数学家的能力不会检测数学家自身是否未正常生效。","数学家不会检测中毒和醉酒这些状态本身，而是检测因为中毒和醉酒而导致的没有按照预期发挥作用的能力。陌客被厨师当作了邪恶玩家，中毒的士兵被小恶魔杀死，此类情况会被数学家检测到。中毒的共情者获取了正确信息则不会被检测到。"],"qa":[{"q":"中毒或醉酒一个人，就一定加一吗？","a":"不是。看其能力是否因其他角色实际未正常生效；失真反馈碰巧正确通常不计。同一人多次异常也只计一次。"},{"q":"特殊相克是否始终生效？","a":"仅在对应组合及本局裁定下适用；例如重见天日明确移除了与酒鬼、疯子的相克，不得补回来。"}],"interactions":[{"with":["侍女"],"text":"侍女会得知数学家是否醒来，即使她是在数学家之前醒来。","kind":"jinx"},{"with":["疯子"],"text":"数学家会得知疯子是否攻击了与真正的恶魔不同的目标。","kind":"jinx"},{"with":["酒鬼"],"text":"数学家会得知酒鬼产生了错误信息或“能力未正常生效”。","kind":"jinx"},{"with":["提线木偶"],"text":"数学家会得知提线木偶产生了错误信息或“能力未正常生效”。","kind":"jinx"},{"with":["悟道者"],"text":"数学家会得知悟道者产生了错误信息或“能力未正常生效”。","kind":"jinx"},{"with":["引路人"],"text":"引路人会得知数学家是否被影响，即使他是在数学家之前醒来。","kind":"jinx"}],"tips":["收齐当日行动与反馈，逐项找真正未正常生效的能力。","醉毒人数不等于数学家数字。"],"counterplay":["假数字可无差别制造醉毒怀疑；应对时要求能具体对应到异常，而非无限泛化能力失效。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成数学家"]},"flowergirl":{"id":"flowergirl","name":"卖花女孩","sourceTitle":"卖花女孩","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%8D%96%E8%8A%B1%E5%A5%B3%E5%AD%A9","checkedAt":"2026-11-17","ability":"每个夜晚*，你会得知在今天白天时是否有恶魔投过票。","mechanics":["卖花女孩的能力不会检测到恶魔玩家因为其他的原因而举手表决。例如恶魔玩家举手“投票”选择晚餐吃什么，或者恶魔玩家举手赞成流放旅行者，都不会被卖花女孩的能力检测到。","如果在原恶魔投票之后，卖花女孩得知该信息之前，恶魔玩家发生了改变，卖花女孩的能力还是会检测到原恶魔是否投票。","如果有两名或更多的恶魔玩家在场，卖花女孩的能力都会检测他们当中是否有任一恶魔投票，即使那些死去的恶魔也能检测到。哪怕只有一名恶魔玩家投票，卖花女孩得知的信息都是“是”。","只检测白天正式提名处决投票，不检测旅行者流放等其他举手。恶魔投票后再换位，仍应按投票发生当时的角色身份判断；有多个恶魔时任一恶魔投过票都可产生肯定结果。"],"qa":[],"interactions":[],"tips":["自己记全日投票名单与是否完整。","“否”也只限制对应时点的恶魔，不排爪牙。","优先记完整投票者集合；名单不完整时，不能拿一个否结果把未记录的玩家一并排除。"],"counterplay":["假报反馈须与完整投票集合相容；应对时优先补齐漏票，不把没记到的票算未投。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成卖花女孩"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%8D%96%E8%8A%B1%E5%A5%B3%E5%AD%A9","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%8D%96%E8%8A%B1%E5%A5%B3%E5%AD%A9"]},"town_crier":{"id":"town_crier","name":"城镇公告员","sourceTitle":"城镇公告员","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%9F%8E%E9%95%87%E5%85%AC%E5%91%8A%E5%91%98","checkedAt":"2026-11-11","ability":"每个夜晚*，你会得知在今天白天时是否有爪牙发起过提名。","mechanics":["每个夜晚，城镇公告员都会得知“是”或“否”。","他不会得知哪些玩家是爪牙或有多少爪牙进行了提名，只会得知今天白天是否有爪牙发起了提名。"],"qa":[],"interactions":[],"tips":["记录发起提名者而非被提名者。","分批让不同人提名，才能缩小爪牙范围。"],"counterplay":["假“是”可把多个提名者拖入嫌疑；应对时比较逐日提名集合，并保留爪牙后来转角色。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成城镇公告员"]},"oracle":{"id":"oracle","name":"神谕者","sourceTitle":"神谕者","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%A5%9E%E8%B0%95%E8%80%85","checkedAt":"2026-11-11","ability":"每个夜晚*，你会得知有多少名死亡的玩家是邪恶的。","mechanics":["由于神谕者每晚在恶魔之后行动，所以神谕者的信息以当晚黎明时的状态为基准，他得知的是在所有玩家都睁开眼睛时，死亡的邪恶玩家数量。","神谕者能力能检测死去的爪牙和恶魔，以及任何属于邪恶阵营的玩家。例如邪恶的旅行者，或者变得邪恶的镇民或外来者。"],"qa":[],"interactions":[],"tips":["将每晚数字变化与新增死者对照。","基于真角色和正常信息的“0”才约束全部当时死者。"],"counterplay":["假报增量能抹黑死者；应对时比较两次反馈间所有死亡与阵营变化，而不只看处决。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成神谕者"]},"savant":{"id":"savant","name":"博学者","sourceTitle":"博学者","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%8D%9A%E5%AD%A6%E8%80%85","checkedAt":"2026-11-17","ability":"每个白天，你可以私下询问说书人以得知两条信息：一个是正确的，一个是错误的。","mechanics":["每次正常获得的一对信息恰好一真一假；不同日期的配对分别处理，不把所有句子混成一组。","醉毒时不再保证恰好一真一假；完整保留两句话，只有决定性的歧义才补问。"],"qa":[],"interactions":[{"with":[],"text":"博学者在中文社区内的“谜题”式信息方式引起了设计师的兴趣，对于“是否应该给博学者提供谜题类信息”，设计师的回复如下（原文翻译）：“从规则上来讲，给出这样的信息是不允许的，因为这种含糊不清的内容并不能算是‘正确’或是‘错误’的信息。然而，如果说书人愿意以这样的方式给出信息，也没有任何问题。因为这允许了新人玩家在伪装自己是博学者时有更为宽松的要求——他们不需要编造明显正确或是错误的信息便能成功地伪装。说书人能够在一定限度内去‘犯一些错’，而这会使得玩家们也因此在伪装上更为容易。编造谜题也会让游戏变得更加有趣。”","kind":"detail"},{"with":[],"text":"如果你在作为说书人时想要给出谜题类的信息，那么你需要注意适时给出更为严肃的信息来“以假乱真”，或是适当协助邪恶玩家进行一些谜题的伪造，来帮助他们显得更像是真正从你这里获得了谜题类信息一样。","kind":"detail"}],"tips":["两条原文成对记录。","先分别假设一真一假，再用其他信息淘汰矛盾分支。"],"counterplay":["伪装可混入一真一假的简单句取得信任；应对时先核对原文，不把玩家自己改写的谜题解释当硬规则。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成博学者"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%8D%9A%E5%AD%A6%E8%80%85","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%8D%9A%E5%AD%A6%E8%80%85"]},"seamstress":{"id":"seamstress","name":"女裁缝","sourceTitle":"女裁缝","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%A5%B3%E8%A3%81%E7%BC%9D","checkedAt":"2026-11-11","ability":"每局游戏限一次，在夜晚时，你可以选择除你以外的两名玩家：你会得知他们是否为同一阵营。","mechanics":["女裁缝每场游戏只能得到一次信息，所以女裁缝最好是选择最佳时机来使用能力，还要选择最关键的玩家。","女裁缝可以选择除自己外的任何玩家，无论他是生是死，甚至可以选择旅行者。"],"qa":[],"interactions":[],"tips":["选能区分当前主要分支的两人，或一名较可信者与疑点者。","同阵营不等于都善良。"],"counterplay":["假报不同阵营会制造对立；应对时两种阵营关系分别与其他信息联立，不机械二选一处决。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成女裁缝"]},"philosopher":{"id":"philosopher","name":"哲学家","sourceTitle":"哲学家","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%93%B2%E5%AD%A6%E5%AE%B6","checkedAt":"2026-11-17","ability":"每局游戏限一次，在夜晚时，你可以选择一个善良角色：你获得该角色的能力。 如果这个角色在场，他醉酒。","mechanics":["每局限一次，获得一个善良角色的能力，真实角色仍为哲学家；不能把所获能力再占一个该角色的起始名额。","所选角色在场时其中一名对应玩家醉酒；之后该角色才入场也可能受到此影响。哲学家死亡或失能时，其造成的醉酒不继续生效。","获得首夜能力可在获得能力的当夜使用；持续信息要按实际获得时间与行动顺序判断。","原角色醉酒时反馈仍可能碰巧正确；两份信息相同不能认证没有醉酒，也不能由信息未变直接认定有人邪恶。"],"qa":[],"interactions":[{"with":[],"text":"与侍臣相似的是，如果哲学家所选择的角色的在场数量超过1人，那么哲学家的能力只会使得其中一名玩家醉酒。","kind":"detail"},{"with":["赏金猎人"],"text":"如果哲学家获得了赏金猎人的能力，可能会有一名镇民玩家转变为邪恶。","kind":"jinx"}],"tips":["按本局缺口选能力，尽量避免让强力在场角色醉酒。","记录获得能力的时间。","记录获得哪项能力及首次生效夜；辨别真哲学家、假跳解释矛盾，以及真实信息角色被其能力影响的情况。"],"counterplay":["“我选了你的能力”可被用来解释别人的异常；应对时先确认声明时点，不能反向认证所有异常。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成哲学家"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%93%B2%E5%AD%A6%E5%AE%B6","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%93%B2%E5%AD%A6%E5%AE%B6"]},"artist":{"id":"artist","name":"艺术家","sourceTitle":"艺术家","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%89%BA%E6%9C%AF%E5%AE%B6","checkedAt":"2026-11-11","ability":"每局游戏限一次，在白天时，你可以私下询问说书人一个是非问题，你会得知该问题的答案。","mechanics":["艺术家可以询问有关任何内容的问题，也可以随心所欲的遣词造句来提问。说书人需要诚实地回答“是”、“不是”，或“我不知道。”","是否提问由艺术家决定，而非说书人。艺术家向说书人询问不是公开交流，因此其他玩家不能旁听。艺术家会秘密地询问并获取问题的答案。"],"qa":[],"interactions":[{"with":[],"text":"请注意说书人有权回答“我不知道”，且这样会使得艺术家的能力被浪费掉。针对含糊不清的问题，或者玩家尝试用多个问题嵌套成一个问题，或是如果说书人认为让玩家“重新再问一个问题”会导致对现在的问题有一定程度的暗示作用，那么这种时候，说书人都可以回答“我不知道”。","kind":"detail"}],"tips":["问单一、清楚、可判真假的问题。","保存完整措辞与回答，避免模糊或嵌套问题。"],"counterplay":["伪装者能自由编问题和答案；应对时核验精确问题、时点与答案，并寻找独立约束。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成艺术家"]},"juggler":{"id":"juggler","name":"杂耍艺人","sourceTitle":"杂耍艺人","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%9D%82%E8%80%8D%E8%89%BA%E4%BA%BA","checkedAt":"2026-11-11","ability":"在你的首个白天，你可以公开猜测任意玩家的角色最多五次。在当晚，你会得知猜测正确的角色数量。","mechanics":["在第一个白天，杂耍艺人可以对任意玩家的角色进行猜测。当晚，他会得知他猜对的次数……如果他没有被杀害的话。","他必须公开猜测，以使所有玩家听到他猜测的内容。他可以猜测零个角色，或者最多猜测五个角色，他所猜测的玩家和角色可以相同也可以不同。","如果杂耍艺人在醉酒或中毒时做出了猜测，但当晚他的能力触发时却清醒且健康，那么说书人仍然会给他真实的信息。"],"qa":[],"interactions":[{"with":[],"text":"（如猜测小明是数学家三次。）但杂耍艺人仍然可以猜测同一名玩家为不同的角色多次，或猜测多名玩家为同一角色多次。","kind":"detail"},{"with":[],"text":"此时“0”为正确信息。然而如果是老手玩家，说书人则需要严格进行要求，那名玩家必须要公开声明自己是杂耍艺人之后，才能够在夜晚获得信息（即使他公开声明之后不进行任何猜测，也一样能够获得信息）。","kind":"detail"},{"with":["食人族"],"text":"如果杂耍艺人在自己的首个白天猜测后在当天死于处决，当晚食人族会替杂耍艺人得知对应的信息。","kind":"jinx"}],"tips":["公开且逐条记五次以内的猜测，尽量让总数能区分主要分支。","总命中数不认证每个人。"],"counterplay":["邪恶能猜队友来配合命中；应对时不要把总数拆成未经证明的个别正确身份。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成杂耍艺人"]},"sage":{"id":"sage","name":"贤者","sourceTitle":"贤者","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%B4%A4%E8%80%85","checkedAt":"2026-11-11","ability":"如果恶魔杀死了你，在当晚你会被唤醒并得知两名玩家，其中一名是杀死你的那个恶魔。","mechanics":["贤者只有在被恶魔杀死时才会获取信息，死于处决时不会。"],"qa":[],"interactions":[{"with":["陌客"],"text":"陌客可能会被贤者当作杀死他的恶魔。","kind":"jinx"},{"with":["利维坦"],"text":"每个夜晚*，利维坦要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果贤者被选择，他的能力生效但不会死亡。","kind":"jinx"},{"with":["暴乱"],"text":"每个夜晚*，暴乱要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果贤者被选择，他的能力生效但不会死亡。","kind":"jinx"}],"tips":["可伪装成恶魔想攻击的角色。","死后尽快让团队处理二选一，但先确认触发来源。"],"counterplay":["自刀传位后的恶魔可用贤者伪装构陷二人；应对时核验夜死来源，不直接相信自述触发。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成贤者"]},"mutant":{"id":"mutant","name":"畸形秀演员","sourceTitle":"畸形秀演员","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E7%95%B8%E5%BD%A2%E7%A7%80%E6%BC%94%E5%91%98","checkedAt":"2026-11-17","ability":"如果你“疯狂”地证明自己是外来者，你可能被处决。","mechanics":["“疯狂”是一个术语，意思是“你正在尝试说服他人相信某件事情”。所以，“畸形秀演员‘疯狂’地证明自己是畸形秀演员”，这意味着他正在试图说服他人相信他是畸形秀演员。“他‘疯狂’地证明他是外来者”，这意味着他正在试图说服他人相信他是外来者。","说服的形式包含口头暗示自己的角色，也包含在自己的角色被质疑时的保持沉默。畸形秀演员是否“疯狂”由说书人来决定。如果你认为他正在以任何方式证明自己是一名外来者，你就可以处决他，即使在提名阶段之外，甚至是在晚上都可以处决他。如果你这样做，正常情况下这意味今天白天不会再有其他人被处决，因为每个白天只有一次处决。","如果畸形秀演员晚上暗示他是畸形秀演员，那么你在当晚可以处决他，即使今天白天已经有人被处决。宣布他的死亡，并正常进行夜晚。明天仍然可能发生一场处决。"],"qa":[],"interactions":[],"tips":["准备可信的镇民声明，遵守本局疯狂判定。","未被处决不能用来反证自己不是畸形秀演员。"],"counterplay":["邪恶可改口成畸形秀演员解释旧谎言；应对时检查全局名额，未受罚不证明该声明。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成畸形秀演员"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E7%95%B8%E5%BD%A2%E7%A7%80%E6%BC%94%E5%91%98","https://wiki.biligame.com/jbzlbwgwjcygf/%E7%95%B8%E5%BD%A2%E7%A7%80%E6%BC%94%E5%91%98"]},"sweetheart":{"id":"sweetheart","name":"心上人","sourceTitle":"心上人","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%BF%83%E4%B8%8A%E4%BA%BA","checkedAt":"2026-11-17","ability":"当你死亡时，会有一名玩家开始醉酒。","mechanics":["由说书人选择哪名玩家醉酒。","这项能力当心上人死亡时才会被触发。","死亡后造成的持续醉酒须作为具体来源分析，不能受单个投毒者同夜仅一目标的容量限制；也不能无依据地认定受影响者一定是善良。"],"qa":[],"interactions":[],"tips":["尽量生存。","死后标出醉酒可能开始的时点，再复核后续信息，不要无差别否定此前记录。","为避免夜死而早期假报低威胁角色是合理善良策略；死亡前后更正时，要同步撤回此前编造的能力信息。","死亡触发的持续醉酒按实际死亡时点分析；不能把死亡之前的全部反馈也一律作废。"],"counterplay":["假跳可给所有后续矛盾提供借口；应对时只在死亡后的时间窗盘新醉酒，并限制实际醉酒目标。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成心上人"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%BF%83%E4%B8%8A%E4%BA%BA","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%BF%83%E4%B8%8A%E4%BA%BA"]},"barber":{"id":"barber","name":"理发师","sourceTitle":"理发师","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E7%90%86%E5%8F%91%E5%B8%88","checkedAt":"2026-11-17","ability":"如果你死亡，在当晚恶魔可以选择两名玩家（不能选择其他恶魔）交换角色。","mechanics":["死亡可给恶魔一次交换两名玩家角色的机会，恶魔可以不交换，可以选择自己，但不能选择其他恶魔。","交换角色不交换阵营；交换后获得新角色能力，包括重新获得的首夜及限次能力，须按具体时点结算。","恶魔可把自己的恶魔角色交给另一名玩家；不能把交换前的恶魔排除结果移到交换之后。","死后才变成理发师不追溯触发一次此前死亡。"],"qa":[],"interactions":[{"with":["梼杌"],"text":"如果梼杌的角色发生了交换，因为梼杌失去能力的爪牙依然失去能力。","kind":"jinx"}],"tips":["降低被处决或被刀的风险。","死亡后主动收集角色变化声明，区分换角色与换阵营。","有理发师死亡时，优先对照之后的角色变化与信息窗口，重新确定当前恶魔范围。","早期可隐藏身份以避免给邪恶交换机会；真正发生交换后，按两人角色变化而非阵营互换分析。"],"counterplay":["邪恶可借已死理发师解释身份变化；应对时只采用实际收到的通知，不补造交换。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成理发师"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E7%90%86%E5%8F%91%E5%B8%88","https://wiki.biligame.com/jbzlbwgwjcygf/%E7%90%86%E5%8F%91%E5%B8%88"]},"klutz":{"id":"klutz","name":"呆瓜","sourceTitle":"呆瓜","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%91%86%E7%93%9C","checkedAt":"2026-11-17","ability":"当你得知你死亡时，你要公开选择一名存活的玩家：如果他是邪恶的，你的阵营落败。","mechanics":["当呆瓜死亡时，他必须公开选择一名玩家。他可能需要花几分钟来做决定——毕竟，这是一个大决定，而且其他玩家可以向他提供建议，但最终决定始终由呆瓜来做出。如果他选择了一名邪恶玩家，那游戏就立即结束，善良阵营落败。如果他选择了一名善良玩家，无事发生，游戏继续。","说书人没有义务提醒呆瓜公开表明自己的角色并选择一名玩家。呆瓜必须在他得知自己死亡后，尽快去这样做。故意不这样做会被认为是作弊。"],"qa":[{"q":"呆瓜选择某人后继续游戏，能直接认证那人善良吗？","a":"先确认真呆瓜、有效触发及所选者当时被此能力检测的阵营，并核对间谍等登记和本局特例；不能只凭自称及游戏继续就作无条件认证。"}],"interactions":[],"tips":["在选人前听取建议，优先当时可信的存活玩家。","没有立刻结束仍依赖能力有效等前提。"],"counterplay":["假呆瓜可以选择队友认好；应对时公开未结束只有在采信角色与有效能力时才形成约束。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成呆瓜"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%91%86%E7%93%9C","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%91%86%E7%93%9C"]},"evil_twin":{"id":"evil_twin","name":"邪恶双子","sourceTitle":"镜像双子","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%95%9C%E5%83%8F%E5%8F%8C%E5%AD%90","checkedAt":"2026-11-11","ability":"你与一名对立阵营的玩家互相知道对方是什么角色。 如果其中善良玩家被处决，邪恶阵营获胜。 如果你们都存活，善良阵营无法获胜。","mechanics":["由说书人来选择邪恶双子与一名对立阵营玩家配对，被选择的玩家是对立双子。","如果双子中善良一方被处决，邪恶阵营获胜。如果邪恶一方被处决，游戏继续。死去的邪恶双子会失去能力，如果在他死后处决善良双子，邪恶阵营不会获胜。","两个双子都存活时善良阵营无法获胜。此时即使恶魔死亡，游戏也会继续。善良阵营要杀死邪恶双子以取得胜利。","如果一名善良玩家变成了邪恶双子，他仍然是善良玩家，此时一名邪恶玩家成为他的对立双子。另一个双子是什么角色并不重要，真正重要的是他们的阵营，好人可以安全处决邪恶的双子，但如果处决的是善良的双子，邪恶阵营获胜。","如果两个双子都是相同阵营，则由说书人为邪恶双子重新选择一名玩家成为对立双子。"],"qa":[],"interactions":[{"with":[],"text":"在游玩梦殒春宵剧本时，以上述运作方式来唤醒邪恶双子与对立双子是没有任何问题的，但是这一方式在扩展到其他混合剧本的时候可能会出现问题。（例如邪恶双子被传教士影响，或有涡流在场时炼金术士获得了邪恶双子的能力，等等。","kind":"detail"},{"with":["瘟疫医生"],"text":"如果说书人本应获得邪恶双子的能力，改为一名玩家会变成邪恶双子。","kind":"jinx"},{"with":["戏子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["梼杌"],"text":"邪恶双子在梼杌的能力判断中被当作“不具有能力”。","kind":"jinx"},{"with":["戏子（改）"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["姑获鸟"],"text":"如果姑获鸟获得了邪恶双子的能力，新对立双子会知道“姑获鸟在场”，但不会知道姑获鸟是谁。","kind":"jinx"}],"tips":["围绕配对双方的独立信息建立判断。","逼对方解释矛盾，不只重复互指。"],"counterplay":["双方互指不确定谁善良；对抗时尽量用独立信息破双子，而非仅靠谁表现激烈。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗镜像双子"]},"witch":{"id":"witch","name":"女巫","sourceTitle":"女巫","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%A5%B3%E5%B7%AB","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择一名玩家：如果他明天白天发起提名，他死亡。如果只有三名存活的玩家，你失去此能力。","mechanics":["每个夜晚，女巫会选择一名玩家诅咒。那名玩家如果在下个白天提名了任何玩家，就会死亡。尽管如此，他的提名仍然生效。","女巫的诅咒只持续一个白天，但女巫可以每晚一次又一次地诅咒同一名玩家。","只剩三名玩家存活时，女巫的诅咒立即解除，女巫也无法再进行夜晚行动。"],"qa":[],"interactions":[],"tips":["选最可能发起提名的人，和恶魔错开目标。","三人存活时要及时调整预期。"],"counterplay":["提名死亡与贞洁立即处决不同；应对时记清是死亡还是处决，女巫死亡后诅咒效力也要重看。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","对抗女巫"]},"cerenovus":{"id":"cerenovus","name":"洗脑师","sourceTitle":"洗脑师","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B4%97%E8%84%91%E5%B8%88","checkedAt":"2026-11-17","ability":"每个夜晚，你要选择一名玩家和一个善良角色。他明天白天和夜晚需要“疯狂”地证明自己是这个角色，不然他可能被处决。","mechanics":["洗脑师会选择让一名玩家“疯狂”地证明自己是某个镇民或外来者角色。被选择的玩家明天必须试图说服其他玩家相信他是这个角色，否则就会死亡。","简短的暗示不足以避免死亡。玩家必须付出努力说服其他玩家。虽然疯狂的玩家不会被强迫一定要说出他不想说的东西，但是如果说书人感受不到他的努力，他就会付出代价。","疯狂的邪恶玩家可能会以这种方式被处决，但“可能”意味着你可以选择不这么做，以防止邪恶玩家通过这种策略获胜。","像畸形秀演员一样，执行处决惩罚计入每天的处决限制。"],"qa":[{"q":"对跳和改口能直接说明邪恶吗？","a":"不能。疯狂可能迫使善良玩家维持指定自称，需核对影响日及可能处决；未被处决也不反证没有洗脑师。"}],"interactions":[{"with":["哥布林"],"text":"洗脑师可以选择将玩家洗脑成哥布林。","kind":"jinx"}],"tips":["针对信息关键的人安排有压力的疯狂身份。","对抗时先确认疯狂持续时间及本局裁定。"],"counterplay":["被疯狂约束的声明不应直接按撒谎判红；应对时给对方保留修正信息的窗口。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗洗脑师"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%B4%97%E8%84%91%E5%B8%88","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B4%97%E8%84%91%E5%B8%88"]},"pit_hag":{"id":"pit_hag","name":"麻脸巫婆","sourceTitle":"麻脸巫婆","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E9%BA%BB%E8%84%B8%E5%B7%AB%E5%A9%86","checkedAt":"2026-11-17","ability":"每个夜晚*，你要选择一名玩家和一个角色，如果该角色不在场，他变成该角色。如果因此创造了一个恶魔，当晚的死亡由说书人决定。","mechanics":["除首夜外可把玩家变成不在场的角色，通常不改变其阵营；善良爪牙或善良恶魔在相应角色变化分支中可能成立。","创造恶魔当晚死亡由说书人决定；不能按常规刀数或一名静态恶魔排除此夜。","重点区分开局配置、过去的信息时点与当前恶魔位置，角色变化不能倒改已经发生的真实身份。"],"qa":[],"interactions":[{"with":[],"text":" 在这个期间，说书人能够自由决定是否让某名玩家死亡，或让被恶魔攻击的某名玩家存活。 说书人在这个时间范围内，可以分别在不同的恶魔行动前或后多次执行造成或阻止死亡的效果。这对于在创造出哈迪寂亚等带有特殊效果的恶魔时非常重要。 说书人只能造成更多的死亡或阻止原本要发生的死亡，其他类型的恶魔能力无法阻止，如普卡的中毒、 哈迪寂亚的复活等。恶魔攻击后无法杀死某名玩家再由说书人决定杀死，这种情况不算在内。 说书人造成的死亡视为麻脸巫婆造成，因此不会触发贤者 、 唱诗男孩等角色的能力，也能够成功杀死士兵 （如果麻脸巫婆没有照看小怪宝的话）。 只要麻脸巫婆创造了恶魔，即使在那之后麻脸巫婆离场、失去能力或死亡，当晚说书人仍然可以决定造成或阻止死亡。 说书人只能阻止恶魔造成的死亡，由非恶魔玩家造成的死亡无法阻止。","kind":"detail"},{"with":["村夫"],"text":"如果村夫在场数量不足3人，麻脸巫婆可以创造新的村夫。如果她这么做，村夫的醉酒效果可能会更换目标。","kind":"jinx"},{"with":["异端分子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["落难少女"],"text":"如果麻脸巫婆创造了落难少女，改为由说书人来决定哪一名玩家变成落难少女。","kind":"jinx"},{"with":["异教领袖","政客","莽夫","食人魔"],"text":"被麻脸巫婆创造的邪恶异教领袖/政客/莽夫/食人魔无法因为自身能力转变为善良阵营。","kind":"jinx"},{"with":["召唤师"],"text":"如果召唤师创造了第二个存活的恶魔，当晚的死亡由说书人决定。","kind":"jinx"},{"with":["利维坦"],"text":"利维坦不能在第五天之后加入游戏。","kind":"jinx"},{"with":["戏子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["梼杌"],"text":"如果梼杌变成了其他角色，因为梼杌而失去能力的爪牙会立即死亡。","kind":"jinx"},{"with":["戏子（改）"],"text":"麻脸巫婆无法创造戏子（改），麻脸巫婆创造的邪恶玩家无法获得戏子（改）的能力。","kind":"jinx"}],"tips":["区分改角色与改阵营，协调创造恶魔的时机。","对抗时及时记录新角色和通知时点。"],"counterplay":["一旦创造恶魔，当晚刀口可能不按通常数量；应对时先定位变角时点，再判断后续信息。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗麻脸巫婆"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E9%BA%BB%E8%84%B8%E5%B7%AB%E5%A9%86","https://wiki.biligame.com/jbzlbwgwjcygf/%E9%BA%BB%E8%84%B8%E5%B7%AB%E5%A9%86"]},"fang_gu":{"id":"fang_gu","name":"方古","sourceTitle":"方古","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%96%B9%E5%8F%A4","checkedAt":"2026-11-17","ability":"每个夜晚*，你要选择一名玩家：他死亡。 被该能力杀死的外来者改为变成邪恶的方古且你代替他死亡，但每局游戏仅能成功转化一次。[+1外来者]","mechanics":["初始增加一名外来者。成功转化外来者时，目标变成邪恶方古，原方古代死；原方古仍属邪恶，不会因死亡回到善良。","每局只成功转化一次，不能每次杀外来者都再跳。转化前的非恶魔信息不排除目标转化后是恶魔。"],"qa":[],"interactions":[{"with":["猩红女郎"],"text":"如果即将出现两名存活的恶魔，其中之一是由猩红女郎转变的，猩红女郎不会变成恶魔。","kind":"jinx"}],"tips":["留意真实外来者并安排转化时机。","对抗时结合额外外来者名额与身份变化，而非只看刀口。"],"counterplay":["外来者后来转邪会让早期善良信息过期；应对时不要因早期被认好就排除其当前恶魔身份。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗方古"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%96%B9%E5%8F%A4","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%96%B9%E5%8F%A4"]},"vigormortis":{"id":"vigormortis","name":"亡骨魔","sourceTitle":"亡骨魔","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E4%BA%A1%E9%AA%A8%E9%AD%94","checkedAt":"2026-11-17","ability":"每个夜晚*，你要选择一名玩家：他死亡。 被你杀死的爪牙保留他的能力，且与他邻近的两名镇民之一中毒。[-1外来者]","mechanics":["初始减少一名外来者。其亲自杀死的爪牙可保留能力，并令该爪牙两侧最近的镇民之一中毒；不是最近存活玩家，死亡镇民也可在范围内。","多名被其杀死的爪牙可同时保留能力并产生多个中毒来源，不能硬套投毒者同夜一目标。","恶魔死亡或失能、爪牙变成非爪牙等变化会影响持续效果，须按时间线判断；夜死不能在此机制下强认善良。"],"qa":[],"interactions":[{"with":["主谋"],"text":"如果亡骨魔死亡，被亡骨魔杀死的主谋依然保留能力。","kind":"jinx"}],"tips":["与爪牙协调保留能力和毒位。","对抗时比较夜死位置、死后能力与邻近镇民信息异常。"],"counterplay":["死爪牙还能行动，不要把夜死自动等同失能；同时不能无依据让所有死爪牙都保留能力。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗亡骨魔"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E4%BA%A1%E9%AA%A8%E9%AD%94","https://wiki.biligame.com/jbzlbwgwjcygf/%E4%BA%A1%E9%AA%A8%E9%AD%94"]},"no_dashii":{"id":"no_dashii","name":"诺-达鲺","sourceTitle":"诺-达鲺","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%AF%BA-%E8%BE%BE%E9%B2%BA","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：他死亡。 与你邻近的两名镇民中毒。","mechanics":["在诺-达鲺顺时针和逆时针方向上最近的镇民中毒，无论这些镇民是存活还是死亡。如果诺-达鲺死亡或者因为其他原因失去能力，那么这两名镇民玩家恢复健康。总是会有两名镇民玩家因此中毒，诺-达鲺的效果会跳过与他相邻的非镇民角色。","如果有玩家成为新的诺-达鲺，或一个中毒的镇民变成了一个非镇民角色，都会根据新位置关系立刻改变中毒的玩家。"],"qa":[],"interactions":[],"tips":["确认两侧最近镇民是谁。","对抗时按角色类型越过外来者与爪牙，别只怀疑物理邻座。"],"counterplay":["应对时检查中毒两侧的角色类型链；镇民死亡一般不让毒位自动跳过他。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","对抗诺-达鲺"]},"vortox":{"id":"vortox","name":"涡流","sourceTitle":"涡流","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%B6%A1%E6%B5%81","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：他死亡。 镇民玩家的能力都会产生错误信息。 如果白天没人被处决，邪恶阵营获胜。","mechanics":["任何时候角色是镇民的玩家通过能力获取信息时，他们会得知错误信息。哪怕他们醉酒或中毒，信息也一定是错误的。","涡流不会影响其他人通过其他方式获得的信息，例如说书人解释的规则或玩家的角色或阵营的变化。","当夜晚降临时，如果今天白天没有人被处决，邪恶阵营胜利。流放旅行者不算在内。"],"qa":[{"q":"醉毒镇民可以收到真信息吗？","a":"有效涡流要求镇民自身信息能力产生错误信息，即使该镇民醉毒。酒鬼是外来者，不直接受此条约束。保护、替换信息或相克另按具体交互。"},{"q":"处决了人但没有死，算有处决吗？","a":"算。不要把“没有处决”写成“没有处决死亡”。角色或阵营变化的通知也不是镇民信息能力。"}],"interactions":[{"with":["报丧女妖"],"text":"如果涡流杀死了报丧女妖，玩家仍然会得知正确信息。（中文百科上的‘通用简化原则’已涵盖包括多角色互动下的涡流信息的简化处理方式，此条仅作说明。）","kind":"jinx"}],"tips":["反向利用系统性错误信息。","善良方仍应推动处决，处决未死也满足有处决。"],"counterplay":["假跳者也可能配合“全假”叙事；应对时区分真镇民的错误反馈、酒鬼模拟反馈和邪恶自编。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗涡流"]},"deviant":{"id":"deviant","name":"怪咖","sourceTitle":"怪咖","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%80%AA%E5%92%96","checkedAt":"2026-11-17","ability":"如果你表现得很有趣，当天你不能被流放。","mechanics":["怪咖可以以任何方式逗乐其他玩家。通常来说，怪咖可以通过讲笑话、有趣的故事或者是神回复来达到目的。","说书人来判断怪咖是否有趣。"],"qa":[],"interactions":[],"tips":["自然地参与讨论、活跃气氛。","是否有趣由本局裁定，不能依赖固定话术保证免流放。"],"counterplay":["免流放由本局裁定；应对时不要用是否逗笑来推断隐藏阵营。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%80%AA%E5%92%96","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%80%AA%E5%92%96"]},"bonecollector":{"id":"bonecollector","name":"集骨者","sourceTitle":"集骨者","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E9%9B%86%E9%AA%A8%E8%80%85","checkedAt":"2026-11-17","ability":"每局游戏限一次，在夜晚时*，你可以选择一名死亡的玩家：他重新获得能力直到下个黄昏。","mechanics":["集骨者只能选择一名已死亡的玩家。被选中的玩家仍然保持着死亡状态，但该玩家会重新获得其角色的能力。如果该角色有 “在你的首个夜晚”或“每局游戏限一次” 的能力——比如贞洁者、猎手、钟表匠、女裁缝或者杂耍艺人——该玩家可以在黄昏之前再次使用这些能力，即使先前已经使用过了。","当集骨者选择了一名玩家，该玩家不会得知他被集骨者选中了，尽管他可能很快就会发现自己被唤醒而且可以再次使用角色能力了。","如果集骨者死亡，被选择的玩家将不再拥有因集骨者而重新获得的能力。"],"qa":[],"interactions":[{"with":[],"text":"集骨者与受到亡骨魔效果影响的玩家或“假死” 僵怖的交互：因为这些玩家虽然“死亡”但仍然具有能力，集骨者不会让这些玩家再次获得能力。在英文描述中，集骨者的能力描述中“重获”是regain，而其他的获得能力都是“gain”，regain意味着这项能力需要先失去之后，才能被“重获”。而已经使用了限次能力且被亡骨魔杀死并保留能力的爪牙也不会因此获得能力，因为他们的能力仍然存在，且已经被使用。","kind":"detail"},{"with":[],"text":"集骨者让死亡玩家重获能力后，如果这一项能力非强制使用的能力（如艺术家、博学者等），说书人无需对这些能力是否能够使用进行提示。这是因为在白天的时候，集骨者的玩家通常都会直接告诉那名玩家他对那名玩家使用了自己的能力，然后那名玩家可以主动找说书人验证这一结果。而夜晚会行动的能力，因为不存在集骨者与那名玩家交流的空间，因此才需要说书人主动告诉那名玩家轮到他使用自己重获的能力了。","kind":"detail"}],"tips":["先确认死者真实能力与剩余价值，再安排复得能力窗口。","目标没有复活。"],"counterplay":["一次性能力可能因重新获得而刷新；应对时核对其原能力是否真正失去过，而非只看公开死亡。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧（作为善良）","提示与技巧（作为邪恶）"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E9%9B%86%E9%AA%A8%E8%80%85","https://wiki.biligame.com/jbzlbwgwjcygf/%E9%9B%86%E9%AA%A8%E8%80%85"]},"barista":{"id":"barista","name":"咖啡师","sourceTitle":"咖啡师","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%92%96%E5%95%A1%E5%B8%88","checkedAt":"2026-11-17","ability":"每个夜晚，直至下个黄昏，由说书人二选一：1）一名玩家解除并免受醉酒和中毒影响，且会得知正确信息；2）一名玩家的能力可以生效两次。该玩家会得知是哪个效果。","mechanics":["每个夜晚由说书人选择咖啡师的角色能力生效，和受到该能力影响的玩家。咖啡师不会知道说书人选择了谁或者哪一项能力，但受影响的玩家会知道。","如果玩家的角色能力生效两次，仍会在能力原本的时间点使用能力。如果该玩家已经使用过“每局游戏限一次”能力，他仍能再次使用该能力。如果该玩家拥有“每局游戏限一次”能力而且还没使用，那他就可以在下个黄昏之前使用能力两次。","该玩家一定会获得正确信息，即使涡流在场。"],"qa":[],"interactions":[{"with":[],"text":"）","kind":"detail"},{"with":[],"text":"因为该玩家免受醉酒和中毒的影响，因此这些效果“暂时”无法对该玩家生效。（在咖啡师的效果1结束时，这些效果会重新生效。）","kind":"detail"},{"with":[],"text":"（如果这名玩家是上一个因普卡的能力中毒的玩家的话。）","kind":"detail"},{"with":[],"text":"咖啡师的效果1能够使得酒鬼玩家获得“自己以为的那个镇民角色”的信息时，获得正确信息。","kind":"detail"}],"tips":["受影响者应记清效果与有效期。","咖啡师本人不要假定知道受益对象。"],"counterplay":["多次行动不应被直接认作造假；应对时核对受益者确实收到的效果通知。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧（作为善良）","提示与技巧（作为邪恶）"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%92%96%E5%95%A1%E5%B8%88","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%92%96%E5%95%A1%E5%B8%88"]},"harlot":{"id":"harlot","name":"流莺","sourceTitle":"流莺","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B5%81%E8%8E%BA","checkedAt":"2026-11-17","ability":"每个夜晚*，你要选择一名存活的玩家：如果他同意，你会得知他的角色，但是你们两个可能同时死亡。","mechanics":["每个夜晚，流莺需要选择一名玩家，该玩家会做一个决定：要向流莺揭露自己的角色吗？如果揭露的话，说书人可以决定流莺和该玩家是否在今晚一起死亡。","流莺只会得知她所选的玩家的角色，而不会得知这名玩家所属的阵营。","流莺可以在白天讨论她晚上将会选择哪一名玩家，其他玩家也可以提出要被选择。但流莺可能会食言，在夜晚醒来时做出不同的选择。"],"qa":[],"interactions":[],"tips":["前期可用信息换风险，后期先评估双死是否会结束游戏。","角色查验不等于阵营查验。"],"counterplay":["被查者同意揭示角色不等于善良；应对时同时记是否同意和是否真的获得角色。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%B5%81%E8%8E%BA","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B5%81%E8%8E%BA"]},"butcher":{"id":"butcher","name":"屠夫","sourceTitle":"屠夫","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%B1%A0%E5%A4%AB","checkedAt":"2026-11-11","ability":"每个白天，首次处决后，你可以再次发起提名。","mechanics":["在有一名玩家因处决而死之后，屠夫可以提名当天第二名玩家进行处决。屠夫可以提名一名当天已经被提名过的玩家，且屠夫不论当天是否已经发起过提名，都可以在此时再次发起提名。","如果一名玩家被处决了，即使该玩家没有因处决而死亡，屠夫也可以使用自己的角色能力。屠夫使用能力提名后，其他玩家可以选择投票，也可以选择不投票，所以这次额外的提名并不会保证一定有人被处决。额外的处决机会仍旧需要足够的票数，但这次的票数不需要超过前一次提名统计后的票数。","如果当天没有发生任何处决，屠夫无法在当天使用自己的角色能力。"],"qa":[],"interactions":[],"tips":["提前争取第二次处决所需票数。","第一次处决未死人仍可能使用能力。"],"counterplay":["第二次处决仍需真实票决支持；应对时重新核算当时存活人数与其他已发生效果。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"]},"grandmother":{"id":"grandmother","name":"祖母","sourceTitle":"祖母","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E7%A5%96%E6%AF%8D","checkedAt":"2026-11-17","ability":"在你的首个夜晚，你会得知一名善良玩家和他的角色。 如果恶魔杀死了他，你也会死亡。","mechanics":["在首个夜晚，祖母会得知自己的孙子——一名善良玩家的镇民或外来者角色信息。孙子不会得知自己有位祖母。","如果恶魔杀死了孙子，祖母也会死亡。如果孙子通过任何其他方式死亡——例如处决，或在夜晚因其他原因死亡——祖母不会因此死亡。"],"qa":[{"q":"两人都夜死，是否足够双认祖母与孙子？","a":"不够。只有采信真祖母及能力正常、孙子因恶魔死亡等前提才有相应约束；混合剧本先排查其他多死来源。"}],"interactions":[{"with":[],"text":"在绝大多数情况下，祖母得知的角色都应该是善良角色。因为如果祖母得知了邪恶角色，这会带来祖母能力之外的额外信息（有处于善良阵营的邪恶角色，又或者在剧本条件不允许的情况下作为了祖母醉酒中毒的明确提示）。","kind":"detail"},{"with":["利维坦"],"text":"如果利维坦在场，孙子死于处决，邪恶阵营获胜。","kind":"jinx"},{"with":["暴乱"],"text":"如果暴乱在场，孙子死于处决，邪恶阵营获胜。","kind":"jinx"}],"tips":["与孙子建立私下联系并保护其信息。","双死只是来源线索，不凭死亡数量单独认证身份。"],"counterplay":["假祖母常绑定邪恶队友；应对时检验双方是否独立报信息，不把互相声援视为证明。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成祖母"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E7%A5%96%E6%AF%8D","https://wiki.biligame.com/jbzlbwgwjcygf/%E7%A5%96%E6%AF%8D"]},"sailor":{"id":"sailor","name":"水手","sourceTitle":"水手","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B0%B4%E6%89%8B","checkedAt":"2026-11-17","ability":"每个夜晚，你要选择一名存活的玩家：你或他之一会醉酒直到下个黄昏。 你不会死亡。","mechanics":["每晚选择一名存活玩家，包括自己；你或目标之一醉酒到下个黄昏。只要自己的能力正常，就不会死亡。","自选会使自己醉酒并失去免死。选择他人时不能只凭说书人的常见选择倾向，锁定究竟是谁醉酒。","死亡或存活结果需联立醉毒、其他保护和本次实际死因；不能用一次处决未死直接认证水手。"],"qa":[],"interactions":[],"tips":["选择值得验证或值得醉酒的对象。","未死要与保护来源交叉验证，不能证明目标是哪一类型。","与信息角色对照你选人的夜次，先定位可能受影响的反馈，不把选择对象直接认证为镇民或邪恶。"],"counterplay":["恶魔代言人可协助假水手未死；应对时逐夜限制保护对象，不用同一解释覆盖全部白天。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成水手"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%B0%B4%E6%89%8B","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B0%B4%E6%89%8B"]},"chambermaid":{"id":"chambermaid","name":"侍女","sourceTitle":"侍女","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E4%BE%8D%E5%A5%B3","checkedAt":"2026-11-17","ability":"每个夜晚，你要选择除你以外的两名存活的玩家：你会得知他们中有几人在当晚因其自身能力而被唤醒。","mechanics":["每晚选择除自己外两名存活玩家，只得知其中几人当晚因自身能力醒来，不得知具体是谁。","恶魔或爪牙首夜互认、因哈迪寂亚的能力醒来作生死选择等，都不是因被选者自身能力醒来。","醉酒或中毒玩家若仍因自身能力醒来，仍会计入；数字不能直接证明其能力正常。","需按实际夜序、当晚生死和限次能力是否仍在行动判断；不能把所有角色按每晚必醒处理。"],"qa":[],"interactions":[{"with":["数学家"],"text":"侍女会得知数学家是否醒来，即使她是在数学家之前醒来。","kind":"jinx"},{"with":["引路人"],"text":"侍女会得知引路人是否醒来，即使她是在引路人之前醒来。","kind":"jinx"}],"tips":["记目标、数字和该夜自称的行动。","角色通知、他人能力唤醒与自身能力唤醒分开。","先把所选两人的实际行动窗口与数字联立，再缩小身份范围；数字矛盾先查夜次、外部唤醒与信息失效来源。"],"counterplay":["善良也可能隐藏真实角色；应对时先补原始唤醒声明，不把不相容直接等同邪恶。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成侍女"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E4%BE%8D%E5%A5%B3","https://wiki.biligame.com/jbzlbwgwjcygf/%E4%BE%8D%E5%A5%B3"]},"exorcist":{"id":"exorcist","name":"驱魔人","sourceTitle":"驱魔人","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%A9%B1%E9%AD%94%E4%BA%BA","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家（与上个夜晚不同）：如果你选中了恶魔，他会得知你是驱魔人，但他当晚不会因其自身能力而被唤醒。","mechanics":["除首个夜晚以外的每个夜晚，驱魔人都需要选择一名玩家。如果所选玩家不是恶魔，恶魔仍然可以发动攻击。恶魔会得知他不能发动攻击，且得知谁是驱魔人。","任何其他恶魔能力仍然会生效——例如僵怖被杀后依然保持存活，普卡会杀死他在上一个夜晚攻击的玩家，或是沙巴洛斯反刍一名玩家。","驱魔人不能连续两个夜晚选择同一名玩家。"],"qa":[],"interactions":[{"with":["利维坦"],"text":"如果利维坦提名并处决了驱魔人选择的那名玩家，善良阵营获胜。","kind":"jinx"},{"with":["暴乱"],"text":"如果暴乱提名并处决了驱魔人选择的那名玩家，善良阵营获胜。","kind":"jinx"},{"with":["牙噶巴卜"],"text":"如果驱魔人选中了牙噶巴卜，那么牙噶巴卜在当晚无法造成死亡。","kind":"jinx"}],"tips":["把目标与无人死亡夜交叉比较，不能连续同选。","恶魔被驱魔仍可能保留被动效果。"],"counterplay":["假跳可借其他保护或蓄力制造平安夜；应对时把恶魔类型与其他无死原因一起比较。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成驱魔人"]},"innkeeper":{"id":"innkeeper","name":"旅店老板","sourceTitle":"旅店老板","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%97%85%E5%BA%97%E8%80%81%E6%9D%BF","checkedAt":"2026-11-17","ability":"每个夜晚*，你要选择两名玩家：他们当晚不会死亡，但其中一人会醉酒到下个黄昏。","mechanics":["除首夜外每晚选两名玩家，当夜免死，其中一名醉酒到下个黄昏；保护涵盖多种来源的死亡，不能延伸到白天处决。","选择自己且自己醉酒时，自己的保护能力失效，另一名所选者也不因此继续受到保护。","不能假定一定由善良目标醉酒。须联立具体夜次、两名目标、当晚其他醉毒来源与保护是否有效。"],"qa":[],"interactions":[{"with":["利维坦"],"text":"如果利维坦提名并处决了旅店老板上个夜晚保护的其中一名玩家，善良阵营获胜。","kind":"jinx"},{"with":["暴乱"],"text":"如果暴乱提名并处决了旅店老板上个夜晚保护的其中一名玩家，善良阵营获胜。","kind":"jinx"}],"tips":["保护关键人物时权衡其中一人醉酒的代价。","若需要可靠当晚信息，应另选保护组合。","与需要当夜可靠信息的角色协调；幸存只说明一个待解释的结果，不直接认证保护发动或双方善良。"],"counterplay":["假跳可借醉酒解释被保护者信息不对；应对时逐夜最多按技能处理一名醉酒者，不能让两人都随意失真。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成旅店老板"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%97%85%E5%BA%97%E8%80%81%E6%9D%BF","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%97%85%E5%BA%97%E8%80%81%E6%9D%BF"]},"gambler":{"id":"gambler","name":"赌徒","sourceTitle":"赌徒","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E8%B5%8C%E5%BE%92","checkedAt":"2026-11-17","ability":"每个夜晚*，你要选择一名玩家并猜测该玩家的角色：如果你猜错了，你会死亡。","mechanics":["赌徒可选择自己、存活或死亡的玩家，猜错才因自身能力死亡，不收到直接的对错通知。","幸存需同时假设能力正常、没有阻止死亡的效果，才支持猜中；死亡也要区分自身猜错与其他杀人来源。"],"qa":[],"interactions":[],"tips":["先选最值得核验的声明，记原始角色猜测。","存活或死亡都要结合其他死亡与保护来源。"],"counterplay":["假赌徒可能只顺着已公开角色猜；应对时核验其生前预记目标，死亡不单独认证赌错。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成赌徒"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E8%B5%8C%E5%BE%92","https://wiki.biligame.com/jbzlbwgwjcygf/%E8%B5%8C%E5%BE%92"]},"gossip":{"id":"gossip","name":"造谣者","sourceTitle":"造谣者","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%80%A0%E8%B0%A3%E8%80%85","checkedAt":"2026-11-11","ability":"每个白天，你可以公开发表一个声明。如果该声明正确，在当晚会有一名玩家死亡。","mechanics":["每个白天，造谣者可以公开发表一个声明。如果该声明是正确的，说书人会在当晚杀死一名玩家。如果声明是错误的，那就没有玩家会因造谣者而死。","含糊不清的词语、低声细语、说书人无法判断对错的声明、或是发表声明时有人没听到等情况下，声明都不作数。如同猎手的能力，说书人和每一名玩家都必须要听到并明确造谣者发表的声明，明白造谣者正在使用自己的能力，以此来让说书人判定接下来会发生什么。","如果造谣者在白天处于醉酒或中毒时发表了一个正确的声明，但当晚造谣者能力触发时他恢复了清醒和健康，那么说书人仍然会杀死一名玩家。"],"qa":[],"interactions":[],"tips":["公开可判真假的清晰声明，逐日比较死亡。","不要把额外死亡或无人死亡直接当成真假答复。"],"counterplay":["假跳可借别的多死来源配合声明；应对时逐夜做来源核算，不把“几个人死”当直接是非答案。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成造谣者"]},"courtier":{"id":"courtier","name":"侍臣","sourceTitle":"侍臣","source":"https://wiki.biligame.com/bloodontheclocktower/%E4%BE%8D%E8%87%A3","checkedAt":"2026-11-11","ability":"每局游戏限一次，在夜晚时，你可以选择一个角色：如果该角色在场，该角色之一从当晚开始醉酒三天三夜。","mechanics":["每局游戏限一次，侍臣可以选择一个角色，使其醉酒三个夜晚和三个白天，立即生效。","侍臣不会得知自己成功或失败，因此侍臣可能会选到不在场的角色。","侍臣选择的是一个角色，而不是一名玩家。说书人可能需要提醒侍臣玩家注意这一点。也需要提醒试图伪装成侍臣的邪恶玩家注意这一点。","如果醉酒或中毒的侍臣选择了一个角色，该角色不会醉酒，即使侍臣于之后恢复了清醒和健康。如果侍臣使一个角色醉酒，但是侍臣变得醉酒或中毒，那名醉酒的玩家会重新恢复清醒。如果侍臣在三个夜晚和三个白天结束前又恢复了清醒和健康，那名被侍臣选中角色的玩家还是会继续醉酒。"],"qa":[],"interactions":[{"with":["维齐尔"],"text":"如果维齐尔失去能力，他会得知此事，但不会在白天死亡。","kind":"jinx"},{"with":["召唤师"],"text":"如果存活的召唤师失去能力，说书人会获得召唤师能力。","kind":"jinx"}],"tips":["按角色而非座位选择，记开始夜和三天三夜窗口。","没反馈不代表没命中。"],"counterplay":["假跳可解释夜死节奏变化；应对时核对选择的是哪一角色和三天三夜窗口。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成侍臣"]},"professor":{"id":"professor","name":"教授","sourceTitle":"教授","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%95%99%E6%8E%88","checkedAt":"2026-11-17","ability":"每局游戏限一次，在夜晚时*，你可以选择一名死亡的玩家：如果他是镇民，你会将他起死回生。","mechanics":["每局游戏限一次，教授可以选择一名已死亡的玩家。如果该玩家是镇民，他将被复活，再次变成存活状态。","如果教授选择了外来者、爪牙或恶魔，则无事发生，并且教授失去自己的能力。","复活的玩家会重新获得自己的能力，即使是已经使用过的“每局游戏限一次”的能力也会重新获得。","复活的镇民能不能在自己复活的当晚进行行动，取决于复活的镇民本该在教授之前还是之后行动。"],"qa":[],"interactions":[{"with":[],"text":"如果在城镇广场上没有死亡玩家，则无需唤醒教授（即使可能已经有人死亡，但还未被说书人告知）。","kind":"detail"},{"with":["狸猫"],"text":"如果狸猫与使用过能力的教授交换角色，新教授仍然失去能力。","kind":"jinx"}],"tips":["优先复活价值高且较可信的镇民，权衡等候风险。","复活也可能另有来源。","复活能提供独立的公开结果，但须先排查本剧本其他复活来源，不能仅由复活便双认教授与镇民。","在本板有哈迪寂亚时，公开复活不独占教授来源；优先核对三人名单及复活时点。"],"counterplay":["假跳者可能声称选到非镇民或能力失效；应对时同时考虑沙巴洛斯等复活来源。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成教授"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%95%99%E6%8E%88","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%95%99%E6%8E%88"]},"minstrel":{"id":"minstrel","name":"吟游诗人","sourceTitle":"吟游诗人","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%90%9F%E6%B8%B8%E8%AF%97%E4%BA%BA","checkedAt":"2026-11-11","ability":"当一名爪牙死于处决时，除了你和旅行者以外的所有其他玩家醉酒直到明天黄昏。","mechanics":["如果一名爪牙玩家被处决且死亡，所有玩家（除了吟游诗人）会立即变得醉酒，并在整个夜晚和下一个白天都保持醉酒状态。镇民、外来者、爪牙、甚至是恶魔都会醉酒，但是旅行者不会。如果爪牙在夜晚死亡，吟游诗人不会使人醉酒。","如果一名已死亡的爪牙玩家被处决，吟游诗人的能力不会触发——已死亡的角色不会再次死亡！如果一名爪牙玩家被处决但没有死亡，吟游诗人的能力不会触发。如果一名爪牙玩家在吟游诗人醉酒或中毒期间死于处决时，吟游诗人的能力不会触发。"],"qa":[],"interactions":[{"with":["军团"],"text":"如果军团死于处决，所有军团保留能力，但吟游诗人可能会在当晚得知今天白天死于处决的玩家是军团。","kind":"jinx"}],"tips":["围绕爪牙处决死亡后的整段醉酒窗口复核。","无夜死有多种来源，别直接认定被处决者是爪牙。"],"counterplay":["平安夜可能被恶魔空刀伪造；应对时需结合被处决者名额与其他角色反馈。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成吟游诗人"]},"tea_lady":{"id":"tea_lady","name":"茶艺师","sourceTitle":"茶艺师","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E8%8C%B6%E8%89%BA%E5%B8%88","checkedAt":"2026-11-17","ability":"如果与你邻近的两名存活的玩家是善良的，他们不会死亡。","mechanics":["保护顺、逆时针最近的两名存活邻居；死亡邻座被跳过，座次或生死变化后须重算。","只有两名邻居都被此能力当作善良且茶艺师有效时，才同时免死；茶艺师自身不因此受保护。","邻居未死不是保护发动的证明：水手、弄臣、恶魔代言人等可给出同样表象；间谍误登记、醉毒与其他特殊能力也需按本局角色核验。"],"qa":[],"interactions":[],"tips":["逐日记两侧最近存活邻居，保护范围会移动。","选择是否公开时平衡邻居保护和自身暴露。","记录测试发生时两侧最近存活邻居，结合当次保护与投毒来源缩小邪恶范围，避免把单次存活直接升级为身份认证。"],"counterplay":["假跳可利用其他免死能力；应对时只在已接受真茶艺师且有效时，用邻居死亡反推阵营条件。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成茶艺师"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E8%8C%B6%E8%89%BA%E5%B8%88","https://wiki.biligame.com/jbzlbwgwjcygf/%E8%8C%B6%E8%89%BA%E5%B8%88"]},"pacifist":{"id":"pacifist","name":"和平主义者","sourceTitle":"和平主义者","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%92%8C%E5%B9%B3%E4%B8%BB%E4%B9%89%E8%80%85","checkedAt":"2026-11-11","ability":"被处决的善良玩家可能不会死亡。","mechanics":["当一名善良玩家被处决时，说书人选择该玩家是死亡还是存活。","一如既往，当这类能力以如此直白的方式生效时，只需要告知大家发生了什么事，不要告知为什么发生。大家得知处决成功了，但被处决的玩家没有死亡——这就够了。","如果一名玩家被处决但依然存活，也仍然算作今天白天的处决。今天不能再发起其他的提名了。"],"qa":[],"interactions":[],"tips":["可隐藏身份争取持续保护。","未救下好人不证明能力不存在，未死也不直接证明目标好人。"],"counterplay":["假跳几乎没有必须发生的外显效果；应对时不因从未救人而硬排，也不因此无限信任。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成和平主义者"]},"fool":{"id":"fool","name":"弄臣","sourceTitle":"弄臣","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%BC%84%E8%87%A3","checkedAt":"2026-11-17","ability":"当你首次将要死亡时，你不会死亡。","mechanics":["首次真正将要死亡时免死一次，不会收到能力是否消耗的通知。","若其他能力已经阻止死亡，不会因此消耗弄臣的自保；若自己当时醉毒，也不能由结果假定自保已正常发动。","处决未死可由水手、茶艺师、恶魔代言人等其他来源解释，不能单独认证弄臣。"],"qa":[],"interactions":[],"tips":["可吸引攻击或在安全时验证一次不死。","注意其他保护可能使你的首次机会尚未消耗。"],"counterplay":["假跳要解释是否曾消耗一次免死；应对时将真正将死、被他人保护与普通未被攻击分开。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成弄臣"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%BC%84%E8%87%A3","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%BC%84%E8%87%A3"]},"tinker":{"id":"tinker","name":"修补匠","sourceTitle":"修补匠","source":"https://wiki.biligame.com/bloodontheclocktower/%E4%BF%AE%E8%A1%A5%E5%8C%A0","checkedAt":"2026-11-11","ability":"你随时可能死亡。","mechanics":["说书人随时可以杀死修补匠。","修补匠在受到免于死亡的能力保护时，不能因自己的能力而死亡。"],"qa":[],"interactions":[],"tips":["死亡后及时说明自己的角色可能造成额外夜死。","活得久也不排除修补匠。"],"counterplay":["额外死亡既可能是修补匠自身也可能是其他击杀；不能为任意缺失刀数固定指定修补匠。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成修补匠"]},"moonchild":{"id":"moonchild","name":"月之子","sourceTitle":"月之子","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%9C%88%E4%B9%8B%E5%AD%90","checkedAt":"2026-11-11","ability":"当你得知你死亡时，你要公开选择一名存活的玩家。如果他是善良的，在当晚他会死亡。","mechanics":["月之子必须在得知自己死亡后的一到两分钟内选择一名玩家，无论是被处决后，还是在黎明说书人宣布夜晚的死亡玩家后。月之子可以在作出决定前花点时间听取大家的建议。","如果月之子选择了一名善良玩家，该玩家会在当晚死亡。如果月之子选择了一名邪恶玩家，无事发生。","说书人并没有义务提醒月之子来选择玩家。月之子必须在得知自己死亡后的短时间内使用自己的能力。故意不使用能力将被认定为作弊。","如果月之子在夜晚是清醒且健康的，但在今天白天选择玩家时是醉酒或中毒的，所选的玩家会死亡。如果月之子在夜晚是醉酒或中毒的，但在今天白天选择玩家时是清醒且健康的，所选的玩家不会死亡。","如果月之子在选择莽夫时，莽夫是善良的，则无论莽夫的阵营在夜晚如何变化，月之子都会杀死莽夫。"],"qa":[],"interactions":[],"tips":["先与团队核对可信存活目标。","次夜未死需考虑保护、失效等，不直接认红。"],"counterplay":["假跳可借普通夜杀配合带人；应对时比较选择前后保护及其他可能击杀。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成月之子"]},"goon":{"id":"goon","name":"莽夫","sourceTitle":"莽夫","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%8E%BD%E5%A4%AB","checkedAt":"2026-11-11","ability":"每个夜晚，首个使用其自身能力选择了你的玩家会醉酒直到下个黄昏。你会转变为他的阵营。","mechanics":["该玩家的能力在当晚和下一个白天不会生效。","之后在同一个夜晚，如果另一位玩家被唤醒且使用自己的能力选择了莽夫，该能力会正常生效。","除非玩家自己选择了莽夫，否则莽夫不能让玩家醉酒。通过祖母之类的角色能力，而由说书人选择了莽夫不算在内。","一旦莽夫让一名玩家醉酒，莽夫的阵营改变为与该玩家一致。如果选择莽夫的玩家已经醉酒或中毒，莽夫仍然会改变阵营并让该玩家醉酒。","如果被刺客选择，莽夫会死亡，但仍然会转变为邪恶阵营。"],"qa":[],"interactions":[{"with":["麻脸巫婆"],"text":"被麻脸巫婆创造的邪恶莽夫无法因为自身能力转变为善良阵营。","kind":"jinx"},{"with":["科学怪人"],"text":"如果恶魔拥有莽夫的能力，他无法因为该能力转变为善良阵营。","kind":"jinx"}],"tips":["逐夜记阵营通知，关注首个选择来源。","为当前阵营行动，不把旧阵营延用到整局。"],"counterplay":["假转阵营通知可以诱导站队；应对时记录私有通知与公开自述的证据差别。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成莽夫"]},"lunatic":{"id":"lunatic","name":"疯子","sourceTitle":"疯子","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E7%96%AF%E5%AD%90","checkedAt":"2026-11-17","ability":"你以为你是一个恶魔，但其实你不是。 恶魔知道你是疯子以及你在每个夜晚选择了哪些玩家。","mechanics":["和酒鬼很相似，疯子不知道自己的真实角色和真实阵营。","真正的恶魔会知道疯子每个夜晚攻击了哪些玩家。"],"qa":[],"interactions":[{"with":["数学家"],"text":"数学家会得知疯子是否攻击了与真正的恶魔不同的目标。","kind":"jinx"},{"with":["戏子（改）"],"text":"疯子不会因为戏子（改）能力参与互认，也不会因为戏子（改）的能力醉酒。","kind":"jinx"}],"tips":["核对自认爪牙的配合、所选目标与真实死亡。","不一致是线索，一致也可能是真恶魔在跟刀。"],"counterplay":["邪恶可假称发现自己是疯子以解释旧恶魔行为；应对时核对其自认队友和完整选择链。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成疯子"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E7%96%AF%E5%AD%90","https://wiki.biligame.com/jbzlbwgwjcygf/%E7%96%AF%E5%AD%90"]},"godfather":{"id":"godfather","name":"教父","sourceTitle":"教父","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%95%99%E7%88%B6","checkedAt":"2026-11-17","ability":"在你的首个夜晚，你会得知有哪些外来者角色在场。 如果有外来者在白天死亡，你会在当晚被唤醒并且你要选择一名玩家：他死亡。[-1或+1外来者]","mechanics":["首夜得知实际在场的外来者角色，设置增加或减少一名外来者。","外来者因任意原因在白天死亡都可能触发当晚额外杀人，不限于处决；同一天死多名外来者仍只发动一次。","夜晚死亡不触发，公开夜死人数也不自动证明教父存在；须联立其他夜间死亡来源。"],"qa":[],"interactions":[{"with":["异端分子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["戏子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"}],"tips":["结合已知外来者与白天死亡安排额外攻击。","对抗时同时盘外来者增减和额外死亡来源。"],"counterplay":["外来者白天能力死亡也可触发；应对时别把触发条件缩成只有外来者处决死亡。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗教父"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%95%99%E7%88%B6","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%95%99%E7%88%B6"]},"devils_advocate":{"id":"devils_advocate","name":"恶魔代言人","sourceTitle":"魔鬼代言人","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E9%AD%94%E9%AC%BC%E4%BB%A3%E8%A8%80%E4%BA%BA","checkedAt":"2026-11-17","ability":"每个夜晚，你要选择一名存活的玩家（与上个夜晚不同）：如果明天白天他被处决，他不会死亡。","mechanics":["每个夜晚，恶魔代言人需要选择一名存活的玩家，保护他不会因处决而死亡。在下一个白天，如果该玩家被处决，处决会成功但该玩家依然存活。","恶魔代言人不能连续两个夜晚选择同一名玩家，无论该玩家是否从处决中被救出，并且恶魔代言人也不能选择被当作死亡的僵怖。","处决仍发生但被保护者可不死亡；这不等于无人处决。不能连续两晚同选，即使上一晚保护未实际救人。"],"qa":[],"interactions":[],"tips":["预判恶魔受处决风险，不能连续同保。","对抗时结合其他不死来源，而非看一次未死就认红。","结合连续两天的处决未死、具体保护来源和实际角色变化排查恶魔；不能只凭一次处决未死就排除恶魔。"],"counterplay":["应对时可利用不能连续同保的限制，但要同时排除水手、弄臣等自身不死来源。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗魔鬼代言人"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E9%AD%94%E9%AC%BC%E4%BB%A3%E8%A8%80%E4%BA%BA","https://wiki.biligame.com/jbzlbwgwjcygf/%E9%AD%94%E9%AC%BC%E4%BB%A3%E8%A8%80%E4%BA%BA"]},"assassin":{"id":"assassin","name":"刺客","sourceTitle":"刺客","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%88%BA%E5%AE%A2","checkedAt":"2026-11-11","ability":"每局游戏限一次，在夜晚时*，你可以选择一名玩家：他死亡，即使因为任何原因让他不会死亡。","mechanics":["每局游戏限一次，在夜晚，刺客能杀死一名玩家。即使该玩家受到了包括角色能力在内的任何方式的保护而免于死亡，也依然会死亡。","刺客的能力如常受到醉酒和中毒的影响。","如果刺客攻击了莽夫，莽夫会死去并转变为邪恶阵营。","如果刺客攻击了尚未触发能力的僵怖（不论因为什么理由），僵怖会死去，但在死后触发能力且仍存活。"],"qa":[],"interactions":[],"tips":["把唯一一次穿透击杀留给恶魔难处理的目标。","与恶魔协调避免重复攻击浪费。"],"counterplay":["穿透保护的死亡不说明保护角色是假；应对时一局一次，已消耗后不能重复用刺客解释。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","对抗刺客"]},"mastermind":{"id":"mastermind","name":"主谋","sourceTitle":"主谋","source":"https://wiki.biligame.com/bloodontheclocktower/%E4%B8%BB%E8%B0%8B","checkedAt":"2026-11-11","ability":"如果恶魔因为死于处决而因此导致游戏结束时，再额外进行一个夜晚和一个白天。在那个白天如果有玩家被处决，他的阵营落败。","mechanics":["如果最后一名存活的恶魔死于处决，游戏继续。玩家们不会得知刚死去的是恶魔。在下一个白天，如果一名善良玩家被处决——无论该玩家是否死于处决——邪恶阵营获胜。如果一名邪恶玩家被处决，或者没有人被处决，则善良阵营获胜。","已死亡的恶魔无法进行攻击，如常失去自己的能力。在这个额外的夜晚和白天，其他角色的能力会正常生效。","如果恶魔死亡且只剩余两名存活玩家，游戏仍然会额外进行一天——邪恶阵营不会因为只剩两名存活玩家而获胜，而善良阵营也不会因为杀死了恶魔而获胜。主谋的能力为“额外进行一天一夜”，此能力会覆盖游戏常规规则。"],"qa":[],"interactions":[{"with":["哈迪寂亚"],"text":"如果哈迪寂亚死于处决，且主谋存活，当晚哈迪寂亚要选择三名善良玩家：如果他们都选择存活，邪恶阵营获胜。否则，善良阵营获胜。","kind":"jinx"},{"with":["痢蛭"],"text":"如果主谋存活且痢蛭的宿主死于处决，痢蛭存活但失去能力。","kind":"jinx"},{"with":["炼金术士"],"text":"如果炼金术士本应获得主谋的能力，那么他不会拥有该能力并改为主谋一定不在场。","kind":"jinx"},{"with":["亡
