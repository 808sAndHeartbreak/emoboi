i.biligame.com/bloodontheclocktower/%E6%97%A0%E7%A5%9E%E8%AE%BA%E8%80%85","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%97%A0%E7%A5%9E%E8%AE%BA%E8%80%85"]},"alsaahir":{"id":"alsaahir","name":"戏法师","sourceTitle":"戏法师","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%88%8F%E6%B3%95%E5%B8%88","checkedAt":"2026-11-11","ability":"每个白天，你可以公开进行一次谁是爪牙，谁是恶魔的猜测。如果你猜对，善良阵营获胜。","mechanics":["戏法师的猜测需要在白天且公开进行。他不需要每个白天都进行猜测。","其他玩家也可以假装自己是戏法师来进行猜测。如同杂耍艺人或造谣者，说书人也需要配合假装那名玩家是戏法师。","如果戏法师猜对了谁是爪牙，谁是恶魔，游戏会立刻结束。这需要戏法师一次性猜中所有恶魔和爪牙。","戏法师不需要猜测恶魔和爪牙的具体角色是什么。","如果有多于一名恶魔在场，戏法师也需要猜中全部的恶魔。","如果一名玩家既是恶魔也是爪牙，例如军团，戏法师需要猜测这名玩家是恶魔才算猜对。","一旦戏法师猜测完毕，他在当天就不能更改自己的猜测结果或是再次进行猜测。","戏法师也需要猜出所有属于善良阵营的恶魔和爪牙，但他不需要猜中邪恶的旅行者。","如果在游戏中玩家的阵营发生了变化，戏法师需要猜测的是当前的邪恶角色所属玩家，而非游戏开始时的邪恶角色所属玩家。"],"qa":[],"interactions":[{"with":["维齐尔"],"text":"说书人不会宣布维齐尔在场。","kind":"jinx"}],"tips":["按每日新信息调整完整爪牙、恶魔猜测。","未获胜只排该次完整猜测，不逐个认好。"],"counterplay":["假跳也可每天公开猜；未胜不直接排除猜测里的每一个单独身份。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成戏法师"]},"pixie":{"id":"pixie","name":"小精灵","sourceTitle":"小精灵","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%B0%8F%E7%B2%BE%E7%81%B5","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你会得知一个在场的镇民角色。如果你“疯狂”地证明你是该角色，当他死亡时你获得该角色的能力。","mechanics":["在首个夜晚，小精灵会得知一个在场的镇民角色。由说书人来决定他得知的是哪个镇民角色。小精灵不会知道哪名玩家是这个角色。","如果小精灵假装他是这个镇民，他会在对应的镇民玩家死亡时获得这个镇民角色的能力。他可以只在某天里声称自己是这个角色，也可以每天都假装自己是这个角色，或者指责那个镇民玩家说他是骗子——由说书人来判断小精灵是否有尝试在“疯狂”地证明自己是这个角色。","当那个镇民玩家死亡时，小精灵不会得知这一信息，也不会被告知自己获得了新的能力。他可能会由于自己在夜晚被唤醒并获得信息或是被要求选择玩家，从而间接得知自己获得了能力。","如果小精灵得知的角色所对应的玩家他的角色发生了变化，并随后死亡，小精灵会获得他得知的那个角色的能力，而非那名玩家死亡时的角色的能力。"],"qa":[],"interactions":[{"with":[],"text":"只要小精灵在那名玩家死亡时清醒健康，且说书人判断他足够疯狂，便能获得他所得知的那个镇民角色的能力（不一定是标记了“疯狂”的那名玩家的角色能力，小精灵可以以此获得一个不在场的镇民角色能力）。","kind":"detail"}],"tips":["明确临摹角色并满足疯狂，再核对原角色死亡时点。","对跳不必直接视为邪恶。"],"counterplay":["邪恶可在对跳失败后改口小精灵；应对时核对所知角色、疯狂过程与能力取得时点。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成小精灵"]},"shugenja":{"id":"shugenja","name":"修行者","sourceTitle":"修行者","source":"https://wiki.biligame.com/bloodontheclocktower/%E4%BF%AE%E8%A1%8C%E8%80%85","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你会得知距离最近的邪恶玩家位于你的顺时针还是逆时针方向。如果两侧的邪恶玩家与你距离相等，你得知的信息由说书人决定。","mechanics":["距离最近的邪恶玩家，就是与修行者之间坐着的玩家数量最少的邪恶玩家。","如果修行者顺时针方向上最近的邪恶玩家与修行者之间的玩家数量，等同于修行者逆时针方向上最近的邪恶玩家与修行者之间的玩家数量，那么就是“修行者两侧的邪恶玩家与他的距离相等”。","如果修行者两侧的邪恶玩家与他的距离相等，由说书人来决定向修行者给出什么样的信息。说书人可以决定修行者会得知的信息是顺时针还是逆时针。","修行者不会知道他所得知的信息是真实结果，还是由说书人决定的结果。","修行者不会得知他与最近的邪恶玩家之间的具体距离。","说书人与修行者关于信息的交流方式可以是用手指指向与他信息相符的方向，或是其他提前商定一致的信息方式。"],"qa":[],"interactions":[],"tips":["以方向作起点而非认证另一侧全好。","两侧等距时可能得到任意方向。"],"counterplay":["假方向可保护邪恶邻座；应对时同时计算两侧等距情形，不把反方向所有人认好。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成修行者"]},"huntsman":{"id":"huntsman","name":"巡山人","sourceTitle":"巡山人","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%B7%A1%E5%B1%B1%E4%BA%BA","checkedAt":"2026-11-17","ability":"每局游戏限一次，在夜晚时，你可以选择一名存活的玩家：如果你选中了落难少女，她会变成一个不在场的镇民角色。[+落难少女]","mechanics":["巡山人在场要求加入落难少女：原配置已含落难少女时不用重复添加；若原本不含，加入并替换一个镇民。","正确选中落难少女会使其变成一个不在场镇民；落难少女也可能在没有巡山人的局中单独在场。"],"qa":[],"interactions":[{"with":[],"text":"落难少女被选中后角色变为不在场的镇民角色，玩家的角色类型也会跟着改变，而不仅仅只是获得镇民的能力。","kind":"detail"},{"with":[],"text":"拥有落难少女能力的其他角色被巡山人选择，该玩家并不会变成一个不在场的镇民角色。","kind":"detail"},{"with":["侍臣"],"text":"如果侍臣让落难少女醉酒，然后巡山人选中落难少女，他变为一个新的角色，这名原落难少女玩家仍然会继续醉酒。","kind":"interaction"},{"with":["教父","方古"],"text":"如果被巡山人选中的落难少女玩家改变的角色后在白天死亡，教父无法在晚上被唤醒杀人；方古不能转化到该玩家身上。该玩家不再是落难少女，所以不再是外来者。","kind":"interaction"},{"with":["提线木偶"],"text":"如果巡山人在场，落难少女不会是提线木偶。不过，巡山人可能是提线木偶。","kind":"interaction"},{"with":["痢蛭"],"text":"即使落难少女是宿主，他仍然能被巡山人改变，但仍然继续中毒。","kind":"interaction"},{"with":["咖啡师"],"text":"如果落难少女被选中，他仍然只会改变角色一次。","kind":"interaction"},{"with":["提线木偶"],"text":"如果提线木偶抽到了巡山人，在设置调整阶段会增加落难少女。","kind":"jinx"}],"tips":["谨慎寻找落难少女并保留一次机会。","别要求她为配合你而向全场公开暴露。"],"counterplay":["邪恶可配合假落难少女编造被救；应对时不能因双方互认就省略真实角色变化验证。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成巡山人"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%B7%A1%E5%B1%B1%E4%BA%BA","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%B7%A1%E5%B1%B1%E4%BA%BA"]},"cultleader":{"id":"cultleader","name":"异教领袖","sourceTitle":"异教领袖","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%BC%82%E6%95%99%E9%A2%86%E8%A2%96","checkedAt":"2026-11-11","ability":"每个夜晚，你会转变为与你邻近的一名存活的玩家的阵营。 每个白天，你可以提议所有玩家加入你的教派，如果所有善良玩家同意加入，你的阵营获胜。","mechanics":["在每个夜晚结束时，异教领袖会转变为一名邻近存活玩家的阵营。","每个白天限一次，异教领袖可以公开创立一个教派。如果所有善良玩家投票加入教派，游戏立刻结束，异教领袖的阵营获胜。","异教领袖可以在一天的任何时候创立教派。","投票加入教派不需要消耗投票标记。","玩家可以在任何时候说任何事情，所以当玩家要伪装异教领袖的时候，他可以假装要创立一个教派。"],"qa":[],"interactions":[{"with":["麻脸巫婆"],"text":"被麻脸巫婆创造的邪恶异教领袖无法因为自身能力转变为善良阵营。","kind":"jinx"},{"with":["科学怪人"],"text":"如果恶魔拥有异教领袖的能力，他无法因为该能力转变为善良阵营。","kind":"jinx"}],"tips":["逐夜记当前阵营与邻居变化，提议教派前评估风险。","同意加入不直接认证善良。"],"counterplay":["假教派可分散讨论时间；应对时在加入前判断领袖当前阵营，失败也不直接认证谁邪恶。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成异教领袖"]},"poppygrower":{"id":"poppygrower","name":"罂粟种植者","sourceTitle":"罂粟种植者","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E7%BD%82%E7%B2%9F%E7%A7%8D%E6%A4%8D%E8%80%85","checkedAt":"2026-11-17","ability":"爪牙和恶魔互相不认识。如果你死亡，当晚他们会互相认识。","mechanics":["有效时爪牙和恶魔不互认，恶魔通常仍有不在场角色。死亡时能力有效才会在相应夜晚互认；中途醉毒或变成其他角色不立即触发互认。","与食人族同池时，后者在其处决死亡时接获能力，可能继续阻止互认。邪恶旅行者的信息另算。","早期互动和后续协作变化只作倾向，不能假设红方自始协调或一直不知道队友。"],"qa":[],"interactions":[{"with":[],"text":"拥有爪牙或恶魔角色的玩家在罂粟种植者死亡时相互认识，无论阵营和生/死状态。","kind":"detail"},{"with":[],"text":"将罂粟种植者变成另一个角色，或罂粟种植者死亡时处于中毒或醉酒状态，将不会导致爪牙/恶魔互认。","kind":"detail"},{"with":["食人族","小精灵"],"text":"如果罂粟种植者被处决并被食人族吃掉或已经被足够疯狂的小精灵知晓，食人族或小精灵将在罂粟种植者死亡的同时获得的罂粟种植者能力并阻止恶魔/爪牙互认。","kind":"interaction"},{"with":["军团"],"text":"军团玩家不会知道其他军团玩家是谁，但需要单独唤醒他们以提供他们的三个不在场角色。","kind":"interaction"},{"with":["疯子"],"text":"剧本里同时有罂粟种植者时，可以向疯子假装有罂粟种植者在场，从而在首夜不告诉疯子，他的“爪牙”是谁。","kind":"interaction"},{"with":["数学家"],"text":"首夜不会检测恶魔/爪牙没有互认，因为他们不是通过自身能力获得这些信息，而是通过他们的角色类型。 然而，数学家会检测到罂粟种植者在死亡时中毒/醉酒并因此不允许恶魔/爪牙互认。","kind":"interaction"},{"with":["间谍"],"text":"如果罂粟种植者拥有能力，间谍无法查看魔典。","kind":"jinx"},{"with":["寡妇"],"text":"如果罂粟种植者拥有能力，寡妇无法查看魔典。","kind":"jinx"},{"with":["召唤师"],"text":"如果罂粟种植者在第三个夜晚存活，由召唤师来选择创造哪种恶魔，由说书人来决定哪名玩家发生转变。","kind":"jinx"},{"with":["鸩"],"text":"如果鸩选择了罂粟种植者，罂粟种植者不会因为鸩的能力中毒。","kind":"jinx"},{"with":["孟婆"],"text":"如果孟婆选中了罂粟种植者，罂粟种植者会得知自己被孟婆选中并死亡。","kind":"jinx"}],"tips":["考虑隐藏以延迟邪恶互认。","死亡后观察协作变化，但社交行为只提供倾向。"],"counterplay":["邪恶可用此名解释互不认识的行为；应对时社交协作迹象只提供倾向。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成罂粟种植者"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E7%BD%82%E7%B2%9F%E7%A7%8D%E6%A4%8D%E8%80%85","https://wiki.biligame.com/jbzlbwgwjcygf/%E7%BD%82%E7%B2%9F%E7%A7%8D%E6%A4%8D%E8%80%85"]},"fisherman":{"id":"fisherman","name":"渔夫","sourceTitle":"渔夫","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B8%94%E5%A4%AB","checkedAt":"2026-11-17","ability":"每局游戏限一次，在白天时，你可以让说书人给你一些能帮助你的阵营获胜的建议。","mechanics":["渔夫自由选择什么时候使用他的能力。","当渔夫拜访说书人时，说书人会给他一条建议。","说书人的建议不需要是事实。他是说书人觉得能帮助渔夫获胜的策略指示，如果他这样做的话。","如果渔夫醉酒或中毒，说书人可以给渔夫一条糟糕的建议。"],"qa":[],"interactions":[],"tips":["在局势清晰、建议能落实时使用，保存建议原文。","不要把行动建议改写成无条件身份查验。"],"counterplay":["假建议能驱动任意行动；应对时先把建议作为自述，不能提升为说书人公开命令。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","伪装成渔夫"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E6%B8%94%E5%A4%AB","https://wiki.biligame.com/jbzlbwgwjcygf/%E6%B8%94%E5%A4%AB"]},"acrobat":{"id":"acrobat","name":"杂技演员","sourceTitle":"杂技演员","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%9D%82%E6%8A%80%E6%BC%94%E5%91%98","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：如果当晚他醉酒或中毒，你死亡。","mechanics":["除首个夜晚之外的每个夜晚，杂技演员要选择一名玩家。如果该玩家在当晚保持清醒健康，什么也不会发生；如果该玩家醉酒或中毒，杂技演员就会死亡。","如果杂技演员自己醉酒或中毒，则不会因自身能力而死亡。","杂技演员可以选择任何玩家——无论存活还是死亡的玩家，也可以选择自己。","如果杂技演员选择的玩家在被选择时是清醒健康的，但在夜晚稍后阶段醉酒或中毒了，杂技演员仍会死亡。","杂技演员不会得知所选玩家是醉酒、中毒，还是两者皆有。","酒鬼（Drunk）会被杂技演员当作醉酒（drunk）（双关）。"],"qa":[],"interactions":[],"tips":["选值得核验醉毒的人，提前记目标。","自己失效或其他夜死会干扰用死亡判断目标状态。"],"counterplay":["恶魔可杀假杂技演员的同盟制造查毒假象；应对时不能把夜死单独当目标醉毒证明。"],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"snitch":{"id":"snitch","name":"告密者","sourceTitle":"告密者","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%91%8A%E5%AF%86%E8%80%85","checkedAt":"2026-11-11","ability":"爪牙会在其首个夜晚得知三个伪装。","mechanics":["告密者使得爪牙能够在游戏的首个夜晚得知三个不在场的角色，如同恶魔一样。","爪牙得知的三个不在场角色可能与恶魔得知的相同，也可能不同。","多名爪牙可能会得知不同的角色，也可能得知相同的角色。"],"qa":[],"interactions":[{"with":["戏子（改）"],"text":"告密者不会因为戏子（改）的能力醉酒。","kind":"jinx"}],"tips":["注意邪恶方可能有充足安全伪装。","对跳与不对跳都只是线索，不直接认证阵营。"],"counterplay":["邪恶可事后根据已报身份选择安全伪装；应对时越晚出现的声明越应核对独立证据。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成告密者"]},"puzzlemaster":{"id":"puzzlemaster","name":"解谜大师","sourceTitle":"解谜大师","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%A7%A3%E8%B0%9C%E5%A4%A7%E5%B8%88","checkedAt":"2026-11-11","ability":"一名玩家醉酒，即使你已死亡。每局游戏限一次，你可以猜测谁是那个醉酒的玩家，如果猜对了，你会得知谁是恶魔，但如果猜错了，你会得知错误的“谁是恶魔”信息。","mechanics":["会有一名玩家因为解谜大师的能力在整局游戏中醉酒。通常来说会是镇民，也有可能会是外来者。该玩家不会知道自己醉酒了。","每局游戏限一次，解谜大师可以猜测谁是那名醉酒的玩家。可以进行公开猜测，也可以私下找说书人猜测。不论他猜了什么，说书人都会私下告诉解谜大师一名玩家的名字。如果解谜大师猜测正确，他得知的会是恶魔玩家。如果解谜大师猜测错误，他得知的则是非恶魔玩家。","解谜大师不会得知自己的猜测正确与否。","只有猜中因解谜大师的能力醉酒的玩家才算作猜测正确。猜测因为其他原因醉酒的玩家不算猜测正确。","在解谜大师死亡后，他的能力造成的醉酒玩家会依然醉酒。已经死亡的解谜大师不能猜测，他这一部分的能力因为死亡而失去了。"],"qa":[],"interactions":[{"with":[],"text":"如果场上存在多名恶魔，只告诉解谜大师一名恶魔。优先告诉解谜大师当前存活的邪恶的恶魔。","kind":"detail"},{"with":["食人族"],"text":"如果食人族获得解谜大师的能力，会有某名玩家因此开始醉酒，直到其他玩家被处决并死亡。在此期间，食人族解谜大师可以猜测因其被醉酒的玩家并被告知恶魔。如果食人解谜大师在获得新的能力前就死亡，他会继续使那名玩家醉酒直到游戏结束。","kind":"interaction"}],"tips":["结合异常信息定位由你造成的特定醉酒者，勿把任意中毒者代入。","猜错会得到错误恶魔指认。"],"counterplay":["假指认恶魔可迫使团队处理好人；应对时先核对其所猜醉酒者与实际醉酒来源。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成解谜大师"]},"zealot":{"id":"zealot","name":"狂热者","sourceTitle":"狂热者","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%8B%82%E7%83%AD%E8%80%85","checkedAt":"2026-11-11","ability":"如果有大于等于五名玩家存活，你必须在所有提名中投票。","mechanics":["如果存活玩家数量为五人或更多，狂热者必须在所有提名中投票。如果只有四名或更少的玩家存活，狂热者可以自由选择是否参与投票。","在狂热者的能力中，旅行者的数量也计入存活玩家的数量内。","如果狂热者死亡，他可以像其他死亡玩家一样正常选择是否投票。","狂热者在流放中不是必须要举手赞成的。","即使狂热者认定自己醉酒或中毒，他也必须强制参与投票。","说书人没有义务提醒狂热者。狂热者必须为自己的投票行为负责。故意不参与投票将被认定为作弊。"],"qa":[],"interactions":[{"with":["食人族"],"text":"如果食人族获得了狂热者的能力，他会得知这一信息。","kind":"jinx"},{"with":["维齐尔"],"text":"维齐尔的能力可能会将狂热者当作邪恶阵营。","kind":"jinx"},{"with":["军团"],"text":"狂热者可能会被军团当作邪恶玩家。","kind":"jinx"}],"tips":["遵守存活人数达到五人的投票要求，提前参与提名讨论争取目标。","投票行为不直接证明角色。"],"counterplay":["人人投票也能被假跳模仿；应对时遵守行为不是身份认证，其他强制票规则也可能影响。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成狂热者"]},"damsel":{"id":"damsel","name":"落难少女","sourceTitle":"落难少女","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E8%90%BD%E9%9A%BE%E5%B0%91%E5%A5%B3","checkedAt":"2026-11-17","ability":"所有爪牙都知道落难少女在场。每局游戏限一次，任意爪牙可以公开猜测你是落难少女，如果猜对，你的阵营落败。","mechanics":["爪牙知道落难少女在场，不代表知道座位。公开猜测是爪牙阵营共享的每局一次，不是每名爪牙各一次。","早期伪装镇民或其他角色可为合理自保；不能仅凭其晚些更正外来者身份直接认定邪恶。"],"qa":[],"interactions":[{"with":[],"text":"如果落难少女玩家因巡山人变为具有设置调整能力的镇民，设置调整能力不会生效。","kind":"detail"},{"with":["僧侣"],"text":"僧侣只能在夜晚保护，并且针对的是恶魔而不是爪牙，所以僧侣的保护不会阻止爪牙正确猜测落难少女并结束游戏。除了，一个正在照顾小怪宝的爪牙在夜晚进行猜测，此时落难少女被僧侣保护，我将裁定在这种情况下游戏不会结束。（僧侣的保护能力能阻止恶魔通过触发落难少女的能力来获胜，即使这个能力来自于落难少女而不是恶魔。） 理发师 ：如果落难少女被交换，你不需要重新告知爪牙落难少女在场，尽管落难少女的能力已经重新进场，爪牙们会从之前的告知中继续知道落难少女在场。如果一名玩家之前不是爪牙，然后被交换为爪牙角色，他会被告知落难少女在场。","kind":"interaction"},{"with":["莽夫"],"text":"爪牙猜测莽夫是落难少女不会触发莽夫的阵营转换——爪牙没有使用自身能力选择莽夫。","kind":"interaction"},{"with":["陌客"],"text":"可以被当作爪牙并猜测落难少女，并结束游戏。如果你是陌客，也许不去猜测是最好的！理论上你可以在对应时刻将陌客当作爪牙并告诉他有落难少女在场，但请不要这样做。","kind":"interaction"},{"with":["猩红女郎","小恶魔"],"text":"如果恶魔死亡，并且猩红女郎/某个爪牙变为恶魔，他不能猜测落难少女。","kind":"interaction"},{"with":["女巫"],"text":"即使只有三名玩家存活，女巫失去能力，他仍然可以猜测落难少女军团 ：军团由于被当作爪牙而能够猜测落难少女。","kind":"interaction"},{"with":["小怪宝"],"text":"所有爪牙，包括那名正在照看宝宝而因此还被当作恶魔的爪牙，都会得知落难少女在场并能够进行猜测。","kind":"interaction"},{"with":["沙巴洛斯"],"text":"如果落难少女被复活，爪牙同样不会被重新告知有落难少女在场，他们在游戏开始时被告知就足够了。如果场上出现之前没有被告知过的新爪牙，他会被告知。因此，最好不要让沙巴洛斯复活落难少女。如果在落难少女之前猜测机会已经使用过，在落难少女复活的新场合中，猜测次数重置，因此爪牙还有一次猜测机会。","kind":"interaction"},{"with":["侍女"],"text":"落难少女玩家不是因为自身能力而醒来得知自己的新角色，所以不会被侍女探查。","kind":"interaction"},{"with":["水手"],"text":"如果落难少女因巡山人变为成水手，他在当晚不能选择与其他玩家喝酒，因为水手的夜晚顺序已经过去了。因此这名（原落难少女）水手玩家在当晚和下一个白天都不会死亡。","kind":"interaction"},{"with":["麻脸巫婆"],"text":"如果麻脸巫婆创造了落难少女，改为由说书人来决定哪一名玩家变成落难少女。","kind":"jinx"},{"with":["间谍","寡妇"],"text":"如果间谍/寡妇正在场或曾经在场，落难少女中毒。","kind":"jinx"},{"with":["戏子（改）"],"text":"落难少女不会因为戏子（改）的能力醉酒。","kind":"jinx"}],"tips":["谨慎保密，只在必要时联系高度可信的人。","爪牙猜测机会是全局共用一次。"],"counterplay":["邪恶可用此名回避报身份；应对时避免通过公开逼问反而暴露真正落难少女。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成落难少女"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E8%90%BD%E9%9A%BE%E5%B0%91%E5%A5%B3","https://wiki.biligame.com/jbzlbwgwjcygf/%E8%90%BD%E9%9A%BE%E5%B0%91%E5%A5%B3"]},"hatter":{"id":"hatter","name":"帽匠","sourceTitle":"帽匠","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%B8%BD%E5%8C%A0","checkedAt":"2026-11-11","ability":"如果你死亡，当晚爪牙和恶魔玩家可以选择变成新的爪牙和恶魔角色。","mechanics":["帽匠的能力使得所有邪恶角色的玩家可以选择变成与自己原本角色类型相同的角色。","这些玩家可以选择不改变自己的角色。","如果一名玩家变成了新的角色，他会获得新角色的能力，即使是一项“在你的首个夜晚”能力或是一项“每局游戏限一次”但此前已被其他玩家使用过的能力。","一旦玩家的角色变化，他此前的角色能力不再在本局游戏中生效。","如果一名玩家在死亡后再变成帽匠，邪恶角色的玩家无法在当晚因此改变自己的角色。","一旦某名玩家选择变成了某个角色后，其他玩家便无法选择变成同一角色。如果某名玩家选择变成了一个已在场的角色，那么那个角色对应的玩家必须选择变成一个新的角色。"],"qa":[],"interactions":[{"with":[],"text":"由说书人决定恶魔和爪牙在茶会中选择更换角色的先后顺序，且需要注意控制茶会的时间。","kind":"detail"},{"with":[],"text":"如果帽匠在夜晚时由于恶魔的攻击而死亡，在茶会中产生的新恶魔在当晚无法再次攻击。","kind":"detail"},{"with":["召唤师"],"text":"如果召唤师创造了第二个存活的恶魔，当晚的死亡由说书人决定。","kind":"jinx"},{"with":["军团"],"text":"如果帽匠创造了军团，所有邪恶玩家会变成军团。如果军团在场，帽匠失去能力。","kind":"jinx"},{"with":["小怪宝"],"text":"如果帽匠死亡，恶魔选择了小怪宝，则还需要选择变成一个爪牙角色。","kind":"jinx"},{"with":["利维坦"],"text":"利维坦不能在第五天之后加入游戏。","kind":"jinx"},{"with":["梼杌"],"text":"如果梼杌变成了其他角色，因为梼杌而失去能力的爪牙会立即死亡。","kind":"jinx"}],"tips":["避免给邪恶方无代价调整组合。","死后主动收集新能力迹象，分开旧角色与新角色时段。"],"counterplay":["假跳可以把后续异常归于换角；应对时只采用明确通知或有实际依据的新机制。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成帽匠"]},"golem":{"id":"golem","name":"魔像","sourceTitle":"魔像","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E9%AD%94%E5%83%8F","checkedAt":"2026-11-17","ability":"每局游戏你只能发起提名一次。当你发起提名时，如果被你提名的玩家不是恶魔，他死亡。","mechanics":["每局只能提名一次；有效能力提名非恶魔会使其死亡，能力杀人不是处决。","无事发生只有在真魔像、能力正常、目标没有其他免死效果等前提下才能支持目标是恶魔，不可直接取逆命题。"],"qa":[],"interactions":[{"with":["陌客"],"text":"可以被当作恶魔，从而免于因魔像的能力而死。","kind":"interaction"},{"with":["修补匠"],"text":"可以令修补匠在适当时刻死亡以（让对方）模拟魔像。","kind":"interaction"},{"with":["女巫"],"text":"如果健康清醒且被女巫诅咒的魔像提名非恶魔玩家，说书人来决定谁的能力优先触发。但通常是让魔像先触发，这样可以保证两个角色的能力都能正常生效。如果魔像提名的是女巫，那么说书人就只能从其中选择一个能力来进行触发了（因为一个效果触发后导致一名玩家死亡，另一个效果就无法被触发了）。","kind":"interaction"},{"with":["咖啡师"],"text":"即使受到咖啡能力生效两次效果的影响，魔像仍被限制为每局游戏只能提名一次。但当魔像提名时，被提名玩家会死亡两次。所以受咖啡行动两次效果影响的魔像可以在一次提名中直接杀死一个未使用能力的弄臣。如果魔像已经使用了他唯一的一次提名机会，那么咖啡师对他没有任何效果。","kind":"interaction"}],"tips":["把唯一提名留给值得验证的对象。","未死要先排除失效、保护和误登记，不能一律认恶魔。"],"counterplay":["假魔像可提名恶魔同伴并解释未死；应对时也须保留真魔像失效、保护与登记干扰。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成魔像"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E9%AD%94%E5%83%8F","https://wiki.biligame.com/jbzlbwgwjcygf/%E9%AD%94%E5%83%8F"]},"ogre":{"id":"ogre","name":"食人魔","sourceTitle":"食人魔","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%A3%9F%E4%BA%BA%E9%AD%94","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你要选择除你以外的一名玩家：你转变为他的阵营，即使你已醉酒或中毒，但你不知道你转变后的阵营。","mechanics":["食人魔选定了玩家之后，他的目标就不会发生变化，即使他在选择时醉酒或中毒也是如此。","食人魔会在他的首个夜晚选择玩家后立即转变为那名玩家的阵营，即使他在选择时醉酒或中毒也是如此。","说书人不会告知食人魔转变后的阵营。","如果随后食人魔的阵营因为其他方式发生变化，食人魔会如常得知他转变后的阵营。","如果食人魔在游戏中途被创造，他需要在当晚选择一名玩家，并转变为那名玩家的阵营。"],"qa":[],"interactions":[{"with":["陌客"],"text":"如果陌客被食人魔当作邪恶阵营，食人魔会得知自己转变为邪恶。","kind":"jinx"},{"with":["间谍"],"text":"间谍必定被食人魔当作邪恶阵营。","kind":"jinx"},{"with":["麻脸巫婆"],"text":"被麻脸巫婆创造的邪恶食人魔无法因为自身能力转变为善良阵营。","kind":"jinx"},{"with":["科学怪人"],"text":"恶魔无法拥有食人魔的能力。","kind":"jinx"},{"with":["蛊雕"],"text":"如果“蛊毒”玩家被食人魔当作邪恶的蛊雕，食人魔会得知自己转变为邪恶。","kind":"jinx"}],"tips":["记首夜朋友与当时阵营信息，按自身可能阵营规划。","朋友后来转阵营不等于自己自动跟随。"],"counterplay":["邪恶可向好人表示忠诚取得信任；应对时朋友关系不自动认证角色或目前阵营。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成食人魔"]},"plaguedoctor":{"id":"plaguedoctor","name":"瘟疫医生","sourceTitle":"瘟疫医生","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%98%9F%E7%96%AB%E5%8C%BB%E7%94%9F","checkedAt":"2026-11-11","ability":"当你死亡时，说书人会获得一个爪牙能力。","mechanics":["由说书人来选择获得哪一个爪牙的能力。","瘟疫医生的能力效果会在剩余的游戏时间里持续生效。","说书人不会有其他变化——他不会转为邪恶阵营，不会成为玩家，不会成为其他能力的合法目标，不能参与投票，也不能发起提名。","如果瘟疫医生在死亡时醉酒中毒，说书人不会获得爪牙能力，即使瘟疫医生在之后恢复清醒健康。"],"qa":[],"interactions":[{"with":["男爵"],"text":"如果说书人获得了男爵的能力，改为至多两名玩家会变成外来者。","kind":"jinx"},{"with":["炸弹人"],"text":"如果说书人本应获得炸弹人的能力，改为一名玩家会变成炸弹人。","kind":"jinx"},{"with":["邪恶双子"],"text":"如果说书人本应获得邪恶双子的能力，改为一名玩家会变成邪恶双子。","kind":"jinx"},{"with":["提线木偶"],"text":"如果说书人本应获得提线木偶的能力，改为一名与恶魔邻近的善良玩家变成提线木偶。","kind":"jinx"},{"with":["恐惧之灵","哥布林","猩红女郎","间谍","亡魂"],"text":"如果说书人本应获得这些爪牙之一的能力，改为一名爪牙玩家获得此能力，且他会得知此事。","kind":"jinx"},{"with":["赶尸人","狐媚娘","养蛊人","蛊雕"],"text":"如果说书人本应获得这些爪牙之一的能力，改为一名爪牙玩家获得此能力，且他会得知此事。","kind":"jinx"}],"tips":["尽量生存以缩短新增爪牙能力的作用期。","死亡后结合新迹象判断获得哪项能力。"],"counterplay":["假跳可借恐惧额外爪牙来逃处决；应对时围绕真实名额与死亡后的新迹象判断。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成瘟疫医生"]},"heretic":{"id":"heretic","name":"异端分子","sourceTitle":"异端分子","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%BC%82%E7%AB%AF%E5%88%86%E5%AD%90","checkedAt":"2026-11-11","ability":"对调胜负结果，即使你已死亡。","mechanics":["如果一局游戏会使得善良阵营获胜，异端分子会导致所有善良玩家落败，且邪恶玩家获胜。","如果一局游戏将由邪恶阵营获胜而结束，邪恶玩家落败，善良玩家获胜。","异端分子的能力会应用于所有的胜利条件，包括只剩两名非旅行者玩家存活，所有恶魔死亡，或一项能力导致的游戏结束。","异端分子的能力在他死亡时仍然正常生效，但在他醉酒中毒时不会生效。"],"qa":[],"interactions":[{"with":["将军"],"text":"将军的信息应该将异端分子考虑在内。如果善良阵营已经非常接近找出并处决恶魔，但异端分子在场，因为处决恶魔会导致邪恶阵营获胜，所以应该展示邪恶更有优势。","kind":"interaction"},{"with":["哲学家"],"text":"如果哲学家选择异端分子，随后死亡，哲学家仍然保留这个能力，因为那是“死后能力保留”的能力。然而，原始异端分子也会在哲学家死亡时恢复清醒，这意味着游戏中有两个正常生效的异端分子能力。","kind":"interaction"},{"with":["邪恶双子"],"text":"异端分子的能力只有在游戏因为满足某个胜利条件而结束的时候才会生效。所以邪恶双子将会阻止因善良阵营获胜而结束游戏，但如果游戏因邪恶阵营获胜而结束，异端分子能力会生效并转为让善良阵营获胜。","kind":"interaction"},{"with":["教父"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["间谍"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["寡妇"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["麻脸巫婆"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["痢蛭"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["男爵"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["科学怪人"],"text":"恶魔无法拥有异端分子的能力。","kind":"jinx"},{"with":["狐媚娘"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"}],"tips":["谨慎隐藏胜负反转，评估恶魔自杀风险。","必须按本局有效反转数量与时点判断胜负。"],"counterplay":["邪恶可在终局谎称反转以诱导放过恶魔；应对时根据独立信息保留不同胜负分支。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成异端分子"]},"hermit":{"id":"hermit","name":"隐士","sourceTitle":"隐士","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%9A%90%E5%A3%AB","checkedAt":"2026-11-11","ability":"你拥有所有外来者能力。[-0~1外来者]","mechanics":["隐士同时拥有角色列表中所有其他外来者的能力。他不会拥有不存在于角色列表中的外来者能力。","即使角色列表包含超过4名外来者，隐士也会拥有所有外来者的能力。","如果有一名外来者的能力类型是死后能力保留，例如陌客，隐士会在死亡时保留他的能力，但不保留其他类型的能力。","如果隐士拥有酒鬼的能力，他不会得知自己是隐士，而他也同时拥有其他外来者的能力。一个同时拥有酒鬼和陌客能力的隐士可以被当作一名邪恶角色。","如果隐士获得了具有相克规则的角色能力，那么这条相克规则对隐士也适用。","如果你这样做了，隐士可以作为恶魔的伪装之一。"],"qa":[{"q":"隐士就是陌客吗？","a":"不是。隐士Hermit拥有本剧本其他外来者能力；陌客Recluse具有误登记能力。"},{"q":"外来者能力相互冲突怎么办？","a":"开局确认本局裁定，并把裁定记进本局规则。拥有相应能力时也承接其相克与死亡后保留条件，不能把所有能力一律永久保留。"}],"interactions":[{"with":[],"text":"（如同角色简介中所写）如果隐士获得了具有相克规则的角色能力，那么这条相克规则对隐士也适用。","kind":"detail"}],"tips":["先通读本剧本所有外来者技能，特别注意疯狂与败北条件。","拥有的仅限当前角色列表中的外来者能力。"],"counterplay":["声称隐士后仍应遵守其拥有的强制外来者行为；但规则冲突需先采用本局明确裁定。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成隐士"]},"politician":{"id":"politician","name":"政客","sourceTitle":"政客","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%94%BF%E5%AE%A2","checkedAt":"2026-11-11","ability":"如果你是对你的阵营落败负最大责任的人，你转变阵营并获胜，即使你已死亡。","mechanics":["当游戏结束时，如果政客是善良阵营落败负最大责任的人，政客会加入邪恶阵营并一起获胜。","当决定谁获胜的关键时候，政客玩家应当非常有影响力。简单的散布错误信息或投票善良玩家通常是不够的——他需要比任何一个其他的善良玩家起到让善良阵营落败的关键作用，同时最好也是比任何一个邪恶玩家的作用大。由说书人决定政客是否符合条件。","政客也可以和其他角色一样，以善良阵营获胜。","中毒或醉酒的政客不能转变阵营。","如果邪恶玩家的总数已经比初始设置多了一名，即使政客是对善良阵营落败负最大责任的人，由于圣洁之魂的存在，也不能转变阵营获胜。"],"qa":[],"interactions":[{"with":["麻脸巫婆"],"text":"被麻脸巫婆创造的邪恶政客无法因为自身能力转变为善良阵营。","kind":"jinx"},{"with":["维齐尔"],"text":"维齐尔的能力可能会将政客当作邪恶阵营。","kind":"jinx"},{"with":["科学怪人"],"text":"恶魔无法拥有政客的能力。","kind":"jinx"},{"with":["军团"],"text":"政客可能会被军团当作邪恶玩家。","kind":"jinx"}],"tips":["选择自己想争取的获胜路径。","需要关键责任而非随便撒谎一次，不要假定已保证转阵营。"],"counterplay":["公开搞破坏不保证符合“最大责任”；应对时把行为作为策略倾向，不用它认证政客身份。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","伪装成政客"]},"goblin":{"id":"goblin","name":"哥布林","sourceTitle":"哥布林","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%93%A5%E5%B8%83%E6%9E%97","checkedAt":"2026-11-11","ability":"如果你在被提名后公开声明自己是哥布林且在那个白天被处决，你的阵营获胜。","mechanics":["如果哥布林被处决，邪恶阵营获胜。","为了让这种情况发生，哥布林需要在被提名后，开始投票前告知其他玩家他是哥布林。他的公开宣言需要让所有人都听见，因为善良玩家必须清楚自己接下来的行为所带来的风险。","如果哥布林没有公布自己的角色就被处决了，那么哥布林死亡，游戏如常进行。","哥布林必须在被处决的当天宣布自己的角色，只有这样他的能力才会生效。在前一天或更早的时间里宣布不会产生效果。","任何玩家都可以在被提名时声称自己是哥布林。"],"qa":[],"interactions":[{"with":["瘟疫医生"],"text":"如果说书人本应获得哥布林的能力，改为一名爪牙玩家获得此能力，且他会得知此事。","kind":"jinx"},{"with":["洗脑师"],"text":"洗脑师可以选择将玩家洗脑成哥布林。","kind":"jinx"},{"with":["戏子"],"text":"戏子无法反转由哥布林的能力产生的胜负结果。","kind":"jinx"},{"with":["戏子（改）"],"text":"戏子（改）无法反转由哥布林的能力产生的胜负结果。","kind":"jinx"},{"with":["姑获鸟"],"text":"姑获鸟无法获得哥布林的能力。","kind":"jinx"}],"tips":["被提名后投票前明确公开声明，才有能力风险。","对抗时区分真哥布林与恶魔借名自保。"],"counterplay":["恶魔可以借哥布林声明自保；应对时决定是否处决仍需基于谁更可能是真恶魔。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗哥布林"]},"widow":{"id":"widow","name":"寡妇","sourceTitle":"寡妇","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%AF%A1%E5%A6%87","checkedAt":"2026-11-17","ability":"在你的首个夜晚，你能查看魔典并选择一名玩家：他中毒。随后，始终会有一名善良玩家知道寡妇在场。","mechanics":["首夜看魔典并选择一名玩家持续中毒，不是每夜更换一名目标；善良方的寡妇在场通知也是可记录的信息。","同一人的多夜错误反馈可以由该持续中毒解释；通知的缺失、自述与实际能力状态须分别核验，不能无依据盘整场任意多人同中毒。"],"qa":[{"q":"两个人都说收到寡妇通知，是否必有一个邪恶？","a":"不一定。声明可能编造、善良也可有策略性假报；须结合真实收到通知的时点及当时阵营。不要凭通知声明本身认证善良。"}],"interactions":[{"with":["罂粟种植者"],"text":"如果罂粟种植者拥有能力，寡妇无法查看魔典。","kind":"jinx"},{"with":["炼金术士"],"text":"如果炼金术士本应获得寡妇的能力，那么他不会拥有该能力并改为寡妇一定在场。每次处决后，存活的炼金术士可以公开猜测一名存活玩家是寡妇：如果猜对了，恶魔当晚必须选择寡妇。","kind":"jinx"},{"with":["落难少女"],"text":"如果寡妇正在场或曾经在场，落难少女中毒。","kind":"jinx"},{"with":["异端分子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["戏子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["戏子（改）"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"}],"tips":["利用魔典帮助队友并选择最有价值的长期毒位。","对抗时核对善良玩家收到的在场通知。"],"counterplay":["真寡妇知道大量准确身份，准确复述不认证善良；通知声明也需保留邪恶编造的可能。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗寡妇"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%AF%A1%E5%A6%87","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%AF%A1%E5%A6%87"]},"organgrinder":{"id":"organgrinder","name":"街头风琴手","sourceTitle":"街头风琴手","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%A1%97%E5%A4%B4%E9%A3%8E%E7%90%B4%E6%89%8B","checkedAt":"2026-11-11","ability":"所有玩家在投票时闭眼，且票数会秘密统计。 每个夜晚，你要选择自己是否醉酒直到下个黄昏。","mechanics":["当一名玩家被提名后，在投票时所有玩家都需要闭上眼睛。","说书人在计票时不会大声唱票，也不会在一次投票结束时告诉大家有多少玩家投了票。","说书人不会告诉大家某次提名是否导致了一名玩家“即将被处决”。","在提名阶段结束后，说书人宣布了哪名玩家被处决，和正常一样。","已死亡的玩家在有投票标记时能够如常投票，但仅限一次。","说书人无需对此进行额外说明，比如街头风琴手是否死亡或存活。当天夜晚，街头风琴手要再次选择自己醉酒或清醒。"],"qa":[],"interactions":[{"with":[],"text":"特定角色互动： 枪手 ：因为说书人能够决定在游戏中有哪些旅行者可以出场并被玩家选择作为自己的旅行者角色，因此避免枪手在有街头风琴手的剧本中出场是应对这两个角色的奇怪互动的最好方式。","kind":"detail"},{"with":["管家"],"text":"如果街头风琴手使得玩家需要闭眼投票，管家可以自由举手投票，但只在他的主人投票时他的票才会被统计。","kind":"jinx"},{"with":["炼金术士"],"text":"如果炼金术士获得街头风琴手的能力，街头风琴手一定在场。如果炼金术士和街头风琴手都是清醒的，改为他们都醉酒。","kind":"jinx"},{"with":["梼杌"],"text":"当梼杌被处决时，如果街头风琴手具有能力，说书人会宣布“无人被处决”。","kind":"jinx"}],"tips":["利用秘密投票限制票型信息，决定是否暂时自醉。","对抗时记录可观察结果，别补造隐藏票数。"],"counterplay":["应对时闭眼票不可由猜测补全；能力因醉毒消失的窗口应与原始投票记录分开。"],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"psychopath":{"id":"psychopath","name":"精神病患者","sourceTitle":"精神病患者","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E7%B2%BE%E7%A5%9E%E7%97%85%E6%82%A3%E8%80%85","checkedAt":"2026-11-17","ability":"每个白天，在提名开始前，你可以公开选择一名玩家：他死亡。 如果你被处决，提名你的玩家需要和你猜拳，只有你输了你才会死亡。","mechanics":["白天公开杀人须在提名开始前；此能力杀人不是处决，不给送葬者正常的处决结果。","被处决时只有与提名者猜拳失败才因该次处决死亡；猜拳平局或获胜不死，仍然发生过处决。","本局确认公开能力生效可形成强信息；单纯自称或喊技能但没有效果，不等于已认证其真实角色。"],"qa":[],"interactions":[{"with":["咖啡师"],"text":"“行动两次”的效果将允许精神病患者在白天杀死2人（咖啡师可能会被立即流放），但如果在接下来的这个白天精神病患者被处决，仍然只会进行一次猜拳。","kind":"interaction"},{"with":["屠夫"],"text":"每天都可以重新提名精神病患者来进行第二次处决并尝试杀死他。","kind":"interaction"},{"with":["恶魔代言人"],"text":"即使受到恶魔代言人的保护，精神病患者仍然应该进行猜拳，只有当他输了时，善良阵营才会发现精神病患者受到了恶魔代言人的保护，因为精神病患者没有死于一次“猜拳胜利”的处决。","kind":"interaction"},{"with":["弄臣","水手","茶艺师"],"text":"如果精神病患者的目标不能死亡，目标不会死亡。这会被数学家记录。","kind":"interaction"},{"with":["法官"],"text":"如果法官强制使对精神病患者的提名通过，这只能确保精神病患者被处决，并且将需要进行猜拳来确定他是否会死亡。","kind":"interaction"},{"with":["呆瓜","月之子"],"text":"如果精神病患者杀死他，他会在白天得知他的死亡，因此必须在同一天做出选择。","kind":"interaction"},{"with":["亡骨魔"],"text":"如果精神病患者被亡骨魔杀死并因此在死亡状态保留了他的能力，如果他在死亡状态被处决，则没有必要进行猜拳——他已经死亡，因此无论猜拳的结果如何都不会再次死亡。","kind":"interaction"},{"with":["小怪宝"],"text":"如果精神病患者正照看小怪宝，他会在被处决时死亡。","kind":"jinx"},{"with":["姑获鸟"],"text":"如果姑获鸟获得了精神病患者的能力，他会在被处决时死亡。","kind":"jinx"}],"tips":["权衡尽早公开连杀与隐藏蓄势。","对抗时别漏掉每日威胁，但猜拳未死仍要考虑保护。","善良视角通常仍优先找恶魔；公开爪牙若会立刻达成胜负条件，则把当天安全处置列为紧急行动。","已确认有效公开杀人可显著收窄其角色；仍须核对本剧本其他能力来源、阵营变化与实际裁定，别把所有日杀都认证成精神病患者。"],"counterplay":["善良炼金术士也可能获得此能力；应对时不要在混合剧本中把公开发动直接等同邪恶。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗精神病患者"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E7%B2%BE%E7%A5%9E%E7%97%85%E6%82%A3%E8%80%85","https://wiki.biligame.com/jbzlbwgwjcygf/%E7%B2%BE%E7%A5%9E%E7%97%85%E6%82%A3%E8%80%85"]},"boffin":{"id":"boffin","name":"科学怪人","sourceTitle":"科学怪人","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%A7%91%E5%AD%A6%E6%80%AA%E4%BA%BA","checkedAt":"2026-11-11","ability":"恶魔拥有一个不在场的善良角色的能力，即使他醉酒或中毒。你和他都知道他获得了什么能力。","mechanics":["只要科学怪人存活且清醒健康，恶魔就会拥有一个不在场的镇民或外来者角色的能力。","如果恶魔醉酒中毒，恶魔仍然保留自己获得的这个善良角色的能力。然而如果科学怪人醉酒中毒，恶魔就会暂时失去这个善良角色的能力。","如果恶魔拥有的能力是死亡后触发或保留的能力，且恶魔死亡，那么恶魔会保留获得的这项能力，例如心上人。","如果有新恶魔被创造，例如猩红女郎或理发师，那么新恶魔也能从科学怪人处获得能力。新恶魔获得的能力可以与旧恶魔获得的能力不同。","如果有多名恶魔同时在场且存活，只会有其中一名存活恶魔能够从科学怪人处获得能力。","如果在游戏设置时恶魔因此获得的能力能够影响初始设置，例如唱诗男孩，那么就会对游戏设置产生影响。","获得善良角色能力的恶魔与科学怪人都能得知恶魔获得了哪个角色的能力。说书人可以分别或同时唤醒这两名玩家通知他们相关信息。","恶魔因此获得的不在场角色能力可以来自于恶魔的伪装之一。"],"qa":[],"interactions":[{"with":[],"text":"如果科学怪人让恶魔拥有“能够让自己醉酒中毒”的能力（比如水手 、 食人族等），当这些能力导致自身醉酒或中毒时，仅影响恶魔因科学怪人拥有的能力，不会影响恶魔玩家原本的能力。","kind":"detail"},{"with":["异教领袖"],"text":"如果恶魔拥有异教领袖的能力，他无法因为该能力转变为善良阵营。","kind":"jinx"},{"with":["莽夫"],"text":"如果恶魔拥有莽夫的能力，他无法因为该能力转变为善良阵营。","kind":"jinx"},{"with":["异端分子"],"text":"恶魔无法拥有异端分子的能力。","kind":"jinx"},{"with":["食人魔"],"text":"恶魔无法拥有食人魔的能力。","kind":"jinx"},{"with":["政客"],"text":"恶魔无法拥有政客的能力。","kind":"jinx"},{"with":["酒鬼"],"text":"恶魔无法拥有酒鬼的能力。","kind":"jinx"},{"with":["炼金术士"],"text":"如果炼金术士拥有科学怪人的能力，炼金术士不会得知恶魔因此获得了哪个角色的能力。","kind":"jinx"},{"with":["村夫"],"text":"如果村夫在场数量不足3人，科学怪人可以让恶魔拥有村夫的能力。","kind":"jinx"},{"with":["悟道者"],"text":"恶魔无法拥有悟道者的能力。","kind":"jinx"},{"with":["狸猫"],"text":"如果因科学怪人获得狸猫能力的恶魔与“太子”交换角色，改为“太子”变成狸猫且恶魔获得“太子”原本角色的能力。","kind":"jinx"}],"tips":["围绕恶魔获赠的善良技能协调伪装。","对抗时“确认有某能力”仍不必然确认善良。"],"counterplay":["强能力认证需要排除获赠能力的恶魔；不能用此角色无限否定所有互证，恶魔人数仍受配置约束。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗科学怪人"]},"fearmonger":{"id":"fearmonger","name":"恐惧之灵","sourceTitle":"恐惧之灵","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%81%90%E6%83%A7%E4%B9%8B%E7%81%B5","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择一名玩家：如果你提名他且他被处决，他的阵营落败。当你首次选择或更换目标时，所有玩家都会得知你选择了新的玩家。","mechanics":["在游戏的首个夜晚，恐惧之灵选择了一名玩家后，所有玩家都会得知这件事情。","在其他夜晚，每当恐惧之灵选择了与上次选择不同的一名玩家后，所有玩家都会得知这件事情。如果恐惧之灵选择的玩家与上一次选择的相同，玩家不会得知任何内容。","玩家只会得知恐惧之灵是否采取了行动，但不会得知恐惧之灵具体选择了哪一名玩家。","如果恐惧之灵提名了他当前选择的玩家，且该玩家因此被处决时，该玩家的阵营落败，游戏结束。","只有恐惧之灵当前选择的玩家会受到恐惧之灵的能力影响。他此前选择的玩家不会受到影响。","如果被选择的玩家被恐惧之灵提名并处决后没有死亡，他的阵营仍然会落败。"],"qa":[],"interactions":[{"with":["瘟疫医生"],"text":"如果说书人本应获得恐惧之灵的能力，改为一名爪牙玩家获得此能力，且他会得知此事。","kind":"jinx"},{"with":["维齐尔"],"text":"他会得知恐惧之灵选择了哪名玩家，并且无法使用自己的能力让那名玩家立即被处决。","kind":"jinx"},{"with":["戏子"],"text":"戏子无法反转由恐惧之灵的能力产生的胜负结果。","kind":"jinx"},{"with":["戏子（改）"],"text":"戏子（改）无法反转由恐惧之灵的能力产生的胜负结果。","kind":"jinx"}],"tips":["预判容易被处决的人并亲自提名。","对抗时记录改目标公告与实际提名者，而非只看处决对象。"],"counterplay":["公告不透露目标是谁；应对时让较可信者发起关键提名可降低风险，但不等于绝对安全。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗恐惧之灵"]},"mezepheles":{"id":"mezepheles","name":"灵言师","sourceTitle":"灵言师","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E7%81%B5%E8%A8%80%E5%B8%88","checkedAt":"2026-11-17","ability":"在你的首个夜晚，你会得知一个关键词。首个说出该关键词的善良玩家会在当晚转变为邪恶阵营。","mechanics":["关键词可使一名善良玩家在当晚转邪；不能仅凭私聊、某个普通用词或玩家猜测认证转邪。","转邪改变阵营，不必改变角色；圣洁之魂若启用，还须核对转邪时点的邪恶人数上限。"],"qa":[],"interactions":[],"tips":["确认准确关键词再诱导说出。","对抗时警惕异常诱导，记录实际转阵营通知而非猜测。","把每个时点的善恶和角色分开；早期可靠好人后来可能转邪，但没有有效关键词记录时不能凭空认证已转邪。"],"counterplay":["假称已经转阵营也可操控站队；应对时以实际私有通知和关键词时点为条件。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","对抗灵言师"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E7%81%B5%E8%A8%80%E5%B8%88","https://wiki.biligame.com/jbzlbwgwjcygf/%E7%81%B5%E8%A8%80%E5%B8%88"]},"marionette":{"id":"marionette","name":"提线木偶","sourceTitle":"提线木偶","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%8F%90%E7%BA%BF%E6%9C%A8%E5%81%B6","checkedAt":"2026-11-11","ability":"你以为你是一个善良角色，但其实你不是。恶魔会知道你是提线木偶。[提线木偶会与恶魔邻座]","mechanics":["提线木偶与恶魔是邻座。他们之间不会有其他的玩家。","恶魔会知道哪一名玩家是提线木偶。","认为自己是提线木偶的玩家所抽取到的善良角色对应的能力不会产生任何效果，但说书人会假装这些效果生效了。这与酒鬼的运作方式相似。","提线木偶在互动时被当作邪恶阵营以及爪牙角色。","例如：告密者，传教士，小怪宝，罂粟种植者，帽匠，落难少女等。"],"qa":[],"interactions":[{"with":["瘟疫医生"],"text":"如果说书人本应获得提线木偶的能力，改为一名与恶魔邻近的善良玩家变成提线木偶。","kind":"jinx"},{"with":["小怪宝"],"text":"如果提线木偶本应初始在场，他们会在恶魔之后进场并与恶魔邻座。","kind":"jinx"},{"with":["气球驾驶员"],"text":"如果提线木偶抽到了气球驾驶员，在设置调整阶段可能会+1外来者。","kind":"jinx"},{"with":["巡山人"],"text":"如果提线木偶抽到了巡山人，在设置调整阶段会增加落难少女。","kind":"jinx"},{"with":["召唤师"],"text":"如果提线木偶本应初始在场，他们会在恶魔之后进场并与恶魔邻座。","kind":"jinx"},{"with":["卡扎力"],"text":"如果提线木偶本应初始在场，他们会在恶魔之后进场并与恶魔邻座。","kind":"jinx"},{"with":["炼金术士"],"text":"如果炼金术士本应获得提线木偶的能力，那么他不会拥有该能力并改为提线木偶一定在场。","kind":"jinx"},{"with":["魔术师"],"text":"如果魔术师存活，恶魔不会得知谁是提线木偶。","kind":"jinx"},{"with":["数学家"],"text":"数学家会得知提线木偶产生了错误信息或“能力未正常生效”。","kind":"jinx"},{"with":["戏子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["梼杌"],"text":"梼杌不会得知谁是提线木偶。在梼杌使得提线木偶失去能力后，梼杌会得知对应的那一名提线木偶是谁，但提线木偶会仍然以为自己是一个善良角色。","kind":"jinx"},{"with":["姑获鸟"],"text":"姑获鸟无法获得提线木偶的能力。","kind":"jinx"}],"tips":["用异常反馈核验自己的表面身份。","有人声称你是木偶也可能是诱骗，不立即相信。"],"counterplay":["恶魔可能谎称邻座是木偶；应对时角色自疑、能力异常和恶魔说法要独立判断。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗提线木偶"]},"wraith":{"id":"wraith","name":"亡魂","sourceTitle":"亡魂","source":"https://wiki.biligame.com/bloodontheclocktower/%E4%BA%A1%E9%AD%82","checkedAt":"2026-11-11","ability":"你可以在夜晚睁眼。当其他邪恶玩家被唤醒时，你也会被唤醒。","mechanics":["如果善良玩家发现亡魂睁着眼，不会有任何能力上的影响。"],"qa":[],"interactions":[{"with":["魔术师"],"text":"每次处决后，存活的魔术师可以公开猜测一名存活玩家是亡魂：如果猜对了，恶魔当晚必须选择亡魂。","kind":"jinx"},{"with":["炼金术士"],"text":"如果炼金术士本应获得亡魂的能力，那么他不会拥有该能力并改为亡魂一定在场。每次处决后，存活的炼金术士可以公开猜测一名存活玩家是亡魂：如果猜对了，恶魔当晚必须选择亡魂。","kind":"jinx"},{"with":["瘟疫医生"],"text":"如果说书人本应获得亡魂的能力，改为一名爪牙玩家获得此能力，且他会得知此事。","kind":"jinx"},{"with":["戏子","戏子（改）"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["姑获鸟"],"text":"如果姑获鸟本应获得亡魂的能力，改为亡魂保留能力。","kind":"jinx"}],"tips":["仔细观察夜间行动并与队友协作。","对抗时保持自己的行动清晰，白天共享实际观察。"],"counterplay":["目击者的转述仍可能撒谎；应对时保留实际夜间观察的原话，而非自动认证被指认者。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗亡魂"]},"vizier":{"id":"vizier","name":"维齐尔","sourceTitle":"维齐尔","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%BB%B4%E9%BD%90%E5%B0%94","checkedAt":"2026-11-11","ability":"所有玩家都知道你是维齐尔。 你在白天时不会死亡。 如果一次提名中有善良玩家投票，你可以让被提名者立即被处决。","mechanics":["在第一个白天，所有玩家都会得知维齐尔在场，并且知道是哪一名玩家。","在白天时，维齐尔不会因为任何原因死亡。","在一次提名的投票被统计后，如果维齐尔选择处决被提名者（且至少有一名善良玩家参与投票），那么被提名者会立即被处决。这算在每个白天的一次处决之内。","在一次提名的投票被统计后，如果维齐尔选择处决被提名者（且没有任何善良玩家参与投票），那么无事发生。","即使被提名者得票在存活玩家的半数以下，维齐尔仍然能够执行处决。即使有其他玩家得票比此次被提名者多，维齐尔仍然能够执行处决。","维齐尔无需在每个白天都使用自己的能力来造成强制处决。"],"qa":[],"interactions":[{"with":[],"text":"如果维齐尔受到非相克规则的角色带来的醉酒或中毒的效果影响，那么他能够在白天死亡，并且无法选择立即执行处决，但玩家不会知道这一点，直到维齐尔尝试这么做为止。","kind":"detail"},{"with":[],"text":"如果维齐尔在游戏中途被创造，所有玩家都会立即得知谁是维齐尔。然而如果维齐尔的角色中途发生了变化，玩家不会立即得知这一消息（因为暴露角色的能力来源消失了）。","kind":"detail"},{"with":["调查员"],"text":"说书人不会宣布维齐尔在场。","kind":"jinx"},{"with":["传教士"],"text":"如果维齐尔失去能力，他会得知此事，但不会在白天死亡。","kind":"jinx"},{"with":["侍臣"],"text":"如果维齐尔失去能力，他会得知此事，但不会在白天死亡。","kind":"jinx"},{"with":["魔术师"],"text":"如果维齐尔在场，魔术师不会拥有能力，但他会免疫维齐尔的能力。","kind":"jinx"},{"with":["戏法师"],"text":"说书人不会宣布维齐尔在场。","kind":"jinx"},{"with":["政客"],"text":"维齐尔的能力可能会将政客当作邪恶阵营。","kind":"jinx"},{"with":["狂热者"],"text":"维齐尔的能力可能会将狂热者当作邪恶阵营。","kind":"jinx"},{"with":["恐惧之灵"],"text":"他会得知恐惧之灵选择了哪名玩家，并且无法使用自己的能力让那名玩家立即被处决。","kind":"jinx"},{"with":["小怪宝"],"text":"如果维齐尔正照看小怪宝，他会在被处决时死亡。","kind":"jinx"},{"with":["姑获鸟"],"text":"姑获鸟无法获得维齐尔的能力。","kind":"jinx"}],"tips":["从强制处决和未使用能力的选择中控制局势。","对抗时票型有条件信息，仍须排除相克登记。"],"counterplay":["强制处决通常约束至少一张善良票；有狂热者、政客等相克时需按本局细则核验。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗维齐尔"]},"wizard":{"id":"wizard","name":"巫师","sourceTitle":"巫师","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%B7%AB%E5%B8%88","checkedAt":"2026-11-11","ability":"每局游戏限一次，你可以向说书人许愿。如果愿望被实现，可能会伴随着代价和线索。","mechanics":["这个愿望只受限于玩家的想象力，它可以是任何事。巫师可以在夜晚用手机屏幕展示愿望内容给说书人，也可以在白天私下告诉说书人。如果巫师有些鲁莽，他也可以公开许愿。","说书人不必立刻公开宣布巫师许下了愿望，而是可以稍后再宣布。","许多愿望都伴随着代价。代价可能会以某种方式影响游戏，或是影响这个愿望本身。它也可以是任何事，由说书人认真思考后决定。说书人可以决定是否告诉巫师愿望的代价。代价的目的是为了从能力的效果上平衡这个愿望，以免它对善良阵营造成不公平的影响。","许多愿望会留下线索。线索可以是任何事，由说书人认真思考后决定，然后再公开宣布。线索的目的是为了从信息上平衡这个愿望，以免它对善良阵营造成不公平的影响。","当巫师死亡，愿望可能会继续生效，也可能会失效，取决于愿望和代价具体是什么。","如果巫师许了一个说书人不理解的愿望，或者说书人认为他无法实现，说书人可以让巫师重新许愿，或者告诉巫师，他的愿望被消耗了。"],"qa":[],"interactions":[],"tips":["让愿望服务具体局势并考虑代价。","对抗时保存说书人公开的线索，不任意补造愿望内容。"],"counterplay":["应对时把已宣布的代价和线索记入规则，不让“也许巫师许了愿”成为任意矛盾的万能解释。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","对抗巫师"]},"xaan":{"id":"xaan","name":"限","sourceTitle":"限","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%99%90","checkedAt":"2026-11-11","ability":"在等同于初始外来者数量的夜晚，所有镇民玩家中毒直到下个黄昏。[外来者数量任意]","mechanics":["限会让所有镇民玩家中毒一个夜晚和一个白天。限的能力生效夜晚和初始加入游戏的外来者数量相同。比如，游戏开始时，有两名外来者，限的能力就会在第二个夜晚生效。","限可以让任意数量的外来者加入游戏，但通常是一名到四名外来者。外来者的数量可以和限不在场时的数量一致，也可以有所差距。限的能力会覆盖其他设置调整类型的能力，例如男爵等角色。","如果在游戏过程中外来者数量发生变化，大限将至的夜晚也仍然取决于初始设置的外来者数量。","限需要存活，能力才能生效。"],"qa":[{"q":"用现在跳外来者的人数决定群毒夜吗？","a":"不是。看初始实际外来者数量；邪恶假跳、隐藏外来者和之后角色变化都不能直接改写那个数字。"}],"interactions":[],"tips":["规划活过对应外来者数量的夜晚。","对抗时以初始外来者数定位群毒，不按当前报身份人数机械计算。"],"counterplay":["外来者报数可能被邪恶操纵；应对时先分真实角色配置，再用群毒夜检验，而非循环自证。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","对抗限"]},"harpy":{"id":"harpy","name":"鹰身女妖","sourceTitle":"鹰身女妖","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%B9%B0%E8%BA%AB%E5%A5%B3%E5%A6%96","checkedAt":"2026-11-11","ability":"每个夜晚，你要选择两名玩家：明天第一名玩家需要“疯狂”地证明第二名玩家是邪恶的，否则他们之中可能会有人死亡。","mechanics":["在夜晚时，鹰身女妖选择玩家时是一次选择一名玩家，而不是同时选择两名玩家。","被鹰身女妖选择的玩家会在鹰身女妖下一次进行选择之前持续被影响。","如果说书人决定通过鹰身女妖的能力杀死玩家，那么他必须决定是杀死其中一名玩家还是全部杀死。","鹰身女妖可以选择已死亡的玩家。如果她这么做，那么说书人只能杀死当前仍存活的目标玩家，因为已死亡的玩家不能再次死亡。","被鹰身女妖的能力杀死的玩家的死亡顺序由说书人决定，这一点非常重要。"],"qa":[],"interactions":[],"tips":["选择能制造阵营冲突的两人。","对抗时区分疯狂说法与真实判断，评估违背疯狂的死亡风险。"],"counterplay":["被迫指控不等于真实查红；应对时分开原始反馈与疯狂要求下的说法。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","对抗鹰身女妖"]},"boomdandy":{"id":"boomdandy","name":"炸弹人","sourceTitle":"炸弹人","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%82%B8%E5%BC%B9%E4%BA%BA","checkedAt":"2026-11-11","ability":"如果你被处决，除三名玩家以外的其他所有玩家均会死亡。倒数十声后，被最多玩家手指指着的玩家死亡。","mechanics":["如果炸弹人被处决，由说书人来选择会有哪些玩家被杀死，每次一名玩家，直到只剩三名玩家存活。","恶魔一定会是这三名存活的玩家之一（在绝大多数情况下都应该是这种结果，否则游戏就会立刻结束）。","玩家们要在十声倒数内决定下一个死亡的是谁。今天白天不会有其他的提名和处决，取而代之的是，所有玩家会用手指指向自己想要杀死的玩家。在倒数结束后，说书人会统计每名玩家被指向的次数。如果这种情况下出现了平局，那么游戏会进入夜晚阶段（邪恶阵营极有可能会因为恶魔在当晚的杀戮而获胜）。","即使是失去了投票标记的已死亡玩家，也能够用手指指向自己想要杀死的玩家。","玩家在倒数时间内可以随意更换手指指向的目标，在倒数结束后指向的结果才会作为最终结果。","炸弹人只会因为处决而触发能力。通过其他方式死亡，例如魔像或者精神病患者，不会触发能力。如果炸弹人被处决但没有死亡（由于恶魔代言人等的能力），他的能力仍然会触发。","如果有不会死亡的角色在场，例如弄臣或水手，那么在炸弹人触发能力之后，可能会有多于三名玩家存活。"],"qa":[],"interactions":[{"with":["瘟疫医生"],"text":"如果说书人本应获得炸弹人的能力，改为一名玩家会变成炸弹人。","kind":"jinx"}],"tips":["可主动争取早处决压缩善良信息。","对抗时先准备最终三人判断和十秒指认计划。"],"counterplay":["假称炸弹人可阻止处决恶魔；应对时别因恐惧技能而完全放弃核验。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗炸弹人"]},"summoner":{"id":"summoner","name":"召唤师","sourceTitle":"召唤师","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%8F%AC%E5%94%A4%E5%B8%88","checkedAt":"2026-11-11","ability":"在首个夜晚，你会得知三个伪装。在第三个夜晚，你要选择一名玩家：他变成由你选择的邪恶恶魔。[无恶魔在场]","mechanics":["召唤师能够选择任意一名玩家变成恶魔，他甚至可以选择自己。","被创造的新恶魔不会得知谁是爪牙，爪牙也不会得知他是恶魔。邪恶玩家之间需要通过交流来互认。","即使在游戏的前两天没有恶魔在场，游戏也不会因此结束。然而，如果召唤师因为某些原因无法创造新的恶魔（死亡或在第三个夜晚中毒等），善良阵营获胜。","新恶魔在被创造的当晚就能行动。"],"qa":[],"interactions":[{"with":["莽夫"],"text":"如果召唤师在创造恶魔时选择了莽夫，莽夫转为邪恶，且会与邪恶阵营一同落败，因为场上没有恶魔且召唤师醉酒了。","kind":"interaction"},{"with":["炼金术士"],"text":"获得召唤师能力的炼金术士不会获得伪装。他要选择一个恶魔角色，但不选择玩家，由说书人决定哪一名玩家变成邪恶的恶魔。如果他在选择之前死亡，邪恶阵营获胜。[无恶魔在场] 钟表匠 ：召唤师会被钟表匠当作恶魔。","kind":"jinx"},{"with":["罂粟种植者"],"text":"如果罂粟种植者在第三个夜晚存活，由召唤师来选择创造哪种恶魔，由说书人来决定哪名玩家发生转变。","kind":"jinx"},{"with":["侍臣"],"text":"如果存活的召唤师失去能力，说书人会获得召唤师能力。","kind":"jinx"},{"with":["传教士"],"text":"如果存活的召唤师失去能力，说书人会获得召唤师能力。","kind":"jinx"},{"with":["工程师"],"text":"如果存活的召唤师从游戏中离场，说书人会获得召唤师的能力。","kind":"jinx"},{"with":["帽匠","麻脸巫婆","卡扎力"],"text":"如果召唤师创造了第二个存活的恶魔，当晚的死亡由说书人决定。","kind":"jinx"},{"with":["提线木偶"],"text":"如果提线木偶本应初始在场，他们会在恶魔之后进场并与恶魔邻座。","kind":"jinx"},{"with":["僵怖"],"text":"如果召唤师将一名已死亡的玩家变成了僵怖，该玩家会变成“已经死过一次”的僵怖。","kind":"jinx"},{"with":["普卡"],"text":"召唤师可以在第二个夜晚召唤普卡来替代第三个夜晚的召唤。","kind":"jinx"},{"with":["军团"],"text":"如果召唤师召唤了军团，所有邪恶玩家会变成军团。","kind":"jinx"},{"with":["堤丰之首"],"text":"如果召唤师创造了堤丰之首，则堤丰之首必须与一名爪牙相邻，且堤丰之首另一侧的玩家会变成一个邪恶的爪牙。","kind":"jinx"},{"with":["戏子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["戏子（改）"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["姑获鸟"],"text":"如果召唤师成功召唤了姑获鸟，召唤师会变成一个不在场的爪牙。","kind":"jinx"},{"with":["典狱长"],"text":"召唤师可以在第二个夜晚召唤典狱长来替代第三个夜晚的召唤。","kind":"jinx"}],"tips":["提前与队友协调第三夜目标和恶魔类型。","对抗时首两夜无刀符合此世界，不据此认证保护。"],"counterplay":["第三夜前后身份可能突然变化；应对时早期非恶魔信息不能永久排除后来的新恶魔。"],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节"]},"ojo":{"id":"ojo","name":"奥赫","sourceTitle":"奥赫","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%A5%A5%E8%B5%AB","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一个角色：他死亡。如果该角色不在场，则由说书人来决定谁会被你杀死。","mechanics":["与其他恶魔不同，奥赫在攻击时选择的是角色，而不是玩家。说书人可能需要提醒玩家奥赫能力的特殊之处。建议在游戏进入到夜晚阶段时，让所有玩家将角色列表放在手边。","如果奥赫愿意，他可以杀死邪恶角色。","如果某个角色有多名玩家在场，且奥赫选择了这个角色，只会有一名玩家死亡。","如果奥赫选择了不在场的角色，说书人大多数情况下都会杀死一名存活的善良玩家。说书人杀死死亡玩家或邪恶玩家虽然可行，但这种情况会非常少见。"],"qa":[],"interactions":[],"tips":["按角色价值选择而非只追座位，和队友共享确认到的角色。","对抗时隐藏关键角色可增加其选空的风险。"],"counterplay":["选空角色仍可能杀人；应对时不能由有人死亡直接推出被点名角色在场。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧","对抗奥赫"]},"riot":{"id":"riot","name":"暴乱","sourceTitle":"暴乱","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%9A%B4%E4%B9%B1","checkedAt":"2026-11-11","ability":"在第三个白天，所有爪牙会变成暴乱，当天被提名的玩家会立即死亡且必须再次提名一名存活的玩家。","mechanics":["在第三天，每名被提名的玩家都会立即死亡。尽管他已经死亡，但他在今天必须再次提名。","被提名的玩家必须立刻发起提名，或者放弃发起提名的机会。说书人倒数“3，2，1”让玩家知道他们需要迅速发起提名。如果他们没有这样做，说书人代替他进行提名。","如果所有暴乱玩家死亡，善良阵营获胜。如果最后一个暴乱死亡，且只有两名玩家存活，他不能提名，且善良阵营获胜。","如果第三天没有玩家发起提名，说书人会发起第一次提名。","爪牙们可以在第三天的提名阶段开始时变成暴乱。"],"qa":[],"interactions":[{"with":[],"text":"在第三个白天，如果已经提名过的玩家被提名，暴乱的能力取代了他不能提名两次的标准游戏规则，因此他可以再次提名。但是，玩家每天只能被提名一次的游戏规则仍然适用。","kind":"detail"},{"with":[],"text":"在第三个白天，要求流放旅行者不会立即杀死他。暴乱只会影响提名，所以对旅行者的流放表决应该照常进行。暴乱提名链一旦开始就不应该被打断，因此只有提名开始之前可以流放旅行者。","kind":"detail"},{"with":["小精灵"],"text":"可以在第三个白天获得他的新能力，并在他意识到自己拥有该能力之前让它生效。示例：当原始的茶艺师被提名（死亡）时，小精灵-茶艺师立即开始保护与之邻近的玩家。","kind":"interaction"},{"with":["解谜大师"],"text":"如果解谜大师在第三个白天成功猜出他的醉酒玩家，他会得知任意一名存活的暴乱玩家。","kind":"interaction"},{"with":["茶艺师"],"text":"如果与茶艺师邻近的两名存活的玩家是善良的，他们不会在第三个白天被提名时因为暴乱而死，但他们仍然需要立即再次发起提名。","kind":"interaction"},{"with":["驱魔人"],"text":"如果暴乱提名并处决了驱魔人上个夜晚选择的那名玩家，善良阵营获胜。","kind":"jinx"},{"with":["农夫"],"text":"每个夜晚*，暴乱要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果农夫被选择，他的能力生效但不会死亡。（建议在暴乱选择农夫/守鸦人/贤者并触发这些角色的能力后，这些角色失去能力） 祖母 ：如果暴乱在场，孙子死于处决，邪恶阵营获胜。","kind":"jinx"},{"with":["旅店老板"],"text":"如果暴乱提名并处决了旅店老板上个夜晚保护的其中一名玩家，善良阵营获胜。","kind":"jinx"},{"with":["镇长"],"text":"镇长可以停止暴乱的提名链。如果他这样做了，并且场上只有一名暴乱存活，善良阵营获胜；否则，邪恶阵营获胜。","kind":"jinx"},{"with":["僧侣"],"text":"如果暴乱提名并处决了僧侣上个夜晚保护的那名玩家，善良阵营获胜。","kind":"jinx"},{"with":["守鸦人"],"text":"每个夜晚*，暴乱要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果守鸦人被选择，他的能力生效但不会死亡。","kind":"jinx"},{"with":["贤者"],"text":"每个夜晚*，暴乱要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果贤者被选择，他的能力生效但不会死亡。","kind":"jinx"},{"with":["士兵"],"text":"如果暴乱提名并处决了士兵，善良阵营获胜。","kind":"jinx"},{"with":["国王"],"text":"如果暴乱在场，当至少一名玩家死亡时，国王每晚就会得知一个存活的角色。","kind":"jinx"},{"with":["报丧女妖"],"text":"每个夜晚*，暴乱要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果报丧女妖被选择，他死亡并能力生效。","kind":"jinx"},{"with":["无神论者"],"text":"在暴乱的提名链中，如果说书人被提名，玩家要进行投票。如果说书人“即将被处决”，游戏结束；否则，说书人要重新发起提名。","kind":"jinx"},{"with":["戏子"],"text":"在戏子存在于剧本中时，暴乱可以在游戏中任意时候向说书人示意自己“想要死亡”。说书人会在当晚杀死这名玩家。","kind":"jinx"},{"with":["打更人"],"text":"如果暴乱提名并处决了打更人上个夜晚猜测的其中一名玩家，善良阵营获胜。","kind":"jinx"},{"with":["和尚"],"text":"如果暴乱提名并处决了与和尚邻近的其中一名存活玩家，善良阵营获胜。","kind":"jinx"},{"with":["戏子（改）"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["狸猫"],"text":"每个夜晚*，暴乱要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果“太子”被选择，他会与狸猫交换角色但不会死亡。","kind":"jinx"},{"with":["巡察"],"text":"如果暴乱提名并处决了巡察上个夜晚保护的其中一名玩家，善良阵营获胜。","kind":"jinx"}],"tips":["第三天前整理候选与提名顺序。","链式提名时优先处理恶魔候选，注意死亡保护不一定停止提名链。"],"counterplay":["应对时第三日提名直接死亡不等于处决；相关处决触发能力不可机械套用。"],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介","规则细节","提示与技巧","对抗暴乱"]},"lordoftyphon":{"id":"lordoftyphon","name":"堤丰之首","sourceTitle":"堤丰之首","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%A0%A4%E4%B8%B0%E4%B9%8B%E9%A6%96","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：他死亡。[邪恶角色全部邻座，你靠近正中，+1爪牙，-或+任意数量外来者]","mechanics":["所有邪恶角色玩家全都连续相邻而坐。","在游戏开始时，堤丰之首的左右两侧必须都要有邪恶角色玩家。他不能位于一连串邪恶角色玩家队列的两侧。","邪恶阵营在游戏开始时有一名额外的爪牙。","可能会有任意数量的外来者在场。","此外说书人还会决定爪牙的具体角色。","如果堤丰之首在游戏中途被创造，则他无需与其他邪恶角色玩家的位置相邻。"],"qa":[],"interactions":[{"with":[],"text":"如果游戏因堤丰之首而导致有4名邪恶爪牙在场，那么堤丰之首可以不在这5名邪恶玩家的正中间（但不能位于一连串邪恶角色玩家队列的两侧）。","kind":"detail"},{"with":["召唤师"],"text":"如果召唤师创造了堤丰之首，则堤丰之首必须与一名爪牙相邻，且堤丰之首另一侧的玩家会变成一个邪恶的爪牙。","kind":"jinx"},{"with":["戏子"],"text":"堤丰之首和戏子不能在初始时同时在场。如果有角色能力能够使得善良玩家在第一个夜晚变成戏子，说书人会在这一效果生效之前先告知堤丰之首两侧的玩家是邪恶的爪牙。","kind":"jinx"}],"tips":["与邻近队友协调伪装，避免整段暴露。","对抗时结合连续邪恶座位、额外爪牙与初始设置判断。"],"counterplay":["同排一起投票仅作倾向；应对时连续邪恶队列是初始设置条件，变化后另按时点盘。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗堤丰之首"]},"alhadikhia":{"id":"alhadikhia","name":"哈迪寂亚","sourceTitle":"哈迪寂亚","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%93%88%E8%BF%AA%E5%AF%82%E4%BA%9A","checkedAt":"2026-11-17","ability":"每个夜晚*，你要选择三名玩家（所有玩家都会得知你选了谁）：他们分别秘密决定自己的生死，然后如果他们都存活则都死亡。","mechanics":["除首夜外选择三名玩家，可包含自己与已死者。被选者分别秘密决定生死，死亡者选生可以复活。","先结算三人的选择，再看他们实际是否全部存活；不是看三人是否全都选择了生。受免死保护且选择死的人仍可能存活，从而参与全员死亡的再检查。","醉毒哈迪寂亚不会因此宣布目标、唤醒目标、杀人或复活；已被确认的公开发动应作为能力当时有效的强信息分析。","恶魔死亡后能力不再继续结算；已完成的死亡或复活不被追溯撤销。具体死亡与复活按夜内顺序判断。","此剧本有多种免死、醉毒、角色交换与复活，不能沿用单刀暗流的夜死偏善良捷径，也不能把被选择、存活或复活直接当作阵营认证。"],"qa":[],"interactions":[{"with":[],"text":"已死亡的玩家如果选择“活着”，会被复活。","kind":"detail"},{"with":[],"text":"“如果他们都存活”判断条件不会关注这些玩家是如何做出选择的，而只看在这些选择结算后玩家是否存活。选择“死去”的存活玩家如果受到免死能力的保护，会因此存活并计入“如果他们都存活”的判断条件。","kind":"detail"},{"with":[],"text":"当哈迪寂亚死亡时，他如常失去自己的能力。此前被他杀死或复活的玩家依然保持当前的生死状态。哈迪寂亚的能力不会再继续产生效果。在黎明时，如常宣布玩家生死状态的改变情况。","kind":"detail"},{"with":["猩红女郎"],"text":"如果即将出现两名存活的恶魔，其中之一是由猩红女郎转变的，则猩红女郎变成的恶魔会变回猩红女郎。","kind":"jinx"},{"with":["主谋"],"text":"如果哈迪寂亚死于处决，且主谋存活，当晚哈迪寂亚要选择三名善良玩家：如果他们都选择存活，邪恶阵营获胜。否则，善良阵营获胜。","kind":"jinx"},{"with":["公主"],"text":"如果公主在首个白天提名并处决了一名玩家，没有人会因为哈迪寂亚而死亡。(公主与哈迪寂亚角色互动结果本应如此，此条仅做说明)","kind":"jinx"}],"tips":["利用三人选择与复活压力规划节奏。","对抗时为团队收益权衡生死，不用个人选择直接认证阵营。","优先记录三名公开目标、各自声明的生死选择及最终公告；仅缺结算相关细节才补问。善良视角重点找当前恶魔位置，不重复讨论已由公开发动明确的恶魔种类。","有水手、旅店老板、茶艺师或弄臣时，逐个核对免死与全员存活的连锁结算，勿以夜死人数机械推身份。"],"counterplay":["邪恶也可选择死亡来伪装牺牲；应对时不要把愿意死或复活后的表现直接认好。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗哈迪寂亚"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%93%88%E8%BF%AA%E5%AF%82%E4%BA%9A","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%93%88%E8%BF%AA%E5%AF%82%E4%BA%9A"]},"legion":{"id":"legion","name":"军团","sourceTitle":"军团","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%86%9B%E5%9B%A2","checkedAt":"2026-11-11","ability":"每个夜晚*，可能有一名玩家死亡。如果一项提名只有邪恶玩家投票，投票无效。你也会被当作是爪牙。[多数玩家为军团]","mechanics":["如果军团在场，推荐将在场善良和邪恶玩家的数量在通常的数量上进行反转。例如，在一局十人游戏中，你可以采取近似七名军团和三名善良玩家的设置。","非军团的玩家可以是镇民也可以是外来者，由说书人来决定这些善良玩家的角色类型组合方式。","如果一项提名中至少有一名善良玩家参与投票，并且被提名的玩家“即将被处决”，那么在处决阶段时处决会正常发生。如果一项提名中只有邪恶玩家参与了投票，那么在统计票数的时候会记为零票。","每名军团在互动时被当作恶魔，同时也被当作爪牙。","由说书人来决定哪一名玩家会在夜晚死亡。","如果游戏中只剩一名善良玩家存活，说书人可以宣布邪恶阵营获胜，因为在这种条件下善良阵营无法获胜。","说书人可以不向军团提供恶魔的伪装。"],"qa":[{"q":"一次投票没通过，能确认投票者都是军团吗？","a":"不能。先确认是只有邪恶投票导致投票无效，而非票数未过半、平票、其他能力或记录不完整。"}],"interactions":[{"with":["工程师"],"text":"如果工程师创造了军团，所有邪恶玩家会变成军团。如果军团在场，工程师失去能力并改为得知这一信息。","kind":"jinx"},{"with":["传教士"],"text":"如果传教士选中了军团，军团仍然保留能力，但传教士可能会得知自己选中了军团。","kind":"jinx"},{"with":["吟游诗人"],"text":"如果军团死于处决，所有军团保留能力，但吟游诗人可能会在当晚得知今天白天死于处决的玩家是军团。","kind":"jinx"},{"with":["帽匠"],"text":"如果帽匠创造了军团，所有邪恶玩家会变成军团。如果军团在场，帽匠失去能力。","kind":"jinx"},{"with":["狂热者"],"text":"狂热者可能会被军团当作邪恶玩家。","kind":"jinx"},{"with":["召唤师"],"text":"如果召唤师召唤了军团，所有邪恶玩家会变成军团。","kind":"jinx"},{"with":["政客"],"text":"政客可能会被军团当作邪恶玩家。","kind":"jinx"},{"with":["戏子"],"text":"在戏子存在于剧本中时，军团可以在游戏中任意时候向说书人示意自己“想要死亡”。","kind":"jinx"},{"with":["戏子（改）"],"text":"在戏子（改）存在于剧本中时，军团可以在游戏中任意时候向说书人示意自己“想要死亡”。","kind":"jinx"}],"tips":["协调有限伪装及投票，避免只有邪恶投票暴露整组。","对抗时善良票很关键，先核对是否有其他无效原因。"],"counterplay":["应对时只计已知有效投票事实；若未确认无效原因，不能直接把整组投票者都认证邪恶。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗军团"]},"kazali":{"id":"kazali","name":"卡扎力","sourceTitle":"卡扎力","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%8D%A1%E6%89%8E%E5%8A%9B","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：他死亡。[由你决定谁是什么爪牙，-或+任意数量外来者]","mechanics":["如果卡扎力在游戏中途被创造，他不会选择玩家成为新的爪牙。","说书人可以将这些变成爪牙的玩家的原本善良角色作为恶魔的伪装提供，因为这些角色都已不在场。","卡扎力只能选择位于角色列表上的爪牙。他不能选择让多名玩家变成同一个爪牙角色。","卡扎力能够将他想要的任意玩家变成爪牙，无论该名玩家的角色能力如何，例如：士兵，莽夫，落难少女，国王等。"],"qa":[],"interactions":[{"with":[],"text":"在不考虑与其他角色交互时的运作，卡扎力对于爪牙的转化可以按照“重复这个流程，直到场上有与初始设置时同等数量的爪牙”来理解。然而实际上卡扎力的转化的更标准的描述形式应该是“重复这个流程，直到卡扎力进行了等同于初始设置爪牙数量次数的选择”。","kind":"detail"},{"with":[],"text":"特定角色互动： 村夫 ：如果有复数个村夫在场，卡扎力的设置调整优先生效，其他的村夫因卡扎力的能力变成了爪牙，剩下的那名村夫一定是清醒的，因为这时村夫已经只有一个了。","kind":"detail"},{"with":["赏金猎人"],"text":"如果卡扎力把赏金猎人变成了爪牙，赏金猎人不会带来邪恶的镇民。","kind":"jinx"},{"with":["提线木偶"],"text":"如果提线木偶本应初始在场，他们会在恶魔之后进场并与恶魔邻座。","kind":"jinx"},{"with":["召唤师"],"text":"如果召唤师创造了第二个存活的恶魔，当晚的死亡由说书人决定。","kind":"jinx"},{"with":["戏子"],"text":"卡扎力和戏子不能在初始时同时在场。如果有角色能力能够使得善良玩家在第一个夜晚变成戏子，卡扎力会在这一效果生效之前先进行转变爪牙的行动。","kind":"jinx"}],"tips":["按团队协作和技能选择爪牙。","对抗时别按普通外来者数量机械排除，也别认为爪牙没有安全伪装。"],"counterplay":["选择爪牙可能留下已移除善良角色作安全伪装；应对时“没有对跳”并不能认证其善良。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗卡扎力"]},"leviathan":{"id":"leviathan","name":"利维坦","sourceTitle":"利维坦","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%88%A9%E7%BB%B4%E5%9D%A6","checkedAt":"2026-11-11","ability":"如果多于一名善良玩家被处决，邪恶阵营获胜。 所有玩家都知道利维坦在场。 在第五个白天结束时，邪恶阵营获胜。","mechanics":["所有玩家都会知道利维坦在场，即使利维坦在游戏过程中被创造也是如此。","可以有任意数量的邪恶玩家被处决，然而如果有多于一名善良玩家被处决，邪恶阵营获胜。被处决的角色是什么无关紧要，只看那名玩家在被处决的时候的阵营是什么。","当第五个白天结束时，如果利维坦仍然存活，邪恶阵营获胜。","不论何种类型的处决均会计算在内，即使处决没有让玩家死亡也会正常计算。被贞洁者处决，或者畸形秀演员自爆处决，都会计算在内。善良玩家被处决但因为和平主义者的能力仍然存活也会计算在内。"],"qa":[],"interactions":[{"with":[],"text":"不是利维坦的第五天触发邪恶阵营获胜的条件，而是游戏总天数。所以如果利维坦在第五天之后出现在游戏中，邪恶阵营立即获胜。","kind":"detail"},{"with":[],"text":"如果你选择每天播报利维坦在场的第几天，一旦利维坦醉酒/中毒，那么在当天不能宣布利维坦在场。当利维坦恢复清醒/健康时，可以再次宣布利维坦在场（如果还没有宣布过，则必须宣布）。","kind":"detail"},{"with":[],"text":"当利维坦中毒/醉酒时，处决不会算入利维坦获胜条件。如果利维坦在第五天是中毒/醉酒的，他在恢复清醒/健康之前不会获胜，但只要利维坦在第五天结束后的任意时候是清醒/健康的，游戏结束，邪恶阵营获胜。","kind":"detail"},{"with":[],"text":"同一名善良玩家被处决多次只会计入一次利维坦的获胜条件。","kind":"detail"},{"with":["士兵"],"text":"如果利维坦提名并处决了士兵，善良阵营获胜。","kind":"jinx"},{"with":["僧侣"],"text":"如果利维坦提名并处决了僧侣上个夜晚保护的那名玩家，善良阵营获胜。","kind":"jinx"},{"with":["旅店老板"],"text":"如果利维坦提名并处决了旅店老板上个夜晚保护的其中一名玩家，善良阵营获胜。","kind":"jinx"},{"with":["守鸦人"],"text":"每个夜晚*，利维坦要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果守鸦人被选择，他的能力生效但不会死亡。（建议在利维坦选择农夫/守鸦人/贤者并触发这些角色的能力后，这些角色失去能力） 贤者 ：每个夜晚*，利维坦要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果贤者被选择，他的能力生效但不会死亡。","kind":"jinx"},{"with":["农夫"],"text":"每个夜晚*，利维坦要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果农夫被选择，他的能力生效但不会死亡。","kind":"jinx"},{"with":["镇长"],"text":"如果利维坦和镇长在第五天存活且没有处决发生，善良阵营获胜。","kind":"jinx"},{"with":["报丧女妖"],"text":"每个夜晚*，利维坦要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果报丧女妖被选择，他死亡并能力生效。","kind":"jinx"},{"with":["驱魔人"],"text":"如果利维坦提名并处决了驱魔人上个夜晚选择的那名玩家，善良阵营获胜。","kind":"jinx"},{"with":["祖母"],"text":"如果利维坦在场，孙子死于处决，邪恶阵营获胜。","kind":"jinx"},{"with":["国王"],"text":"如果利维坦在场，当至少一名玩家死亡时，国王每晚就会得知一个存活的角色。","kind":"jinx"},{"with":["麻脸巫婆"],"text":"利维坦不能在第五天之后加入游戏。","kind":"jinx"},{"with":["帽匠"],"text":"利维坦不能在第五天之后加入游戏。","kind":"jinx"},{"with":["戏子"],"text":"在戏子存在于剧本中时，利维坦可以在游戏中任意时候向说书人示意自己“想要死亡”。说书人会在当晚杀死这名玩家。","kind":"jinx"},{"with":["和尚"],"text":"如果利维坦提名并处决了与和尚邻近的其中一名存活玩家，善良阵营获胜。","kind":"jinx"},{"with":["打更人"],"text":"如果利维坦提名并处决了打更人上个夜晚猜测的其中一名玩家，善良阵营获胜。","kind":"jinx"},{"with":["戏子（改）"],"text":"在戏子（改）存在于剧本中时，利维坦可以在游戏中任意时候向说书人示意自己“想要死亡”。说书人会在当晚杀死这名玩家。","kind":"jinx"},{"with":["狸猫"],"text":"每个夜晚*，利维坦要选择一名存活的善良玩家（与之前的每个夜晚不同）：如果“太子”被选择，他会与狸猫交换角色但不会死亡。","kind":"jinx"},{"with":["巡察"],"text":"如果利维坦提名并处决了巡察上个夜晚保护的其中一名玩家，善良阵营获胜。","kind":"jinx"}],"tips":["围绕善良处决次数与第五天期限争夺节奏。","对抗时规划有限处决，能力正常时处决未死也计数。"],"counterplay":["应对时处决计数不是死亡计数；能力失效窗口和第五天期限都应单独记录。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗利维坦"]},"lleech":{"id":"lleech","name":"痢蛭","sourceTitle":"痢蛭","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%97%A2%E8%9B%AD","checkedAt":"2026-11-11","ability":"每个夜晚*，你要选择一名玩家：他死亡。在你的首个夜晚，你要选择一名存活的玩家：他中毒，只有当他处于死亡状态时你才会立即死亡。","mechanics":["在首个夜晚，痢蛭会选择一名玩家，被选择的玩家会在游戏的剩余时间内都处于中毒状态。","如果这名玩家存活，痢蛭就不会死亡。如果痢蛭被处决，说书人会告诉大家这名玩家仍然存活，但不会说明原因。","如果这名首夜被痢蛭选择的玩家死亡，痢蛭也会死亡。如果此时只剩一名或两名玩家存活，那么善良阵营还是会获胜，因为恶魔死亡了。","从第二个夜晚开始，痢蛭会攻击并杀死玩家，但不会让他中毒。","如果痢蛭在游戏过程中被创造，他会在当晚令一名玩家中毒。他必须要选择一名存活的玩家。"],"qa":[{"q":"宿主自己也是恶魔吗？","a":"不是。宿主保持原角色和类型，只是受到痢蛭能力中毒及死亡联动影响。"},{"q":"宿主在痢蛭醉毒时死亡怎么办？","a":"醉毒时联动暂停；痢蛭恢复能力后，若宿主处于死亡状态，痢蛭立即死亡。痢蛭醉毒时本身也可正常死亡。"}],"interactions":[{"with":[],"text":"当痢蛭醉酒或中毒时，宿主恢复健康。如果宿主在这个期间死亡，痢蛭不会受到影响，当痢蛭恢复清醒/健康后会立即死亡。如果痢蛭在醉酒或中毒时死亡，他死亡，因为他的能力在醉酒/中毒时无法阻止死亡。如果痢蛭的宿主醉酒/中毒，对痢蛭没有影响。","kind":"detail"},{"with":[],"text":"痢蛭仍然是恶魔，宿主仍然是他相应的角色类型，痢蛭对宿主的选择不会对他的角色产生任何改变。注意，宿主可以是任何存活玩家，不管是什么角色类型。","kind":"detail"},{"with":["士兵"],"text":"如果士兵被痢蛭选为宿主，他不会中毒。然而，如果他因为任何原因死亡（被处决，半兽人等等），痢蛭也会死亡。","kind":"interaction"},{"with":["莽夫"],"text":"如果莽夫在首个夜晚被选为宿主，这会使得痢蛭醉酒直到下个黄昏，并且莽夫变为邪恶。如果莽夫在首个白天被处决，痢蛭仍然会死亡，因为莽夫的醉酒效果由于莽夫的死亡而消失了。","kind":"interaction"},{"with":["疯子"],"text":"如果疯子自认为是痢蛭，真正的恶魔会被告知疯子在首个夜晚选择谁作为宿主，但是，举例来说，这与疯子自认为是普卡并在首个夜晚做出选择没有什么区别——真正的恶魔不会知道这里面的区别。","kind":"interaction"},{"with":["麻脸巫婆"],"text":"如果创造出新的恶魔，仍然需要杀死宿主才能杀死痢蛭，麻脸巫婆不能无视痢蛭免死的能力。因为如果旅行者离开，他死亡，并且痢蛭因此死亡。","kind":"interaction"},{"with":["咖啡师"],"text":"如果咖啡2不是在首个夜晚，痢蛭可以杀害两次。如果咖啡2在首个夜晚，痢蛭选择两名玩家，从现在开始他们两个都中毒。无论如何，必须这两名玩家都死亡，痢蛭才会死亡。","kind":"interaction"},{"with":["猎手"],"text":"如果猎手选择了痢蛭的宿主，则宿主会死亡。","kind":"jinx"},{"with":["主谋"],"text":"如果主谋存活且痢蛭的宿主死于处决，痢蛭存活但失去能力。","kind":"jinx"},{"with":["异端分子"],"text":"互为克星的角色在同一时间里只能有其中一个角色在场。","kind":"jinx"},{"with":["半仙"],"text":"痢蛭的宿主及其中毒效果无法被转移。","kind":"jinx"},{"with":["使节"],"text":"痢蛭的宿主及其中毒效果无法被转移。","kind":"jinx"},{"with":["掮客"],"text":"痢蛭的宿主及其中毒效果无法被转移。","kind":"jinx"}],"tips":["与队友保护宿主，隐蔽长期中毒来源。","对抗时先辨认机制，再找宿主而非反复处决痢蛭。"],"counterplay":["假称宿主或中毒可转移处决方向；应对时用长期反馈、未死现象和真实名额交叉核验。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗痢蛭"]},"lilmonsta":{"id":"lilmonsta","name":"小怪宝","sourceTitle":"小怪宝","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%B0%8F%E6%80%AA%E5%AE%9D","checkedAt":"2026-11-11","ability":"每个夜晚，所有爪牙要秘密决定由哪名玩家来照看小怪宝并且“是恶魔”。每个夜晚*，可能会有一名玩家死亡。[+1爪牙]","mechanics":["爪牙们通过指向一名玩家或以其他明显的方式达成一致意见。如果他们不能达成一致，由说书人决定谁照顾小怪宝。","他需要把小怪宝藏进他的口袋，放在他的帽子里，或其他合适的地方。玩家不能要求其他人清空他们的口袋。","正照顾小怪宝的玩家“是恶魔”。如果他死亡了，善良阵营获胜。他会被其他角色能力检测到“是恶魔”，例如占卜师。","如果一个善良玩家正照顾小怪宝，他“是恶魔”，但依旧是善良的。一个死亡玩家照顾小怪宝会让游戏结束，因为恶魔已经死亡了。","照顾小怪宝的玩家保留他原有的能力。","小怪宝不是玩家，所以不会醉酒或中毒。"],"qa":[],"interactions":[{"with":[],"text":"小怪宝这个角色也会被视作是“在场角色”，但它不属于任何一名玩家，也无法被常规的“选择一名玩家”的能力选中。","kind":"detail"},{"with":[],"text":"“非指向性”的死亡效果可以杀死小怪宝，例如麻脸巫婆 、 小怪宝等角色的能力。从现在起，小怪宝会被视作是“不在场”来处理。","kind":"detail"},{"with":[],"text":"如果某个能力让一名玩家变成小怪宝，该玩家的角色不会发生变化，而是改为正在照看小怪宝。但如果是工程师选择让小怪宝在场，会让一名恶魔因此变成一个正在照看小怪宝的不在场爪牙。反之如果工程师选择了其他的恶魔而导致小怪宝需要发生角色变化，当前照看小怪宝的玩家会变成工程师所选择的恶魔，同时小怪宝会离场。","kind":"detail"},{"with":["猩红女郎"],"text":"如果在五名及以上的玩家存活时照看小怪宝的玩家死亡，之后猩红女郎必须要一直照看小怪宝。","kind":"jinx"},{"with":["魔术师"],"text":"如果魔术师存活，由说书人决定谁照看小怪宝。","kind":"jinx"},{"with":["帽匠"],"text":"如果帽匠死亡，恶魔选择了小怪宝，则还需要选择变成一个爪牙角色。","kind":"jinx"},{"with":["精神病患者"],"text":"如果精神病患者正照看小怪宝，他会在被处决时死亡。","kind":"jinx"},{"with":["提线木偶"],"text":"如果提线木偶本应初始在场，他们会在恶魔之后进场并与恶魔邻座。","kind":"jinx"},{"with":["维齐尔"],"text":"如果维齐尔正照看小怪宝，他会在被处决时死亡。","kind":"jinx"}],"tips":["发挥额外爪牙并规划每夜照顾者。","对抗时区分真实角色与当夜“是恶魔”的玩家。"],"counterplay":["当夜照顾者可能来自任何角色或阵营；应对时随夜晚更新恶魔视角，不能永久固定照顾者。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗小怪宝"]},"yaggababble":{"id":"yaggababble","name":"牙噶巴卜","sourceTitle":"牙噶巴卜","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%89%99%E5%99%B6%E5%B7%B4%E5%8D%9C","checkedAt":"2026-11-11","ability":"在你的首个夜晚，你会得知一段秘密短语。每次你在白天公开说出这段短语，当天便可能会有一名玩家在这之后死亡。","mechanics":["说书人提供给牙噶巴卜的短语可以是任意长度，但建议是2到5个字左右。","如果牙噶巴卜说出了这段短语，说书人便可以在这之后，在下个黎明前的任意时机杀死一名玩家。","牙噶巴卜无论是通过单独说出这段短语，或将它混杂在整句话里说出，都可以触发效果。","牙噶巴卜可以在同一天多次说出这段短语。说书人可以因此杀死多名玩家。","由说书人来决定牙噶巴卜的能力会让哪名玩家死亡。","说书人可以选择只杀死少于牙噶巴卜说出短语的次数这一数量的玩家。","在牙噶巴卜醉酒或中毒期间，玩家不会因为他的能力死亡，即使牙噶巴卜在说出短语时清醒健康。在牙噶巴卜清醒健康期间，玩家会因为他的能力死亡，即使在牙噶巴卜在说出短语时醉酒或中毒。","只有极少数情况下，牙噶巴卜的能力才会让玩家在白天死亡。"],"qa":[],"interactions":[{"with":["驱魔人"],"text":"如果驱魔人选中了牙噶巴卜，那么牙噶巴卜在当晚无法造成死亡。","kind":"jinx"},{"with":["戏子"],"text":"在戏子存在于剧本中时，牙噶巴卜可以在游戏中任意时候向说书人示意自己“想要死亡”。不论他是否说过秘密短语，说书人都会在当晚杀死这名玩家。","kind":"jinx"},{"with":["戏子（改）"],"text":"在戏子（改）存在于剧本中时，牙噶巴卜可以在游戏中任意时候向说书人示意自己“想要死亡”。不论他是否说过秘密短语，说书人都会在当晚杀死这名玩家。","kind":"jinx"}],"tips":["让说书人听清短语，同时避免过于明显。","对抗时把重复短语与死亡时点对照，警惕队友掩护。"],"counterplay":["爪牙可重复假短语掩护恶魔；应对时结合真实死亡时点，不凭一句常用口头禅认恶魔。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","规则细节","提示与技巧","对抗牙噶巴卜"]},"deusexfiasco":{"id":"deusexfiasco","name":"失败的上帝","sourceTitle":"失败的上帝","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%A4%B1%E8%B4%A5%E7%9A%84%E4%B8%8A%E5%B8%9D","checkedAt":"2026-11-11","ability":"每局游戏至少一次，说书人将会出现失误，但会纠正并公开承认自己曾处理有误。","mechanics":["在游戏开始时，宣布失败的上帝加入游戏。它不可以在游戏中途加入游戏。假如说书人游戏中途犯了一个措误，并在事后加入失败的上帝，那么所有玩家都会明确意识到这确实是一个真实的失误，这样失败的上帝原本模糊和不确定性的设计目的就失效了。","说书人至少需要犯一次错。这可以是一个意外的错误，也可以是一个故意的错误。玩家并不知道是哪种情况。","若说书人已经有过失误，就无需再人为制造额外错误来配合角色。如果游戏椄近最后一天，说书人还没有犯过错，那么他要在游戏结束前故意犯个错。","玩家可以在没有错误时声称说书人犯错了，或者声称一个还未纠正的错误被处理了。","如有需要，说书人可以安排几次看似意外的错误、有意为之的错误，或二者结合，以营造失败的上帝带来的混乱效果。"],"qa":[],"interactions":[],"tips":["把公开更正记为新版本并回看受影响推断。","不要自行把任何矛盾都认作说书人失误。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"ferryman":{"id":"ferryman","name":"摆渡人","sourceTitle":"摆渡人","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%91%86%E6%B8%A1%E4%BA%BA","checkedAt":"2026-11-11","ability":"在游戏的最后一天，所有已死亡玩家会重新获得投票标记。","mechanics":["如果你正在为新人玩家主持一场游戏，而他们还没有掌握何时使用死亡票的策略，或者忘记自己已经死亡而使用了死亡票，你可以将摆渡人加入游戏。这样可以确保每个人在最后一天的关键投票中都有发言权。","所有已死亡的玩家都能够在最后一天获得投票标记，不论他们阵营如何，在何时用掉了自己的投票标记。","如果一名已死亡玩家仍然拥有投票标记，摆渡人不会让他获得第二枚投票标记。","最后一天指的是说书人认为最有可能是游戏的最后一天——如果这一天没有处决恶魔，邪恶阵营就会获胜！通常来说，这意味着当天只有三名玩家存活。","在最后一天时使用投票标记后，不会再重新获得投票标记。"],"qa":[],"interactions":[],"tips":["为最后一天投票保留明确计划。","重新获得的票不改变死者身份可信度。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"stormcatcher":{"id":"stormcatcher","name":"暴风捕手","sourceTitle":"暴风捕手","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%9A%B4%E9%A3%8E%E6%8D%95%E6%89%8B","checkedAt":"2026-11-11","ability":"游戏开始时，你要宣布一个善良角色。如果该角色在场，他只能死于处决，但所有邪恶玩家会在首个夜晚得知他是哪一名玩家。","mechanics":["如果你想要基于一个特定的善良角色的行动或信息来创建一个剧本，又或者是你希望在每一局游戏中都让这个角色出场（或者至少会有一名邪恶玩家想要伪装成这个角色），你可以使用暴风捕手。你所选择的角色会在游戏中占据举足轻重的位置，会在多数时候成为公开讨论的焦点，且大多数时候都会存活直至游戏的最后一天。","被说书人宣布的角色在除处决以外的所有情况下都不会死亡。这个角色可能会在场，也可能不在场。如果他在场，那么这名善良玩家的生死就会完全取决于其他善良玩家的意愿，因为邪恶玩家无法杀死他。如果他不在场，所有邪恶玩家都会得知这一信息，因此任何一名邪恶玩家都能够轻易伪装成这个角色。（他们不是必须要这样做，但他们可以这样做。）"],"qa":[],"interactions":[],"tips":["开局记公布角色和保护条件，利用安全期收集信息。","只有处决可死不等于所有能力都不受影响。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"ventriloquist":{"id":"ventriloquist","name":"腹语师","sourceTitle":"腹语师","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%85%B9%E8%AF%AD%E5%B8%88","checkedAt":"2026-11-11","ability":"如果一名玩家在被提名时“疯狂”地证明自己是一个新的角色，他可能不会死于当天的处决。","mechanics":["“疯狂”地证明自己是一个新的角色指的是玩家要“疯狂”地证明自己是一个之前未声称过的角色。","只有当玩家在被提名的期间“疯狂”地证明自己是一个新角色，才能因腹语师的能力受益。","玩家的真实角色无关乎腹语师的能力结算。玩家可以先后“疯狂”地证明自己是假的角色和真实角色；先后“疯狂”地证明自己是真实角色和假的角色；或先后“疯狂”地证明自己是两个不同的假的角色。","玩家只有在被处决时才得知死亡还是存活，但不会得知是否被腹语师的能力保护免于死亡。","说书人有对玩家的表现是否符合“疯狂”状态的最终裁决权，就算玩家足够疯狂，说书人仍可能决定让该玩家死于处决。","腹语师的能力可以保护恶魔，但说书人不能因此让邪恶阵营直接获胜。","玩家“疯狂”地证明自己是一个之前未声称过的角色只能保护自己当天不会死于处决。"],"qa":[],"interactions":[],"tips":["被提名时考虑新声明的收益与代价。","可能免死不代表一定生效，换跳也不能直接判红。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"knaves":{"id":"knaves","name":"诡诈杰克","sourceTitle":"诡诈杰克","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%AF%A1%E8%AF%88%E6%9D%B0%E5%85%8B","checkedAt":"2026-11-11","ability":"场上有两位说书人：一人说真话，一人说假话。每局游戏限一次，他们可能会在黄昏互换。","mechanics":["当诡诈杰克在场时，对局将由两位说书人主持。当玩家因角色能力获取信息时，其中一位说书人提供正确信息，另一位提供错误信息。","玩家不知道哪位说书人提供正确/错误信息。每次需要获取信息时，玩家自行选择由哪位说书人来告知。","在涉及游戏规则或非角色能力信息时，说书人始终必须给出正确信息，包括但不限于：宣布提名情况、提供恶魔的伪装信息、爪牙信息阶段等。","如果玩家醉酒或中毒，说书人都可以选择提供正确或错误信息。","每局游戏限一次，通常在善良阵营逐渐分辨出真假说书人时，提供正确信息的说书人可以变为提供错误信息的，反之亦然。"],"qa":[],"interactions":[],"tips":["记录每条信息由哪位说书人提供，比较可能的黄昏互换。","不要把真假来源固定到整局。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"pope":{"id":"pope","name":"教皇","sourceTitle":"教皇","source":"https://wiki.biligame.com/bloodontheclocktower/%E6%95%99%E7%9A%87","checkedAt":"2026-11-11","ability":"会有重复的善良角色在场。他们也可能是恶魔的伪装。","mechanics":["镇民或外来者中，可能有复数个相同角色同时在场，也可能两类角色均有重复。","可能只有一个角色会有复数个相同角色在场，也有可能有多个角色会有复数个相同角色在场。","恶魔的三个伪装中可以包含这些重复的角色。","复数个相同的外来者会导致外来者数量异常，而复数个相同的镇民则不会如此。"],"qa":[],"interactions":[],"tips":["保留重复善良角色的合法性，别仅凭对跳认定一假。","恶魔也可能拿到相同角色作伪装。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"godofug":{"id":"godofug","name":"讷神","sourceTitle":"讷神","source":"https://wiki.biligame.com/bloodontheclocktower/%E8%AE%B7%E7%A5%9E","checkedAt":"2026-11-11","ability":"会有一顶讷帽。当玩家戴着讷帽的时候，只能说单音节词，但投票算作两票。如果违反规则，讷帽会被转移。","mechanics":["戴着讷帽的玩家投票时，该票算作两票。如果可以的话，最好真的准备一顶帽子作为道具。","任何单音节词都是允许的。试图用连字符把词拼起来的花招不算数。如果说出一个多音节词，就会立刻失去讷帽。","说书人决定最开始戴讷帽的玩家。如果戴帽玩家说出了多音节词、说话拖太久、玩得不开心，或是已经戴帽太久，说书人就会把帽子给新的玩家。","任何玩家都可以戴讷帽。如果不想戴，可以拒绝。一名玩家也可能在游戏中多次获得讷帽。","如果说书人恰巧不在场，则使用荣誉制度：任何玩家只要发现戴帽玩家说了多音节词，都可以指出，讷帽随即被移走。"],"qa":[],"interactions":[],"tips":["遵守本局单音节要求并记录帽子流转。","双票权重不是阵营证据。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"bigwig":{"id":"bigwig","name":"首席律师","sourceTitle":"首席律师","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%A6%96%E5%B8%AD%E5%BE%8B%E5%B8%88","checkedAt":"2026-11-11","ability":"每个被提名者要选择一名玩家：在投票前，只有他可以发言，并且他要“疯狂”地证明被提名者是善良的，否则他可能死亡。","mechanics":["当玩家被提名时，他必须选择一名玩家为其辩护，无论该玩家是生是死。","在此期间，其他玩家不得发言，包括被提名的那位玩家。如有必要，说书人可以借助“地狱藏书员”来强制执行这一规定。","如果这名被选择的玩家“疯狂”地证明被提名者是邪恶的，或没有足够“疯狂”地证明被提名者是善良的，说书人可能会杀死他。","“疯狂”地证明“这个人不该被处决”这种表现，可能足够接近“疯狂”地证明“这名玩家是善良的”，从而不会被说书人杀死。","说书人会明确告知其他玩家需要开始保持安静。该阶段会持续到投票开始为止。","被提名者所选择的玩家仍然可以参与投票。"],"qa":[],"interactions":[],"tips":["选择能有效辩护的玩家，区分被要求的疯狂发言与真实认人。","注意辩护期发言限制。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"bootlegger":{"id":"bootlegger","name":"私货商人","sourceTitle":"私货商人","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%A7%81%E8%B4%A7%E5%95%86%E4%BA%BA","checkedAt":"2026-11-11","ability":"这个剧本包含有自制角色或自制规则。","mechanics":["私货商人允许说书人使用自己或他人创造的非官方角色，或允许他在游戏中使用非标准规则。","如果剧本列表上有自定义角色，或游戏中包含自定义规则，说书人需要在游戏开始前讲这些内容介绍给所有玩家。","私货商人允许剧本中夹杂复数数量的自定义角色或规则。","（译注：这一项功能为国外app的功能，但也希望各位说书人在使用集石在线魔典的时候也遵循这个规则）","私货商人是仅能在官方app（国内为在线魔典）上使用的奇遇角色。","尽管这个角色的名字之前有很多备选方案，但在决定它名字的一次激烈的投票中，“私货商人”成功击败了“私酿世家的霍姆布鲁菲斯蜀黍”。"],"qa":[],"interactions":[],"tips":["开局确认全部自制技能和规则，按本局原文推理。","未声明的特例不能随意添加。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"hindu":{"id":"hindu","name":"印度教教徒","sourceTitle":"印度教教徒","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%8D%B0%E5%BA%A6%E6%95%99%E6%95%99%E5%BE%92","checkedAt":"2026-11-11","ability":"最先死亡的四名玩家会立刻以相同阵营的旅行者转世重生。","mechanics":["最先死亡的四名玩家会变成旅行者，无论他们是如何死亡的。","由说书人决定玩家变成哪个旅行者角色——这和常规情况下玩家自行选择旅行者角色不同。成为旅行者角色后的玩家的阵营与其死亡前一致。","如果剧本有五名推荐的旅行者角色，说书人要从这五个角色之中进行选择。","多个死亡效果的结算都是有先后顺序的。例如，沙巴洛斯在夜间攻击了两名玩家，结算顺序由其选择攻击的顺序决定。","如果恶魔是最先死亡的四名玩家之一，游戏立刻结束，善良阵营获胜。"],"qa":[],"interactions":[],"tips":["依死亡顺序记前四次转世及新旅行者角色。","角色变化保留原阵营，不按新角色类型自动改阵营。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"zenomancer":{"id":"zenomancer","name":"异术士","sourceTitle":"异术士","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%BC%82%E6%9C%AF%E5%A3%AB","checkedAt":"2026-11-11","ability":"一名或多名玩家各自拥有一个目标。当达成目标后，他会获得一条正确信息。","mechanics":["说书人可以为一名或多名玩家分配目标。说书人会私下告知玩家他的目标是什么。玩家可能在游戏开始时就被分配了目标，也可能在游戏过程中才被分配目标。不同玩家被分配目标的时间点可能各不相同。","目标可以是任何事情：可以是与游戏直接相关的，也可以是超出游戏范围的内容。","判定一名玩家是否达成目标条件的决定权在说书人手中。一旦说书人判定达成目标条件，该玩家将获得一条关于游戏的正确信息，即使玩家中毒或醉酒，因为这是异术士能力产生的信息，而不是来源于玩家自己的角色。","目标之间可能相互冲突，也可能始终无法达成。","通常一局游戏会有1到3个目标，且大多数目标在对局开始时就已被分配。","玩家可以声称自己被分配了目标，或假装已经达成了目标。","任何玩家都可能被分配目标，哪怕是旅行者或死亡玩家。"],"qa":[],"interactions":[],"tips":["准确记录自己的目标、达成时点与收到的信息。","目标本身不自动说明其他玩家身份。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"tor":{"id":"tor","name":"遗忘之门","sourceTitle":"遗忘之门","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%81%97%E5%BF%98%E4%B9%8B%E9%97%A8","checkedAt":"2026-11-11","ability":"玩家不知道自己的角色和阵营。当他们死亡时才会得知这些信息。","mechanics":["玩家不会知道自己的角色。","角色的能力依然正常生效。","当一名玩家死亡时，他会得知自己的角色和阵营。即使他中毒或醉酒，也会得知其正确的角色和阵营信息。","恶魔和爪牙互相不认识。"],"qa":[],"interactions":[],"tips":["分开未知身份、实际行动和死后得知的身份。","被唤醒或选人不代表已认证角色。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"gardener":{"id":"gardener","name":"园丁","sourceTitle":"园丁","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%9B%AD%E4%B8%81","checkedAt":"2026-11-11","ability":"由说书人来为所有玩家派发角色。","mechanics":["说书人决定每位玩家的具体角色。","初始设置不会因为园丁的加入而有所调整。","加入园丁的目的并不是为了让玩家去选择自己想游玩的角色，而是为了让说书人可以为玩家提供特定风格的对局体验或逻辑碰撞。"],"qa":[],"interactions":[],"tips":["不凭玩家惯用角色反推分配。","没有明确额外规则时，人数配置仍按正常设置处理。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["角色简介"]},"gangster":{"id":"gangster","name":"黑帮","sourceTitle":"黑帮","source":"https://wiki.biligame.com/bloodontheclocktower/%E9%BB%91%E5%B8%AE","checkedAt":"2026-11-11","ability":"每个白天限一次，你可以杀死与你邻近的两名存活的玩家中的一名，但需要另一边那个存活的玩家同意。","mechanics":["黑帮可以杀死与他邻近的存活玩家之一。死亡的邻近玩家会被跳过而不被计算在内。","想要使用这项能力，黑帮和另一名与他邻近的存活玩家必须一致同意。说书人必须亲自听到两人的意向。黑帮不能在未经过说书人的见证时杀死其他玩家。","每个白天，黑帮可以随心所欲地发言，以此来挑拨玩家。一旦他提议使用能力并征求了意见之后，他就不能在今天再次使用他的能力，即使被攻击的玩家因为某些能力保护而没有死亡。","在计算黑帮邻近的存活玩家时，始终是在顺时针和逆时针方向上分别计算距离黑帮最近的存活玩家。","如果两名邻近的存活玩家都想要杀死对方，那么由黑帮来做出决定让谁死亡。"],"qa":[],"interactions":[],"tips":["先核对两侧最近存活者的声明与同意，再决定是否击杀。","拒绝同意不是邪恶认证。"],"counterplay":[],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"]},"cacklejack":{"id":"cacklejack","name":"笑匠","sourceTitle":"笑匠","source":"https://wiki.biligame.com/bloodontheclocktower/%E7%AC%91%E5%8C%A0","checkedAt":"2026-11-11","ability":"每个白天，你要选择一名玩家：一名其他玩家会在当晚改变角色。","mechanics":["每个夜晚，说书人选择一名玩家发生角色变化。这名玩家是邪恶的，善良的，死亡的或存活的都可以。","说书人也决定他会变成什么角色。可以是在场角色，也可以是不在场角色。","每个白天，笑匠选择一名玩家免疫自己的能力：说书人必须选择另一名玩家在当晚发生角色变化。","笑匠可以公开选择，也可以私下选择，但必须在白天。","当玩家的角色发生变化时，他是以全新的角色进场并拥有能力。例如，如果一名玩家在第三个夜晚变成了厨师，他会得知有多少邪恶玩家邻座。"],"qa":[{"q":"我选的人会被换角色吗？","a":"恰好相反：你选择的是当晚不会因此换角色的人；改变的是另一名玩家。"}],"interactions":[],"tips":["优先选择值得保留能力的人，使其免于当晚改角色。","对抗时及时记录实际新角色。"],"counterplay":[],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"]},"gnome":{"id":"gnome","name":"侏儒","sourceTitle":"侏儒","source":"https://wiki.biligame.com/bloodontheclocktower/%E4%BE%8F%E5%84%92","checkedAt":"2026-11-11","ability":"当你加入游戏时，所有玩家会得知一名与你阵营相同的玩家。每当他被提名时，你可以杀死提名者。","mechanics":["侏儒的初始阵营与另一名玩家相同——这名玩家是侏儒的同伴。说书人要公开宣布谁是侏儒的同伴。","当侏儒的同伴被提名时，在投票开始之前，侏儒可以发言来表明是否使用能力。说书人不需要提醒侏儒使用能力。","如果同伴的阵营发生变化，侏儒的阵营不会发生改变。","侏儒可以在游戏中多次使用他的能力，也可以一次都不使用。即使如此，同伴仍然每天只能被提名一次。","当说书人确定侏儒的能力生效后，提名者立刻死亡，必要的辩护和投票仍然继续。","不论玩家群体的意见如何，每名玩家的提名应当由玩家个人决定，侏儒是否使用能力也应由侏儒自己决定。如果说书人认为一名玩家被他人施压而进行提名或使用能力，且他主观上并不想这样做，说书人可以拒绝这次提名或这次能力的使用。"],"qa":[],"interactions":[],"tips":["结合同伴阵营与每次提名价值决定是否击杀。","同伴以后转阵营不自动带动你转阵营。"],"counterplay":[],"tipBasis":"根据百科玩家策略整理","sourceSections":["角色简介","提示与技巧（作为善良）","提示与技巧（作为邪恶）"]},"imperialist_v2":{"id":"imperialist_v2","name":"禁卫军（改）","ability":"在你的首个夜晚，你要选择存活或死亡。“疯狂”地想要这样做的玩家可能会立即被处决。","sourceTitle":"山雨欲来","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%B1%B1%E9%9B%A8%E6%AC%B2%E6%9D%A5","checkedAt":"2026-11-11","mechanics":["首夜选择“存活”或“死亡”；随后疯狂想达成该选择的玩家可能被立即处决。","这是合集卡面改版，单独禁卫军页面仍为只针对求死的旧版。"],"qa":[],"interactions":[],"tips":["记录首夜选择及本局疯狂裁定；未发生处决不能反证该角色。"],"counterplay":[],"tipBasis":"按技能整理的玩家建议","sourceSections":["合集角色卡"],"coverageNote":"合集仅提供改版卡面，尚无对应改版的详细答疑；不沿用旧版交互。"},"doomsayer":{"id":"doomsayer","name":"末日预言者","team":"fabled","ability":"如果大于等于四名玩家存活，每名当前存活的玩家可以公开要求你杀死一名与他阵营相同的玩家（每名玩家限一次）。","mechanics":["公开启用的传奇规则，不占玩家座位，也不会因死亡、醉酒或中毒而失效。","仅在至少四名玩家存活时可用，每名当前存活玩家限一次；死亡者须与请求者当时阵营相同，不是必杀邻居或必杀自己。","先确认死亡确由这项公开能力造成，再使用同阵营关系，仍检查本局实际适用的登记规则。"],"tips":["先确认本局是否启用及其具体对象，只在这些条件下使用规则推论；公开规则不认证任何玩家身份。"],"source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E6%9C%AB%E6%97%A5%E9%A2%84%E8%A8%80%E8%80%85","checkedAt":"2026-11-17","sourceTitle":"末日预言者","qa":[],"interactions":[],"counterplay":[],"tipBasis":"根据百科规则与范例整理","sourceSections":["角色能力","玩家规则摘记"]},"toymaker":{"id":"toymaker","name":"玩具匠","team":"fabled","ability":"恶魔可以在夜晚选择放弃攻击（每局游戏至少一次）。 邪恶玩家照常获取初始信息。","mechanics":["公开启用的传奇规则，不占玩家座位，也不会因死亡、醉酒或中毒而失效。","允许恶魔夜间放弃攻击，且每局至少一次；无人夜死不能因此自动认证保护或醉毒。","邪恶玩家照常获得初始信息；五六人局不可继续无条件沿用没有邪恶互认的默认前提。"],"tips":["先确认本局是否启用及其具体对象，只在这些条件下使用规则推论；公开规则不认证任何玩家身份。"],"source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E7%8E%A9%E5%85%B7%E5%8C%A0","checkedAt":"2026-11-17","sourceTitle":"玩具匠","qa":[],"interactions":[],"counterplay":[],"tipBasis":"根据百科规则与范例整理","sourceSections":["角色能力","玩家规则摘记"]},"angel":{"id":"angel","name":"天使","team":"fabled","ability":"对新玩家的死亡负最大责任的人，可能会遭遇一些不好的事情。","mechanics":["公开启用的传奇规则，不占玩家座位，也不会因死亡、醉酒或中毒而失效。","惩罚并非固定必死或固定失能；只使用本局明确宣布的保护对象、后果与时点，不凭模糊惩罚补造事件。"],"tips":["先确认本局是否启用及其具体对象，只在这些条件下使用规则推论；公开规则不认证任何玩家身份。"],"source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%A4%A9%E4%BD%BF","checkedAt":"2026-11-17","sourceTitle":"天使","qa":[],"interactions":[],"counterplay":[],"tipBasis":"根据百科规则与范例整理","sourceSections":["角色能力","玩家规则摘记"]},"buddhist":{"id":"buddhist","name":"佛教徒","team":"fabled","ability":"每个白天的前两分钟老玩家不能发言。","mechanics":["公开启用的传奇规则，不占玩家座位，也不会因死亡、醉酒或中毒而失效。","限制老玩家每天前两分钟发言，不改变角色名额、角色能力或阵营；沉默不能被当作角色或阵营证据。"],"tips":["先确认本局是否启用及其具体对象，只在这些条件下使用规则推论；公开规则不认证任何玩家身份。"],"source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E4%BD%9B%E6%95%99%E5%BE%92","checkedAt":"2026-11-17","sourceTitle":"佛教徒","qa":[],"interactions":[],"counterplay":[],"tipBasis":"根据百科规则与范例整理","sourceSections":["角色能力","玩家规则摘记"]},"revolutionary":{"id":"revolutionary","name":"革命者","team":"fabled","ability":"公开声明一对邻座玩家本局游戏一直保持同一阵营。 每局游戏限一次，他们中的一人可能被当作其他的角色/阵营。","mechanics":["公开启用的传奇规则，不占玩家座位，也不会因死亡、醉酒或中毒而失效。","公开指定的邻座二人整局保持同阵营；不意味着两人必善良。","每局限一次，其中一人可能发生角色或阵营误登记；必须与实际启用的对象及相应检测共同分析，不能将此异常无限复用。"],"tips":["先确认本局是否启用及其具体对象，只在这些条件下使用规则推论；公开规则不认证任何玩家身份。"],"source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E9%9D%A9%E5%91%BD%E8%80%85","checkedAt":"2026-11-17","sourceTitle":"革命者","qa":[],"interactions":[],"counterplay":[],"tipBasis":"根据百科规则与范例整理","sourceSections":["角色能力","玩家规则摘记"]},"hellslibrarian":{"id":"hellslibrarian","name":"地狱藏书员","team":"fabled","ability":"当说书人宣布安静时，仍在说话的玩家可能会遭遇一些不好的事情。","mechanics":["公开启用的传奇规则，不占玩家座位，也不会因死亡、醉酒或中毒而失效。","违反安静要求的后果由本局明确公告确定，不预设为处决、死亡或投毒；公开惩罚与角色能力事件分开记录。"],"tips":["先确认本局是否启用及其具体对象，只在这些条件下使用规则推论；公开规则不认证任何玩家身份。"],"source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%9C%B0%E7%8B%B1%E8%97%8F%E4%B9%A6%E5%91%98","checkedAt":"2026-11-17","sourceTitle":"地狱藏书员","qa":[],"interactions":[],"counterplay":[],"tipBasis":"根据百科规则与范例整理","sourceSections":["角色能力","玩家规则摘记"]},"fiddler":{"id":"fiddler","name":"小提琴手","team":"fabled","ability":"每局游戏限一次， biligame.com/jbzlbwgwjcygf/%E5%93%A8%E5%85%B5"]},"spiritofivory":{"id":"spiritofivory","name":"圣洁之魂","team":"fabled","ability":"游戏过程中邪恶玩家的总数最多能比初始设置多一名。","mechanics":["公开启用的传奇规则，不占玩家座位，也不会因死亡、醉酒或中毒而失效。","限制游戏过程中的邪恶总人数，最多比初始设置多一；不等于只允许发生一次转邪，也不直接固定具体邪恶座位。"],"tips":["先确认本局是否启用及其具体对象，只在这些条件下使用规则推论；公开规则不认证任何玩家身份。"],"source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%9C%A3%E6%B4%81%E4%B9%8B%E9%AD%82","checkedAt":"2026-11-17","sourceTitle":"圣洁之魂","qa":[],"interactions":[],"counterplay":[],"tipBasis":"根据百科规则与范例整理","sourceSections":["角色能力","玩家规则摘记"],"sources":["https://wiki.biligame.com/jbzlbwgwjcygf/%E5%9C%A3%E6%B4%81%E4%B9%8B%E9%AD%82"]},"djinn":{"id":"djinn","name":"灯神","team":"fabled","ability":"使用灯神的相克规则。所有玩家都会知道其内容。","mechanics":["公开启用的传奇规则，不占玩家座位，也不会因死亡、醉酒或中毒而失效。","使用本局公开的具体相克；不能因为灯神在场便任意制造、删除或改变相克。缺少关键裁定时才询问对应内容。"],"tips":["先确认本局是否启用及其具体对象，只在这些条件下使用规则推论；公开规则不认证任何玩家身份。"],"source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E7%81%AF%E7%A5%9E","checkedAt":"2026-11-17","sourceTitle":"灯神","qa":[],"interactions":[],"counterplay":[],"tipBasis":"根据百科规则与范例整理","sourceSections":["角色能力","玩家规则摘记"],"sources":["https://wiki.biligame.com/jbzlbwgwjcygf/%E7%81%AF%E7%A5%9E"]},"alhadikhia_optional":{"id":"alhadikhia_optional","name":"哈迪寂亚","sourceTitle":"哈迪寂亚","source":"https://wiki.biligame.com/jbzlbwgwjcygf/%E5%93%88%E8%BF%AA%E5%AF%82%E4%BA%9A","checkedAt":"2026-11-17","ability":"每个夜晚*，你可以选择三名玩家（所有玩家都会得知你选了谁）：他们分别秘密决定自己的生死，然后如果他们都存活则都死亡。","mechanics":["可选三名存活或已死玩家，包含自己；已死目标选生可复活。","本卡面为可选发动的旧版：除首夜外可以选择三人，也可以不发动；不能仅因未宣布三人排除此恶魔。","先结算三人的选择，再看他们实际是否全部存活；不是看三人是否全都选择了生。受免死保护且选择死的人仍可能存活，从而参与全员死亡的再检查。","醉毒哈迪寂亚不会因此宣布目标、唤醒目标、杀人或复活；已被确认的公开发动应作为能力当时有效的强信息分析。","恶魔死亡后能力不再继续结算；已完成的死亡或复活不被追溯撤销。具体死亡与复活按夜内顺序判断。","此剧本有多种免死、醉毒、角色交换与复活，不能沿用单刀暗流的夜死偏善良捷径，也不能把被选择、存活或复活直接当作阵营认证。"],"qa":[],"interactions":[{"with":[],"text":"已死亡的玩家如果选择“活着”，会被复活。","kind":"detail"},{"with":[],"text":"“如果他们都存活”判断条件不会关注这些玩家是如何做出选择的，而只看在这些选择结算后玩家是否存活。选择“死去”的存活玩家如果受到免死能力的保护，会因此存活并计入“如果他们都存活”的判断条件。","kind":"detail"},{"with":[],"text":"当哈迪寂亚死亡时，他如常失去自己的能力。此前被他杀死或复活的玩家依然保持当前的生死状态。哈迪寂亚的能力不会再继续产生效果。在黎明时，如常宣布玩家生死状态的改变情况。","kind":"detail"},{"with":["猩红女郎"],"text":"如果即将出现两名存活的恶魔，其中之一是由猩红女郎转变的，则猩红女郎变成的恶魔会变回猩红女郎。","kind":"jinx"},{"with":["主谋"],"text":"如果哈迪寂亚死于处决，且主谋存活，当晚哈迪寂亚要选择三名善良玩家：如果他们都选择存活，邪恶阵营获胜。否则，善良阵营获胜。","kind":"jinx"},{"with":["公主"],"text":"如果公主在首个白天提名并处决了一名玩家，没有人会因为哈迪寂亚而死亡。(公主与哈迪寂亚角色互动结果本应如此，此条仅做说明)","kind":"jinx"}],"tips":["利用三人选择与复活压力规划节奏。","对抗时为团队收益权衡生死，不用个人选择直接认证阵营。","优先记录三名公开目标、各自声明的生死选择及最终公告；仅缺结算相关细节才补问。善良视角重点找当前恶魔位置，不重复讨论已由公开发动明确的恶魔种类。","有水手、旅店老板、茶艺师或弄臣时，逐个核对免死与全员存活的连锁结算，勿以夜死人数机械推身份。"],"counterplay":["邪恶也可选择死亡来伪装牺牲；应对时不要把愿意死或复活后的表现直接认好。"],"tipBasis":"根据百科玩家策略整理","sourceSections":["上传卡面","共通结算规则"],"sources":["https://wiki.biligame.com/bloodontheclocktower/%E5%93%88%E8%BF%AA%E5%AF%82%E4%BA%9A","https://wiki.biligame.com/jbzlbwgwjcygf/%E5%93%88%E8%BF%AA%E5%AF%82%E4%BA%9A"],"coverageNote":"可选版本以本剧本上传卡面为准；结算方式沿用已核对的共通机制。"}};
