  const residentScripts = [{"id":"resident_daybreak_v1","name":"重见天日","data":[{"id":"_meta","name":"重见天日","author":"北方的预言家","specialRules":"【版本】重见天日；剧本作者：北方的预言家。依据用户提供的剧本图片整理，采用图中的角色、技能与顶部“失忆与回忆”，不替换为其他同名或新版角色组合。\n\n【遗忘之门】玩家不知道自己的角色和阵营，当他们死亡时才会得知。未知角色、未知阵营和实际身份分别处理；不因为玩家选人、收到信息或被唤醒就认证其角色。死亡后获得的信息按对应时点记录，不倒推为此前已知。\n\n【失忆与回忆·相克】移除数学家与酒鬼、数学家与疯子的两条相克规则。图中角色下方印出的这两条相克说明均不启用，不能从已移除的相克额外推导数学家数字；其余按主技能与有效交互处理。\n\n【失忆与回忆·疯子】恶魔不会知道疯子及其选择。此条覆盖图片疯子栏的常规通知文字；不得假定恶魔会跟随疯子选择。\n\n【失忆与回忆·唤醒】每个角色只有一种唤醒模式：唤醒并得到信息、唤醒并选择一名玩家、不会被唤醒。如果说书人唤醒玩家但不给出信息，代表该玩家需要选择一名玩家。仍遵守各技能的首夜、每夜*、存活和触发条件，不等于所有玩家每晚都会被唤醒。\n\n【角色范围】13镇民、4外来者、4爪牙、4恶魔，另有2个奇遇规则。遗忘之门、私货商人不占玩家座位、不是在场人数配置中的玩家角色。角色池不是实际在场名单。\n\n【配置和特殊能力】气球驾驶员可+0~1外来者，男爵+2外来者，亡骨魔-1外来者；不能只按报身份数推定实际配置。食人魔转变阵营即使醉毒仍生效；报丧女妖触发后有死后提名与双票；恐惧之灵导致阵营落败的条件是其本人提名的目标被处决，不能改成必须处决死亡。"},{"id":"empath","name":"共情者","team":"townsfolk","ability":"每个夜晚，你会得知与你邻近的两名存活的玩家中有几名是邪恶的。","notes":"跳过死亡玩家寻找两侧最近的存活玩家，不固定为最初邻座。保留每晚的存活状态。","builtin":true},{"id":"highpriestess","name":"女祭司","team":"townsfolk","ability":"每个夜晚，你会得知一名说书人认为你最应该与其交流的玩家。","notes":"这是交流建议，不直接认证该玩家的角色、阵营或信息真假。遗忘之门下，收到指认不代表已得知自己是女祭司。"},{"id":"sailor","name":"水手","team":"townsfolk","ability":"每个夜晚，你要选择一名存活的玩家：你或他之一会醉酒直到明天黄昏。你不会死亡。","notes":"若水手自己醉酒，他会失去不死能力；记录每夜选择，不把不死与醉酒同时无条件成立。","builtin":true},{"id":"balloonist","name":"气球驾驶员","team":"townsfolk","ability":"每个夜晚，你会得知一名与上个夜晚得知的玩家角色类型不同的玩家。[+0~1外来者]","notes":"按本图的逐夜相邻两次不同类型版本分析，不套旧版依次收集四类角色的技能。类型指镇民、外来者、爪牙、恶魔；设置调整为可增加0或1名外来者。"},{"id":"preacher","name":"传教士","team":"townsfolk","ability":"每个夜晚，你要选择一名玩家：如果选中了爪牙，他会得知被传教士选中。所有被你选中的爪牙失去能力。","notes":"选择不是查验反馈，传教士本人通常不因命中而收到确认。检查爪牙失能与传教士自身状态及时间线；不能把所有被选择者直接当爪牙。"},{"id":"mathematician","name":"数学家","team":"townsfolk","ability":"每个夜晚，你会得知从上个黎明到现在，有多少名玩家的能力因为其他角色的能力而未正常生效。","notes":"只计因其他角色而实际异常的能力；醉毒本身不计，醉毒却得到正常信息通常不计，自己的异常不计。同一玩家只计一次；误认也可能造成应计的异常。 本剧本“失忆与回忆”移除数学家与酒鬼、数学家与疯子的两条相克；不按这两条已移除的相克额外计数，其余仍按主技能及有效交互处理。","builtin":true},{"id":"daybreak_magistrate","name":"知府","team":"townsfolk","ability":"每个夜晚*，你会得知今天是否有非镇民且非旅行者玩家死亡。","notes":"检测当日死亡中是否包含外来者、爪牙或恶魔，不只看处决，也不是检测是否有邪恶死亡。旅行者和镇民排除在该条件外；保留当日死亡范围、角色时点及失真分支。"},{"id":"flowergirl","name":"卖花女孩","team":"townsfolk","ability":"每个夜晚*，你会得知今天白天是否有恶魔投过票。","notes":"需要全天投票记录，不能只看最终一次提名；没记录的票不能当作未投票。","builtin":true},{"id":"town_crier","name":"城镇公告员","team":"townsfolk","ability":"每个夜晚*，你会得知今天白天是否有爪牙发起过提名。","notes":"观察发起提名者，不是被提名者，也不是投票者。","builtin":true},{"id":"monk","name":"僧侣","team":"townsfolk","ability":"每个夜晚*，你要选择除你以外的一名玩家：当晚恶魔的负面效果对他无效。","notes":"已由用户确认：不能选择自己。保护只持续当晚，不等于免疫所有来源的死亡。","builtin":true},{"id":"alsaahir","name":"戏法师","team":"townsfolk","ability":"每个白天，你可以公开进行一次谁是爪牙、谁是恶魔的猜测。如果你猜对，善良阵营获胜。","notes":"需要完整区分哪些玩家是爪牙、哪些是恶魔，不是只猜某个坏人。猜错不代表每个被猜中的玩家都善良；遗忘之门下不可假定玩家已经知道自己拥有此能力。"},{"id":"ravenkeeper","name":"守鸦人","team":"townsfolk","ability":"如果你在夜晚死亡，你会被唤醒，然后你要选择一名玩家：你会得知他的角色。","notes":"触发条件是夜晚死亡，不只限于恶魔击杀；死亡当晚的触发例外需保留。","builtin":true},{"id":"banshee","name":"报丧女妖","team":"townsfolk","ability":"如果恶魔杀死了你，所有玩家都会得知此事。从现在开始，你每天可以发起两次提名，每次投票时可以投两票。","notes":"必须由恶魔杀死才触发，其他夜间死亡不自动满足条件。触发后有死后提名和额外票的特殊权限，不能套普通死者不能提名、仅一张幽灵票的限制；区分公开公告与自述。"},{"id":"ogre","name":"食人魔","team":"outsider","ability":"在你的首个夜晚，你要选择除你以外的一名玩家：你转变为他的阵营，即使你已醉酒或中毒，但你不知道你转变后的阵营。","notes":"本图食人魔对应Ogre，属于外来者，不是食人族Cannibal。首次选择改变阵营而不改变角色；醉毒不阻止该次转变。不由未知阵营、挡刀或表态推定善良，追踪选择当时目标的阵营。"},{"id":"drunk","name":"酒鬼","team":"outsider","ability":"你不知道你是酒鬼。你以为你是一个镇民角色，但其实你不是。","notes":"拿到的镇民身份不等于真实身份；酒鬼没有该镇民能力，模拟得到的信息可能真也可能假。 本剧本移除数学家与酒鬼的相克；不按该相克把酒鬼模拟反馈或能力未生效直接加进数学家数字。","builtin":true},{"id":"daybreak_lunatic","name":"疯子","team":"outsider","ability":"你以为你是一个恶魔，但其实你不是。根据本剧本“失忆与回忆”，恶魔不会知道你是疯子，也不会得知你的选择。","notes":"图中疯子栏印有常规通知文字，但顶部“失忆与回忆”明确覆盖：不向恶魔透露疯子及选择。本剧本也移除数学家与疯子的相克。疯子的选择不等于实际恶魔选择或死亡来源。"},{"id":"tinker","name":"修补匠","team":"outsider","ability":"你可能在任何时候死亡。","notes":"属于额外死亡来源，“可能”不能当成必定死亡。","builtin":true},{"id":"devils_advocate","name":"魔鬼代言人","team":"minion","ability":"每个夜晚，你要选择一名存活的玩家（与上个夜晚不同）：如果明天白天他被处决，他不会死亡。","notes":"保护仅针对处决死亡，不阻止发生处决；不能连续两晚选择同一人。","builtin":true},{"id":"witch","name":"女巫","team":"minion","ability":"每个夜晚，你要选择一名玩家：如果他明天白天发起提名，他死亡。如果只有三名存活的玩家，你失去此能力。","notes":"触发是发起提名，不是被提名；保留当时存活人数。","builtin":true},{"id":"fearmonger","name":"恐惧之灵","team":"minion","ability":"每个夜晚，你要选择一名玩家：如果你提名他且他被处决，他的阵营落败。当你首次选择或更换目标时，所有玩家都会得知你选择了新的玩家。","notes":"须由恐惧之灵本人提名其目标并发生处决，不要求处决死亡。公告只透露选了新目标，不公开目标是谁；提名者、被提名者与实际处决分开核对。"},{"id":"baron","name":"男爵","team":"minion","ability":"会有额外的两名外来者在场。[+2外来者]","notes":"开局设置改变，通常由镇民名额替换；男爵之后死亡不会撤销已经完成的设置。","builtin":true},{"id":"pukka","name":"普卡","team":"demon","ability":"每个夜晚，你要选择一名玩家：他中毒。上个因你的能力中毒的玩家会死亡并恢复健康。","notes":"从首夜行动，先中毒、随后夜晚延迟死亡。驱魔阻止其醒来选择新中毒目标，不等于撤销已有中毒。普卡醉酒可暂停既有中毒与击杀，恢复清醒后可能继续；保护阻止死亡时原中毒可结束。","builtin":true},{"id":"vigormortis","name":"亡骨魔","team":"demon","ability":"每个夜晚*，你要选择一名玩家：他死亡。被你杀死的爪牙保留他的能力，且与他邻近的两名镇民之一中毒。[-1外来者]","notes":"死亡爪牙可能继续有能力；邻近镇民不是简单的相邻座位。","builtin":true},{"id":"no_dashii","name":"诺-达鲺","team":"demon","ability":"每个夜晚*，你要选择一名玩家：他死亡。与你邻近的两名镇民中毒。","notes":"沿两个方向寻找最近镇民，不能直接等同恶魔物理邻座。","builtin":true},{"id":"lleech","name":"痢蛭","team":"demon","ability":"每个夜晚*，你要选择一名玩家：他死亡。在你的首个夜晚，你要选择一名存活的玩家：他中毒，只有当他处于死亡状态时你才会立即死亡。","notes":"采用图片这一版宿主死亡联动规则，不套普通恶魔被处决即死亡。追踪首夜宿主、宿主中毒和死亡状态、痢蛭本身是否有能力；不能仅凭某人信息异常锁定其为宿主。"},{"id":"daybreak_oblivion_gate","name":"遗忘之门","team":"loric","ability":"玩家不知道自己的角色和阵营。当他们死亡时才会得知这些信息。","notes":"这是作用于本局的奇遇规则，不占玩家座位，不是可分配给某名玩家的身份。按死亡前未知、得知死亡后获知的时间线处理；不把被唤醒、选人或收到信息当成角色认证，也不凭空补充邪恶互认所得信息。"},{"id":"bootlegger","name":"私货商人","team":"loric","ability":"这个剧本包含有自制角色或自制规则。","notes":"这是规则声明，不占玩家座位，不是可分配给玩家的角色。以本剧本图片整理版为准，特别是顶部“失忆与回忆”。"}]},{"id":"resident_storm_v1","name":"山雨欲来","data":[{"id":"_meta","name":"山雨欲来","specialRules":"【角色合集】山雨欲来是官方角色合集，并非固定的平衡成品剧本。此处保存百科收录的完整角色池；开局可按实际剧本调整范围。传奇与奇遇为规则，不占玩家座位；旅行者不计入基础人数配置。\n【版本】采用合集更新卡面：戏子（改）、禁卫军（改）。旧版仍保留在角色库，不混用其能力与答疑。","description":"角色合集","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%B1%B1%E9%9B%A8%E6%AC%B2%E6%9D%A5"},{"id":"brushholder","name":"秉笔","team":"townsfolk","ability":"如果你在白天死亡，当晚你会得知一名善良玩家。 如果你在夜晚死亡，当晚你会得知一名邪恶玩家。","notes":""},{"id":"favoretteen","name":"宠妃","team":"townsfolk","ability":"每局游戏限一次，说书人会在关于你的事情上打破规则。随后，你会秘密得知说书人为此做了什么。","notes":""},{"id":"dawnseal","name":"道士","team":"townsfolk","ability":"每个夜晚*，你要选择一名玩家：如果你选中了恶魔，你死亡，然后他醉酒直到下个黎明。","notes":""},{"id":"arythmomancer","name":"方士","team":"townsfolk","ability":"在你的首个夜晚，你要选择一个数字。 在该数字对应的那一个夜晚，你会得知对应数量的在场角色。","notes":""},{"id":"dragonli","name":"狸猫","team":"townsfolk","ability":"每个夜晚*，你要选择一名玩家：如果他是善良角色且当晚被邪恶角色杀死，你和他交换角色。","notes":""},{"id":"broker","name":"掮客","team":"townsfolk","ability":"每个夜晚，你要选择两名存活玩家：如果他们阵营相同，今晚任何玩家使用自身能力选择他们之一作为目标时，改为选中另一名玩家。","notes":""},{"id":"inspector","name":"提刑官","team":"townsfolk","ability":"在你首次提名玩家后，你会在当晚得知他的角色。恶魔会被你的能力当作善良角色。","notes":""},{"id":"patrolman","name":"巡察","team":"townsfolk","ability":"每个夜晚*，你要选择两个善良角色（与上个夜晚都不同）：如果他们都存活，他们当晚不会死亡。","notes":""},{"id":"guide","name":"引路人","team":"townsfolk","ability":"每个夜晚，你要选择除你以外的至多三名玩家：你会得知今晚是否有邪恶玩家的能力选择或影响了他们之中的玩家。","notes":""},{"id":"estafette","name":"驿使","team":"townsfolk","ability":"每个白天，你可以公开声明一个角色在场。在当晚，你会得知该声明是否正确。 如果你得知过是和否，你失去此能力。","notes":""},{"id":"zhen","name":"鸩","team":"townsfolk","ability":"每局游戏限一次，在夜晚时*，你可以选择一个镇民角色：如果他在场，他中毒并死亡。","notes":""},{"id":"prefect","name":"知府","team":"townsfolk","ability":"每个夜晚*，你会得知今天是否有非镇民且非旅行者的玩家死亡。","notes":""},{"id":"bartender","name":"酒保","team":"outsider","ability":"与你邻近的善良玩家（旅行者除外）之一醉酒，即使你死于处决。","notes":""},{"id":"mortician","name":"入殓师","team":"outsider","ability":"如果你提名了恶魔且他死于这次处决，你会变成那个邪恶的恶魔。当剩余存活玩家小于等于四人时（旅行者除外），你失去能力。","notes":""},{"id":"veilhuska","name":"画皮","team":"minion","ability":"在你的首个夜晚，你要选择一名存活玩家：他死亡但会被当作存活。 当他下一次即将死亡时，他重生，随后你重获能力。","notes":""},{"id":"hekwing","name":"蛊雕","team":"minion","ability":"每个夜晚，你会得知顺时针方向上的下一名存活的镇民玩家的角色，他中毒且可能被当作邪恶的蛊雕，直到下个黄昏。 每局游戏限一次，在夜晚时，你可以改变方向。","notes":""},{"id":"mengpo","name":"孟婆","team":"minion","ability":"每个夜晚*，你可以选择一名存活玩家，他要二选一：1）能力描述修改为“你没有能力。”；2）死亡并保留能力直到下个黄昏。","notes":""},{"id":"brewer","name":"酿酒师","team":"minion","ability":"每个夜晚，你要选择一个镇民角色：当他下一次通过自身能力获取信息时，改为得知你给出的信息。","notes":""},{"id":"pokkkun","name":"暴君","team":"demon","ability":"每个夜晚*，你要选择一名玩家：他死亡。 如果你杀死了与爪牙邻近的玩家，下个夜晚你可以选择至多两名玩家：他们死亡。","notes":""},{"id":"warden","name":"典狱长","team":"demon","ability":"每个夜晚，你要选择至多三名玩家：如果明天白天他们之一死于处决，上次被你选择的其他玩家会在当晚死亡。否则，当晚他们之中会有一名玩家死亡。","notes":""},{"id":"guhornia","name":"姑获鸟","team":"demon","ability":"每个夜晚*，你要选择一名玩家：他死亡。每局游戏限一次，当爪牙死于处决时，你可能会获得他的能力。","notes":""},{"id":"geehnyn","name":"奸佞","team":"demon","ability":"每个夜晚*，你要选择一名玩家：他死亡。爪牙在其死亡的当晚要选择一名玩家：如果他是善良的，他死亡。","notes":""},{"id":"actor_v2","name":"戏子（改）","team":"townsfolk","ability":"其他善良玩家醉酒（旅行者除外），你们互相认识且无法转变阵营，对调胜负结果，即使你失去能力。","notes":""},{"id":"imperialist_v2","name":"禁卫军（改）","team":"minion","ability":"在你的首个夜晚，你要选择存活或死亡。“疯狂”地想要这样做的玩家可能会立即被处决。","notes":"采用山雨欲来合集的改版技能，不与旧版禁卫军混用。"},{"id":"royalmessenger","name":"赦令承旨","team":"fabled","ability":"解除所有角色能力在进行选择时的限制条件。","notes":""}]},{"id":"resident_temple_v1","name":"华灯初上","data":[{"id":"_meta","name":"华灯初上","specialRules":"【角色合集】华灯初上是官方角色合集，并非固定的平衡成品剧本。此处保存百科收录的完整角色池；开局可按实际剧本调整范围。传奇与奇遇为规则，不占玩家座位；旅行者不计入基础人数配置。","description":"角色合集","source":"https://wiki.biligame.com/bloodontheclocktower/%E5%8D%8E%E7%81%AF%E5%88%9D%E4%B8%8A"},{"id":"banxian","name":"半仙","team":"townsfolk","ability":"任何在夜晚使用自身能力选择你的其他玩家，会改为选中另一名邪恶玩家作为替代。","notes":""},{"id":"facechanger","name":"变脸师","team":"townsfolk","ability":"每个白天，如果你“疯狂”地证明自己是一个善良角色（与之前不同），你可能会在当晚获得那个角色的能力，直到下个黄昏。","notes":""},{"id":"firewatcher","name":"打更人","team":"townsfolk","ability":"每个夜晚*，你要猜测今晚首个死亡的玩家与你的距离。如果你猜测正确，则除你以外的所有玩家今晚不会死亡，但你可能会死亡。","notes":""},{"id":"waiter","name":"店小二","team":"townsfolk","ability":"在你的首个夜晚，你会得知两名善良玩家。他们之中会有一人醉酒，即使你已死亡。","notes":""},{"id":"diva","name":"歌伶","team":"townsfolk","ability":"每局游戏限一次，在白天时，你可以提议所有玩家观看你的演出，并从同意参加的玩家中选择你的观众。如果恶魔成为了观众，你会在当晚死亡。","notes":""},{"id":"heshang","name":"和尚","team":"townsfolk","ability":"每个夜晚，当有邪恶玩家的能力首次选择或影响与你邻近的存活玩家时，改为此次能力不生效并持续至下个黎明，且你会得知你的能力被触发。","notes":""},{"id":"brocadier","name":"锦衣卫","team":"townsfolk","ability":"每个夜晚*，你要选择一名玩家：如果他在下个黄昏前死亡，你代替他死亡。","notes":""},{"id":"herbdoctor","name":"郎中","team":"townsfolk","ability":"每个夜晚，你要选择除你以外的一名玩家：你会得知一个与他能力相关的词语。","notes":""},{"id":"stargazer","name":"钦天监","team":"townsfolk","ability":"在你的首个夜晚，你会得知离你最近的邪恶玩家位于你的哪一侧（左/右/相同）。如果与你邻近的玩家中有邪恶阵营，你会得知错误信息作为替代。","notes":""},{"id":"enlightenedone","name":"悟道者","team":"townsfolk","ability":"你以为你是一个外来者，但你实际上不是。如果有邪恶玩家的能力选择或影响了你，你会立即变成一个不在场的镇民角色。","notes":""},{"id":"actor","name":"戏子","team":"townsfolk","ability":"所有戏子互相认识。不论在场的戏子数量多少或存活与否，胜负结果会被对调。[所有善良玩家都是戏子]","notes":""},{"id":"rascal","name":"熊孩子","team":"townsfolk","ability":"每个夜晚，你要选择一个镇民角色：他的能力会产生错误信息，直到下个黄昏。","notes":""},{"id":"yinyangdiviner","name":"阴阳师","team":"townsfolk","ability":"在你的首个夜晚，你会得知两个善良角色和两个邪恶角色，其中有且只有两个角色在场。","notes":""},{"id":"turncoat","name":"逆臣","team":"outsider","ability":"在你的首个夜晚，你要选择除你以外的一名玩家：如果他先死于处决，你会在当晚转变为邪恶；如果你先死于处决，他会在当晚转变为邪恶。","notes":""},{"id":"mrmisfortune","name":"煞星","team":"outsider","ability":"如果你死亡，当晚与你邻近的存活玩家之一可能会死亡。","notes":""},{"id":"ambassador","name":"使节","team":"outsider","ability":"每个夜晚限一次，一名玩家在使用自身能力选择邪恶玩家时会改为选中你，即使你已死亡。","notes":""},{"id":"pedant","name":"书生","team":"outsider","ability":"恶魔知道书生在场。每局游戏限一次，恶魔可以拜访说书人并猜测你是书生。如果恶魔猜测正确，即使你已死亡，当晚该恶魔可以选择一名玩家：他死亡。","notes":""},{"id":"corpsewalker","name":"赶尸人","team":"minion","ability":"与你邻近的两名镇民玩家会在其首次死亡时被当作仍然存活。[-1外来者]","notes":""},{"id":"vixen","name":"狐媚娘","team":"minion","ability":"在你的首个夜晚，你要选择一名玩家：他会知道狐媚娘在场。如果你死于处决，当晚他转变为邪恶阵营。","notes":""},{"id":"imperialist","name":"禁卫军","team":"minion","ability":"“疯狂”地想要死亡的玩家可能会立即被处决。","notes":""},{"id":"bugkeeper","name":"养蛊人","team":"minion","ability":"在你存活时提名你的玩家会在当晚死亡，即使你已死亡。","notes":""},{"id":"hundun","name":"混沌","team":"demon","ability":"每个夜晚*，你要选择一名玩家：他死亡。如果你以这种方式杀死了一名与你邻近的镇民玩家，除旅行者外的所有善良玩家会中毒直到下个黄昏。","notes":""},{"id":"qiongqi","name":"穷奇","team":"demon","ability":"每个夜晚*，你要选择一名玩家：他死亡。如果今天白天有外来者死亡，当晚改为你要选择一名玩家：他死亡，但被当作仍然存活，随后会有一名其他玩家死亡。[+1外来者]","notes":""},{"id":"taotie","name":"饕餮","team":"demon","ability":"每个夜晚*，你要选择任意数量的非旅行者玩家或一名旅行者玩家：如果他们的角色类型均不相同，他们死亡。[+1外来者]","notes":""},{"id":"taowu","name":"梼杌","team":"demon","ability":"每个夜晚*，你要选择一名玩家：他死亡。当你将要死亡时，改为一名存活且具有能力的爪牙失去能力。你不会得知恶魔信息。","notes":""},{"id":"pauper","name":"叫花子","team":"traveler","ability":"每个白天限一次，你可以公开选择一名其他玩家，让他选择一个非恶魔角色：你可能会获得这个角色的能力，直到下个黎明。","notes":""},{"id":"qilin","name":"麒麟","team":"fabled","ability":"在游戏的最后一天，最幸运的玩家身上会发生一些好的事情。","notes":""}]},{"id":"resident_crawling_city_v1","name":"爬行都市","data":[{"id":"_meta","name":"爬行都市","author":"Aero","source":"https://ran.dogyupi.com/scripts?open=local-c9c33d90b5e3fc5a","specialRules":"醉酒与中毒：醉酒或中毒的玩家会失去能力，但会认为自己仍具有能力，说书人会做出这些玩家仍然具有能力的行为。如果醉酒或中毒玩家的角色能力会给他提供信息，说书人可能会给出错误信息。醉酒或中毒的玩家不会得知自己醉酒或中毒。"},{"id":"chef","name":"厨师","team":"townsfolk","ability":"在你的首个夜晚，你会得知场上邻座的邪恶玩家有多少对。"},{"id":"librarian","name":"图书管理员","team":"townsfolk","ability":"在你的首个夜晚，你会得知两名玩家和一个外来者角色：这两名玩家之一是该角色（或者你会得知没有外来者在场）。"},{"id":"washerwoman","name":"洗衣妇","team":"townsfolk","ability":"在你的首个夜晚，你会得知两名玩家和一个镇民角色：这两名玩家之一是该角色。"},{"id":"sailor","name":"水手","team":"townsfolk","ability":"每个夜晚，你要选择一名存活的玩家：你或他之一会醉酒直到下个黄昏。你不会死亡。"},{"id":"chambermaid","name":"侍女","team":"townsfolk","ability":"每个夜晚，你要选择除你以外的两名存活的玩家：你会得知他们中有几人在当晚因其自身能力而被唤醒。"},{"id":"snake_charmer","name":"舞蛇人","team":"townsfolk","ability":"每个夜晚，你要选择一名存活的玩家：如果你选中了恶魔，你和他交换角色和阵营，然后他中毒。"},{"id":"general","name":"将军","team":"townsfolk","ability":"每个夜晚，你会得知说书人认为哪个阵营当前更有优势（善良/邪恶/均势）。"},{"id":"flowergirl","name":"卖花女孩","team":"townsfolk","ability":"每个夜晚*，你会得知在今天白天时是否有恶魔投过票。"},{"id":"innkeeper","name":"旅店老板","team":"townsfolk","ability":"每个夜晚*，你要选择两名玩家：他们当晚不会死亡，但其中一人会醉酒到下个黄昏。"},{"id":"undertaker","name":"送葬者","team":"townsfolk","ability":"每个夜晚*，你会得知今天白天死于处决的玩家的角色。"},{"id":"philosopher","name":"哲学家","team":"townsfolk","ability":"每局游戏限一次，在夜晚时，你可以选择一个善良角色：你获得该角色的能力。如果这个角色在场，他醉酒。"},{"id":"fool","name":"弄臣","team":"townsfolk","ability":"当你首次将要死亡时，你不会死亡。"},{"id":"tea_lady","name":"茶艺师","team":"townsfolk","ability":"如果与你邻近的两名存活的玩家是善良的，他们不会死亡。"},{"id":"virgin","name":"贞洁者","team":"townsfolk","ability":"当你首次被提名时，如果提名你的玩家是镇民，他立刻被处决。"},{"id":"drunk","name":"酒鬼","team":"outsider","ability":"你不知道你是酒鬼。你以为你是一个镇民角色，但其实你不是。"},{"id":"barber","name":"理发师","team":"outsider","ability":"如果你死亡，在当晚恶魔可以选择两名玩家（不能选择其他恶魔）交换角色。"},{"id":"sweetheart","name":"心上人","team":"outsider","ability":"当你死亡时，会有一名玩家开始醉酒。"},{"id":"saint","name":"圣徒","team":"outsider","ability":"如果你死于处决，你的阵营落败。"},{"id":"klutz","name":"呆瓜","team":"outsider","ability":"当你得知你死亡时，你要公开选择一名存活的玩家：如果他是邪恶的，你的阵营落败。"},{"id":"poisoner","name":"投毒者","team":"minion","ability":"每个夜晚，你要选择一名玩家：他在当晚和明天白天中毒。"},{"id":"spy","name":"间谍","team":"minion","ability":"每个夜晚，你能查看魔典。你可能会被当作善良阵营、镇民角色或外来者角色，即使你已死亡。"},{"id":"baron","name":"男爵","team":"minion","ability":"会有额外的外来者在场。[+2 外来者]"},{"id":"devils_advocate","name":"恶魔代言人","team":"minion","ability":"每个夜晚，你要选择一名存活的玩家（与上个夜晚不同）：如果明天白天他被处决，他不会死亡。"},{"id":"psychopath","name":"精神病患者","team":"minion","ability":"每个白天，在提名开始前，你可以公开选择一名玩家：他死亡。如果你被处决，提名你的玩家需要和你猜拳，只有你输了你才会死亡。"},{"id":"alhadikhia","name":"哈迪寂亚","team":"demon","ability":"每个夜晚*，你要选择三名玩家（所有玩家都会得知你选了谁）：他们分别秘密决定自己的生死，然后如果他们都存活则都死亡。"}]},{"id":"resident_thunder_v1","name":"瓦釜雷鸣","data":[{"id":"_meta","name":"瓦釜雷鸣","author":"Emily","specialRules":""},{"id":"investigator","name":"调查员","team":"townsfolk","ability":"在你的首个夜晚，你会得知两名玩家和一个爪牙角色：这两名玩家之一是该角色（或者你会得知没有爪牙在场）。","notes":"考虑陌客可能被误认为爪牙；指认不能直接证明另一人为善良。"},{"id":"chef","name":"厨师","team":"townsfolk","ability":"在你的首个夜晚，你会得知场上邻座的邪恶玩家有多少对。","notes":"按环形座位计相邻对数，首尾相邻；连续三名邪恶通常构成两对。考虑间谍与陌客的误认。"},{"id":"grandmother","name":"祖母","team":"townsfolk","ability":"在你的首个夜晚，你会得知一名善良玩家和他的角色。如果恶魔杀死了他，你也会死亡。","notes":"“孙子”的死亡来源重要；善良信息也可能受醉酒、中毒影响。"},{"id":"balloonist","name":"气球驾驶员","team":"townsfolk","ability":"每个夜晚，你会得知一名与上个夜晚得知的玩家角色类型不同的玩家。[+0~1外来者]","notes":""},{"id":"dreamer","name":"筑梦师","team":"townsfolk","ability":"每个夜晚，你要选择除你及旅行者以外的一名玩家：你会得知一个善良角色和一个邪恶角色，该玩家是其中一个角色。","notes":"保留两个角色选项，不能把善良选项直接当作真身份。"},{"id":"snake_charmer","name":"舞蛇人","team":"townsfolk","ability":"每个夜晚，你要选择一名存活的玩家：如果你选中了恶魔，你和他交换角色和阵营，然后他中毒。","notes":"交换后的身份、阵营与中毒分别按时间记录；旧恶魔掌握的旧信息可能仍然有用。"},{"id":"fortune_teller","name":"占卜师","team":"townsfolk","ability":"每个夜晚，你要选择两名玩家：你会得知他们之中是否有恶魔。会有一名善良玩家始终被你的能力当作恶魔。","notes":"“是”不能唯一定位恶魔；考虑被当作恶魔的善良玩家（干扰项）、陌客误认及醉酒中毒。"},{"id":"gambler","name":"赌徒","team":"townsfolk","ability":"每个夜晚*，你要选择一名玩家并猜测他的角色：如果你猜错了，你会死亡。","notes":"赌徒自述猜测与公开死亡分别记录；猜错死亡是额外来源，不能全算作恶魔刀。"},{"id":"savant","name":"博学者","team":"townsfolk","ability":"每个白天，你可以私下询问说书人以得知两条信息：一个是正确的，一个是错误的。","notes":"成对保存原文；健康正常情况下恰好一真一假，角色机制可能改变信息。"},{"id":"amnesiac","name":"失忆者","team":"townsfolk","ability":"你不知道你的能力是什么。每个白天你可以找说书人猜测一次，你会得知你的猜测有多准确。","notes":""},{"id":"philosopher","name":"哲学家","team":"townsfolk","ability":"每局游戏限一次，在夜晚时，你可以选择一个善良角色：你获得该角色的能力。如果这个角色在场，他醉酒。","notes":"获得能力，不变成那个角色。若哲学家死亡、醉酒或中毒，由他导致的醉酒通常停止；所选角色后来入场也会受影响。首夜信息能力在获得当晚使用。"},{"id":"ravenkeeper","name":"守鸦人","team":"townsfolk","ability":"如果你在夜晚死亡，你会被唤醒，然后你要选择一名玩家：你会得知他的角色。","notes":"触发条件是夜晚死亡，不只限于恶魔击杀；死亡当晚的触发例外需保留。"},{"id":"cannibal","name":"食人族","team":"townsfolk","ability":"你拥有上个死于处决的玩家的能力。如果该玩家属于邪恶阵营，你中毒直到下个善良玩家死于处决。","notes":""},{"id":"drunk","name":"酒鬼","team":"outsider","ability":"你不知道你是酒鬼。你以为你是一个镇民角色，但其实你不是。","notes":"拿到的镇民身份不等于真实身份；酒鬼没有该镇民能力，模拟得到的信息可能真也可能假。"},{"id":"recluse","name":"陌客","team":"outsider","ability":"你可能会被当作邪恶阵营、爪牙角色或恶魔角色，即使你已死亡。","notes":"是可能误认，不是每次必定误认；真实阵营仍为善良，勿将误认自动当作转阵营。"},{"id":"mutant","name":"畸形秀演员","team":"outsider","ability":"如果你“疯狂”地证明自己是外来者，你可能被处决。","notes":"疯狂是行为要求，可能隐瞒或假报身份；未被处决不能排除此角色。"},{"id":"sweetheart","name":"心上人","team":"outsider","ability":"当你死亡时，会有一名玩家开始醉酒。","notes":"死亡后的持续醉酒可能污染后续多轮信息，须记录开始时点。"},{"id":"lunatic","name":"疯子","team":"outsider","ability":"你以为你是一个恶魔，但其实你不是。恶魔知道你是疯子以及你在每个夜晚选择了哪些玩家。","notes":"自己拿到恶魔身份也可能是疯子；其夜间选择与实际死亡不一定一致。"},{"id":"godfather","name":"教父","team":"minion","ability":"在你的首个夜晚，你会得知有哪些外来者角色在场。如果有外来者在白天死亡，你会在当晚被唤醒并且你要选择一名玩家：他死亡。[-1或+1外来者]","notes":"设置可增减一个外来者；额外击杀由白天外来者死亡触发，不限处决死亡。"},{"id":"cerenovus","name":"洗脑师","team":"minion","ability":   function reportContext(snapshotId) {
    const s=game()?.snapshots.find(s=>s.id===snapshotId);if(!s)return null;
    if(ui.reportContextCache?.request===s.request)return ui.reportContextCache.context;
    const context=C.snapshotContext(s);ui.reportContextCache={request:s.request,context};return context;
  }
  function reportInline(text,snapshotId) {
    const context=reportContext(snapshotId);
    return C.formatReportInline(text,{roles:context?.rules?.roles||context?.scriptRoles||game()?.script.roles||[]},context?.evidence||[]).replace(/(<span class="report-seat">\d+号<\/span>)\s*(<span class="report-role[^\"]*">[^<]+<\/span>)/g,'<span class="report-identity">$1 $2</span>').replace(/\d{1,2}镇\/\d{1,2}外\/\d{1,2}爪\/\d{1,2}魔/g,'<span class="report-quota">$&</span>');
  }
  function reportSources(text,snapshotId) {
    const context=reportContext(snapshotId),refs=new Set(C.reportReferences(text));
    const evidence=(context?.evidence||[]).filter(e=>refs.has(e.ref));
    if(!evidence.length)return '';
    return `<details class="report-evidence"><summary>查看分析依据 <span>${evidence.length}</span>${icon('down',12)}</summary>${evidence.map(e=>`<button type="button" class="report-evidence-row" data-action="show-evidence" data-ref="${E(e.ref)}" data-snapshot="${E(snapshotId)}"><strong>${E(C.evidenceLabel(e))} · ${E(e.stage)}</strong><span>${E(e.content.slice(0,100))}</span></button>`).join('')}</details>`;
  }
  function snapshotReportText(snapshot){if(snapshot.request.protocol!==window.ClocktowerReasoner?.PROTOCOL||snapshot.reportFormat==='external-markdown'||!snapshot.rawReport)return snapshot.report;const parsed=window.ClocktowerReasoner.render(snapshot.rawReport,C.snapshotContext(snapshot),{partial:snapshot.status!=='complete'});return parsed.markdown|| (parsed.errors.length?'这份旧回答未通过当前逻辑核验，请重新追问。':snapshot.report);}
  function renderSnapshotReport(text,snapshot,busy=false) {
    if(snapshot.request.protocol===window.ClocktowerReasoner?.PROTOCOL)return (snapshot.reportFormat==='external-markdown'?'<div class="inline-update">外部报告 · 未经过结构核验</div>':'')+renderReport(busy?text:snapshotReportText(snapshot),snapshot.id);
    if(busy)return renderReport(text,snapshot.id);
    const guard=C.reportGuard(snapshot.request,text);
    if(!guard.critical.length)return renderReport(text,snapshot.id);
    const conflict=guard.critical[0].match(/已约束(\d+号)为([^，。]+)，却又在该类允许其为([^。]+)\./),message=conflict?`${conflict[1]}在同一分支被写成${conflict[2]}和${conflict[3]}。`:'报告结论与已核验的角色或历史时序冲突。';
    return `<div class="notice warning report-conflict" role="status"><strong>报告未通过逻辑核验</strong><p>${E(message)}</p></div>${renderReport(guard.fallback,snapshot.id)}<details class="report-unverified"><summary>查看原始报告 ${icon('down',12)}</summary>${renderReport(text,snapshot.id)}</details>`;
  }
  function renderReport(text,snapshotId='') {
    const lines=text.replace(/\r\n/g,'\n').split('\n'),out=[];let section=false,sectionIndex=0,folds=0;
    for(let i=0;i<lines.length;i++) {
      const line=lines[i];if(!line.trim())continue;
      if(line.startsWith(':::fold ')){out.push('<details class="report-variants"><summary>'+reportInline(line.slice(8),snapshotId)+icon('down',12)+'</summary><div class="report-variants-body">');folds++;continue;}
      if(line===':::endfold'){if(folds){out.push('</div></details>');folds--;}continue;}
      const heading=line.match(/^(#{1,4})\s+(.+)$/);
      if(heading){const level=heading[1].length<=2?'h2':heading[1].length===4?'h4':'h3';if(level==='h2'){if(section)out.push('</section>');const type=/^可能/.test(heading[2])?' report-possibility':/^(?:确定|已确定|已知|优先前提|优先结论|判断基线)/.test(heading[2])?' report-premises':/我接下来|下一步/.test(heading[2])?' report-next-actions':'';out.push(`<section class="report-section${type}" data-report-section="${++sectionIndex}">`);section=true;}const headingHTML=reportInline(heading[2],snapshotId).replace(/(\d{1,3})%/g,'<span class="report-probability" title="主观权重，非统计概率">$1%</span>');out.push(`<${level}>${headingHTML}</${level}>`);continue;}
      if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3}/.test(lines[i+1])) {
        const cells=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
        const headers=cells(line);i+=2;const rows=[];
        while(i<lines.length&&lines[i].includes('|')){rows.push(cells(lines[i]));i++;}i--;
        out.push(`<div class="report-table"><table><thead><tr>${headers.map(c=>'<th>'+reportInline(c,snapshotId)+'</th>').join('')}</tr></thead><tbody>${rows.map(row=>'<tr>'+row.map(c=>'<td>'+reportInline(c,snapshotId)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`);continue;
      }
      if(C.reportListItem(line)!==null) {
        const entries=[];while(i<lines.length&&C.reportListItem(lines[i])!==null){entries.push(C.reportListItem(lines[i]));i++;}i--;
        out.push('<ul>'+entries.map(t=>'<li>'+reportInline(t,snapshotId)+'</li>').join('')+'</ul>');continue;
      }
      if(/^\s*---+\s*$/.test(line)){out.push('<hr>');continue;}
      if(/^(已展示核验过的代表组合|已按解析信息核验代表组合)/.test(line))continue;
      out.push('<p>'+reportInline(line,snapshotId)+'</p>');
    }
    while(folds-->0)out.push('</div></details>');if(section)out.push('</section>');return out.join('');
  }

      }
      else if(form.id==='roles-form'){
        const d=new FormData(form),g=game(),ids=d.getAll('roles'),roles=ui.rolePool.filter(r=>ids.includes(r.id));
        if(!roles.length)throw new Error('请至少选择一个角色。');
        const base=form.dataset.mode==='setup'?ui.roleDraft:g.script,script={...base,name:C.clean(d.get('scriptName'),80)||base.name,roles:C.clone(roles),builtin:false,code:'自定义'};if(form.dataset.mode==='setup'){if(ui.editorContext==='library'){saveLibraryRoles(d,roles);return;}ui.setup.scriptDraft=script;if(!roles.some(r=>r.id===ui.setup.ownRoleId))ui.setup.ownRoleId='';openSetup(ui.setup);return;}ensureReferencedRoles(g,script);
        g.script=script;if(!roles.some(r=>r.id===g.ownRoleId))g.ownRoleId='';touch();closeModal();render();toast('本局角色范围已更新');
      }
      else if(form.id==='custom-role-form'){
        const d=new FormData(form),g=game(),setup=form.dataset.mode==='setup',script=setup?(ui.setup.scriptDraft||selectedScript(ui.setup.scriptId)):g.script,previous=script.roles.find(r=>r.id===form.dataset.id);
        const role=C.normalizeRole({id:previous?previous.id:'custom_'+C.uid(),name:d.get('name'),team:d.get('team'),ability:d.get('ability'),notes:d.get('notes')},0);
        if(!C.clean(d.get('name'))||!C.clean(d.get('ability')))throw new Error('请填写角色名和技能原文。');
        if(previous)script.roles[script.roles.indexOf(previous)]=role;else script.roles.push(role);script.builtin=false;if(setup){ui.setup.scriptDraft=script;if(!previous)ui.roleEditorView={query:role.name,team:'',view:'current',scroll:0};ui.returningRoleEdit=true;openRoleEditor(true);return;}touch();closeModal();render();toast('角色已保存到本局');
      }
      else if(form.id==='report-form'){
        const d=new FormData(form),g=game(),s=g.snapshots.find(s=>s.id===form.dataset.id);if(!s)throw new Error('这份分析快照已不存在。');
        const report=C.clean(d.get('report'),100000);if(!report)throw new Error('请粘贴报告内容。');
        if(s.request.protocol===window.ClocktowerReasoner?.PROTOCOL){
          if(report.trim().startsWith('{')||/^```(?:json|jsonl|ndjson)?\s/i.test(report.trim())){const formatted=window.ClocktowerReasoner.render(report,C.snapshotContext(s));if(formatted.errors.length)throw new Error(formatted.errors.join('；'));s.report=formatted.markdown;s.rawReport=report;s.reportFormat='verified-frames';}
          else{s.report=report;s.rawReport=report;s.reportFormat='external-markdown';}
        }else s.report=report;
        s.validationIssues=[];s.status='complete';s.error='';s.errorCode='';delete s.reviewNotice;s.reportOrigin=C.clean(d.get('origin'),100)||'外部 AI · 手动粘贴';s.reportAt=new Date().toISOString();touch();closeModal();render();toast('报告已保存到原始快照');
      }
    }catch(error){if(form.id==='api-settings-form'){$('#api-settings-error').textContent=error.message;}else if(form.id==='record-form'){$('#record-error').textContent=error.message;$('#record-error').scrollIntoView({block:'nearest'});}else modalError(error.message);}
  });
  document.addEventListener('toggle',event=>{
    const item=event.target;if(!item.matches?.('details[data-reference-role]')||!item.open||item.dataset.guideLoaded)return;
    ensureRoleGuide(item);
  },true);
  document.addEventListener('input',event=> {
    const el=event.target,g=game();
    if(el.id==='record-content')resizeRecordInput();
    if(el.closest('#record-form')&&g){const raw=recordFromForm($('#record-form'));ui.record={...recordDraft(g),...raw,seat:raw.seat||'',advanced:!!$('#record-form details')?.open};storeDraft();}
    if(el.id==='event-search'&&g){ui.search=el.value;$('#timeline').innerHTML=renderTimeline(g);}
    if(el.id==='role-search'&&ui.referenceScript){ui.roleSearch=el.value;$('#role-list').innerHTML=renderRoleList({script:ui.referenceScript});}
    if(el.id==='general-rules'){state.generalRules=el.value;state.games.forEach(item=>{item.generalRules=el.value;});queuePersist();}
    if(el.id==='special-rules'&&g){g.specialRules=el.value;queuePersist();}
    if((el.id==='player-statement'||el.id==='player-death-note')&&g){savePlayerDraft();queuePersist();}
    if(el.id==='followup-question'&&g){g.followupDrafts ||= {};g.followupDrafts[selectedSnapshot(g).id]=el.value;g.followupDraft='';queuePersist();}
    if(el.id==='analysis-focus'&&g){g.analysisFocus=el.value;queuePersist();}
    if(el.id==='role-pool-search'){if(el.value.trim())ui.roleView='all';filterRolePool();}
    if(el.id==='script-json'){ui.importPreview=null;const result=$('#import-result');if(result)result.innerHTML='';}
  });
  document.addEventListener('change',event=> {
    if(event.target.name==='result'&&event.target.closest('#dawn-form')){const form=$('#dawn-form'),show=event.target.value==='deaths';$('#dawn-players').hidden=!show;if(!show)form.querySelectorAll('[name="deaths"]').forEach(el=>el.checked=false);return;}
    if(event.target.id==='death-category'){const form=$('#player-status-form');if(form&&C.projectPlayers(game()).find(p=>p.seat===Number(form.dataset.seat))?.alive)form.elements.day.value=game().current.phase==='night'&&event.target.value!=='night'?Math.max(1,game().current.day-1):game().current.day;return;}

    if(event.target.name==='execution'&&event.target.closest('#dusk-form')){const row=$('.dusk-survived'),seat=Number(event.target.value),p=C.projectPlayers(game()).find(p=>p.seat===seat);row.hidden=!p?.alive;if(row.hidden)row.querySelector('input').checked=false;return;}
    if(event.target.name==='wasExecution'&&$('#player-form')){savePlayerDraft();queuePersist();return;}
    const el=event.target,g=game();
    if(el.id==='analysis-model'||el.id==='analysis-thinking'){try{window.ClocktowerAI.configure(el.id==='analysis-model'?{model:el.value}:{thinking:el.checked});}catch(error){toast(error.message);refreshReasoning();}return;}
    if(el.closest('#roles-form')&&el.name==='roles')filterRolePool();
    if(el.id==='library-base')switchLibraryBase(el.value);
    if(el.id==='record-seat'&&g){const form=$('#record-form'),raw=el.value;if(raw==='st'){form.elements.source.value='public';if(form.elements.kind.value==='note')form.elements.kind.value='statement';}else if(raw==='note'){form.elements.source.value='hypothesis';form.elements.kind.value='note';}else{form.elements.source.value=Number(raw)===g.ownSeat?'self':'hearsay';if(form.elements.kind.value==='note')form.elements.kind.value='statement';}ui.record={...recordDraft(g),...recordFromForm(form),advanced:!!form.querySelector('.advanced-fields')?.open};storeDraft();form.outerHTML=renderComposer(g);resizeRecordInput();}
    if(el.id==='filter-seat'&&g){ui.filterSeat=el.value;$('#timeline').innerHTML=renderTimeline(g);}
    if(el.closest('[data-counter]')){syncSetupCounters(true);syncSetupAdditions();}
    if(el.closest('#setup-additions-root'))syncSetupAdditions();
    if(el.closest('#setup-form')&&el.name==='scriptId'){
      switchSetupScript(el.value);
    }
    if(el.closest('#record-form')&&el.name==='kind'&&g){
      const form=$('#record-form'),source=form.elements.source;
      if(['death','revival','ghost_used','nomination','vote','execution'].includes(el.value))source.value='public';
      if(el.value==='claim'||el.value==='statement')source.value='hearsay';
      if(el.value==='note')source.value='hypothesis';
      ui.record={...recordDraft(g),...recordFromForm(form),advanced:!!form.querySelector('details')?.open};storeDraft();
      if(['claim','vote','feedback','action','role_change','death','revival','execution'].includes(el.value)){ui.record.advanced=true;storeDraft();}form.outerHTML=renderComposer(g);resizeRecordInput();
    }
  });
  $('#script-file').addEventListener('change',async event=> {
    const file=event.target.files[0];if(!file)return;
    if(file.size>3000000)return modalError('文件超过 3 MB，请选择剧本 JSON。');
    try{$('#script-json').value=await file.text();previewImport();}catch(_){modalError('无法读取这个文件。');}
  });
  $('#backup-file').addEventListener('change',async event=> {
    const file=event.target.files[0];if(!file)return;
    if(file.size>30000000)return modalError('备份超过 30 MB，暂不支持导入。');
    try{
      const incoming=C.validateWorkspace(JSON.parse((await file.text()).replace(/^\uFEFF/,'')));ui.pendingBackup=incoming;
      const conflicts=incoming.games.filter(g=>state.games.some(s=>s.id===g.id)).length;
      modal('恢复完整备份','先检查内容，再选择合并方式。',`${errorSlot}<div class="notice">这份备份有 <strong>${incoming.games.length} 局对局</strong>、${incoming.library.length} 份常用剧本。<br>与当前工作区有 ${conflicts} 局相同 ID 的对局。</div><label class="field" style="margin-top:18px">同 ID 对局如何处理<select id="merge-strategy"><option value="current">保留当前工作区的版本</option><option value="backup">使用备份中的版本</option></select></label><p class="input-note">不同 ID 的对局会添加进来。导入前会在浏览器内保留当前工作区的恢复副本。</p><div class="modal-footer">${button('confirm-backup','确认合并备份','check','primary')}</div>`);
    }catch(error){modalError('备份无法恢复：'+error.message);}
  });
  function mergeBackup() {
    if(ui.aiBusy)throw new Error('先停止当前分析，再恢复备份。');
    const incoming=ui.pendingBackup;if(!incoming)return;
    const preferBackup=$('#merge-strategy').value==='backup',merged=C.clone(state);
    incoming.games.forEach(g=>{const i=merged.games.findIndex(s=>s.id===g.id);if(i<0)merged.games.push(g);else if(preferBackup)merged.games[i]=g;});
    incoming.library.forEach(s=>{const i=merged.library.findIndex(t=>t.id===s.id);if(i<0)merged.library.push(s);else if(preferBackup)merged.library[i]=s;});
    merged.generalRules=preferBackup?incoming.generalRules:merged.generalRules;merged.games.forEach(g=>{g.generalRules=merged.generalRules||'';});
    const validated=C.validateWorkspace(merged);
    try {localStorage.setItem(STORAGE+'.beforeRestore',rawRecovery||JSON.stringify(state));}
    catch(_){throw new Error('无法保存恢复副本。请先导出当前完整备份，并释放浏览器存储空间。');}
    state=validated;rawRecovery='';ui.record=null;ui.pendingBackup=null;ui.search='';ui.filterSeat='';ui.page=state.activeId?'records':'home';persist();closeModal();render();toast('备份已合并，可在对局列表中切换');
  }
  // 原生 dialog 提供焦点限制与 Escape 关闭；点击外部只关闭窗口，不修改已保存内容。
  $('#modal').addEventListener('cancel',event=>{event.preventDefault();closeModal();});
  $('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
  document.addEventListener('keydown',event=>{if(event.target.closest?.('[data-action="session-tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const next=event.key==='Home'?'records':event.key==='End'?'reasoning':ui.page==='records'?'reasoning':'records';navigatePage(next);$('#tab-'+next)?.focus({preventScroll:true});return;}if(event.target.closest?.('[data-counter]')&&event.key==='Enter'){event.preventDefault();syncSetupCounters(true);syncSetupAdditions();return;}if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){if(event.target.id==='player-statement'){event.preventDefault();$('[data-action="save-player-declaration"]')?.click();return;}const form=$('#modal').open?($('#event-edit-form')||$('#followup-form')):$('#record-form');if(form){event.preventDefault();form.requestSubmit();}}});
  document.addEventListener('focusout',event=>{if(event.target.matches?.('[data-counter] input')){syncSetupCounters(true);syncSetupAdditions();}});
  document.addEventListener('toggle',event=>{const el=event.target;if(el.id==='analysis-history'&&el.isConnected)ui.analysisHistoryOpen=el.open;if(el.matches?.('#record-form > .advanced-fields')&&el.isConnected&&ui.record){ui.record.advanced=el.open;storeDraft();}},true);
  window.addEventListener('beforeunload',()=>{checkpointAI(true);if(ui.record)storeDraft();if(saveTimer)persist();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){checkpointAI(true);if(saveTimer)persist();}else{void keepScreenAwake();updateAIProgress();}});
  window.addEventListener('pagehide',()=>checkpointAI(true));
  window.addEventListener('storage',event=>{
    if(event.key!==null&&!event.key.startsWith('emoboi.deepseek.key.v1'))return;
    const available=window.ClocktowerAI.getSettings().hasKey;
    const input=$('#api-key');if(input)input.placeholder=available?'已配置；留空保持':'粘贴 API Key';
    const clear=$('[data-action="clear-api-key"]');if(clear)clear.hidden=!available;
    const start=$('.analysis-start .analysis-actions button');if(start){start.dataset.action=available?'analyze-now':'app-settings';start.textContent=available?'开始分析':'设置 API Key';}
  });
  window.addEventListener('resize',resizeRecordInput);
  render();
  if(seededResidents||interruptedAI||normalizedReports)persist();
  if(tabletopPage&&!game()&&!rawRecovery)openSetup();
})();



</script>
</body>
</html>
