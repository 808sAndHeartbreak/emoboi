<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本旅行详情</title>
  <meta name="description" content="日本旅行详情页，按东京+伊豆、箱根+伊豆两个大方向，切换查看包车与不包车 4 套可直接执行的行程版本。">
  <link rel="stylesheet" href="details.css?v=20260430-1">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="hero-top">
        <div class="hero-copy">
          <p class="hero-label">当前方案</p>
          <h1>日本旅行</h1>
          <p id="hero-route-title" class="hero-route-title"></p>
          <p id="hero-route-subtitle" class="hero-route-subtitle"></p>
        </div>
        <a
          class="weather-link"
          href="https://tenki.auone.jp/weather/22222"
          target="_blank"
          rel="noreferrer"
          aria-label="查看日本天气"
          title="查看日本天气"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 15.5a3.5 3.5 0 0 1 .58-6.95A5.5 5.5 0 0 1 17 7a4 4 0 1 1 .5 8.5H6Z" />
            <path d="M12 2.75v2.5M12 18.75v2.5M4.05 5.05l1.77 1.77M18.18 19.18l1.77 1.77M2.75 12h2.5M18.75 12h2.5M4.05 18.95l1.77-1.77M18.18 4.82l1.77-1.77" />
          </svg>
          <span>查看天气</span>
        </a>
      </div>
    </header>

    <main class="panel">
      <div class="panel-head">
        <div>
          <p class="kicker">方案切换</p>
          <h2>去哪儿&是否包车</h2>
        </div>
        <div class="panel-tools">
          <p id="route-meta" class="meta"></p>
        </div>
      </div>

      <div class="tab-stack" aria-label="方案切换区">
        <div class="tab-block">
          <p class="tab-caption">大方向</p>
          <div id="direction-tabs" class="tabs" aria-label="大方向切换"></div>
        </div>
        <div class="tab-block">
          <p class="tab-caption">是否包车</p>
          <div id="plan-tabs" class="tabs" aria-label="包车状态切换"></div>
        </div>
      </div>

      <section id="route-content" class="route-content" aria-live="polite"></section>
    </main>
  </div>

  <script src="itinerary-details.js?v=20260430-1"></script>
  <script src="details.js?v=20260430-1" defer></script>
</body>
</html>
