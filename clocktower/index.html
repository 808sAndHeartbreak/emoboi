  --font-display:"Notebook Serif","Noto Serif SC","Songti SC",serif;
  --font-mono:"SFMono-Regular",Consolas,monospace;
  --content-width:760px; --ease:cubic-bezier(.22,1,.36,1); --radius:12px;
  font:15px/1.65 var(--font-body); font-synthesis:none;
}
* { box-sizing:border-box; }
[hidden] { display:none!important; }
body { margin:0; background:var(--bg); color:var(--ink); }
button,input,select,textarea { font:inherit; -webkit-tap-highlight-color:transparent; }
button { cursor:pointer; color:inherit; border:0; }
button:disabled { opacity:.45; cursor:not-allowed; }
a { color:var(--accent); text-decoration:none; }a:hover { text-decoration:underline; }
svg { display:inline-block; flex-shrink:0; vertical-align:middle; }
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
input,select,textarea { min-width:0; max-width:100%; padding:11px 13px; color:var(--ink); border:1px solid #dcd6ce; border-radius:9px; background:var(--panel); }
input:focus,select:focus,textarea:focus { border-color:#a48b87; }
input::placeholder,textarea::placeholder { color:var(--faint); opacity:1; }
textarea { resize:vertical; line-height:1.85; }select { padding-right:27px; text-overflow:ellipsis; }
input[type=checkbox],input[type=radio] { accent-color:var(--accent); width:18px; height:18px; flex-shrink:0; }
input[type=search] { appearance:none; }
h1,h2,h3,p { margin:0; }
h1 { font:600 34px/1.4 var(--font-display); letter-spacing:.015em; }
h2 { font-size:18px; font-weight:600; }h3 { font-size:15px; font-weight:600; }
small,.small { font-size:13px; }
.muted { color:var(--muted); }.faint { color:var(--faint); }.gold { color:var(--gold); }.danger { color:var(--red); }
.mono { font-variant-numeric:tabular-nums; }.eyebrow { font-size:11px; letter-spacing:.12em; color:var(--faint); }
.row { display:flex; align-items:center; gap:12px; }.between { justify-content:space-between; }.wrap { flex-wrap:wrap; }.stack { display:flex; flex-direction:column; gap:24px; }.spacer { flex:1; }.gap6 { gap:6px; }
.button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 18px; border:1px solid #d9d3cb; border-radius:9px; background:var(--panel); white-space:nowrap; font-size:14px; font-weight:500; transition:background .16s,border-color .16s; }
.button:hover { background:var(--surface); border-color:#c6beb3; }.button:active { background:var(--hover); }
.button.primary { color:#fff; background:var(--primary); border-color:var(--primary); }.button.primary:hover { background:var(--primary-hover); border-color:var(--primary-hover); }
.button.quiet { background:transparent; }.button.small { min-height:40px; padding:8px 12px; font-size:13px; }
.button.text-only { min-height:44px; padding:8px 4px; background:none; border:0; color:var(--muted); }.button.text-only:hover { color:var(--accent); }
.icon-button { min-width:44px; min-height:44px; padding:11px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; color:var(--muted); background:none; transition:background .16s; }
.icon-button:hover { color:var(--ink); background:var(--surface); }.icon-button[data-active=true] { color:var(--accent); background:var(--accent-dark); }
.text-button { display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:8px 0; color:var(--accent); background:none; }
.pill { display:inline-flex; align-items:center; gap:5px; padding:3px 0; color:var(--muted); font-size:12px; white-space:nowrap; }.pill.accent { color:var(--accent); }.pill.warning { color:var(--red); }
.dot { display:inline-block; width:4px; height:4px; background:var(--green); border-radius:50%; }.dot.pending { background:var(--faint); }
.divider { border:0; border-top:1px solid var(--line); margin:28px 0; }
.skip-link { position:fixed; top:-80px; left:12px; z-index:100; padding:12px; background:var(--ink); color:white; }.skip-link:focus { top:12px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

/* One navigation rail and one reading column. */
.sidebar { position:fixed; inset:0 auto 0 0; width:200px; display:flex; flex-direction:column; padding:38px 24px 26px; background:var(--bg); border-right:1px solid var(--line); z-index:20; }
.brand { display:flex; align-items:center; gap:10px; padding-bottom:48px; }.brand-seal { color:var(--accent); display:flex; }.brand-icon { color:inherit; }
.brand-name { font:600 21px/1.4 var(--font-display); letter-spacing:.03em; white-space:nowrap; }
.nav-list { display:flex; flex-direction:column; gap:8px; }
.nav-button { display:flex; align-items:center; gap:16px; min-height:49px; padding:12px; text-align:left; color:var(--muted); border-radius:9px; background:none; font-size:14px; }
.nav-button:hover { background:var(--surface); }.nav-button.active { background:#eae6e0; color:var(--ink); font-weight:600; }.nav-button.active svg { color:var(--accent); }
.sidebar-create { margin-top:32px; padding-top:25px; border-top:1px solid var(--line); }.sidebar-create>.button { width:100%; font-size:13px; }
.sidebar-footer { margin-top:auto; padding:32px 8px 0; display:flex; flex-direction:column; align-items:flex-start; gap:4px; }.sidebar-footer .button { font-size:13px; }.sidebar-footer .button svg { width:17px; height:17px; }
.save-state { display:inline-flex; gap:7px; align-items:center; color:var(--faint); font-size:11px; margin-top:24px; }.save-state.failed { color:var(--red); }
#main { margin-left:200px; padding:0 clamp(30px,5.5vw,96px) 80px; min-height:100svh; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:78px; max-width:var(--content-width); margin:0 auto; border-bottom:1px solid var(--line); }
.breadcrumb { display:flex; align-items:center; gap:9px; min-width:0; padding:10px 0; color:var(--muted); font-size:13px; background:none; }.breadcrumb-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.top-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }.top-settings { display:none; }
.page-content { max-width:var(--content-width); margin:0 auto; }
.page-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; margin:36px 0 28px; }.page-heading p { color:var(--muted); font-size:13px; margin-top:9px; }.page-heading>.button { flex-shrink:0; }
.identity-link { background:none; color:var(--muted); padding:0; text-align:left; font-size:inherit; min-height:24px; }.identity-link:hover { color:var(--accent); }
.workspace,.work-primary { min-width:0; }.mobile-nav { display:none; }

/* Capture: speaker, content, save. */
.play-stage-row { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:45px; margin-bottom:14px; }.play-stage-row>div { display:flex; align-items:center; min-width:0; gap:18px; }.play-stage-row>.button { gap:7px; }
.phase-button { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0; background:none; font-weight:600; font-size:14px; white-space:nowrap; }.phase-button svg { color:var(--faint); }.alive-label { color:var(--muted); font-size:12px; white-space:nowrap; }
.composer { display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:12px; border:1px solid #dfd9d1; border-radius:14px; padding:16px 20px 14px; background:var(--panel); transition:border-color .16s; }.composer:focus-within { border-color:#94746e; }
.composer>.form-error,.fast-composer-top,.composer>textarea,.draft-stage { grid-column:1/-1; }
.fast-composer-top { display:flex; align-items:center; justify-content:space-between; gap:20px; }.fast-composer-top>select { width:auto; max-width:calc(100% - 72px); min-height:44px; border:0; background:none; font-size:14px; padding:8px 26px 8px 0; font-weight:500; }.fast-composer-top>.button { font-size:12px; }
.composer>textarea { display:block; width:100%; min-height:92px; border:0; background:none; border-radius:0; padding:13px 0 18px; font-size:16px; resize:none; line-height:1.8; }.composer>textarea:focus-visible { outline:none; }
.composer-bottom { grid-column:2; display:flex; align-items:center; justify-content:flex-end; gap:12px; }.composer-bottom>.primary { min-width:86px; }.composer-bottom>.draft-clear { font-size:12px; }
.composer:has(>textarea:placeholder-shown) .draft-clear { visibility:hidden; }
.advanced-fields { grid-column:1; min-width:0; align-self:center; }.advanced-fields>summary { min-height:44px; font-size:12px; gap:7px; }.advanced-fields[open] { grid-column:1/-1; }
.composer:has(.advanced-fields[open]) .composer-bottom { grid-column:1/-1; padding-top:14px; margin-top:10px; border-top:1px solid var(--line); }
.record-classifiers { border-top:1px solid var(--line); padding-top:20px; margin-bottom:18px; }.detail-summary { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:11px; color:var(--faint); }.advanced-fields:not([open]) .detail-summary { display:none; }
.composer-phase,.draft-stage { display:inline-flex; align-items:center; gap:6px; color:var(--accent); background:none; padding:10px 0; min-height:44px; font-size:12px; text-align:left; }.draft-stage { justify-self:start; padding:4px 0; min-height:30px; }
details summary { display:flex; align-items:center; gap:8px; cursor:pointer; list-style:none; min-height:44px; color:var(--muted); font-size:13px; }summary::-webkit-details-marker { display:none; }
.chevron { transition:transform .16s; }details[open]>summary>.chevron { transform:rotate(90deg); }
.field-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }.field { display:flex; flex-direction:column; gap:8px; color:var(--muted); font-size:13px; }.field>input,.field>select,.field>textarea { width:100%; }.full { grid-column:1/-1; }.field small,.optional { font-size:12px; color:var(--faint); }
.check-field { display:flex; align-items:center; gap:9px; min-height:44px; font-size:13px; color:var(--muted); cursor:pointer; }.nested-detail { border-top:1px solid var(--line); padding-top:4px; }.nested-detail>.field-grid { margin-top:10px; }
.target-picker { display:flex; flex-wrap:wrap; gap:8px; }.target-option { position:relative; cursor:pointer; }.target-option input { position:absolute; opacity:0; width:1px; height:1px; }
.target-option>span:not(.sr-only) { display:flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; background:var(--panel); border:1px solid #dcd6cd; border-radius:9px; font-size:13px; color:var(--muted); }.target-option input:checked+span { color:var(--accent); background:var(--accent-dark); border-color:#a78687; }.target-option input:focus-visible+span { outline:2px solid var(--accent); outline-offset:2px; }

/* Readable journal; reference codes remain in detail views. */
.timeline-toolbar { display:flex; align-items:center; gap:12px; margin-top:36px; min-height:44px; }.timeline-toolbar h2 { font-size:16px; font-weight:600; }.timeline-toolbar .count { color:var(--faint); font-size:12px; margin-left:7px; font-weight:400; }.timeline-toolbar>.button { padding-inline:4px; }
.timeline-search { display:none; padding-top:10px; }.timeline-search.open { display:block; }.filter-input { display:flex; align-items:center; gap:10px; color:var(--faint); border-bottom:1px solid #d7d0c7; flex:1; min-width:0; }.filter-input input { width:100%; border:0; background:none; border-radius:0; padding:12px 0; font-size:14px; }.filter-input input:focus-visible { outline:0; }
.filter-important { margin:0 0 20px; }.filter-active { color:var(--accent)!important; }
.active-filters { display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; font-size:12px; color:var(--accent); padding-top:10px; }.active-filters span { padding:3px 8px; background:var(--accent-dark); border-radius:5px; }.active-filters button { background:none; color:var(--muted); padding:6px; }
.timeline-group { margin-top:25px; }.timeline-group-heading { color:var(--faint); font-size:12px; padding-bottom:4px; }
.event { display:grid; grid-template-columns:minmax(0,1fr) 44px; gap:12px; padding:20px 0; border-bottom:1px solid var(--line); }.event-body { min-width:0; }.event-meta { display:flex; align-items:center; flex-wrap:wrap; gap:10px; line-height:1.7; font-size:12px; }
.event-person { color:var(--ink); font-size:13px; font-weight:600; padding:0; background:none; min-height:24px; text-align:left; }.event-person:hover { color:var(--accent); }.source-label,.event-kind { color:var(--muted); font-size:12px; }.source-label.hypothesis { color:var(--accent); }
.pinned-icon { color:var(--gold); font-size:11px; margin-left:auto; }.event-content { font-size:16px; line-height:1.9; margin-top:7px; white-space:pre-wrap; overflow-wrap:anywhere; }
.event-extra { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin-top:8px; font-size:12px; color:var(--muted); }.event-end .icon-button { min-width:44px; min-height:44px; padding:12px; color:#8b847c; }
.empty { padding:50px 12px; text-align:center; color:var(--faint); }.empty h3 { font-size:15px; font-weight:400; margin-bottom:8px; }.empty p { font-size:13px; margin:12px 0; }.empty.compact { padding:24px; }

/* Players; the circular map is a deliberate secondary view. */
.player-list { border-top:1px solid var(--line); }.player-row { display:flex; align-items:center; gap:20px; width:100%; min-height:88px; padding:18px 0; border-bottom:1px solid var(--line); background:none; text-align:left; }.player-row:hover { background:#f0ede7; }
.seat-number { display:flex; align-items:center; justify-content:center; flex-shrink:0; width:42px; height:42px; border-radius:10px; background:#eeebe5; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }.seat-number.own { color:var(--accent); background:var(--accent-dark); }.seat-number.dead { color:var(--faint); text-decoration:line-through; background:none; }
.player-info { flex:1; min-width:0; }.player-info strong { font-size:14px; font-weight:500; }.player-info p { font-size:13px; color:var(--muted); margin-top:5px; }.own-label { color:var(--accent); font-size:12px; margin-left:6px; }.player-state { font-size:12px; color:var(--muted); white-space:nowrap; }.player-row>svg { color:#9c958d; }
.circle-map { position:relative; width:min(100%,460px); aspect-ratio:1; margin:12px auto; }.circle-ring { position:absolute; inset:18%; border:1px solid #ded6cb; border-radius:50%; }
.circle-center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; pointer-events:none; }.town-alive { font:500 32px/1.5 var(--font-display); }.town-alive i { font:normal 16px var(--font-body); color:var(--faint); }.circle-center>p { font-size:12px; color:var(--muted); }
.map-seat { position:absolute; left:var(--seat-x); top:var(--seat-y); transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:5px; min-width:44px; min-height:54px; padding:0; background:none; }.map-seat .seat-number { border-radius:50%; width:40px; height:40px; }.map-seat.own .seat-number { background:var(--accent-dark); color:var(--accent); }.map-seat.dead .seat-number { background:none; text-decoration:line-through; color:var(--faint); }.seat-label { font-size:11px; color:var(--muted); max-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player-sheet-identity { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; gap:12px; }.player-sheet-identity h3 { font:600 25px/1.5 var(--font-display); }.player-sheet-identity p { margin-top:5px; }
.player-quick-actions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:24px 0; }.player-quick-actions>.button { font-size:13px; padding:10px; }.player-quick-actions svg { display:none; }
.player-recent { border-top:1px solid var(--line); padding-top:6px; margin-top:22px; }.recent-event { display:block; width:100%; text-align:left; background:none; border-bottom:1px solid var(--line); padding:14px 0; color:var(--ink); font-size:13px; line-height:1.9; }.recent-event small { display:block; font-size:11px; color:var(--faint); margin-bottom:5px; }

/* Script library without emblems or redundant headers. */
.tab-line { display:flex; align-items:center; gap:30px; border-bottom:1px solid var(--line); margin-bottom:28px; overflow-x:auto; }.tab-line button { display:flex; align-items:center; gap:7px; min-height:48px; padding:10px 0 15px; background:none; color:var(--muted); font-size:14px; white-space:nowrap; border-bottom:2px solid transparent; }.tab-line button.active { color:var(--ink); border-color:var(--accent); }.tab-line .mono { color:var(--faint); font-size:12px; }.tab-dot { width:4px; height:4px; border-radius:50%; background:var(--accent); }
.role-tools { display:flex; gap:12px; margin-bottom:28px; }.role-tools .filter-input { border:1px solid var(--line); border-radius:9px; padding:0 14px; background:var(--panel); }.role-tools input { padding-block:11px; }
.role-group { margin-bottom:32px; }.role-group-title { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); padding:8px 0 12px; border-bottom:1px solid var(--line); }.role-group-title>.mono { margin-left:auto; color:var(--faint); font-size:12px; }.role-type { display:none; }
.role-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:38px; align-items:start; }.role-item { min-width:0; border-bottom:1px solid var(--line); }.role-item>summary { min-height:84px; padding:16px 0; gap:14px; }.role-text { min-width:0; flex:1; }.role-text>strong { color:var(--ink); font-size:15px; font-weight:500; }.role-preview { margin-top:5px; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.custom-label { color:var(--gold); font-size:11px; margin-left:6px; }.role-item>summary>svg { color:#9b948b; }
.role-detail { padding:0 0 18px; }.role-detail>p { color:var(--ink); font-size:14px; line-height:1.95; }.role-item[open] .role-preview { display:none; }.role-item[open]>summary { min-height:60px; }.role-detail>.row { margin-top:12px; }.role-detail .button { font-size:12px; }.source-link { color:var(--faint); font-size:12px; white-space:nowrap; }
.rule-note { border-left:2px solid #d9cebd; padding:0 14px; margin-top:16px; background:#f0ede6; }.rule-note summary { font-size:12px; }.rule-note p { font-size:13px; color:var(--muted); line-height:1.9; padding-bottom:14px; }
.inline-update { display:flex; align-items:center; gap:10px; padding:12px 0; color:var(--muted); font-size:13px; margin-bottom:18px; }.inline-update>.button { margin-left:auto; }.inline-update>svg { display:none; }
.editor-panel h2 { font-size:16px; }.rule-editor { width:100%; min-height:230px; margin-top:18px; font-size:15px; }.editor-panel [data-save-state] { color:var(--faint); font-size:11px; display:flex; align-items:center; gap:6px; }.quiet-detail>summary { font-size:12px; }.quiet-detail>p { padding:4px 0 16px; }.ability-copy { font-size:13px; color:var(--muted); line-height:1.95; }
.rules-intro { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); padding-bottom:22px; }.rule-section { border-top:1px solid var(--line); }.rule-section:last-child { border-bottom:1px solid var(--line); }.rule-section>summary { min-height:66px; font-size:15px; color:var(--ink); }.rule-section>summary .mono { margin-left:auto; font-size:12px; }.rule-section p { padding:15px 0; font-size:14px; line-height:1.95; color:var(--muted); border-top:1px solid var(--line); }

/* Analysis is a document, with history beneath it. */
.analysis-shell,.analysis-content { min-width:0; }.analysis-start { padding:8px 0 0; }.analysis-start h2 { font:600 26px/1.5 var(--font-display); }.analysis-start>p { color:var(--muted); font-size:13px; margin:12px 0 26px; }.analysis-focus { display:block; width:100%; min-height:112px; font-size:15px; }
.analysis-actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; }.analysis-actions>.primary { min-width:160px; }.analysis-top-actions { display:flex; justify-content:flex-end; margin-bottom:32px; }
.snapshot-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; }.snapshot-heading h2 { font:600 23px/1.5 var(--font-display); }.snapshot-heading p { color:var(--muted); font-size:12px; margin-top:8px; }
.analysis-question { border-left:2px solid #c6b0ad; padding:9px 0 9px 16px; margin:25px 0; font-size:14px; white-space:pre-wrap; color:var(--muted); }
.report-body { font-size:15px; line-height:1.95; overflow-wrap:anywhere; }.report-body h2 { font-size:19px; margin:35px 0 16px; }.report-body h3 { font-size:16px; margin:28px 0 14px; }.report-body p { margin:14px 0; white-space:pre-wrap; }.report-body ul { padding-left:22px; margin:16px 0; }.report-body li { margin:10px 0; }.report-body hr { border:0; border-top:1px solid var(--line); margin:28px 0; }
.evidence-link { padding:1px 5px; margin:0 2px; border-radius:3px; background:var(--accent-dark); color:var(--accent); font-size:12px; cursor:pointer; }.report-table { max-width:100%; overflow-x:auto; margin:22px 0; }.report-table table { width:100%; border-collapse:collapse; font-size:13px; min-width:300px; }.report-table th,.report-table td { padding:13px 15px; border:1px solid var(--line); text-align:left; vertical-align:top; line-height:1.85; }.report-table th { font-weight:500; background:var(--surface); }
.report-origin { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; border-top:1px solid var(--line); margin-top:30px; padding-top:15px; font-size:11px; color:var(--faint); }
.report-empty { text-align:center; padding:48px 0; color:var(--muted); }.report-empty>svg { display:none; }.report-empty h3 { margin-bottom:16px; font-weight:400; }

  function selectedSnapshot(g) {return g.snapshots.find(s=>s.id===ui.snapshotId)||g.snapshots[0];}
  function renderAnalysis(g) {
    const snapshot=selectedSnapshot(g),stale=snapshot&&snapshot.fingerprint!==C.fingerprint(g),a=window.ClocktowerAI.getSettings(),job=ui.aiJob?.gameId===g.id?ui.aiJob:null,busy=!!job,issues=C.findIssues(g).filter(i=>i.level==='warning');
    const history=`<div class="snapshot-list">${g.snapshots.map(s=>`<button type="button" class="snapshot-button ${snapshot?.id===s.id?'active':''}" data-action="select-snapshot" data-id="${E(s.id)}"><span class="snapshot-dot ${s.status==='complete'||(!s.status&&s.report)?'ready':''}"></span><div><span>${E(s.stage)} <i class="mono">${s.evidenceCount}条</i></span><p>${formatDate(s.createdAt)}</p></div><span class="small muted">${E({running:'生成中',error:'失败',cancelled:'已停止',partial:'未完成',draft:'资料'}[s.status]||(s.report?'报告':'待分析'))}</span></button>`).join('')}</div>`;

      content=`<div class="snapshot-heading"><div><h2>${E(snapshot.stage)} · ${snapshot.question&&snapshot.request.historyCount?'追问':'局势分析'}</h2><p>${formatDate(snapshot.createdAt)} · <span class="mono">${snapshot.evidenceCount}</span> 条线索${snapshot.request.historyCount?' · '+snapshot.request.historyCount+' 轮上下文':''}</p></div><span class="pill ${stale||['partial','error'].includes(snapshot.status)?'warning':'accent'}">${stateLabel}</span></div>${snapshot.question?`<p class="analysis-question">${E(snapshot.question)}</p>`:''}${stale&&!selectedBusy?`<div class="inline-update"><span>记录已更新，下次分析将使用最新资料。</span></div>`:''}${selectedBusy?`<div class="ai-progress"><span class="loading-ring"></span><span id="ai-progress">准备分析…</span><span class="mono" data-ai-elapsed>0秒</span>${button('cancel-ai','停止','','quiet small')}</div>`:''}${snapshot.error?`<div class="notice warning api-report-error">${E(snapshot.error)}${snapshot.errorDetail?`<details class="quiet-detail"><summary>详细信息</summary><p>${E(snapshot.errorDetail)}</p></details>`:''}</div>`:''}<div id="live-report" class="report-body">${renderReport(selectedBusy?job.content:snapshot.report,snapshot.id)}</div>${!snapshot.report&&!selectedBusy?`<div class="report-empty">${icon('file',28)}<h3>${snapshot.status==='error'?'这次未生成报告':'还没有报告'}</h3></div>`:''}${snapshot.reportOrigin?`<div class="report-origin">${E(snapshot.reportOrigin)}${snapshot.usage?`<span class="mono">${snapshot.usage.total_tokens||0} tokens</span>`:''}</div>`:''}`;
    }else content=`<section class="analysis-start"><h2>分析当前局势</h2><p><span class="mono">${C.activeEvents(g).length}</span> 条线索 · ${g.script.roles.length} 个可能角色</p><label class="sr-only" for="analysis-focus">重点问题</label><textarea id="analysis-focus" class="analysis-focus" rows="2" maxlength="4000" placeholder="有想重点分析的问题吗？可留空。">${E(g.analysisFocus)}</textarea><div class="analysis-actions">${button(a.hasKey?'analyze-now':'app-settings',a.hasKey?'开始分析':'设置 API Key','','primary',ui.aiBusy?'disabled':'')}</div></section>`;
    const questionForm=snapshot?.report&&!selectedBusy?`<form id="followup-form" class="followup-form"><label class="sr-only" for="followup-question">继续追问</label><textarea id="followup-question" name="question" rows="2" maxlength="4000" placeholder="继续问这一局，始终带上最新记录…" required>${E(g.followupDraft||'')}</textarea><button class="button primary" type="submit"${ui.aiBusy?' disabled':''}>追问</button></form>`:'';
    const tools=`<details class="analysis-tools"><summary>历史与分析资料 <span class="mono">${g.snapshots.length}</span>${icon('down',12)}</summary>${history}<div class="row wrap">${button('copy-current','复制最新资料','copy','quiet small')}${snapshot?button('paste-report','粘贴外部报告','file','quiet small'):''}${snapshot?button('download-request','导出请求','download','quiet small'):''}${button('build-snapshot','仅保存资料','plus','quiet small')}${button('reset-context','重置本局 AI 上下文','history','text-only small')}</div>${snapshot?`<details class="request-detail"><summary>${icon('chevron',12,'chevron')}查看本次完整输入</summary><textarea class="request-preview" readonly aria-label="完整分析资料">${E(C.requestText(snapshot.request))}</textarea></details>`:''}</details>`;
    const modelLabel=(a.models.find(m=>m.id===a.model)?.name||a.model).replace(/^DeepSeek\s+/,'');
    return heading('','分析','',button('app-settings',modelLabel+(a.thinking?' · 深度思考':' · 快速'),'','text-only small'))+`<div class="analysis-shell"><section class="analysis-content">${snapshot?`<div class="analysis-top-actions">${button(a.hasKey?'analyze-now':'app-settings',a.hasKey?'分析最新局势':'设置 API Key','','primary small',ui.aiBusy?'disabled':'')}</div>`:''}${content}${questionForm}${issues.length?`<details class="preflight"><summary>${icon('alert',14)}${issues.length} 项信息待核对${icon('down',12)}</summary><div class="issue-list">${issues.map(i=>`<p class="issue">${E(i.text)}</p>`).join('')}</div></details>`:''}${tools}</section></div>`;
  }
  function reportInline(text,snapshotId) {
    return E(text).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\bE\d{3,5}\b/g,ref=>`<button type="button" class="evidence-link" data-action="show-evidence" data-ref="${ref}" data-snapshot="${E(snapshotId)}">${ref}</button>`);
  }
  function renderReport(text,snapshotId='') {
    const lines=text.replace(/\r\n/g,'\n').split('\n'),out=[];
    for(let i=0;i<lines.length;i++) {
      const line=lines[i];if(!line.trim())continue;
      const heading=line.match(/^(#{1,4})\s+(.+)$/);
      if(heading){out.push(`<${heading[1].length<=2?'h2':'h3'}>${reportInline(heading[2],snapshotId)}</${heading[1].length<=2?'h2':'h3'}>`);continue;}
      if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3}/.test(lines[i+1])) {
        const cells=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
        const headers=cells(line);i+=2;const rows=[];
        while(i<lines.length&&lines[i].includes('|')){rows.push(cells(lines[i]));i++;}i--;
        out.push(`<div class="report-table"><table><thead><tr>${headers.map(c=>'<th>'+reportInline(c,snapshotId)+'</th>').join('')}</tr></thead><tbody>${rows.map(row=>'<tr>'+row.map(c=>'<td>'+reportInline(c,snapshotId)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`);continue;
      }
      if(/^\s*[-*]\s+/.test(line)||/^\s*\d+[.)、]\s*/.test(line)) {
        const entries=[];while(i<lines.length&&(/^\s*[-*]\s+/.test(lines[i])||/^\s*\d+[.)、]\s*/.test(lines[i]))) {entries.push(lines[i].replace(/^\s*(?:[-*]\s+|\d+[.)、]\s*)/,''));i++;}i--;
        out.push('<ul>'+entries.map(t=>'<li>'+reportInline(t,snapshotId)+'</li>').join('')+'</ul>');continue;
      }
      if(/^\s*---+\s*$/.test(line)){out.push('<hr>');continue;}
      out.push('<p>'+reportInline(line,snapshotId)+'</p>');
    }
    return out.join('');
  }

  function openEvidence(ref,snapshotId) {
    const g=game(),s=g.snapshots.find(s=>s.id===snapshotId);
    let evidence;
    if(s) {
      try {const context=C.snapshotContext(s);evidence=context?.evidence.find(e=>e.ref===ref);}catch(_){/* 原始快照不可解析时不以新版本冒充。 */}
    } else {
      const e=C.activeEvents(g).find(e=>e.ref===ref);
      if(e)evidence={...e,stage:C.phaseName(e),source:C.sources[e.source],kind:C.kinds[e.kind]};
    }
    if(!evidence)return toast('这份快照中没有 '+ref);
    modal(ref,s?'来自报告对应的原始快照':'当前线索',`<div class="row wrap"><span class="pill">${E(evidence.stage)}</span><span class="pill">${E(evidence.kind)}</span><span class="pill">${E(evidence.source)}</span></div><p class="evidence-content">${E(evidence.content)}</p>${evidence.result?`<p class="small muted">结果：${E(evidence.result)}</p>`:''}${evidence.targets?.length?`<p class="small muted">目标：${evidence.targets.map(s=>s+'号').join('、')}</p>`:''}<p class="input-note">${s?'即使现有记录已编辑，此处仍显示分析当时的内容。':''}</p>`);

      }
      else if(form.id==='record-form'){
        const keyboard=!event.submitter,e=C.saveEvent(game(),recordFromForm(form));ui.record=defaultRecord(game());storeDraft();touch();render();if(keyboard)$('#record-content')?.focus({preventScroll:true});toast('已保存 '+e.ref);
      }
      else if(form.id==='event-edit-form'){
        const e=C.saveEvent(game(),recordFromForm(form),form.dataset.id||undefined);touch();closeModal();render();toast('已保存 '+e.ref);
      }
      else if(form.id==='player-form'){capturePlayer();closeModal();render();toast('玩家标注已保存');}
      else if(form.id==='phase-form'){
        const d=new FormData(form),g=game(),day=Number(d.get('day')),phase=d.get('phase');
        if(!Number.isInteger(day)||day<1||day>99)throw new Error('天数必须在 1–99 之间。');
        const prev={...g.current};g.current={day,phase};if(ui.record&&!ui.record.content.trim()&&ui.record.day===prev.day&&ui.record.phase===prev.phase){ui.record.day=day;ui.record.phase=phase;storeDraft();}touch();closeModal();render();
      }
      else if(form.id==='roles-form'){
        const d=new FormData(form),g=game(),ids=d.getAll('roles'),roles=ui.rolePool.filter(r=>ids.includes(r.id));
        if(!roles.length)throw new Error('请至少选择一个角色。');
        const base=form.dataset.mode==='setup'?ui.roleDraft:g.script,script={...base,name:C.clean(d.get('scriptName'),80)||base.name,roles:C.clone(roles),builtin:false,code:'自定义'};if(form.dataset.mode==='setup'){ui.setup.scriptDraft=script;if(!roles.some(r=>r.id===ui.setup.ownRoleId))ui.setup.ownRoleId='';openSetup(ui.setup);return;}ensureReferencedRoles(g,script);
        g.script=script;if(!roles.some(r=>r.id===g.ownRoleId))g.ownRoleId='';touch();closeModal();render();toast('本局角色范围已更新');
      }
      else if(form.id==='custom-role-form'){
        const d=new FormData(form),g=game(),setup=form.dataset.mode==='setup',script=setup?(ui.setup.scriptDraft||selectedScript(ui.setup.scriptId)):g.script,previous=script.roles.find(r=>r.id===form.dataset.id);
        const role=C.normalizeRole({id:previous?previous.id:'custom_'+C.uid(),name:d.get('name'),team:d.get('team'),ability:d.get('ability'),notes:d.get('notes')},0);
        if(!C.clean(d.get('name'))||!C.clean(d.get('ability')))throw new Error('请填写角色名和技能原文。');
        if(previous)script.roles[script.roles.indexOf(previous)]=role;else script.roles.push(role);script.builtin=false;if(setup){ui.setup.scriptDraft=script;openRoleEditor(true);return;}touch();closeModal();render();toast('角色已保存到本局');
      }
      else if(form.id==='report-form'){
        const d=new FormData(form),g=game(),s=g.snapshots.find(s=>s.id===form.dataset.id);if(!s)throw new Error('这份分析快照已不存在。');
        const report=C.clean(d.get('report'),100000);if(!report)throw new Error('请粘贴报告内容。');
        s.status='complete';s.report=report;s.reportOrigin=C.clean(d.get('origin'),100)||'外部 AI · 手动粘贴';s.reportAt=new Date().toISOString();touch();closeModal();render();toast('报告已保存到原始快照');
      }
    }catch(error){if(form.id==='api-settings-form'){$('#api-settings-error').textContent=error.message;}else if(form.id==='record-form'){$('#record-error').textContent=error.message;$('#record-error').scrollIntoView({block:'nearest'});}else modalError(error.message);}
  });
  document.addEventListener('input',event=> {
    const el=event.target,g=game();
    if(el.id==='record-content')resizeRecordInput();
    if(el.closest('#record-form')&&g){const raw=recordFromForm($('#record-form'));ui.record={...recordDraft(g),...raw,seat:raw.seat||'',advanced:$('#record-form details').open};storeDraft();}
    if(el.id==='event-search'&&g){ui.search=el.value;$('#timeline').innerHTML=renderTimeline(g);}
    if(el.id==='role-search'&&g){ui.roleSearch=el.value;$('#role-list').innerHTML=renderRoleList(g);}
    if(el.id==='special-rules'&&g){g.specialRules=el.value;queuePersist();}
    if(el.id==='followup-question'&&g){g.followupDraft=el.value;queuePersist();}
    if(el.id==='analysis-focus'&&g){g.analysisFocus=el.value;queuePersist();}
    if(el.id==='role-pool-search'){const query=el.value.toLowerCase();document.querySelectorAll('.role-check-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(query));}
    if(el.id==='script-json'){ui.importPreview=null;const result=$('#import-result');if(result)result.innerHTML='';}
  });
  document.addEventListener('change',event=> {
    const el=event.target,g=game();
    if(el.id==='record-seat'&&g){const form=$('#record-form'),raw=el.value;if(raw==='st'){form.elements.source.value='public';if(form.elements.kind.value==='note')form.elements.kind.value='statement';}else if(raw==='note'){form.elements.source.value='hypothesis';form.elements.kind.value='note';}else{form.elements.source.value=Number(raw)===g.ownSeat?'self':'hearsay';if(form.elements.kind.value==='note')form.elements.kind.value='statement';}ui.record={...recordDraft(g),...recordFromForm(form),advanced:form.querySelector('.advanced-fields').open};storeDraft();form.outerHTML=renderComposer(g);resizeRecordInput();}
    if(el.id==='filter-seat'&&g){ui.filterSeat=el.value;$('#timeline').innerHTML=renderTimeline(g);}
    if(el.closest('#setup-form')&&el.name==='scriptId'){
      captureSetup();ui.setup.ownRoleId='';delete ui.setup.scriptDraft;openSetup(ui.setup);
    }
    if(el.closest('#record-form')&&el.name==='kind'&&g){
      const form=$('#record-form'),source=form.elements.source;
      if(['death','revival','ghost_used','nomination','vote','execution'].includes(el.value))source.value='public';
      if(el.value==='claim'||el.value==='statement')source.value='hearsay';
      if(el.value==='note')source.value='hypothesis';
      ui.record={...recordDraft(g),...recordFromForm(form),advanced:form.querySelector('details').open};storeDraft();
      if(['claim','vote','feedback','action','role_change','death','revival','execution'].includes(el.value)){ui.record.advanced=true;storeDraft();}form.outerHTML=renderComposer(g);resizeRecordInput();
    }
  });
  $('#script-file').addEventListener('change',async event=> {
    const file=event.target.files[0];if(!file)return;
    if(file.size>3000000)return modalError('文件超过 3 MB，请选择剧本 JSON。');
    try{$('#script-json').value=await file.text();previewImport();}catch(_){modalError('无法读取这个文件。');}
  });
  $('#backup-file').addEventListener('change',async event=> {
    const file=event.target.files[0];if(!file)return;
    if(file.size>30000000)return modalError('备份超过 30 MB，暂不支持导入。');
    try{
      const incoming=C.validateWorkspace(JSON.parse((await file.text()).replace(/^\uFEFF/,'')));ui.pendingBackup=incoming;
      const conflicts=incoming.games.filter(g=>state.games.some(s=>s.id===g.id)).length;
      modal('恢复完整备份','先检查内容，再选择合并方式。',`${errorSlot}<div class="notice">这份备份有 <strong>${incoming.games.length} 局对局</strong>、${incoming.library.length} 份常用剧本。<br>与当前工作区有 ${conflicts} 局相同 ID 的对局。</div><label class="field" style="margin-top:18px">同 ID 对局如何处理<select id="merge-strategy"><option value="current">保留当前工作区的版本</option><option value="backup">使用备份中的版本</option></select></label><p class="input-note">不同 ID 的对局会添加进来。导入前会在浏览器内保留当前工作区的恢复副本。</p><div class="modal-footer">${button('confirm-backup','确认合并备份','check','primary')}</div>`);
    }catch(error){modalError('备份无法恢复：'+error.message);}
  });
  function mergeBackup() {
    if(ui.aiBusy)throw new Error('先停止当前分析，再恢复备份。');
    const incoming=ui.pendingBackup;if(!incoming)return;
    const preferBackup=$('#merge-strategy').value==='backup',merged=C.clone(state);
    incoming.games.forEach(g=>{const i=merged.games.findIndex(s=>s.id===g.id);if(i<0)merged.games.push(g);else if(preferBackup)merged.games[i]=g;});
    incoming.library.forEach(s=>{const i=merged.library.findIndex(t=>t.id===s.id);if(i<0)merged.library.push(s);else if(preferBackup)merged.library[i]=s;});
    if(!merged.activeId)merged.activeId=incoming.activeId;
    const validated=C.validateWorkspace(merged);
    try {localStorage.setItem(STORAGE+'.beforeRestore',rawRecovery||JSON.stringify(state));}
    catch(_){throw new Error('无法保存恢复副本。请先导出当前完整备份，并释放浏览器存储空间。');}
    state=validated;rawRecovery='';ui.record=null;ui.pendingBackup=null;ui.search='';ui.filterSeat='';persist();closeModal();render();toast('备份已合并，可在对局列表中切换');
  }
  // 原生 dialog 提供焦点限制与 Escape 关闭；点击外部只关闭窗口，不修改已保存内容。
  $('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
  document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){const form=$('#modal').open?$('#event-edit-form'):$('#record-form');if(form){event.preventDefault();form.requestSubmit();}}});
  document.addEventListener('toggle',event=>{const el=event.target;if(el.matches?.('#record-form > .advanced-fields')&&el.isConnected&&ui.record){ui.record.advanced=el.open;storeDraft();}},true);
  window.addEventListener('beforeunload',()=>{if(ui.record)storeDraft();if(saveTimer)persist();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveTimer)persist();});
  window.addEventListener('resize',resizeRecordInput);
  render();
})();

</script>
</body>
</html>
