    <style>
        :root {
            --acid-lime: #bcfe2d;
            --deep-black: #050505;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scrollbar-gutter: stable;
        }

        body {
            background-color: var(--deep-black);
            color: white;
            font-family: 'Syne', sans-serif;
            overflow-x: hidden;
            cursor: none;
            min-height: 100vh;
        }

        /* 移除所有按钮默认样式 */
        button {
            border: none;
            outline: none;
            background: none;
            padding: 0;
            cursor: none;
            -webkit-tap-highlight-color: rgba(188, 254, 45, 0.2); /* 移动端点击反馈 */
        }

        button:focus {
            outline: none;
            box-shadow: none;
        }

        button::-moz-focus-inner {
            border: 0;
        }

        input:focus {
            outline: none;
        }

        /* 导航按钮特殊样式 */
        nav a, nav button {
            border: 1px solid #27272a;
        }

        nav a:focus, nav button:focus {
            outline: none;
            box-shadow: none;
        }

        /* 播放器按钮样式 */
        #play-btn {
            border: none !important;
            outline: none !important;
        }

        #play-btn:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        #prev-btn, #next-btn, #volume-btn {
            border: none;
            outline: none;
            background: transparent;
        }

        #prev-btn:focus, #next-btn:focus, #volume-btn:focus {
            outline: none;
            box-shadow: none;
        }

        ::selection {
            background: var(--acid-lime);
            color: black;
        }

        /* ========== 背景效果 ========== */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 30% 50%, rgba(188, 254, 45, 0.05) 0%, transparent 50%),
                none;
            z-index: -1;
            opacity: 0.6;
            pointer-events: none;
        }

        /* drain-core风格: 扭曲色差效果 */
        @keyframes chromaticShift {
            0%, 100% { 
                filter: hue-rotate(0deg);
            }
            33% { 
                filter: hue-rotate(2deg);
            }
            66% { 
                filter: hue-rotate(-2deg);
            }
        }

        .bg-overlay {
            animation: chromaticShift 8s ease-in-out infinite;
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 9990;
            opacity: 0.05;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* ========== 自定义光标 ========== */
        #cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            will-change: transform;
        }

        #cursor-ring {
            position: fixed;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            will-change: transform;
            transition: width 0.2s, height 0.2s, border-color 0.2s, background-color 0.2s;
        }

        #cursor-ring.hover {
            width: 60px;
            height: 60px;
            border-color: var(--acid-lime);
            background-color: rgba(188, 254, 45, 0.1);
        }

        @media (max-width: 768px) {
            #cursor-dot, #cursor-ring { display: none; }
            body { cursor: auto; }
            button { cursor: pointer; }
            a { cursor: pointer; }
            .track-item { cursor: pointer; }
        }
        
        /* 触摸设备active状态优化 */
        @media (hover: none) and (pointer: coarse) {
            button:active {
                opacity: 0.7;
                transform: scale(0.95);
            }
            
            .track-item:active {
                background: rgba(188, 254, 45, 0.05);
            }
        }

        /* ========== Hero Banner ========== */
        .hero-banner {
            position: relative;
            height: auto;
            min-height: 200px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 80px;
            padding-bottom: 20px;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #0d0d0d 50%, #0a0a0a 100%);
        }

        .hero-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 0%, var(--deep-black) 90%);
        }

        /* Hero 标题 - 参考菜单风格,更酷更紧凑 */
        .hero-glitch-text {
            font-family: 'Syne', sans-serif;
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.04em;
            line-height: 0.9;
            text-transform: uppercase;
            position: relative;
            z-index: 10;
            color: white;
            text-shadow: 
                0.03em 0 0 rgba(255, 0, 85, 0.6),
                -0.02em -0.02em 0 rgba(188, 254, 45, 0.5),
                0.02em 0.02em 0 rgba(0, 170, 255, 0.5);
            animation: heroGlitch 5s infinite;
        }

        @keyframes heroGlitch {
            0%, 90%, 100% { 
                text-shadow: 
                    0.03em 0 0 rgba(255, 0, 85, 0.6),
                    -0.02em -0.02em 0 rgba(188, 254, 45, 0.5),
                    0.02em 0.02em 0 rgba(0, 170, 255, 0.5);
            }
            92% { 
                text-shadow: 
                    -0.05em 0 0 rgba(255, 0, 85, 0.9),
                    0.03em -0.02em 0 rgba(188, 254, 45, 0.7),
                    -0.02em 0.04em 0 rgba(0, 170, 255, 0.7);
            }
            94% { 
                text-shadow: 
                    0.04em 0.02em 0 rgba(255, 0, 85, 0.7),
                    -0.04em -0.03em 0 rgba(188, 254, 45, 0.9),
                    0.03em 0.03em 0 rgba(0, 170, 255, 0.6);
            }
        }

        /* 播放中的曲目标题 */
        .drain-track-title {
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.1),
                -1px 0 0 rgba(255, 0, 85, 0.2),
                1px 0 0 rgba(0, 255, 255, 0.2);
        }

        .track-item {
            transition: all 0.3s;
            border-left: 2px solid transparent;
            padding-left: 1rem;
            position: relative;
            overflow: hidden;
            cursor: none;
            -webkit-tap-highlight-color: rgba(188, 254, 45, 0.1); /* 移动端点击高亮 */
        }

        .track-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: linear-gradient(90deg, 
                rgba(188, 254, 45, 0.15), 
                transparent);
            transition: width 0.3s ease;
        }

        .track-item::after {
            content: '▸';
            position: absolute;
            left: 0.5rem;
            top: 50%;
            transform: translateY(-50%) translateX(-20px);
            opacity: 0;
            color: var(--acid-lime);
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .track-item:hover::before {
            width: 100%;
        }

        .track-item:hover::after {
            transform: translateY(-50%) translateX(0);
            opacity: 1;
        }

        .track-item:hover {
            color: white;
            border-left-color: rgba(188, 254, 45, 0.5);
            transform: translateX(8px);
            text-shadow: 0 0 10px rgba(188, 254, 45, 0.3);
        }

        .track-item.active {
            color: var(--acid-lime);
            border-left-color: var(--acid-lime);
            background: rgba(188, 254, 45, 0.08);
            box-shadow: 
                inset 0 0 20px rgba(188, 254, 45, 0.1),
                0 0 10px rgba(188, 254, 45, 0.1);
            text-shadow: 0 0 15px rgba(188, 254, 45, 0.5);
        }

        .track-item.active::before {
            width: 100%;
            background: linear-gradient(90deg, 
                rgba(188, 254, 45, 0.2), 
                transparent);
        }

        .track-item.active::after {
            transform: translateY(-50%) translateX(0);
            opacity: 1;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes ping {
            0% { 
                transform: scale(1);
                opacity: 0.8;
            }
            50% { 
                transform: scale(1.3);
                opacity: 0.4;
            }
            100% { 
                transform: scale(1.6);
                opacity: 0;
            }
        }

        /* ========== 进度条 ========== */
        .progress-bar {
            position: relative;
            height: 6px;
            background: transparent; /* 隐藏外部容器 */
            border-radius: 3px;
            overflow: visible;
            cursor: pointer;
            /* 增加触摸区域 - 使用padding增加点击区域 */
            padding: 12px 0;
            margin: -12px 0;
        }
        
        /* 进度条内部容器 - 居中显示 */
        .progress-bar::before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(34, 34, 34, 0.8);
            border-radius: 3px;
            border: 1px solid rgba(188, 254, 45, 0.1);
        }

        .progress-fill {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
            height: 6px;
            background: linear-gradient(90deg, 
                var(--acid-lime) 0%,
                rgba(188, 254, 45, 0.8) 100%);
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 
                0 0 15px rgba(188, 254, 45, 0.6),
                0 0 30px rgba(188, 254, 45, 0.3);
            border-radius: 3px;
            z-index: 1;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: var(--acid-lime);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(188, 254, 45, 0.8);
        }
        
        /* 移动端进度条增强 */
        @media (hover: none) and (pointer: coarse) {
            .progress-bar {
                height: 8px;
                padding: 16px 0;
                margin: -16px 0;
            }
            
            .progress-bar::before {
                height: 8px;
            }
            
            .progress-fill {
                height: 8px;
            }
            
            .progress-fill::after {
                width: 14px;
                height: 14px;
                right: -7px;
            }
        }

         /* ========== 音量条 ========== */
         .volume-slider {
             -webkit-appearance: none;
             appearance: none;
             width: 120px;
             height: 4px;
             background: linear-gradient(90deg, #2a3a3a, #1a2a2a);
             border-radius: 2px;
             outline: none;
             border: 1px solid rgba(0, 255, 255, 0.15);
             touch-action: none; /* 防止触摸时的浏览器默认行为 */
             /* 增加触摸区域 */
             padding: 10px 0;
             margin: -10px 0;
         }

         .volume-slider::-webkit-slider-thumb {
             -webkit-appearance: none;
             appearance: none;
             width: 14px;
             height: 14px;
             background: linear-gradient(135deg, var(--acid-lime), rgba(0, 255, 255, 0.8));
             border-radius: 50%;
             cursor: pointer;
             box-shadow: 0 0 8px rgba(188, 254, 45, 0.5);
         }

         .volume-slider::-moz-range-thumb {
             width: 14px;
             height: 14px;
             background: linear-gradient(135deg, var(--acid-lime), rgba(0, 255, 255, 0.8));
             border-radius: 50%;
             cursor: pointer;
             border: none;
             box-shadow: 0 0 8px rgba(188, 254, 45, 0.5);
         }
         
         /* 移动端音量滑块增强 */
         @media (hover: none) and (pointer: coarse) {
             .volume-slider {
                 height: 6px;
                 padding: 14px 0;
                 margin: -14px 0;
             }
             
             .volume-slider::-webkit-slider-thumb {
                 width: 20px;
                 height: 20px;
             }

             .volume-slider::-moz-range-thumb {
                 width: 20px;
                 height: 20px;
             }
         }

         /* ========== 播放列表折叠动画 ========== */
         #playlist {
             transition: max-height 0.4s ease, opacity 0.4s ease;
             overflow: hidden;
         }

         /* ========== 媒体显示容器 (固定高度) ========== */
         .media-display-container {
             position: relative;
             width: 100%;
             /* 使用16:9比例作为基准高度 */
             aspect-ratio: 16/9;
             min-height: 0;
         }

         .media-content {
             position: absolute;
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
             transition: opacity 0.3s ease, transform 0.3s ease;
         }

         /* 音频信息区域 - 垂直居中 */
         #now-playing-info {
             display: flex;
             align-items: center;
             justify-content: center;
             background: #000;
             border-radius: 8px;
             overflow: hidden;
         }

         /* 专辑封面容器 */
         .album-cover-container {
             position: absolute;
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
             display: flex;
             align-items: center;
             justify-content: center;
             background: #000;
             overflow: hidden;
         }

         /* 专辑封面图片 - 保持比例,纵向填满 */
         .album-cover {
             max-width: 100%;
             max-height: 100%;
             height: 100%;
             width: auto;
             object-fit: contain;
             opacity: 0.4;
             filter: blur(0px) brightness(0.7) contrast(1.1);
             transition: opacity 0.3s ease;
         }

         /* 悬停时封面稍微亮一点 */
         #now-playing-info:hover .album-cover {
             opacity: 0.5;
         }

         /* 音频信息叠加层 */
         .audio-info-overlay {
             position: relative;
             z-index: 10;
             padding: 2rem;
             text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
         }

         /* ========== 视频播放器 ========== */
         .video-container {
             position: relative;
             width: 100%;
             height: 100%;
             background: #000;
             border-radius: 8px;
             overflow: hidden;
             border: 2px solid rgba(188, 254, 45, 0.2);
             box-shadow: 
                 0 0 30px rgba(188, 254, 45, 0.15),
                 0 0 60px rgba(188, 254, 45, 0.05),
                 inset 0 0 30px rgba(0, 0, 0, 0.5);
             transition: all 0.4s ease;
         }

         .video-container:hover {
             border-color: rgba(188, 254, 45, 0.4);
             box-shadow: 
                 0 0 40px rgba(188, 254, 45, 0.25),
                 0 0 80px rgba(188, 254, 45, 0.1);
         }

         #video-player {
             width: 100%;
             height: 100%;
             object-fit: contain;
             background: #000;
         }

         /* 视频控制按钮 */
         .video-controls {
             position: absolute;
             top: 1rem;
             right: 1rem;
             display: flex;
             gap: 0.5rem;
             z-index: 10;
             opacity: 0;
             transition: opacity 0.3s ease;
         }

         .video-container:hover .video-controls {
             opacity: 1;
         }

         .video-control-btn {
             width: 40px;
             height: 40px;
             background: rgba(0, 0, 0, 0.7);
             border: 1px solid rgba(188, 254, 45, 0.3);
             border-radius: 50%;
             color: white;
             display: flex;
             align-items: center;
             justify-content: center;
             cursor: pointer;
             transition: all 0.3s ease;
             backdrop-filter: blur(10px);
         }

         .video-control-btn:hover {
             background: rgba(188, 254, 45, 0.2);
             border-color: var(--acid-lime);
             color: var(--acid-lime);
             transform: scale(1.1);
             box-shadow: 0 0 15px rgba(188, 254, 45, 0.4);
         }

         /* 视频信息叠加层 */
         .video-overlay {
             position: absolute;
             bottom: 0;
             left: 0;
             right: 0;
             padding: 1.5rem;
             background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
             opacity: 0;
             transition: opacity 0.3s ease;
             pointer-events: none;
         }

         .video-container:hover .video-overlay {
             opacity: 1;
         }

         /* 媒体内容隐藏状态 */
         .media-content[style*="display: none"] {
             opacity: 0;
             pointer-events: none;
         }

         /* 播放器固定容器 - sticky定位 */
         .player-sticky-container {
             position: sticky;
             top: 52px; /* 导航栏高度 */
             z-index: 30;
             background: linear-gradient(to bottom, var(--deep-black) 0%, var(--deep-black) 85%, transparent 100%);
             padding-bottom: 1.5rem;
             margin-bottom: 0;
         }

         /* 播放控制按钮 - 播放按钮绝对居中 */
         .player-controls {
             position: relative;
             display: flex;
             align-items: center;
             justify-content: center;
             margin-bottom: 0;
             min-height: 80px;
         }

         /* 播放按钮 - 绝对居中 */
         #play-btn {
             position: absolute;
             left: 50%;
             transform: translateX(-50%);
         }

         /* 上一曲按钮 - 相对于播放按钮左侧 */
         #prev-btn {
             position: absolute;
             left: 50%;
             transform: translateX(calc(-50% - 100px)); /* 播放按钮左侧100px */
         }

         /* 下一曲按钮 - 相对于播放按钮右侧 (对称位置) */
         #next-btn {
             position: absolute;
             left: 50%;
             transform: translateX(calc(-50% + 100px)); /* 播放按钮右侧100px,与上一曲对称 */
         }

         /* 随机按钮 - 在下一曲按钮的右侧 */
         #shuffle-btn {
             position: absolute;
             left: 50%;
             transform: translateX(calc(-50% + 160px)); /* 在下一曲右侧60px */
         }

         /* 控制按钮基础样式 */
         .control-btn {
             flex-shrink: 0;
         }

         /* 随机播放按钮 */
         .shuffle-btn {
             position: relative;
         }

         .shuffle-btn.active {
             color: var(--acid-lime);
             filter: drop-shadow(0 0 10px rgba(188, 254, 45, 0.6));
         }

         .shuffle-indicator {
             position: absolute;
             bottom: -8px;
             left: 50%;
             transform: translateX(-50%);
             width: 4px;
             height: 4px;
             background: var(--acid-lime);
             border-radius: 50%;
             opacity: 0;
             transition: opacity 0.3s ease;
             box-shadow: 0 0 8px rgba(188, 254, 45, 0.8);
         }

         .shuffle-btn.active .shuffle-indicator {
             opacity: 1;
         }

         /* 响应式: 播放器最大宽度匹配视频容器 */
         @media (min-width: 768px) {
             .max-w-2xl {
                 max-width: 42rem;
             }
         }

         /* 小屏幕优化 */
         @media (max-width: 640px) {
             .media-display-container {
                 /* 小屏幕上略微调整比例 */
                 aspect-ratio: 16/9;
             }
             
             #now-playing-info h2 {
                 font-size: 1.5rem;
             }
             
            /* 播放器控制按钮 - 小屏幕增加间距避免重叠 */
            #prev-btn {
                transform: translateX(calc(-50% - 75px)) !important;
            }
            
            #next-btn {
                transform: translateX(calc(-50% + 75px)) !important;
            }
            
            #shuffle-btn {
                transform: translateX(calc(-50% + 130px)) !important;
            }
             
             /* 播放按钮稍微缩小 */
             #play-btn {
                 width: 56px !important;
                 height: 56px !important;
             }
             
             /* 控制按钮图标缩小 */
             #prev-btn i, #next-btn i {
                 width: 1.5rem !important;
                 height: 1.5rem !important;
             }
             
             #shuffle-btn i {
                 width: 1.25rem !important;
                 height: 1.25rem !important;
             }
             
             /* 音量控制区域优化 */
             .volume-slider {
                 width: 80px !important;
             }
             
             /* 播放列表头部区域换行优化 */
             #playlist + div > div:first-child {
                 flex-wrap: wrap;
                 gap: 0.5rem;
             }
             
             /* 视频控制按钮增大触摸区域 */
             .video-control-btn {
                 width: 44px !important;
                 height: 44px !important;
             }
             
             /* 播放列表标题区域在小屏幕上缩小字体 */
             #playlist-header h3 {
                 font-size: 1.125rem !important;
             }
             
             /* 音量控制区域在小屏幕上缩小间距 */
             #playlist-header > div:last-child {
