<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="日语五十音图学习工具 - 包含平假名、片假名、罗马字及字源对照">
    <meta name="theme-color" content="#080808">
    <title>五十音 | Gojūon</title>
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="../shared/utilities.css">
    <!-- Lucide Icons -->
    <script defer src="../shared/icons.js"></script>
    <!-- Fonts -->
    <link rel="stylesheet" href="../shared/fonts.css">
    <style>
        :root {
            --bg-deep: #080808;
            --ink-black: #000000;
            --drain-white: #ffffff; 
            --text-soft: #dddddd;    
            --grid-line: #222222; 
            --toxic-cyan: #aafff0;
            --acid-purple: #d0aaff;
            --romaji-base: #666666; 
            --ui-border: #333;
            --glitch-speed: 0.2s;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        /* ========== 自定义光标 ========== */
        body {
            cursor: none;
        }

        #cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            will-change: transform;
        }

        #cursor-ring {
            position: fixed;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            will-change: transform;
            transition: width 0.2s, height 0.2s, border-color 0.2s, background-color 0.2s;
        }

        #cursor-ring.hover {
            width: 60px;
            height: 60px;
            border-color: var(--toxic-cyan);
            background-color: rgba(170, 255, 240, 0.1);
        }

        @media (max-width: 768px) {
            #cursor-dot, #cursor-ring { display: none; }
            body { cursor: auto; }
        }

        @keyframes glitch-text {
            0% { text-shadow: 2px 0 var(--acid-purple), -2px 0 var(--toxic-cyan); }
            25% { text-shadow: -2px 0 var(--acid-purple), 2px 0 var(--toxic-cyan); }
            50% { text-shadow: 2px -2px var(--acid-purple), -1px 2px var(--toxic-cyan); }
            100% { text-shadow: 2px 0 var(--acid-purple), -2px 0 var(--toxic-cyan); }
        }

        @keyframes float-ethereal {
            0% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
            100% { transform: translateY(0); }
        }

        html {
            scrollbar-gutter: stable;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                url("data:image/svg+xml,%3Csvg viewBox='0%200%20200%20200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            color: var(--drain-white);
            font-family: "Impact", "Arial Black", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* CRT扫描线效果 */
        body::before {
            content: "";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: 
                linear-gradient(rgba(10, 10, 20, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.5) 100%);
            background-size: 100% 4px, cover;
            pointer-events: none;
            opacity: 0.4;
            z-index: 9999;
        }

        /* ========== Header Title ========== */
        .header-title {
            font-weight: 900;
            letter-spacing: -0.02em;
            font-size: clamp(20px, 4vw, 28px);
            color: #fff;
            line-height: 1;
            margin: 0;
            transition: all var(--glitch-speed);
        }

        .header-title:hover {
            animation: glitch-text var(--glitch-speed) infinite linear;
            color: var(--toxic-cyan);
        }

        /* ========== 顶部导航栏控制区 ========== */
        .nav-center {
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }
        
        @media (min-width: 480px) {
            .nav-center {
                gap: 8px;
            }
        }

        /* ========== 下拉菜单容器 ========== */
        .dropdown-container {
            position: relative;
        }

        .dropdown-trigger {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--ui-border);
            color: #777;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            padding: 8px 12px;
            letter-spacing: 0.08em;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .dropdown-trigger:hover, .dropdown-trigger.active {
            color: #fff;
            border-color: var(--toxic-cyan);
            background: rgba(170, 255, 240, 0.08);
        }

        .dropdown-trigger svg {
            width: 14px;
            height: 14px;
            transition: transform 0.3s ease;
        }

        .dropdown-trigger.active svg {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.98);
            border: 1px solid var(--ui-border);
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 4px;
            min-width: 140px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .dropdown-menu.active {
            display: flex;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: transparent;
            border: 1px solid transparent;
            color: #666;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
        }

        .dropdown-item.active {
            color: var(--toxic-cyan);
            border-color: var(--toxic-cyan);
            background: rgba(170, 255, 240, 0.08);
        }

        .dropdown-item .toggle-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            transition: all 0.2s ease;
        }

        .dropdown-item.active .toggle-indicator {
            background: var(--toxic-cyan);
            box-shadow: 0 0 8px var(--toxic-cyan);
        }

        /* ========== 测试按钮 ========== */
        .quiz-btn {
            background: rgba(208, 170, 255, 0.08);
            border: 1px solid var(--acid-purple);
            color: var(--acid-purple);
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            padding: 8px 14px;
            letter-spacing: 0.08em;
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
        }

        .quiz-btn:hover {
            background: rgba(208, 170, 255, 0.15);
            box-shadow: 0 0 15px rgba(208, 170, 255, 0.3);
        }

        /* ========== 测试弹窗 ========== */
        .quiz-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 400;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .quiz-modal.active {
            display: flex;
        }

        .quiz-content {
            background: linear-gradient(145deg, #0c0c0c 0%, #080808 50%, #050508 100%);
            border: 2px solid var(--acid-purple);
            max-width: 520px;
            width: 92vw;
            max-height: 85vh;
            overflow-y: auto;
            padding: 35px;
            position: relative;
            box-shadow: 
                0 0 80px rgba(208, 170, 255, 0.25),
                inset 0 0 60px rgba(208, 170, 255, 0.03);
            animation: modalFadeIn 0.3s ease-out;
            -webkit-overflow-scrolling: touch;
        }

        .quiz-title {
            font-family: 'Major Mono Display', monospace;
            font-size: 1.6rem;
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 20px var(--acid-purple), 0 0 40px rgba(208, 170, 255, 0.5);
            letter-spacing: 0.05em;
        }

        .quiz-stats {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 14px;
        }

        .quiz-stat-item {
            background: rgba(170, 255, 240, 0.08);
            border: 1px solid var(--ui-border);
            padding: 8px 16px;
            border-radius: 4px;
            color: var(--toxic-cyan);
            font-weight: bold;
        }

        .quiz-reset-btn {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #f87171;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quiz-reset-btn:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: #f87171;
        }

        .quiz-settings {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 30px;
        }

        .quiz-setting-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            background: rgba(208, 170, 255, 0.03);
            border-left: 2px solid rgba(208, 170, 255, 0.3);
        }

        .quiz-setting-label {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            color: var(--acid-purple);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
        }

        .quiz-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quiz-option {
            flex: 1;
            min-width: 90px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #444;
            color: #999;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            font-weight: 500;
        }

        .quiz-option:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ddd;
            border-color: #666;
        }

        .quiz-option.selected {
            color: #fff;
            border-color: var(--acid-purple);
            background: rgba(208, 170, 255, 0.15);
            box-shadow: 0 0 15px rgba(208, 170, 255, 0.3);
            text-shadow: 0 0 10px var(--acid-purple);
        }

        .quiz-start-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, rgba(208, 170, 255, 0.2) 0%, rgba(208, 170, 255, 0.1) 100%);
            border: 2px solid var(--acid-purple);
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--acid-purple);
        }

        .quiz-start-btn:hover {
            background: var(--acid-purple);
            color: #000;
            box-shadow: 0 0 40px rgba(208, 170, 255, 0.6);
            text-shadow: none;
        }

        /* ========== 答题界面 ========== */
        .quiz-question-area {
            display: none;
        }

        .quiz-question-area.active {
            display: block;
        }

        .quiz-question {
            text-align: center;
            margin-bottom: 35px;
            padding: 25px;
            background: rgba(208, 170, 255, 0.03);
            border: 1px solid rgba(208, 170, 255, 0.15);
        }

        .quiz-question-prompt {
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .quiz-question-char {
            font-family: "Hiragino Mincho ProN", "MS Mincho", serif;
            font-size: 5rem;
            color: #fff;
            text-shadow: 
                0 0 30px var(--acid-purple), 
                0 0 60px rgba(208, 170, 255, 0.5),
                0 0 100px rgba(208, 170, 255, 0.3);
            animation: float-ethereal 3s infinite ease-in-out;
        }

        .quiz-question-char.romaji {
            font-family: 'Space Mono', monospace;
            font-size: 3.5rem;
            letter-spacing: 0.1em;
        }

        .quiz-choices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .quiz-choice {
            padding: 22px 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #3a3a3a;
            color: #ccc;
            font-family: "Hiragino Mincho ProN", "MS Mincho", serif;
            font-size: 2.2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .quiz-choice.romaji {
            font-family: 'Space Mono', monospace;
            font-size: 1.4rem;
            letter-spacing: 0.05em;
        }

        .quiz-choice:hover {
            background: rgba(208, 170, 255, 0.12);
            border-color: var(--acid-purple);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(208, 170, 255, 0.2);
        }

        .quiz-choice.correct {
            background: rgba(170, 255, 240, 0.2);
            border-color: var(--toxic-cyan);
            color: #fff;
            text-shadow: 0 0 15px var(--toxic-cyan);
            box-shadow: 0 0 25px rgba(170, 255, 240, 0.3);
        }

        .quiz-choice.wrong {
            background: rgba(255, 100, 100, 0.2);
            border-color: #ff6464;
            color: #fff;
            text-shadow: 0 0 15px #ff6464;
        }

        /* ========== 填空题界面 ========== */
        .quiz-fill-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .quiz-answer-display {
            min-height: 80px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed #444;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Hiragino Mincho ProN", serif;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 20px var(--acid-purple);
        }

        .quiz-answer-display.romaji {
            font-family: 'Space Mono', monospace;
            font-size: 2rem;
            letter-spacing: 0.1em;
        }

        .quiz-input-field {
            width: 100%;
            max-width: 300px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--ui-border);
            color: var(--drain-white);
            font-family: 'Space Mono', monospace;
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s ease;
        }

        .quiz-input-field:focus {
            border-color: var(--toxic-cyan);
            background: rgba(170, 255, 240, 0.08);
            box-shadow: 0 0 15px rgba(170, 255, 240, 0.3);
        }

        .quiz-input-field.kana-input {
            font-family: "Hiragino Mincho ProN", serif;
            font-size: 2rem;
        }

        .quiz-kana-picker-btn {
            padding: 16px 28px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #555;
            color: #ccc;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .quiz-kana-picker-btn:hover {
            border-color: var(--acid-purple);
            color: #fff;
            background: rgba(208, 170, 255, 0.1);
            box-shadow: 0 0 20px rgba(208, 170, 255, 0.2);
        }

        .quiz-fill-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 5px;
        }

        .quiz-submit-btn {
            padding: 16px 35px;
            background: rgba(208, 170, 255, 0.15);
            border: 2px solid var(--acid-purple);
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 0 0 10px var(--acid-purple);
        }

        .quiz-submit-btn:hover {
            background: var(--acid-purple);
            color: #000;
            box-shadow: 0 0 30px rgba(208, 170, 255, 0.5);
            text-shadow: none;
        }

        .quiz-skip-btn {
            padding: 16px 25px;
            background: transparent;
            border: 1px solid #555;
            color: #888;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .quiz-skip-btn:hover {
            border-color: #888;
            color: #ccc;
            background: rgba(255, 255, 255, 0.05);
        }

        .quiz-choice-skip {
            text-align: center;
            margin-bottom: 20px;
        }

        /* ========== 假名选择器弹窗 ========== */
        .kana-picker-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .kana-picker-overlay.active {
            display: flex;
        }

        .kana-picker-content {
            background: linear-gradient(145deg, #0c0c0c 0%, #080808 100%);
            border: 2px solid var(--acid-purple);
            padding: 25px;
            max-width: 95vw;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 60px rgba(208, 170, 255, 0.25);
        }

        .kana-picker-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #444;
            color: #999;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .kana-picker-close:hover {
            border-color: var(--acid-purple);
            color: #fff;
            background: rgba(208, 170, 255, 0.1);
        }

        .kana-picker-title {
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-shadow: 0 0 15px var(--acid-purple);
        }

        .kana-picker-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .kana-picker-grid.romaji-grid {
            grid-template-columns: repeat(6, 1fr);
        }

        .kana-picker-item {
            padding: 14px 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #3a3a3a;
            color: #bbb;
            font-family: "Hiragino Mincho ProN", serif;
            font-size: 1.4rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .kana-picker-item:hover {
            background: rgba(208, 170, 255, 0.15);
            border-color: var(--acid-purple);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(208, 170, 255, 0.2);
        }

        .kana-picker-item.empty {
            visibility: hidden;
        }

        @media (max-width: 480px) {
            .kana-picker-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 5px;
            }
            .kana-picker-grid.romaji-grid {
                grid-template-columns: repeat(5, 1fr);
            }
            .kana-picker-item {
                padding: 12px 6px;
                font-size: 1.1rem;
            }
        }

        /* ========== 结果反馈 ========== */
        .quiz-result {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 25px;
            display: none;
        }

        .quiz-result.active {
            display: block;
        }

        .quiz-result-text {
            font-family: 'Major Mono Display', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 0.08em;
            opacity: 0;
            transform: translateY(20px) scale(0.8);
        }

        .quiz-result.active .quiz-result-text {
            animation: resultTextReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes resultTextReveal {
            0% { 
                opacity: 0; 
                transform: translateY(20px) scale(0.8);
                filter: blur(10px);
            }
            50% {
                filter: blur(0);
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .quiz-result.correct .quiz-result-text {
            color: var(--toxic-cyan);
            text-shadow: 
                0 0 20px var(--toxic-cyan),
                0 0 40px rgba(170, 255, 240, 0.5),
                0 0 60px rgba(170, 255, 240, 0.3);
        }

        .quiz-result.wrong .quiz-result-text {
            color: #ff6464;
            text-shadow: 
                0 0 20px #ff6464,
                0 0 40px rgba(255, 100, 100, 0.5),
                0 0 60px rgba(255, 100, 100, 0.3);
        }

        .quiz-result.skipped .quiz-result-text {
            color: var(--acid-purple);
            text-shadow: 
                0 0 20px var(--acid-purple),
                0 0 40px rgba(208, 170, 255, 0.5);
        }

        .quiz-correct-answer {
            font-family: "Hiragino Mincho ProN", serif;
            font-size: 2rem;
            color: #fff;

        .toggle-btn::after {
            content: "";

            bottom: 0; left: 0; width: 100%; height: 2px;

            transition: transform 0.3s;

        /* ========== 弹窗样式 ========== */

        .modal-title {

                    <button class="quiz-kana-picker-btn" id="open-kana-picker">或点击选择</button>
                    <div class="quiz-fill-buttons">
                        <button class="quiz-submit-btn" id="quiz-submit">提交答案</button>
                        <button class="quiz-skip-btn" id="quiz-skip">显示答案</button>
                    </div>
                </div>

                <!-- 结果反馈 -->
                <div class="quiz-result" id="quiz-result" role="status">
                    <div class="quiz-result-text" id="quiz-result-text">正确!</div>
                    <div class="quiz-correct-answer" id="quiz-correct-answer"></div>
                </div>

                <!-- 操作按钮 -->
                <div class="quiz-actions" id="quiz-actions" style="display: none;">
                    <button class="quiz-action-btn" id="quiz-settings-btn">调整设置</button>
                    <button class="quiz-action-btn primary" id="quiz-next-btn">下一题</button>
                </div>
            </div>
        </div>
    </dialog>

    <!-- 假名选择器 -->
    <dialog class="kana-picker-overlay" id="kana-picker" aria-label="选择答案">
        <div class="kana-picker-content">
            <button class="kana-picker-close" id="kana-picker-close" aria-label="返回题目">×</button>
            <div class="kana-picker-title" id="kana-picker-title">选择答案</div>
            <div class="kana-picker-grid" id="kana-picker-grid"></div>
        </div>
    </dialog>

    <!-- Wallpaper Engine 弹窗 -->
    <dialog class="modal-overlay" id="wallpaper-modal" aria-label="Wallpaper Engine">
        <div class="modal-content">
            <button class="modal-close" id="modal-close" aria-label="关闭窗口">×</button>
            <h2 class="modal-title">† 五十音 * 假名 † WALLPAPER</h2>
            <p class="modal-subtitle">音频监听，显示音乐封面，整体界面响应音频频段互动</p>
            <img src="../asset/gojuon-wallpaper-preview.jpg" alt="Wallpaper Preview" class="modal-preview-img">
            <div class="modal-link-container">
                <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=3635766356" target="_blank" class="modal-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                    访问 Steam 创意工坊
                </a>
                <button class="modal-copy-btn" id="copy-link-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    复制链接
                </button>
            </div>
        </div>
    </dialog>
